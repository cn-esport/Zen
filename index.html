<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenspiris — The Servant Scene 1: The Open Door (5.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px #000}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}.letterbox.top{top:0;border-bottom:1px solid #fcd34d59}.letterbox.bottom{bottom:0;border-top:1px solid #fcd34d59}
.controls{display:flex;gap:8px}.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}.controls .primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
</style></head><body>
<div class="stage-wrapper"><div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="s1Wall" x2="1" y2="1"><stop stop-color="#07151a"/><stop offset=".6" stop-color="#0b2025"/><stop offset="1" stop-color="#10272a"/></linearGradient>
<linearGradient id="s1Floor" x2="0" y2="1"><stop stop-color="#172326"/><stop offset="1" stop-color="#05090c"/></linearGradient>
<linearGradient id="s1DoorGlow" x2="1"><stop stop-color="#fbbf24" stop-opacity=".95"/><stop offset=".5" stop-color="#ea580c" stop-opacity=".72"/><stop offset="1" stop-color="#7c2d12" stop-opacity=".18"/></linearGradient>
<radialGradient id="s1Halo"><stop stop-color="#fb923c" stop-opacity=".42"/><stop offset=".55" stop-color="#c2410c" stop-opacity=".16"/><stop offset="1" stop-color="#c2410c" stop-opacity="0"/></radialGradient>
<linearGradient id="s1Beam" x2="0" y2="1"><stop stop-color="#fbbf24" stop-opacity=".3"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></linearGradient>
<filter id="s1Blur"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<g id="s1Camera">
<rect width="540" height="790" fill="url(#s1Wall)"/><path d="M0 240H540M0 520H540" stroke="#173037" stroke-width="2" opacity=".25"/>
<rect y="785" width="540" height="175" fill="url(#s1Floor)"/><g stroke="#243237" stroke-width="2" opacity=".45"><path d="M0 832H540M0 890H540M120 785L60 960M310 785L340 960"/></g>
<ellipse cx="430" cy="570" rx="210" ry="300" fill="url(#s1Halo)" filter="url(#s1Blur)"/>
<!-- open sliding doorway and warm spill -->
<path d="M345 210H525V785H345Z" fill="#05080a"/><path d="M358 224H512V785H358Z" fill="url(#s1DoorGlow)" opacity=".9"/>
<path d="M368 235H500V785H368Z" fill="#3b1a12" opacity=".24"/><path d="M358 224H512V785H358Z" fill="none" stroke="#29211b" stroke-width="12"/>
<path d="M365 785L540 785L540 960L180 960Z" fill="url(#s1Beam)"/>
<path d="M370 785H540V900H275Z" fill="#f59e0b" opacity=".055"/>
<g id="s1SlidingPanel"><rect x="318" y="208" width="30" height="580" fill="#11191b" stroke="#263337" stroke-width="4"/><path d="M326 222V775" stroke="#3a4747" stroke-width="2"/><circle cx="338" cy="500" r="3" fill="#b77935"/></g>
<path d="M0 755H540" stroke="#263337" stroke-width="5" opacity=".7"/><rect y="760" width="540" height="25" fill="#0b1114"/>
<!-- dust in the beam -->
<g id="s1Dust" fill="#fcd9a1"><circle cx="390" cy="380" r="2.2"/><circle cx="430" cy="450" r="1.6"/><circle cx="475" cy="520" r="2"/><circle cx="405" cy="600" r="1.5"/><circle cx="495" cy="650" r="1.8"/><circle cx="450" cy="330" r="1.3"/><circle cx="365" cy="690" r="1.4"/><circle cx="460" cy="740" r="1.8"/></g>
<!-- broom, starts upright and settles against wall -->
<g id="s1Broom" transform="translate(192 0)"><path d="M0 380V757" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/><path d="M-2 390V750" stroke="#d19a55" stroke-width="1.5" opacity=".55"/><path d="M-17 748Q0 738 17 748L24 783Q0 792 -24 783Z" fill="#a56b2f"/><path d="M-17 750L-22 782M-9 747L-12 786M0 747V789M9 747L12 786M17 750L22 782" stroke="#d6a15b" stroke-width="2"/><path d="M-17 748Q0 741 17 748" stroke="#5b371e" stroke-width="3" fill="none"/></g>
<!-- servant silhouette, simple kimono -->
<ellipse cx="170" cy="786" rx="38" ry="8" fill="#000" opacity=".85"/>
<g id="s1Servant" transform="translate(170 785)">
<g><path d="M-9 -48L-12 -8M9 -48L12 -8" stroke="#08070c" stroke-width="11" stroke-linecap="round"/><path d="M-21 -7H-2L-1 0H-24ZM3 -7H22L24 0H2Z" fill="#08070c"/></g>
<path d="M-13 -112L13 -112L23 -35Q0 -22 -23 -35Z" fill="#08090d"/><path d="M-13 -107L0 -91L13 -107" fill="none" stroke="#1c2529" stroke-width="2"/>
<path d="M-13 -105L-22 -75L-25 -48" stroke="#0d0b12" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M13 -105L21 -78L19 -55" stroke="#0d0b12" stroke-width="8" stroke-linecap="round" fill="none"/>
<g id="s1Head" transform="translate(0 -139) rotate(-9)"><circle cx="1.6" r="22" fill="#60a5fa" opacity=".38"/><circle r="22" fill="#0d0b12"/><path d="M-18 -7Q0 -27 18 -7L14 1H-14Z" fill="#0d0b12"/><path d="M-15 -3Q0 -13 15 -3" fill="none" stroke="#202b30" stroke-width="2"/></g>
</g>
<ellipse cx="255" cy="755" rx="270" ry="90" fill="#0f766e" opacity=".08" filter="url(#s1Blur)"/>
</g></svg></div>
<div class="controls"><button id="playBtn" class="primary">▶ Play (5.0s)</button><button id="replayBtn">↺ 0.0s</button><button id="soundBtn">🔊 Sound: ON</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=id=>document.getElementById(id),playBtn=$('playBtn'),replayBtn=$('replayBtn'),soundBtn=$('soundBtn');
let audioCtx=null,soundEnabled=true,windSource=null,windGain=null,droneOsc=null,droneGain=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(type,f0,f1,d,g){if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02)}
function woodKnock(){tone('triangle',165,72,.16,.105);tone('sine',420,210,.09,.025)}
function footstep(){tone('triangle',118,48,.1,.065)}
function slideDoor(){if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*.38),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),v=audioCtx.createGain();f.type='bandpass';f.frequency.value=430;f.Q.value=.65;v.gain.value=.055;s.buffer=b;s.connect(f).connect(v).connect(audioCtx.destination);s.start(t);tone('sine',180,115,.3,.025)}
function startAmbience(){if(!audioCtx||!soundEnabled)return;if(!droneOsc){droneOsc=audioCtx.createOscillator();droneGain=audioCtx.createGain();droneOsc.type='sine';droneOsc.frequency.value=54;droneGain.gain.value=.0001;droneOsc.connect(droneGain).connect(audioCtx.destination);droneOsc.start()}
droneGain.gain.setTargetAtTime(.025,audioCtx.currentTime,.7);
if(!windSource){const n=audioCtx.sampleRate*2,b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;windSource=audioCtx.createBufferSource();windSource.buffer=b;windSource.loop=true;const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=380;windGain=audioCtx.createGain();windGain.gain.value=.0001;windSource.connect(f).connect(windGain).connect(audioCtx.destination);windSource.start()}windGain.gain.setTargetAtTime(.012,audioCtx.currentTime,.8)}
function fadeAmbience(){if(!audioCtx)return;if(windGain)windGain.gain.setTargetAtTime(.001,audioCtx.currentTime,.6);if(droneGain)droneGain.gain.setTargetAtTime(.0001,audioCtx.currentTime,1.2)}
let sceneTl=null;const st={x:170,head:-9,broom:0};
function render(){$('s1Servant').setAttribute('transform',`translate(${st.x} 785)`);$('s1Head').setAttribute('transform',`translate(0 -139) rotate(${st.head})`);$('s1Broom').setAttribute('transform',`translate(192 0) rotate(${st.broom} 0 755)`)}
function resetScene1ToStart(){if(sceneTl){sceneTl.kill();sceneTl=null}Object.assign(st,{x:170,head:-9,broom:0});gsap.set('#s1SlidingPanel',{x:0});gsap.set('#s1Dust circle',{x:0,y:0,opacity:.65});gsap.set('#s1Camera',{scale:1,svgOrigin:'270 520'});gsap.set('#s1Servant',{opacity:1,scaleX:1,y:0});render();replayBtn.textContent='↺ 0.0s'}
function playScene1(){resetScene1ToStart();sceneTl=gsap.timeline({onUpdate:()=>{render();replayBtn.textContent=`↺ ${sceneTl.time().toFixed(1)}s`},onComplete:()=>replayBtn.textContent='↺ 5.0s'});
// 0.0–1.0s: quiet establishing shot; servant waits with broom upright.
sceneTl.to('#s1Camera',{scale:1.045,svgOrigin:'270 520',duration:5,ease:'power1.inOut'},0);sceneTl.call(woodKnock,null,.03);
// 1.0s: lowers broom; it leans against wall and settles.
sceneTl.to(st,{broom:8,duration:.62,ease:'power2.inOut'},1);sceneTl.to(st,{broom:5,duration:.2,ease:'bounce.out'},1.62);
// 2.0s: straightens and turns toward the glowing exit.
sceneTl.to(st,{head:2,duration:.25,ease:'power2.out'},2);sceneTl.to(st,{head:0,duration:.25,ease:'sine.inOut'},2.25);
// 2.35s: footsteps begin; sliding door moves aside.
sceneTl.call(footstep,null,2.35);sceneTl.call(slideDoor,null,2.48);sceneTl.to('#s1SlidingPanel',{x:34,duration:.48,ease:'power2.inOut'},2.45);
// 2.5–4.7s: calm, steady walk; no glance back.
sceneTl.to(st,{x:255,duration:1.45,ease:'power1.inOut'},2.55);sceneTl.to('#s1Servant',{y:-1,duration:.22,yoyo:true,repeat:5,ease:'sine.inOut'},2.55);
[2.95,3.48,4.02,4.48].forEach(t=>sceneTl.call(footstep,null,t));
// 4.0s: enters the warm doorway and resolves to a thin outline, then disappears.
sceneTl.to(st,{x:410,duration:.72,ease:'power1.in'},4);sceneTl.to('#s1Servant',{scaleX:.22,opacity:.58,duration:.55,ease:'power2.in'},4.15);sceneTl.to('#s1Servant',{opacity:0,duration:.25},4.72);
// Dust drifts through the diagonal beam; ambience fades toward the end.
sceneTl.to('#s1Dust circle',{x:'random(-14,14)',y:'random(-24,22)',duration:2.3,repeat:1,yoyo:true,stagger:.08,ease:'sine.inOut'},.2);sceneTl.call(fadeAmbience,null,4.1)}
playBtn.addEventListener('click',()=>{initAudio();startAmbience();playScene1()});replayBtn.addEventListener('click',resetScene1ToStart);
soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;soundBtn.textContent='🔊 Sound: '+(soundEnabled?'ON':'OFF');if(soundEnabled){initAudio();startAmbience()}else fadeAmbience()});
window.addEventListener('load',()=>{resetScene1ToStart();setTimeout(playScene1,250)});
</script></body></html>
