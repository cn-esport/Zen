<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 3: Paying the Coin & Walking Down the Street (5.5s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #fcd34d;
      --coat: #1e2430;
      --coat-dark: #141821;
      --scarf: #7c2d12;
      --trousers: #2c2825;
      --trousers-back: #1d1a18;
      --cap: #161922;
      --client-shirt: #3b4252;
      --coin: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #080b12;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="s3SkyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070b16"/>
          <stop offset="50%" stop-color="#111b30"/>
          <stop offset="100%" stop-color="#1b2842"/>
        </linearGradient>

        <radialGradient id="s3LampHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.88"/>
          <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.35"/>
          <stop offset="60%" stop-color="#b45309" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="s3DoorGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.65"/>
          <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="s3GroundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d1017"/>
          <stop offset="100%" stop-color="#050608"/>
        </linearGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s3Camera">
        <rect width="540" height="825" fill="url(#s3SkyGrad)"/>

        <!-- Distant 1800s Rowhouses Silhouette -->
        <path d="M 0 580 L 0 420 L 90 395 L 90 365 L 115 365 L 115 392 L 220 375 L 265 415 L 540 415 L 540 580 Z" fill="#090e1a"/>

        <!-- Distant Gas Streetlamp (Right Side) -->
        <g id="s3Streetlamp">
          <circle id="s3LampGlow" cx="445" cy="485" r="200" fill="url(#s3LampHalo)"/>
          <rect x="442" y="505" width="6" height="320" fill="#07080c"/>
          <path d="M 435 825 L 455 825 L 451 775 L 439 775 Z" fill="#07080c"/>
          <rect x="435" y="502" width="20" height="5" rx="2" fill="#07080c"/>
          <polygon points="434,470 456,470 452,502 438,502" fill="#fef3c7"/>
          <polygon points="434,470 456,470 452,502 438,502" fill="none" stroke="#07080c" stroke-width="2.5"/>
          <line x1="445" y1="470" x2="445" y2="502" stroke="#07080c" stroke-width="1.5"/>
          <polygon points="429,470 445,454 461,470" fill="#07080c"/>
          <circle cx="445" cy="451" r="3" fill="#07080c"/>
        </g>

        <!-- 1800s BRICK TOWNHOUSE FRONT DOORWAY (Left Side) -->
        <g id="s3Townhouse">
          <rect x="0" y="130" width="235" height="695" fill="#0b0e17"/>
          <rect x="232" y="130" width="3" height="695" fill="var(--rim)" opacity="0.2"/>
          <rect x="0" y="122" width="244" height="14" fill="#06080e"/>

          <!-- Upper Window -->
          <rect x="65" y="210" width="110" height="145" rx="3" fill="#06080d" stroke="#1e293b" stroke-width="2.5"/>
          <rect x="72" y="217" width="96" height="131" fill="#182438"/>
          <rect x="118" y="217" width="4" height="131" fill="#07090f"/>
          <rect x="72" y="280" width="96" height="4" fill="#07090f"/>

          <!-- Open Doorway Frame & Warm Interior Candlelight -->
          <rect x="52" y="545" width="118" height="262" rx="3" fill="#06080d" stroke="#1e293b" stroke-width="3"/>
          <rect x="56" y="549" width="110" height="258" fill="#451a03"/>
          <circle cx="111" cy="675" r="95" fill="url(#s3DoorGlow)"/>

          <!-- Stone Doorstep -->
          <rect x="44" y="807" width="142" height="18" rx="2" fill="#1a1f2c"/>

          <!-- CLIENT CHARACTER IN DOORWAY (Zenspiris Rig, Handing Over Coin) -->
          <g transform="translate(15, 660)">
            <path d="M 98 85 L 96 146 L 104 146" fill="none" stroke="#1f2430" stroke-width="6.5" stroke-linecap="round"/>
            <path d="M 104 85 L 106 146 L 114 146" fill="none" stroke="#2d3445" stroke-width="7" stroke-linecap="round"/>

            <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 25 105 28.5 Q 110 29.5 110 34 L 110 87 L 92 87 Z" fill="var(--client-shirt)"/>

            <g id="s3ClientHead">
              <circle cx="99.5" cy="4" r="22" fill="#fde68a" opacity="0.45"/>
              <circle cx="101" cy="4" r="22" fill="var(--head)"/>
              <circle cx="111" cy="2.5" r="2.1" fill="var(--face)"/>
              <circle cx="118.8" cy="2.5" r="2.1" fill="var(--face)"/>
              <line x1="112" y1="11.5" x2="118" y2="11.5" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
            </g>

            <g id="s3ClientArm">
              <path d="M 103 36 L 125 46 L 146 43" fill="none" stroke="var(--head)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 101 34 L 114 40" fill="none" stroke="var(--client-shirt)" stroke-width="7.4" stroke-linecap="round"/>
            </g>
          </g>

          <!-- Swung-Open Wooden Front Door -->
          <path d="M 56 549 L 28 558 L 28 815 L 56 807 Z" fill="#14110f" stroke="#29231f" stroke-width="1.5"/>
        </g>

        <!-- Ground -->
        <rect x="0" y="825" width="540" height="135" fill="url(#s3GroundGrad)"/>
        <ellipse cx="445" cy="842" rx="95" ry="9" fill="#f59e0b" opacity="0.12"/>

        <!-- Gold/Copper Penny Coin Passing Between Hands -->
        <g id="s3CoinGroup">
          <circle cx="163" cy="702" r="7" fill="#fef08a" opacity="0.45"/>
          <circle cx="163" cy="702" r="3.6" fill="var(--coin)" stroke="#b45309" stroke-width="1"/>
        </g>

        <!-- KNOCKER-UPPER CHARACTER -->
        <!-- Built facing RIGHT by default; #s3TurnRig flips ENTIRE body (-1 -> +1) cleanly at 1.85s! -->
        <g id="s3KnockerGroup" transform="translate(115, 678)">
          <!-- Ground Shadow -->
          <ellipse cx="101" cy="148" rx="26" ry="5" fill="#030406" opacity="0.85"/>

          <!-- Full-Body Turn Rig (Pivots around center x=101 so head, cap, scarf, coat, arms, pole, AND both feet turn together!) -->
          <g id="s3TurnRig">
            <!-- Back Leg (Both feet point RIGHT in forward walking direction) -->
            <g id="s3LegBack">
              <path d="M 99 86 L 96 116 L 94 144 L 103 144"
                    fill="none" stroke="var(--trousers-back)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Front Leg (Both feet point RIGHT in forward walking direction) -->
            <g id="s3LegFront">
              <path d="M 103 86 L 106 116 L 108 144 L 117 144"
                    fill="none" stroke="var(--trousers)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Torso & Coat -->
            <g id="s3TorsoGroup">
              <!-- Warm Streetlamp Rim Light on Back -->
              <path d="M 91 34 Q 91 29.5 96.5 28.5 Q 101 24.5 105.5 28.5 Q 112 29.5 112.5 34 L 115 104 L 88 104 Z"
                    fill="var(--rim)" opacity="0.45"/>

              <!-- 1800s Victorian Overcoat -->
              <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 25 105 28.5 Q 110.5 29.5 111 34 L 114 104 L 89 104 Z"
                    fill="var(--coat)"/>
              <line x1="103" y1="36" x2="104" y2="104" stroke="#0d1017" stroke-width="1.2" opacity="0.75"/>

              <!-- Rust Scarf Trailing Behind -->
              <path d="M 91 33 L 85 52 L 91 53 L 96 35 Z" fill="#63220d"/>
              <rect x="92" y="27" width="18.5" height="6.5" rx="3" fill="var(--scarf)"/>

              <!-- Back Arm Holding Long Bamboo Pole Upright -->
              <g id="s3PoleArmGroup">
                <line x1="94" y1="142" x2="112" y2="-340" stroke="#07080c" stroke-width="4.2" stroke-linecap="round"/>
                <line x1="93" y1="142" x2="111" y2="-340" stroke="#94a3b8" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
                <path d="M 98 36 L 90 52 L 98 64" fill="none" stroke="var(--head)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 100 34 L 94 45" fill="none" stroke="var(--coat-dark)" stroke-width="7.4" stroke-linecap="round"/>
              </g>

              <!-- Head Group (Exact r=22 + Flat Cap + Clean Zenspiris Face) -->
              <g id="s3Head">
                <circle cx="99.5" cy="4" r="22" fill="var(--rim)" opacity="0.55"/>
                <circle cx="101" cy="4" r="22" fill="var(--head)"/>

                <!-- 1800s Flat Cap Facing Forward -->
                <path d="M 80 -10 C 82 -22, 114 -23, 121 -11 L 130 -8 L 80 -7 Z" fill="var(--cap)"/>
                <path d="M 81 -11 C 84 -20, 104 -22, 115 -16" fill="none" stroke="var(--rim)" stroke-width="1.4" opacity="0.5"/>

                <!-- Clean Zenspiris Dot Eyes & Mouth -->
                <circle cx="111" cy="2.5" r="2.1" fill="var(--face)"/>
                <circle cx="118.8" cy="2.5" r="2.1" fill="var(--face)"/>
                <line x1="112" y1="11.5" x2="118" y2="11.5" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
              </g>

              <!-- Front Arm (Reaches Forward to Receive Coin -> Pockets Coin -> Swings Naturally While Walking) -->
              <g id="s3FrontArm">
                <path d="M 103 36 L 125 46 L 146 42" fill="none" stroke="var(--head)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 101 34 L 114 40" fill="none" stroke="var(--coat)" stroke-width="7.6" stroke-linecap="round"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button class="primary" id="playBtn">▶ Play (5.5s)</button>
    <button id="replayBtn">↺ 0.0s</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCoinClink() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      const freqs = [2450, 3680];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + idx * 0.03);
        gain.gain.setValueAtTime(0.14, now + idx * 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.03 + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.03);
        osc.stop(now + idx * 0.03 + 0.3);
      });
    }

    function playFootstep() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(145, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.08);
      gain.gain.setValueAtTime(0.13, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    let sceneTl = null;
    let walkTl = null;

    function playScene3() {
      if (sceneTl) sceneTl.kill();
      if (walkTl) walkTl.kill();

      // Reset to 0.0s: Entire body faces LEFT (-1 scaleX) toward the client in the doorway
      gsap.set('#s3Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s3KnockerGroup', { x: 115, y: 678 });
      gsap.set('#s3TurnRig', { scaleX: -1, svgOrigin: '101 86' });
      gsap.set('#s3Head', { rotation: 0, svgOrigin: '101 4' });
      gsap.set('#s3FrontArm', { rotation: 0, svgOrigin: '103 36' });
      gsap.set('#s3ClientArm', { rotation: 0, svgOrigin: '103 36' });
      gsap.set('#s3CoinGroup', { x: 0, y: 0, opacity: 1 });
      gsap.set('#s3LegBack', { rotation: 0, y: 0, svgOrigin: '99 86' });
      gsap.set('#s3LegFront', { rotation: 0, y: 0, svgOrigin: '103 86' });
      gsap.set('#s3TorsoGroup', { y: 0, rotation: 0, svgOrigin: '101 86' });

      sceneTl = gsap.timeline();

      // Smooth cinematic pan following the coin exchange into the street walk
      sceneTl.to('#s3Camera', {
        scale: 1.07,
        x: -18,
        svgOrigin: '270 550',
        duration: 5.5,
        ease: 'none'
      }, 0);

      // 0.65s: Coin passes into Knocker-Upper's hand with a crisp clink
      sceneTl.call(() => playCoinClink(), null, 0.72);
      sceneTl.to('#s3CoinGroup', {
        x: 6,
        y: 2,
        duration: 0.3,
        ease: 'power2.out'
      }, 0.55);

      // 1.05s: Knocker-Upper pockets the coin & gives a polite nod
      sceneTl.to('#s3FrontArm', {
        rotation: 58,
        svgOrigin: '103 36',
        duration: 0.42,
        ease: 'power2.inOut'
      }, 1.05);

      sceneTl.to('#s3CoinGroup', {
        x: 48,
        y: 28,
        opacity: 0,
        duration: 0.32,
        ease: 'power2.in'
      }, 1.05);

      sceneTl.to('#s3Head', {
        rotation: 12,
        svgOrigin: '101 4',
        duration: 0.24,
        yoyo: true,
        repeat: 1,
        ease: 'sine.inOut'
      }, 1.15);

      // Client lowers arm back inside doorway
      sceneTl.to('#s3ClientArm', {
        rotation: 45,
        svgOrigin: '103 36',
        duration: 0.5,
        ease: 'power2.inOut'
      }, 1.4);

      // 1.75s: ENTIRE BODY turns smoothly around (scaleX: -1 -> 1) so head, coat, scarf, pole, and feet all face RIGHT!
      sceneTl.to('#s3TurnRig', {
        scaleX: 1,
        svgOrigin: '101 86',
        duration: 0.28,
        ease: 'power2.inOut'
      }, 1.75);

      // Settle front arm down at side ready for natural walking swing
      sceneTl.to('#s3FrontArm', {
        rotation: 72,
        svgOrigin: '103 36',
        duration: 0.25,
        ease: 'power2.out'
      }, 1.78);

      // 2.0s - 5.5s: Walks down the cobblestone street toward the streetlamp
      sceneTl.to('#s3KnockerGroup', {
        x: 335,
        duration: 3.5,
        ease: 'none'
      }, 2.0);

      // Smooth, natural continuous walking gait (legs, knee lift, arm swing, and subtle body bounce)
      sceneTl.call(() => {
        walkTl = gsap.timeline({ repeat: 3 });

        // Step A (Right/Front leg forward, Left/Back leg back)
        walkTl.call(() => playFootstep(), null, 0.05);
        walkTl.to('#s3LegFront', { rotation: -24, y: -2, svgOrigin: '103 86', duration: 0.22, ease: 'power1.out' }, 0);
        walkTl.to('#s3LegFront', { rotation: -22, y: 0, svgOrigin: '103 86', duration: 0.22, ease: 'power1.in' }, 0.22);
        walkTl.to('#s3LegBack', { rotation: 22, y: 0, svgOrigin: '99 86', duration: 0.44, ease: 'sine.inOut' }, 0);
        walkTl.to('#s3FrontArm', { rotation: 88, svgOrigin: '103 36', duration: 0.44, ease: 'sine.inOut' }, 0);
        walkTl.to('#s3TorsoGroup', { y: -3, rotation: 2, svgOrigin: '101 86', duration: 0.22, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0);

        // Step B (Left/Back leg forward with knee lift, Right/Front leg back)
        walkTl.call(() => playFootstep(), null, 0.49);
        walkTl.to('#s3LegBack', { rotation: -24, y: -2, svgOrigin: '99 86', duration: 0.22, ease: 'power1.out' }, 0.44);
        walkTl.to('#s3LegBack', { rotation: -22, y: 0, svgOrigin: '99 86', duration: 0.22, ease: 'power1.in' }, 0.66);
        walkTl.to('#s3LegFront', { rotation: 22, y: 0, svgOrigin: '103 86', duration: 0.44, ease: 'sine.inOut' }, 0.44);
        walkTl.to('#s3FrontArm', { rotation: 56, svgOrigin: '103 36', duration: 0.44, ease: 'sine.inOut' }, 0.44);
        walkTl.to('#s3TorsoGroup', { y: -3, rotation: 2, svgOrigin: '101 86', duration: 0.22, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0.44);
      }, null, 2.0);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene3();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      if (sceneTl) sceneTl.pause(0);
      if (walkTl) walkTl.kill();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene3, 250);
    });
  </script>
</body>
</html>
