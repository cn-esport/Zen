<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Scene 1: The 2:00 AM Hook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #f4c28a;
      --outfit-top: #3b78c4;
      --outfit-bottom: #e8dcc0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050507;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Native 9:16 Stage (Zero alignment cutoffs, 60fps smooth) */
    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #090c17;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
      transform: translateZ(0);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .gpu-layer {
      will-change: transform, opacity;
      transform: translateZ(0);
    }

    /* Cinematic Vignette & Letterbox */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 44%, rgba(4, 3, 8, 0.88) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    /* Location Pill */
    .location-pill {
      position: absolute;
      top: 7.5%;
      left: 6%;
      background: rgba(13, 11, 18, 0.82);
      border: 1px solid rgba(242, 237, 226, 0.18);
      color: #f2ede2;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      z-index: 13;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #181622;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.22);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #2b6cb0; border-color: #63b3ed; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <div class="location-pill">2:00 AM · Modern Bedroom</div>

    <!-- Exact 9:16 ViewBox (540 x 960) so every single prop stays 100% visible -->
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="bgNightRoom" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#080b14"/>
          <stop offset="52%" stop-color="#141d36"/>
          <stop offset="100%" stop-color="#070910"/>
        </linearGradient>
        <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.72"/>
          <stop offset="48%" stop-color="#2b6cb0" stop-opacity="0.24"/>
          <stop offset="100%" stop-color="#0d0b12" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="moonBeam" cx="30%" cy="28%" r="55%">
          <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#090c17" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Camera Group for Smooth Push-In -->
      <g id="s1Camera" class="gpu-layer">
        <rect width="540" height="960" fill="url(#bgNightRoom)"/>
        <rect width="540" height="960" fill="url(#moonBeam)"/>

        <!-- Bedroom Window (Left Upper Safe Zone: x 55 to 205) -->
        <g opacity="0.38">
          <rect x="55" y="175" width="145" height="225" rx="12" fill="#233561"/>
          <line x1="127.5" y1="175" x2="127.5" y2="400" stroke="#0a0e1a" stroke-width="7"/>
          <line x1="55" y1="287" x2="200" y2="287" stroke="#0a0e1a" stroke-width="7"/>
          <!-- Moon & Stars outside window -->
          <circle cx="95" cy="222" r="18" fill="#bae6fd" opacity="0.65"/>
          <circle cx="165" cy="245" r="2.5" fill="#f2ede2" opacity="0.7"/>
          <circle cx="155" cy="210" r="2" fill="#f2ede2" opacity="0.5"/>
        </g>

        <!-- Digital Wall Clock (Right Upper Safe Zone: x 320 to 475 - 100% Visible!) -->
        <g id="s1Clock" class="gpu-layer" transform="translate(320, 215)">
          <rect x="-5" y="-5" width="165" height="76" rx="15" fill="#38bdf8" opacity="0.22"/>
          <rect x="0" y="0" width="155" height="66" rx="11" fill="#070a12" stroke="#38bdf8" stroke-width="2.5"/>
          <text id="s1ClockText" x="77.5" y="43" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="29" font-weight="bold">01:59</text>
        </g>

        <!-- Floor & Bed (Mattress top at y = 645) -->
        <rect x="0" y="825" width="540" height="135" fill="#05070d"/>
        <rect x="45" y="645" width="450" height="180" rx="14" fill="#101526"/>
        <rect x="45" y="645" width="450" height="28" rx="10" fill="#1b243d"/>
        <!-- Headboard & Pillow -->
        <rect x="35" y="540" width="36" height="285" rx="8" fill="#171d33"/>
        <rect x="80" y="608" width="115" height="40" rx="18" fill="#253052"/>

        <!-- Dynamic Phone Screen Light Pool -->
        <circle cx="305" cy="545" r="235" fill="url(#phoneGlow)" id="s1PhonePool" class="gpu-layer"/>

        <!-- Character Sitting Firmly on Bed (Torso & Thighs rest on mattress at y = 645) -->
        <g id="s1Char" transform="translate(225, 565)">
          <!-- Warm Rim Light -->
          <circle cx="4" cy="-60" r="48" fill="#f4c28a" opacity="0.58"/>

          <!-- Torso (Bottom at y = 80 -> 565 + 80 = 645) -->
          <rect id="s1Torso" x="-27" y="-12" width="54" height="92" rx="21" fill="#3b78c4"/>

          <!-- Thigh resting flat on mattress & Lower leg hanging off bed edge -->
          <rect x="8" y="62" width="78" height="20" rx="10" fill="#e8dcc0"/>
          <rect x="70" y="64" width="20" height="84" rx="10" fill="#e8dcc0"/>

          <!-- Head Group -->
          <g id="s1Head">
            <circle cx="0" cy="-60" r="48" fill="#0d0b12"/>

            <!-- Eyes -->
            <g id="s1Eyes">
              <circle class="eye-dot" cx="14" cy="-64" r="4.5" fill="#f2ede2"/>
              <circle class="eye-dot" cx="31" cy="-64" r="4.5" fill="#f2ede2"/>
              <!-- Surprised Rings -->
              <circle class="eye-ring" cx="14" cy="-64" r="6.8" fill="none" stroke="#f2ede2" stroke-width="2.5" opacity="0"/>
              <circle class="eye-ring" cx="31" cy="-64" r="6.8" fill="none" stroke="#f2ede2" stroke-width="2.5" opacity="0"/>
            </g>

            <!-- Eyebrows -->
            <g id="s1Brows">
              <rect id="s1BrowL" x="7" y="-76" width="14" height="4" rx="2" fill="#f2ede2"/>
              <rect id="s1BrowR" x="24" y="-76" width="14" height="4" rx="2" fill="#f2ede2"/>
            </g>

            <!-- Mouth -->
            <line id="s1MouthFlat" x1="16" y1="-44" x2="29" y2="-44" stroke="#f2ede2" stroke-width="3.5" stroke-linecap="round"/>
            <ellipse id="s1MouthOpen" cx="22.5" cy="-43" rx="4.5" ry="5.5" fill="#f2ede2" opacity="0"/>
          </g>

          <!-- Arm & Glowing Smartphone -->
          <g id="s1Arm" class="gpu-layer" transform="translate(8, 12)">
            <rect x="0" y="-6" width="54" height="16" rx="8" fill="#0d0b12" transform="rotate(-14)"/>
            <g transform="translate(52, -34) rotate(16)">
              <rect x="-3" y="-3" width="18" height="46" rx="6" fill="#38bdf8" opacity="0.38"/>
              <rect x="0" y="0" width="12" height="40" rx="4" fill="#7dd3fc"/>
              <!-- Animated Feed Bars on Phone -->
              <rect id="s1ScreenFeed" x="2.5" y="6" width="7" height="13" rx="2" fill="#ffffff" opacity="0.92"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play Scene 1 (7.5s)</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playVibrate() {
      playTone(95, 'sawtooth', 0.16, 0.08, 82);
      setTimeout(() => playTone(95, 'sawtooth', 0.16, 0.08, 82), 230);
    }

    function playBassDrop() {
      playTone(115, 'sine', 1.4, 0.28, 35);
    }

    let sceneTl = null;

    function playScene1() {
      if (sceneTl) sceneTl.kill();

      // Reset initial states
      gsap.set('#s1Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s1Clock', { scale: 1 });
      gsap.set('.eye-dot', { scaleY: 1, opacity: 1, transformOrigin: 'center' });
      gsap.set('.eye-ring', { opacity: 0 });
      gsap.set('#s1BrowL', { y: 0, rotation: 0 });
      gsap.set('#s1BrowR', { y: 0, rotation: 0 });
      gsap.set('#s1MouthFlat', { opacity: 1 });
      gsap.set('#s1MouthOpen', { opacity: 0 });
      document.getElementById('s1ClockText').textContent = '01:59';

      sceneTl = gsap.timeline();

      // 0.0s: Phone buzz & continuous thumb scrolling
      sceneTl.call(() => playVibrate(), null, 0);
      sceneTl.to('#s1Arm', { rotation: -6, duration: 0.42, yoyo: true, repeat: 15, ease: 'sine.inOut' }, 0);
      sceneTl.to('#s1ScreenFeed', { y: 15, duration: 0.42, yoyo: true, repeat: 15, ease: 'power1.inOut' }, 0);
      sceneTl.to('#s1PhonePool', { scale: 1.12, transformOrigin: 'center', duration: 1.4, yoyo: true, repeat: 4, ease: 'sine.inOut' }, 0);

      // 1.3s: Natural eye blink
      sceneTl.to('.eye-dot', { scaleY: 0.1, duration: 0.08, yoyo: true, repeat: 1 }, 1.3);

      // 2.2s: Clock hits 02:00 -> Character reacts with shock & Camera zooms in
      sceneTl.call(() => {
        document.getElementById('s1ClockText').textContent = '02:00';
        playBassDrop();
      }, null, 2.2);

      sceneTl.to('#s1Clock', { scale: 1.14, duration: 0.24, yoyo: true, repeat: 1, transformOrigin: 'center' }, 2.2);
      sceneTl.to('.eye-dot', { opacity: 0, duration: 0.1 }, 2.3);
      sceneTl.to('.eye-ring', { opacity: 1, duration: 0.15 }, 2.3);
      sceneTl.to('#s1BrowL', { y: -5, rotation: -12, duration: 0.2 }, 2.3);
      sceneTl.to('#s1BrowR', { y: -5, rotation: 12, duration: 0.2 }, 2.3);
      sceneTl.to('#s1MouthFlat', { opacity: 0, duration: 0.1 }, 2.3);
      sceneTl.to('#s1MouthOpen', { opacity: 1, duration: 0.15 }, 2.3);

      // Smooth Push-In Camera Zoom (2.4s to 7.5s)
      sceneTl.to('#s1Camera', {
        scale: 1.25,
        x: -25,
        y: -45,
        transformOrigin: 'center',
        duration: 5.0,
        ease: 'power2.inOut'
      }, 2.4);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene1();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    // Auto-start preview on load
    window.addEventListener('load', () => {
      setTimeout(playScene1, 300);
    });
  </script>
</body>
</html>
