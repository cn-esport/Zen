<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenspiris — The Baker's Alarm Scene 1: The Burnt Loaf (6.0s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #fcd34d;
      --rim-cool: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #040406;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      gap: 14px;
      padding: 12px;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #070911;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
      border-radius: 4px;
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(3, 4, 8, 0.92) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }

    .letterbox.top {
      top: 0;
      border-bottom: 1px solid rgba(252, 211, 77, 0.35);
    }

    .letterbox.bottom {
      bottom: 0;
      border-top: 1px solid rgba(252, 211, 77, 0.35);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button.primary {
      background: #1e3a5f;
      border-color: #3b82f6;
      color: #fff;
    }
  </style>
</head>

  <script>
    // --- WEB AUDIO PROCEDURAL FOLEY ---
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 1. Iron Oven Door Bang + Latch Pop
    function playOvenDoorBang() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      // Metallic clank (two detuned triangle/sawtooth hits)
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(195, now);
      osc1.frequency.exponentialRampToValueAtTime(52, now + 0.18);
      osc2.frequency.setValueAtTime(340, now);
      osc2.frequency.exponentialRampToValueAtTime(88, now + 0.14);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.23);
      osc2.stop(now + 0.23);
    }

    // 2. Smoke Puff (Filtered Noise Burst)
    function playSmokePuff() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const duration = 0.45;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(680, now);
      filter.frequency.exponentialRampToValueAtTime(240, now + duration);
      filter.Q.value = 1.8;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
      noise.stop(now + duration);
    }

    // 3. Stone Floor Footstep
    function playStoneStep() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(125, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.085);

      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    // 4. Wooden Peel Slide
    function playPeelSlide() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const duration = 0.25;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(920, now);
      filter.Q.value = 3.2;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
      noise.stop(now + duration);
    }

    // --- GSAP TIMELINE ---
    let sceneTl = null;
    const playBtn = document.getElementById('playBtn');
    const replayBtn = document.getElementById('replayBtn');
    const soundBtn = document.getElementById('soundBtn');

    function resetScene1ToStart() {
      if (sceneTl) {
        sceneTl.kill();
        sceneTl = null;
      }

      gsap.set('#s1Camera', { scale: 1, x: 0, y: 0, transformOrigin: '250px 520px' });
      gsap.set('#s1Baker', { x: 268, y: 635 });
      gsap.set('#s1BakerTorso', { y: 0, rotation: 0, transformOrigin: '0px 20px' });
      gsap.set('#s1BakerHead', { x: 0, y: -64, rotation: -5, transformOrigin: '0px 16px' });

      gsap.set('#s1FrontLeg', { rotation: 0, transformOrigin: '0px 0px' });
      gsap.set('#s1BackLeg', { rotation: 0, transformOrigin: '0px 0px' });

      gsap.set('#s1FrontArm', { attr: { points: '6,-32 10,-4 4,24' } });
      gsap.set('#s1FarArm', { attr: { points: '-10,-34 -24,-6 -18,22' } });

      gsap.set('#s1FaceSleepyLeft', { opacity: 1 });
      gsap.set('#s1FaceOpenLeft', { opacity: 0 });
      gsap.set('#s1FaceCamera', { opacity: 0 });

      gsap.set('#s1OvenDoor', { x: 158, y: 540, scaleX: 1, transformOrigin: '0px 0px' });
      gsap.set('#s1OvenInnerGlow', { opacity: 0.42, scale: 1, transformOrigin: '95px 545px' });
      gsap.set('#s1RoomWash', { opacity: 0.25 });
      gsap.set('#s1OvenBeam', { opacity: 0.05 });
      gsap.set('#s1HeadRim', { opacity: 0.45 });
      gsap.set('#s1TorsoRim', { opacity: 0.35 });

      gsap.set('#s1SmokeGroup', { opacity: 0 });
      gsap.set('#s1Smoke1', { x: 0, y: 0, scale: 0.5, opacity: 0.9, transformOrigin: '155px 515px' });
      gsap.set('#s1Smoke2', { x: 0, y: 0, scale: 0.5, opacity: 0.9, transformOrigin: '172px 495px' });
      gsap.set('#s1Smoke3', { x: 0, y: 0, scale: 0.5, opacity: 0.9, transformOrigin: '145px 480px' });
      gsap.set('#s1Smoke4', { x: 0, y: 0, scale: 0.5, opacity: 0.9, transformOrigin: '182px 525px' });

      gsap.set('#s1PeelGroup', { opacity: 0, x: -26, y: 8 });
      gsap.set('#s1LoafSmoke', { y: 0, opacity: 0.6 });

      gsap.set(['#s1Z1', '#s1Z2', '#s1Z3'], { opacity: 0, y: 0 });

      replayBtn.textContent = '↺ 0.0s';
    }

    function playScene1() {
      resetScene1ToStart();

      const walkState = { stride: 0 };

      sceneTl = gsap.timeline({
        onUpdate: () => {
          replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
        },
        onComplete: () => {
          replayBtn.textContent = '↺ 6.0s';
        }
      });

      // 0.0s: Slow camera push-in over full 6.0s
      sceneTl.to('#s1Camera', {
        scale: 1.06,
        transformOrigin: '245px 525px',
        duration: 6.0,
        ease: 'power1.inOut'
      }, 0);

      // 0.0s - 1.5s: Calm pre-dawn establishing shot, oven embers pulse, sleepy z Z Z
      sceneTl.to('#s1OvenInnerGlow', {
        opacity: 0.62,
        scale: 1.05,
        duration: 0.75,
        yoyo: true,
        repeat: 1,
        ease: 'sine.inOut'
      }, 0);

      sceneTl.to('#s1BakerHead', {
        rotation: -8,
        duration: 0.85,
        ease: 'sine.inOut'
      }, 0.1);

      // Floating z Z Z
      sceneTl.fromTo('#s1Z1', { opacity: 0, y: 0 }, { opacity: 0.75, y: -14, duration: 0.7, ease: 'sine.out', immediateRender: false }, 0.15);
      sceneTl.fromTo('#s1Z2', { opacity: 0, y: 0 }, { opacity: 0.65, y: -18, duration: 0.75, ease: 'sine.out', immediateRender: false }, 0.35);
      sceneTl.fromTo('#s1Z3', { opacity: 0, y: 0 }, { opacity: 0.55, y: -22, duration: 0.8, ease: 'sine.out', immediateRender: false }, 0.55);
      sceneTl.to(['#s1Z1', '#s1Z2', '#s1Z3'], { opacity: 0, duration: 0.25 }, 1.25);

      // 1.5s: Oven door pops open with a bang + smoke puffs + warm light surges
      sceneTl.call(() => {
        playOvenDoorBang();
        playSmokePuff();
      }, null, 1.5);

      // Oven door swings open
      sceneTl.to('#s1OvenDoor', {
        scaleX: -0.25,
        duration: 0.22,
        ease: 'back.out(1.6)'
      }, 1.5);

      // Warm light surge (source glow + room wash + rim light)
      sceneTl.to('#s1OvenInnerGlow', { opacity: 0.95, scale: 1.22, duration: 0.35, ease: 'power2.out' }, 1.5);
      sceneTl.to('#s1RoomWash', { opacity: 0.78, duration: 0.35, ease: 'power2.out' }, 1.5);
      sceneTl.to('#s1OvenBeam', { opacity: 0.14, duration: 0.35, ease: 'power2.out' }, 1.5);
      sceneTl.to('#s1HeadRim', { opacity: 0.62, duration: 0.3 }, 1.5);
      sceneTl.to('#s1TorsoRim', { opacity: 0.52, duration: 0.3 }, 1.5);

      // Smoke puffs billowing out
      sceneTl.set('#s1SmokeGroup', { opacity: 1 }, 1.5);
      sceneTl.to('#s1Smoke1', { x: 42, y: -55, scale: 1.45, opacity: 0, duration: 1.15, ease: 'power2.out' }, 1.5);
      sceneTl.to('#s1Smoke2', { x: 64, y: -78, scale: 1.65, opacity: 0, duration: 1.25, ease: 'power2.out' }, 1.55);
      sceneTl.to('#s1Smoke3', { x: 28, y: -88, scale: 1.55, opacity: 0, duration: 1.2, ease: 'power2.out' }, 1.58);
      sceneTl.to('#s1Smoke4', { x: 75, y: -42, scale: 1.35, opacity: 0, duration: 1.05, ease: 'power2.out' }, 1.62);

      // 2.7s: Baker reacts with deadpan eyes & steps closer to oven
      sceneTl.set('#s1FaceSleepyLeft', { opacity: 0 }, 2.7);
      sceneTl.set('#s1FaceOpenLeft', { opacity: 1 }, 2.7);

      // Subtle startle jolt & head snaps upright
      sceneTl.to('#s1BakerHead', {
        rotation: 0,
        duration: 0.22,
        ease: 'power2.out'
      }, 2.7);
      sceneTl.to('#s1BakerTorso', {
        y: -4,
        duration: 0.12,
        yoyo: true,
        repeat: 1,
        ease: 'power2.out'
      }, 2.7);

      // Short 2-step walk toward oven (x: 268 -> 236)
      sceneTl.call(() => playStoneStep(), null, 2.95);
      sceneTl.call(() => playStoneStep(), null, 3.25);

      sceneTl.to('#s1Baker', {
        x: 236,
        duration: 0.65,
        ease: 'power1.out'
      }, 2.9);

      sceneTl.to(walkState, {
        stride: 8,
        duration: 0.16,
        yoyo: true,
        repeat: 3,
        ease: 'sine.inOut',
        onUpdate: () => {
          document.getElementById('s1FrontLeg').setAttribute('transform', `translate(6, 20) rotate(${walkState.stride})`);
          document.getElementById('s1BackLeg').setAttribute('transform', `translate(-5, 20) rotate(${-walkState.stride})`);
        }
      }, 2.9);

      sceneTl.call(() => {
        document.getElementById('s1FrontLeg').setAttribute('transform', 'translate(6, 20) rotate(0)');
        document.getElementById('s1BackLeg').setAttribute('transform', 'translate(-5, 20) rotate(0)');
      }, null, 3.6);

      // 4.0s: Baker reaches in and pulls out a burnt loaf on wooden peel
      sceneTl.call(() => playPeelSlide(), null, 4.0);

      // Arms reach forward then pull back holding peel
      sceneTl.to('#s1FrontArm', {
        attr: { points: '4,-30 -18,-10 -34,4' },
        duration: 0.25,
        ease: 'power2.out'
      }, 3.85);
      sceneTl.to('#s1FarArm', {
        attr: { points: '-10,-32 -32,-12 -48,2' },
        duration: 0.25,
        ease: 'power2.out'
      }, 3.85);

      // Reveal peel & burnt loaf and pull out
      sceneTl.set('#s1PeelGroup', { opacity: 1, x: -45, y: 6 }, 4.05);
      sceneTl.to('#s1PeelGroup', {
        x: -14,
        y: 8,
        duration: 0.45,
        ease: 'power2.out'
      }, 4.05);
      sceneTl.to('#s1FrontArm', {
        attr: { points: '6,-30 -6,-6 -16,8' },
        duration: 0.45,
        ease: 'power2.out'
      }, 4.05);
      sceneTl.to('#s1FarArm', {
        attr: { points: '-10,-32 -22,-8 -32,6' },
        duration: 0.45,
        ease: 'power2.out'
      }, 4.05);

      // Rising wisp of smoke off the burnt loaf
      sceneTl.to('#s1LoafSmoke', {
        y: -12,
        opacity: 0.25,
        duration: 1.6,
        ease: 'sine.out'
      }, 4.2);

      // 5.0s - 6.0s: Baker turns head to stare deadpan at the camera, hold
      sceneTl.set('#s1FaceOpenLeft', { opacity: 0 }, 5.0);
      sceneTl.set('#s1FaceCamera', { opacity: 1 }, 5.0);
      sceneTl.to('#s1BakerHead', {
        x: 2,
        rotation: 2,
        duration: 0.18,
        ease: 'power2.out'
      }, 5.0);
    }

    playBtn.addEventListener('click', () => {
      initAudio();
      playScene1();
    });

    replayBtn.addEventListener('click', () => {
      initAudio();
      playScene1();
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      if (soundEnabled) initAudio();
    });

    window.addEventListener('load', () => {
      setTimeout(playScene1, 250);
    });
  </script>
</body>
</html>
