<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 2: Waking Up Inside (5.0s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #93c5fd;
      --nightshirt: #cbd5e1;
      --nightshirt-shadow: #94a3b8;
      --blanket: #2b3344;
      --blanket-dark: #1e2433;
      --wood: #171412;
      --wood-light: #26201c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #080a10;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(3, 4, 8, 0.94) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="s2WallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#090b12"/>
          <stop offset="60%" stop-color="#111522"/>
          <stop offset="100%" stop-color="#0b0d14"/>
        </linearGradient>

        <linearGradient id="s2WindowSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#080d1a"/>
          <stop offset="55%" stop-color="#142038"/>
          <stop offset="100%" stop-color="#1e2d4a"/>
        </linearGradient>

        <linearGradient id="s2WindowBeam" x1="0.8" y1="0" x2="0.2" y2="1">
          <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.22"/>
          <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="s2FloorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#120f0d"/>
          <stop offset="100%" stop-color="#070605"/>
        </linearGradient>

        <clipPath id="windowGlassClip">
          <rect x="0" y="0" width="200" height="280"/>
        </clipPath>
      </defs>

      <!-- Camera Group -->
      <g id="s2Camera">
        <rect width="540" height="725" fill="url(#s2WallGrad)"/>
        <rect x="0" y="725" width="540" height="235" fill="url(#s2FloorGrad)"/>
        <line x1="0" y1="765" x2="540" y2="765" stroke="#090807" stroke-width="2"/>
        <line x1="0" y1="815" x2="540" y2="815" stroke="#090807" stroke-width="2"/>
        <line x1="0" y1="875" x2="540" y2="875" stroke="#090807" stroke-width="2"/>

        <!-- 1800s BEDROOM WINDOW -->
        <g id="s2WindowGroup" transform="translate(275, 165)">
          <rect x="-8" y="-8" width="216" height="296" rx="4" fill="#07090e"/>
          <rect x="0" y="0" width="200" height="280" fill="url(#s2WindowSky)"/>

          <!-- Clipped Exterior Elements -->
          <g clip-path="url(#windowGlassClip)">
            <circle cx="148" cy="58" r="14" fill="#e2e8f0" opacity="0.25"/>
            <path d="M 0 280 L 0 225 L 55 212 L 55 195 L 72 195 L 72 210 L 140 200 L 200 222 L 200 280 Z" fill="#0a0f1c"/>

            <!-- Bamboo Pole Tip Strictly Outside Window Glass -->
            <g id="s2OutsidePole">
              <line x1="-18" y1="285" x2="52" y2="132" stroke="#05070b" stroke-width="5.5" stroke-linecap="round"/>
              <line x1="-17" y1="285" x2="53" y2="132" stroke="#94a3b8" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
              <circle cx="52" cy="132" r="5" fill="#1e293b"/>
            </g>
          </g>

          <!-- Glass Tap Ripple Centered EXACTLY on Pole Tip -->
          <circle id="s2GlassRipple" cx="52" cy="132" r="14" fill="none" stroke="#f2ede2" stroke-width="2" opacity="0"/>

          <!-- Window Frame Crossbars -->
          <rect x="97" y="0" width="6" height="280" fill="#07090e"/>
          <rect x="0" y="138" width="200" height="6" fill="#07090e"/>
          <rect x="-14" y="280" width="228" height="10" rx="2" fill="#181c26"/>
        </g>

        <!-- Diagonal Moonlight Shaft -->
        <polygon points="275,165 475,165 360,725 80,725" fill="url(#s2WindowBeam)" pointer-events="none"/>

        <!-- 1800s NIGHTSTAND -->
        <g transform="translate(32, 520)">
          <rect x="8" y="105" width="90" height="100" rx="3" fill="var(--wood)"/>
          <rect x="4" y="101" width="98" height="8" rx="2" fill="var(--wood-light)"/>
          <rect x="16" y="118" width="74" height="30" rx="2" fill="#0e0c0a"/>
          <circle cx="53" cy="133" r="3" fill="#3a322c"/>

          <!-- Brass Candlestick + Wax Candle -->
          <ellipse cx="42" cy="99" rx="14" ry="3.5" fill="#785a28"/>
          <rect x="39" y="88" width="6" height="11" fill="#926f34"/>
          <rect x="38" y="64" width="8" height="24" rx="1.5" fill="#e2d9c8"/>
          <line x1="42" y1="59" x2="42" y2="64" stroke="#1c1917" stroke-width="1.5"/>

          <!-- Vintage Pocket Watch -->
          <circle cx="74" cy="97" r="8" fill="#a17c38"/>
          <circle cx="74" cy="97" r="6" fill="#e7e0d0"/>
        </g>

        <!-- 1800s WOODEN BED & SLEEPING WORKER -->
        <g transform="translate(132, 560)">
          <ellipse cx="165" cy="166" rx="175" ry="12" fill="#040406" opacity="0.9"/>

          <!-- Vintage Wooden Headboard & Footboard -->
          <rect x="0" y="34" width="14" height="130" rx="4" fill="var(--wood-light)"/>
          <circle cx="7" cy="30" r="9" fill="var(--wood-light)"/>
          <rect x="314" y="72" width="14" height="92" rx="4" fill="var(--wood-light)"/>
          <circle cx="321" cy="68" r="8" fill="var(--wood-light)"/>

          <!-- Bed Frame & Mattress -->
          <rect x="10" y="122" width="308" height="22" rx="3" fill="var(--wood)"/>
          <rect x="14" y="102" width="300" height="24" rx="8" fill="#1e222d"/>

          <!-- Plump Feather Pillow -->
          <rect x="24" y="76" width="68" height="28" rx="13" fill="#333b4d"/>

          <!-- Floating "z Z Z" Sleep Indicator (Matches Reference Screenshot) -->
          <g id="s2ZzzGroup" fill="#94a3b8" font-family="sans-serif" font-weight="600">
            <text id="s2Z1" x="86" y="42" font-size="11" opacity="0.85">z</text>
            <text id="s2Z2" x="100" y="26" font-size="14" opacity="0.75">Z</text>
            <text id="s2Z3" x="116" y="8" font-size="17" opacity="0.65">Z</text>
          </g>

          <!-- ZENSPIRIS CHARACTER RIG -->
          <g id="s2Char">
            <!-- Upper Body Group (Pivots cleanly from hip at 136, 94) -->
            <g id="s2UpperBody">
              <!-- Period Cotton Nightshirt Torso (Extended smoothly downward so zero edge glitches above blanket) -->
              <path d="M 126 36 Q 126 31.5 131.5 30.5 Q 136 26.5 140.5 30.5 Q 147 31.5 147.5 36 L 147 110 L 126 110 Z"
                    fill="var(--rim)" opacity="0.35"/>
              <path d="M 127 36 Q 127 31.5 132 30.5 Q 136 27 140 30.5 Q 145.5 31.5 146 36 L 146 110 L 127 110 Z"
                    fill="var(--nightshirt)"/>
              <line x1="139" y1="33" x2="139" y2="56" stroke="var(--nightshirt-shadow)" stroke-width="1.5"/>

              <!-- Zenspiris Signature Head (Exact r=22) -->
              <g id="s2Head">
                <circle cx="137.5" cy="6" r="22" fill="var(--rim)" opacity="0.5"/>
                <circle cx="136" cy="6" r="22" fill="var(--head)"/>

                <!-- Closed Curved Sleeping Eyes (Exact Match to Reference Screenshot) -->
                <g id="s2EyesClosed">
                  <path d="M 142 3.5 Q 145 6.5 148 3.5" fill="none" stroke="var(--face)" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M 150 3.5 Q 153 6.5 156 3.5" fill="none" stroke="var(--face)" stroke-width="1.8" stroke-linecap="round"/>
                  <line x1="146" y1="12.5" x2="152" y2="12.5" stroke="var(--face)" stroke-width="1.8" stroke-linecap="round"/>
                </g>

                <!-- Awake Dot Eyes Looking Straight Toward the Window -->
                <g id="s2EyesAwake" opacity="0">
                  <circle cx="145" cy="4.5" r="2.2" fill="var(--face)"/>
                  <circle cx="152.5" cy="4.5" r="2.2" fill="var(--face)"/>
                  <circle cx="149" cy="13.5" r="2" fill="var(--face)"/>
                </g>
              </g>

              <!-- Sleek Black Arm Resting Naturally on Blanket -->
              <g id="s2Arm">
                <path d="M 137 40 L 144 64 L 160 84" fill="none" stroke="var(--head)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 136 37 L 141 53" fill="none" stroke="var(--nightshirt)" stroke-width="7.6" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Heavy Wool Blanket Covering Torso & Legs Cleanly (Zero Exposed Torso Glitch!) -->
            <path d="M 102 82 Q 168 74 248 84 L 308 92 L 308 118 L 102 118 Z" fill="var(--blanket)"/>
            <!-- Folded Blanket Cuff Over Chest -->
            <path d="M 102 82 Q 126 78 150 82 L 150 118 L 102 118 Z" fill="var(--blanket-dark)"/>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button class="primary" id="playBtn">▶ Play (5.0s)</button>
    <button id="replayBtn">↺ 0.0s</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playIndoorGlassTap() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1280, now);
      osc1.frequency.exponentialRampToValueAtTime(780, now + 0.09);
      gain1.gain.setValueAtTime(0.16, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.1);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(340, now);
      osc2.frequency.exponentialRampToValueAtTime(150, now + 0.07);
      gain2.gain.setValueAtTime(0.15, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + 0.08);
    }

    function playBedRustle() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.45;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(650, now);
      filter.Q.setValueAtTime(1.2, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    let sceneTl = null;

    function playScene2() {
      if (sceneTl) sceneTl.kill();

      // Reset to 0.0s: Tucked cleanly under blanket with head resting on pillow
      gsap.set('#s2Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s2UpperBody', { rotation: -78, x: 0, y: 2, svgOrigin: '136 94' });
      gsap.set('#s2Head', { rotation: 0, svgOrigin: '136 6' });
      gsap.set('#s2Arm', { rotation: 0, svgOrigin: '137 40' });
      gsap.set('#s2EyesClosed', { opacity: 1 });
      gsap.set('#s2EyesAwake', { opacity: 0 });
      gsap.set('#s2ZzzGroup', { opacity: 1, y: 0 });
      gsap.set('#s2OutsidePole', { rotation: -6, svgOrigin: '-18 285' });
      gsap.set('#s2GlassRipple', { opacity: 0, scale: 0.3, svgOrigin: '52 132' });
      gsap.set('#s2WindowGroup', { x: 275, y: 165 });

      sceneTl = gsap.timeline();

      sceneTl.to('#s2Camera', {
        scale: 1.09,
        svgOrigin: '290 500',
        duration: 5.0,
        ease: 'none'
      }, 0);

      // Gentle floating Zzz while sleeping (0.0s - 1.15s)
      sceneTl.to('#s2ZzzGroup', {
        y: -8,
        duration: 1.15,
        ease: 'sine.inOut'
      }, 0);

      function addOutsideTap(tapTime) {
        sceneTl.to('#s2OutsidePole', {
          rotation: 0,
          svgOrigin: '-18 285',
          duration: 0.14,
          ease: 'power2.in'
        }, tapTime - 0.14);

        sceneTl.call(() => playIndoorGlassTap(), null, tapTime);

        sceneTl.fromTo('#s2GlassRipple',
          { opacity: 0.9, scale: 0.3, svgOrigin: '52 132' },
          { opacity: 0, scale: 2.1, duration: 0.55, ease: 'power2.out' },
          tapTime
        );

        sceneTl.to('#s2WindowGroup', {
          x: 277,
          duration: 0.04,
          yoyo: true,
          repeat: 3,
          ease: 'sine.inOut'
        }, tapTime);

        sceneTl.to('#s2OutsidePole', {
          rotation: -6,
          svgOrigin: '-18 285',
          duration: 0.25,
          ease: 'power2.out'
        }, tapTime);
      }

      addOutsideTap(0.8);
      addOutsideTap(2.2);

      // 1.15s: Zzz disappears & eyes snap open!
      sceneTl.to('#s2ZzzGroup', { opacity: 0, y: -14, duration: 0.2 }, 1.05);
      sceneTl.to('#s2EyesClosed', { opacity: 0, duration: 0.08 }, 1.15);
      sceneTl.to('#s2EyesAwake', { opacity: 1, duration: 0.12 }, 1.18);

      // 1.3s: Worker sits up smoothly out of the blanket
      sceneTl.call(() => playBedRustle(), null, 1.3);
      sceneTl.to('#s2UpperBody', {
        rotation: 4,
        y: 0,
        svgOrigin: '136 94',
        duration: 0.85,
        ease: 'back.out(1.2)'
      }, 1.3);

      // 2.25s: Looks up slightly toward the window on the second tap
      sceneTl.to('#s2Head', {
        rotation: -12,
        svgOrigin: '136 6',
        duration: 0.4,
        ease: 'power2.out'
      }, 2.25);

      sceneTl.to('#s2UpperBody', {
        rotation: 0,
        svgOrigin: '136 94',
        duration: 0.8,
        ease: 'power2.inOut'
      }, 3.4);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene2();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      if (sceneTl) sceneTl.pause(0);
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene2, 250);
    });
  </script>
</body>
</html>
