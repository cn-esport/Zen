<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Last Soul Animator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <!-- Floating Player Controls (Tap background to show after hiding) -->
    <div id="controls">
      <button class="btn" id="playPauseBtn">Pause</button>
      <button class="btn" id="replayBtn">Replay</button>
      <button class="btn" id="muteBtn">Sound: ON</button>
      <button class="btn" id="hideBtn">Hide UI</button>
    </div>

    <!-- Animated Camera & SVG Stage -->
    <div id="camera">
      <svg id="scene-svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice"></svg>
    </div>

    <!-- Synced Captions -->
    <div id="caption-box">
      <div id="caption"></div>
    </div>
  </div>

  <script src="scene.js"></script>
</body>
</html>
