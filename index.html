<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 4: Industrial Factory Dawn (5.5s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #f59e0b;
      --worker1-coat: #1e2430;
      --worker1-pants: #2c2825;
      --worker2-coat: #292524;
      --worker2-pants: #1c1917;
      --cap: #14171f;
      --scarf: #7c2d12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #090b10;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Pre-Dawn Industrial Sky Gradient -->
        <linearGradient id="s4SkyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#080b14"/>
          <stop offset="48%" stop-color="#141c2e"/>
          <stop offset="82%" stop-color="#292524"/>
          <stop offset="100%" stop-color="#451a03"/>
        </linearGradient>

        <!-- Factory Furnace & Gate Warm Light -->
        <radialGradient id="s4FurnaceGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.72"/>
          <stop offset="45%" stop-color="#d97706" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>

        <!-- Early Morning Street Mist -->
        <linearGradient id="s4MistGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#94a3b8" stop-opacity="0"/>
          <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </linearGradient>

        <!-- Cobblestone Ground -->
        <linearGradient id="s4GroundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d0f14"/>
          <stop offset="100%" stop-color="#050608"/>
        </linearGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s4Camera">
        <!-- Sky -->
        <rect width="540" height="825" fill="url(#s4SkyGrad)"/>

        <!-- Distant Industrial Smokestacks & Rising Smoke Plumes -->
        <g id="s4SmokeGroup" opacity="0.28">
          <circle class="smoke-puff" cx="312" cy="185" r="22" fill="#64748b"/>
          <circle class="smoke-puff" cx="332" cy="152" r="28" fill="#475569"/>
          <circle class="smoke-puff" cx="362" cy="118" r="34" fill="#334155"/>
          <circle class="smoke-puff" cx="426" cy="215" r="18" fill="#64748b"/>
          <circle class="smoke-puff" cx="445" cy="182" r="24" fill="#475569"/>
        </g>

        <!-- 1800s INDUSTRIAL MILL / FACTORY SILHOUETTE (Right Background) -->
        <g id="s4Factory">
          <!-- Tall Brick Smokestacks -->
          <polygon points="300,390 306,195 318,195 324,390" fill="#090c14"/>
          <rect x="304" y="192" width="16" height="5" fill="#1e293b"/>
          <polygon points="416,410 421,225 431,225 436,410" fill="#090c14"/>
          <rect x="419" y="222" width="14" height="5" fill="#1e293b"/>

          <!-- Sawtooth Factory Roof & Main Brick Hall -->
          <polygon points="240,440 240,385 285,415 285,385 330,415 330,385 375,415 375,385 455,420 455,825 240,825" fill="#0b0e17"/>
          <rect x="240" y="385" width="2.5" height="440" fill="var(--rim)" opacity="0.18"/>

          <!-- Glowing Factory Windows (Early Shift Lights) -->
          <g fill="#f59e0b" opacity="0.38">
            <rect x="265" y="465" width="26" height="42" rx="2"/>
            <rect x="312" y="465" width="26" height="42" rx="2"/>
            <rect x="359" y="465" width="26" height="42" rx="2"/>
            <rect x="265" y="545" width="26" height="42" rx="2"/>
            <rect x="312" y="545" width="26" height="42" rx="2"/>
          </g>

          <!-- Open Iron Factory Entrance Archway (Right Side) -->
          <circle cx="415" cy="725" r="115" fill="url(#s4FurnaceGlow)"/>
          <path d="M 368 825 L 368 655 Q 415 620 462 655 L 462 825 Z" fill="#451a03" stroke="#1e293b" stroke-width="3"/>
          <!-- Steam Whistle Valve & Steam Puff on Factory Roof -->
          <rect x="372" y="370" width="6" height="16" fill="#1e293b"/>
          <circle id="s4WhistleSteam" cx="375" cy="364" r="8" fill="#f2ede2" opacity="0"/>
        </g>

        <!-- Low Drifting Morning Mist -->
        <rect x="0" y="695" width="540" height="130" fill="url(#s4MistGrad)" pointer-events="none"/>

        <!-- Ground -->
        <rect x="0" y="825" width="540" height="135" fill="url(#s4GroundGrad)"/>

        <!-- WORKER 1 (Woken Up Worker from Scene 2 — Walking Right Toward Factory Gate) -->
        <g id="s4Worker1" transform="translate(35, 678)">
          <ellipse cx="101" cy="148" rx="25" ry="5" fill="#030406" opacity="0.85"/>

          <!-- Back Leg (Aligned Right) -->
          <g id="s4W1LegBack">
            <path d="M 99 86 L 96 116 L 94 144 L 103 144"
                  fill="none" stroke="#181614" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Front Leg (Aligned Right) -->
          <g id="s4W1LegFront">
            <path d="M 103 86 L 106 116 L 108 144 L 117 144"
                  fill="none" stroke="var(--worker1-pants)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Torso & Work Jacket -->
          <g id="s4W1Torso">
            <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 25 105 28.5 Q 110.5 29.5 111 34 L 112 92 L 90 92 Z"
                  fill="var(--worker1-coat)"/>
            <!-- Warm Rim Light on Front Facing Factory Glow -->
            <path d="M 109 34 L 112 34 L 113 92 L 110 92 Z" fill="var(--rim)" opacity="0.4"/>
            <!-- Scarf -->
            <rect x="92" y="27" width="18.5" height="6" rx="3" fill="var(--scarf)"/>

            <!-- Head Group (Exact Zenspiris Rig r=22 + Flat Cap) -->
            <g id="s4W1Head">
              <circle cx="102.5" cy="4" r="22" fill="var(--rim)" opacity="0.45"/>
              <circle cx="101" cy="4" r="22" fill="var(--head)"/>
              <!-- Flat Cap Facing Right -->
              <path d="M 80 -10 C 82 -22, 114 -23, 121 -11 L 130 -8 L 80 -7 Z" fill="var(--cap)"/>
              <!-- Clean Zenspiris Face -->
              <circle cx="111" cy="2.5" r="2.1" fill="var(--face)"/>
              <circle cx="118.8" cy="2.5" r="2.1" fill="var(--face)"/>
              <line x1="112" y1="11.5" x2="118" y2="11.5" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
            </g>

            <!-- Swinging Front Arm -->
            <g id="s4W1Arm">
              <path d="M 102 36 L 105 58 L 111 76" fill="none" stroke="var(--head)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 101 34 L 103 48" fill="none" stroke="var(--worker1-coat)" stroke-width="7.6" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <!-- WORKER 2 (Second Factory Worker Ahead — Walking Right into Gate) -->
        <g id="s4Worker2" transform="translate(155, 682) scale(0.95)">
          <ellipse cx="101" cy="148" rx="24" ry="5" fill="#030406" opacity="0.85"/>

          <g id="s4W2LegBack">
            <path d="M 99 86 L 96 116 L 94 144 L 103 144"
                  fill="none" stroke="#141210" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <g id="s4W2LegFront">
            <path d="M 103 86 L 106 116 L 108 144 L 117 144"
                  fill="none" stroke="var(--worker2-pants)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <g id="s4W2Torso">
            <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 25 105 28.5 Q 110.5 29.5 111 34 L 113 96 L 89 96 Z"
                  fill="var(--worker2-coat)"/>
            <path d="M 109 34 L 112 34 L 114 96 L 111 96 Z" fill="var(--rim)" opacity="0.45"/>

            <g id="s4W2Head">
              <circle cx="102.5" cy="4" r="22" fill="var(--rim)" opacity="0.5"/>
              <circle cx="101" cy="4" r="22" fill="var(--head)"/>
              <path d="M 80 -10 C 82 -22, 114 -23, 121 -11 L 130 -8 L 80 -7 Z" fill="#1c1917"/>
              <circle cx="111" cy="2.5" r="2.1" fill="var(--face)"/>
              <circle cx="118.8" cy="2.5" r="2.1" fill="var(--face)"/>
              <line x1="112" y1="11.5" x2="118" y2="11.5" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
            </g>

            <g id="s4W2Arm">
              <path d="M 102 36 L 105 58 L 111 76" fill="none" stroke="var(--head)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 101 34 L 103 48" fill="none" stroke="var(--worker2-coat)" stroke-width="7.6" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button class="primary" id="playBtn">▶ Play (5.5s)</button>
    <button id="replayBtn">↺ 0.0s</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 1800s Factory Steam Shift Whistle Foley SFX
    function playFactoryWhistle() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      const freqs = [311.13, 392.00]; // Deep resonant brass steam chord
      freqs.forEach((f) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f * 0.94, now);
        osc.frequency.linearRampToValueAtTime(f, now + 0.18);
        osc.frequency.setValueAtTime(f, now + 1.1);
        osc.frequency.exponentialRampToValueAtTime(f * 0.88, now + 1.45);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(950, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.065, now + 0.15);
        gain.gain.setValueAtTime(0.065, now + 1.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 1.55);
      });
    }

    function playFootstep() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(52, now + 0.08);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    let sceneTl = null;
    let walkTl1 = null;
    let walkTl2 = null;

    function playScene4() {
      if (sceneTl) sceneTl.kill();
      if (walkTl1) walkTl1.kill();
      if (walkTl2) walkTl2.kill();

      // Reset to 0.0s
      gsap.set('#s4Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s4Worker1', { x: 35, y: 678, opacity: 1 });
      gsap.set('#s4Worker2', { x: 155, y: 682, scale: 0.95, opacity: 1 });
      gsap.set('#s4W1LegFront, #s4W1LegBack, #s4W2LegFront, #s4W2LegBack', { rotation: 0, y: 0 });
      gsap.set('#s4W1Arm, #s4W2Arm', { rotation: 0 });
      gsap.set('#s4W1Torso, #s4W2Torso', { y: 0, rotation: 0 });
      gsap.set('#s4WhistleSteam', { opacity: 0, scale: 0.5, y: 0, svgOrigin: '375 364' });
      gsap.set('.smoke-puff', { y: 0, x: 0, opacity: 0.85 });

      sceneTl = gsap.timeline();

      // Slow cinematic camera push toward the factory gate
      sceneTl.to('#s4Camera', {
        scale: 1.08,
        x: -14,
        svgOrigin: '300 520',
        duration: 5.5,
        ease: 'none'
      }, 0);

      // Rising smokestack plumes
      sceneTl.to('.smoke-puff', {
        y: -35,
        x: 18,
        opacity: 0.35,
        duration: 5.5,
        stagger: 0.2,
        ease: 'none'
      }, 0);

      // Workers walking right toward the glowing factory entrance
      sceneTl.to('#s4Worker1', {
        x: 275,
        duration: 5.5,
        ease: 'none'
      }, 0);

      sceneTl.to('#s4Worker2', {
        x: 325,
        duration: 4.4,
        ease: 'none'
      }, 0);

      // Worker 2 enters the glowing factory gate at 4.1s
      sceneTl.to('#s4Worker2', {
        opacity: 0,
        duration: 0.45,
        ease: 'power1.in'
      }, 4.0);

      // 2.3s: Factory Shift Steam Whistle blows + white steam puff rises from whistle
      sceneTl.call(() => playFactoryWhistle(), null, 2.3);
      sceneTl.fromTo('#s4WhistleSteam',
        { opacity: 0.85, scale: 0.4, y: 0, svgOrigin: '375 364' },
        { opacity: 0, scale: 2.8, y: -38, duration: 1.5, ease: 'power2.out' },
        2.3
      );

      // Natural Continuous Walk Cycle for Worker 1
      walkTl1 = gsap.timeline({ repeat: 6 });
      walkTl1.call(() => playFootstep(), null, 0.05);
      walkTl1.to('#s4W1LegFront', { rotation: -23, y: -2, svgOrigin: '103 86', duration: 0.22, ease: 'power1.out' }, 0);
      walkTl1.to('#s4W1LegFront', { rotation: -21, y: 0, svgOrigin: '103 86', duration: 0.22, ease: 'power1.in' }, 0.22);
      walkTl1.to('#s4W1LegBack', { rotation: 21, y: 0, svgOrigin: '99 86', duration: 0.44, ease: 'sine.inOut' }, 0);
      walkTl1.to('#s4W1Arm', { rotation: 18, svgOrigin: '102 36', duration: 0.44, ease: 'sine.inOut' }, 0);
      walkTl1.to('#s4W1Torso', { y: -2.5, rotation: 1.8, svgOrigin: '101 86', duration: 0.22, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0);

      walkTl1.call(() => playFootstep(), null, 0.49);
      walkTl1.to('#s4W1LegBack', { rotation: -23, y: -2, svgOrigin: '99 86', duration: 0.22, ease: 'power1.out' }, 0.44);
      walkTl1.to('#s4W1LegBack', { rotation: -21, y: 0, svgOrigin: '99 86', duration: 0.22, ease: 'power1.in' }, 0.66);
      walkTl1.to('#s4W1LegFront', { rotation: 21, y: 0, svgOrigin: '103 86', duration: 0.44, ease: 'sine.inOut' }, 0.44);
      walkTl1.to('#s4W1Arm', { rotation: -16, svgOrigin: '102 36', duration: 0.44, ease: 'sine.inOut' }, 0.44);
      walkTl1.to('#s4W1Torso', { y: -2.5, rotation: 1.8, svgOrigin: '101 86', duration: 0.22, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0.44);

      // Offset Walk Cycle for Worker 2 (So they don't look like robotic clones)
      walkTl2 = gsap.timeline({ repeat: 5 });
      walkTl2.to('#s4W2LegBack', { rotation: -22, y: -2, svgOrigin: '99 86', duration: 0.21, ease: 'power1.out' }, 0);
      walkTl2.to('#s4W2LegBack', { rotation: -20, y: 0, svgOrigin: '99 86', duration: 0.21, ease: 'power1.in' }, 0.21);
      walkTl2.to('#s4W2LegFront', { rotation: 20, y: 0, svgOrigin: '103 86', duration: 0.42, ease: 'sine.inOut' }, 0);
      walkTl2.to('#s4W2Arm', { rotation: -16, svgOrigin: '102 36', duration: 0.42, ease: 'sine.inOut' }, 0);
      walkTl2.to('#s4W2Torso', { y: -2.2, rotation: 1.5, svgOrigin: '101 86', duration: 0.21, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0);

      walkTl2.to('#s4W2LegFront', { rotation: -22, y: -2, svgOrigin: '103 86', duration: 0.21, ease: 'power1.out' }, 0.42);
      walkTl2.to('#s4W2LegFront', { rotation: -20, y: 0, svgOrigin: '103 86', duration: 0.21, ease: 'power1.in' }, 0.63);
      walkTl2.to('#s4W2LegBack', { rotation: 20, y: 0, svgOrigin: '99 86', duration: 0.42, ease: 'sine.inOut' }, 0.42);
      walkTl2.to('#s4W2Arm', { rotation: 16, svgOrigin: '102 36', duration: 0.42, ease: 'sine.inOut' }, 0.42);
      walkTl2.to('#s4W2Torso', { y: -2.2, rotation: 1.5, svgOrigin: '101 86', duration: 0.21, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0.42);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene4();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      if (sceneTl) sceneTl.pause(0);
      if (walkTl1) walkTl1.kill();
      if (walkTl2) walkTl2.kill();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene4, 250);
    });
  </script>
</body>
</html>
