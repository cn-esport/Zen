<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — The Quiet Departure Scene 1: Sliding Door (5.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(252,211,77,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(252,211,77,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style></head>
<body>
<div class="stage-wrapper">
<div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="s1TealWall" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#050b0e"/>
  <stop offset="0.48" stop-color="#0a1a20"/>
  <stop offset="1" stop-color="#0f252d"/>
 </linearGradient>
 <linearGradient id="s1WoodFloor" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0e1419"/>
  <stop offset="1" stop-color="#040508"/>
 </linearGradient>
 <linearGradient id="s1EmberOpening" x1="0" y1="0" x2="1" y2="0.4">
  <stop offset="0" stop-color="#f59e0b"/>
  <stop offset="0.55" stop-color="#fb923c"/>
  <stop offset="1" stop-color="#fdba74"/>
 </linearGradient>
 <linearGradient id="s1FloorBeam" x1="0.8" y1="0" x2="0.2" y2="1">
  <stop offset="0" stop-color="#f59e0b" stop-opacity=".34"/>
  <stop offset="0.65" stop-color="#d97706" stop-opacity=".14"/>
  <stop offset="1" stop-color="#b45309" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="s1DoorGlow">
  <stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
  <stop offset="0.5" stop-color="#ea580c" stop-opacity=".2"/>
  <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
 </radialGradient>
</defs>

<g id="s1Camera">
 <!-- dark teal interior wall + floor -->
 <rect x="0" y="0" width="540" height="772" fill="url(#s1TealWall)"/>
 <rect x="0" y="770" width="540" height="190" fill="url(#s1WoodFloor)"/>

 <!-- subtle architectural wall grid & dado rail -->
 <g stroke="#11262e" stroke-width="2" fill="none" opacity=".8">
  <line x1="145" y1="0" x2="145" y2="770"/>
  <line x1="315" y1="0" x2="315" y2="770"/>
  <line x1="0" y1="435" x2="540" y2="435"/>
  <line x1="0" y1="535" x2="315" y2="535"/>
 </g>
 <line x1="0" y1="770" x2="540" y2="770" stroke="#182c34" stroke-width="3"/>

 <!-- warm ambient spill on right wall & floor -->
 <circle id="s1EmberAura" cx="395" cy="590" r="240" fill="url(#s1DoorGlow)" opacity=".65"/>

 <!-- floor light beam extending from open door -->
 <polygon id="s1FloorBeam" points="315,770 406,770 302,882 145,882" fill="url(#s1FloorBeam)" opacity=".9"/>

 <!-- doorway on right (open bright amber/orange gap + dark sliding door leaf) -->
 <g id="s1Doorway">
  <!-- outer frame -->
  <rect x="313" y="433" width="176" height="337" fill="#070b0e" stroke="#16252c" stroke-width="3"/>
  <!-- open glowing ember doorway -->
  <rect x="316" y="436" width="90" height="334" fill="url(#s1EmberOpening)"/>
  <!-- subtle diagonal light sheen inside open gap -->
  <polygon points="316,436 406,436 406,630 316,525" fill="#fef08a" opacity=".12"/>

  <!-- sliding door panel on the right -->
  <g id="s1SlidingPanel" transform="translate(0,0)">
   <rect x="406" y="436" width="80" height="334" fill="#0d171c" stroke="#182930" stroke-width="2"/>
   <!-- subtle door panel lines -->
   <line x1="406" y1="535" x2="486" y2="535" stroke="#15242b" stroke-width="2"/>
   <line x1="406" y1="645" x2="486" y2="645" stroke="#15242b" stroke-width="2"/>
   <!-- handle -->
   <rect x="415" y="585" width="4" height="22" rx="1.5" fill="#1d2f37"/>
  </g>
 </g>

 <!-- floating dust motes in the light -->
 <g fill="#fde68a">
  <circle class="s1Dust" cx="348" cy="655" r="2" opacity=".55"/>
  <circle class="s1Dust" cx="375" cy="695" r="1.6" opacity=".45"/>
  <circle class="s1Dust" cx="332" cy="725" r="2.2" opacity=".4"/>
  <circle class="s1Dust" cx="362" cy="590" r="1.7" opacity=".45"/>
  <circle class="s1Dust" cx="255" cy="810" r="2" opacity=".35"/>
 </g>

 <!-- servant character (left of center, kimono silhouette) -->
 <g id="s1Char">
  <!-- ground shadow -->
  <ellipse cx="0" cy="2" rx="28" ry="5.5" fill="#000" opacity=".92"/>

  <!-- legs -->
  <g id="s1LegB" transform="translate(-4,-42)">
   <path d="M 0 0 L -2 22 L -3 39" stroke="#08070c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <path d="M -7 37 L 9 37 L 10 42 L -8 42 Z" fill="#08070c"/>
  </g>
  <g id="s1LegF" transform="translate(4,-42)">
   <path d="M 0 0 L 2 22 L 3 39" stroke="#0d0b12" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <path d="M -2 37 L 13 37 L 14 42 L -3 42 Z" class="hd"/>
  </g>

  <!-- kimono torso + sash + wide sleeve -->
  <g id="s1TorsoGroup">
   <!-- subtle warm rim on right side -->
   <path id="s1KimonoRim" d="M -12 -98 L 15 -98 L 21 -18 L -17 -18 Z" fill="#fcd34d" opacity=".32"/>
   <!-- kimono body -->
   <path d="M -14 -98 L 13 -98 L 19 -18 L -18 -18 Z" fill="#121a20"/>
   <!-- obi / sash -->
   <rect x="-15" y="-62" width="29" height="10" rx="2" fill="#23303a"/>
   <!-- kimono sleeve -->
   <path id="s1Sleeve" d="M 0 -92 L 15 -76 L 20 -52 L 7 -50 L 2 -72 Z" fill="#162128"/>
  </g>

  <!-- arm -->
  <path id="s1Arm" d="M 3 -92 L 15 -72 L 22 -54" stroke="#0d0b12" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- head (r=21, rim light, minimal face, no nose/ears) -->
  <g id="s1Head" transform="translate(1,-120) rotate(8)">
   <circle id="s1HeadRim" cx="1.6" cy="0" r="21" fill="#fcd34d" opacity=".48"/>
   <circle cx="0" cy="0" r="21" class="hd"/>
   <!-- topknot -->
   <circle cx="-3" cy="-22" r="5.5" class="hd"/>
   <!-- face looking right -->
   <g id="s1FaceRight">
    <circle class="fc" cx="11" cy="-2" r="2.1"/>
    <circle class="fc" cx="18" cy="-2" r="2.1"/>
    <line class="fs" x1="10" y1="7" x2="15.5" y2="7" stroke-width="1.8"/>
   </g>
   <!-- face turned toward doorway -->
   <g id="s1FaceFront" opacity="0">
    <circle class="fc" cx="7.5" cy="-2" r="2.1"/>
    <circle class="fc" cx="14.5" cy="-2" r="2.1"/>
    <line class="fs" x1="6.5" y1="7" x2="12" y2="7" stroke-width="1.8"/>
   </g>
  </g>
 </g>

 <!-- long broom (starts upright in hand, then leans against wall) -->
 <g id="s1Broom" transform="translate(194,724) rotate(0)">
  <line x1="0" y1="0" x2="0" y2="-235" stroke="#241c16" stroke-width="6" stroke-linecap="round"/>
  <path d="M -13 0 L 13 0 L 20 46 L -20 46 Z" fill="#181310"/>
  <g stroke="#34271d" stroke-width="1.4">
   <line x1="-9" y1="3" x2="-13" y2="44"/>
   <line x1="-3" y1="3" x2="-4" y2="44"/>
   <line x1="3" y1="3" x2="4" y2="44"/>
   <line x1="9" y1="3" x2="13" y2="44"/>
  </g>
  <rect x="-14" y="-3" width="28" height="6" rx="2" fill="#54402e"/>
 </g>
</g>
</svg>
</div>
<div class="controls">
 <button id="playBtn" class="primary">▶ Play (5.0s)</button>
 <button id="replayBtn">↺ 0.0s</button>
 <button id="soundBtn">🔊 Sound: ON</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const playBtn=$('playBtn'),replayBtn=$('replayBtn'),soundBtn=$('soundBtn');

// ---------- PROCEDURAL WEB AUDIO FOLEY ----------
let audioCtx=null,soundEnabled=true;
function initAudio(){
 if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
}
function tone(type,f0,f1,d,g){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,type,f,q,g,att){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();
 s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);
}

// 0:00 soft wooden knock when broom is set down
function playSoftWoodKnock(){
 tone('triangle',155,58,.09,.12);
 noise(.08,'bandpass',920,2.2,.06,.004);
}
// 0:02 quiet footsteps on wood
function playQuietWoodStep(){
 tone('triangle',115,44,.075,.075);
 noise(.06,'lowpass',480,1.2,.03,.005);
}
// 0:02 sliding door sound
function playSlidingDoor(){
 noise(.75,'bandpass',380,3.2,.055,.12);
 tone('sine',120,96,.7,.025);
}
// soft wind + low drone fading in
function playAmbientBed(){
 noise(4.9,'bandpass',260,2.5,.028,.8);
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type='sine';o.frequency.setValueAtTime(64,t);o.frequency.linearRampToValueAtTime(72,t+4.8);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.035,t+2.2);g.gain.exponentialRampToValueAtTime(.0001,t+4.95);
 o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+5.0);
}

// ---------- RIG STATE ----------
const st={x:172,bob:0,head:8,stride:0,arm:0,broomX:194,broomY:724,broomRot:0,doorSlide:0,charOpacity:1};
const ARM_UP={e:[15,-72],h:[22,-54]};
const ARM_LOW={e:[20,-64],h:[24,-46]};
const ARM_WALK={e:[11,-74],h:[17,-58]};
const lerp=(a,b,t)=>a+(b-a)*t;

function getArmPose(a){
 if(a<=1)return{e:[lerp(ARM_UP.e[0],ARM_LOW.e[0],a),lerp(ARM_UP.e[1],ARM_LOW.e[1],a)],h:[lerp(ARM_UP.h[0],ARM_LOW.h[0],a),lerp(ARM_UP.h[1],ARM_LOW.h[1],a)]};
 return{e:[lerp(ARM_LOW.e[0],ARM_WALK.e[0],a-1),lerp(ARM_LOW.e[1],ARM_WALK.e[1],a-1)],h:[lerp(ARM_LOW.h[0],ARM_WALK.h[0],a-1),lerp(ARM_LOW.h[1],ARM_WALK.h[1],a-1)]};
}

function render(){
 const p=getArmPose(st.arm);
 $('s1Char').setAttribute('transform',`translate(${st.x},${770+st.bob})`);
 gsap.set('#s1Char',{opacity:st.charOpacity});
 $('s1Head').setAttribute('transform',`translate(1,-120) rotate(${st.head})`);
 $('s1LegF').setAttribute('transform',`translate(4,-42) rotate(${st.stride})`);
 $('s1LegB').setAttribute('transform',`translate(-4,-42) rotate(${-st.stride})`);
 $('s1Arm').setAttribute('d',`M 3 -92 L ${p.e[0]} ${p.e[1]} L ${p.h[0]} ${p.h[1]}`);
 $('s1Broom').setAttribute('transform',`translate(${st.broomX},${st.broomY}) rotate(${st.broomRot})`);
 $('s1SlidingPanel').setAttribute('transform',`translate(${st.doorSlide},0)`);
}

// ---------- TIMELINE (5.0s) ----------
let sceneTl=null;
function resetScene1ToStart(){
 if(sceneTl){sceneTl.kill();sceneTl=null;}
 Object.assign(st,{x:172,bob:0,head:8,stride:0,arm:0,broomX:194,broomY:724,broomRot:0,doorSlide:0,charOpacity:1});
 gsap.set('#s1Camera',{scale:1,x:0,y:0,svgOrigin:'290 580'});
 gsap.set('#s1FaceRight',{opacity:1});gsap.set('#s1FaceFront',{opacity:0});
 gsap.set('#s1HeadRim',{attr:{cx:1.6}});
 gsap.set('#s1EmberAura',{opacity:.65});gsap.set('#s1FloorBeam',{opacity:.9});
 gsap.set('.s1Dust',{x:0,y:0});
 render();
 replayBtn.textContent='↺ 0.0s';
}

function playScene1(){
 resetScene1ToStart();
 sceneTl=gsap.timeline({
  onUpdate:()=>{render();replayBtn.textContent=`↺ ${sceneTl.time().toFixed(1)}s`;},
  onComplete:()=>replayBtn.textContent='↺ 5.0s'
 });

 // ambient wind + drone fade-in
 sceneTl.call(playAmbientBed,null,0.05);

 // very slow push-in toward doorway
 sceneTl.to('#s1Camera',{scale:1.05,x:-10,y:-5,svgOrigin:'320 580',duration:5.0,ease:'power1.inOut'},0);

 // subtle drifting dust motes through light
 sceneTl.to('.s1Dust',{x:-14,y:-20,duration:5.0,ease:'sine.inOut',stagger:{each:.25,repeat:-1,yoyo:true}},0);

 // 0:00 - servant holds long broom upright, head slightly bowed + soft wooden knock
 sceneTl.call(playSoftWoodKnock,null,0.05);
 sceneTl.to(st,{broomRot:-5,duration:.35,ease:'power2.out'},0.05);
 sceneTl.to(st,{broomRot:-3.5,duration:.3,ease:'sine.inOut'},0.40);

 // 0:01 - slowly lowers broom and leans it against wall (tilts and settles)
 sceneTl.to(st,{arm:1,head:11,duration:.85,ease:'power2.inOut'},1.0);
 sceneTl.to(st,{broomX:146,broomY:726,broomRot:-17,duration:.85,ease:'power2.inOut'},1.0);
 sceneTl.to(st,{broomRot:-15.5,duration:.25,ease:'sine.out'},1.85);

 // 0:02 - straightens up, turns toward glowing door, quiet footsteps + door slides
 sceneTl.to(st,{head:0,bob:-2,arm:2,duration:.45,ease:'power2.out'},2.05);
 sceneTl.set('#s1FaceRight',{opacity:0},2.2).set('#s1FaceFront',{opacity:1},2.2);
 sceneTl.call(playSlidingDoor,null,2.25);
 sceneTl.to(st,{doorSlide:14,duration:.85,ease:'power2.inOut'},2.25);

 // 0:03 - walks slowly and steadily to doorway, shoulders relaxed, no looking back
 [[2.35,212],[2.85,254],[3.35,296],[3.85,336]].forEach(([t,targetX])=>{
  sceneTl.to(st,{x:targetX,duration:.48,ease:'power1.inOut'},t)
   .to(st,{stride:7.5,duration:.24,yoyo:true,repeat:1,ease:'sine.inOut'},t)
   .to(st,{bob:-1.5,duration:.24,yoyo:true,repeat:1,ease:'sine.inOut'},t)
   .call(playQuietWoodStep,null,t);
 });
 sceneTl.call(()=>{st.stride=0;st.bob=0;render();},null,4.34);

 // 0:04 - steps into the light and becomes a thin dark outline
 sceneTl.to(st,{x:366,charOpacity:0.25,duration:.65,ease:'power2.in'},4.25);
 sceneTl.to('#s1EmberAura',{opacity:.92,duration:.65,ease:'sine.inOut'},4.25);
 sceneTl.to('#s1FloorBeam',{opacity:1,duration:.65,ease:'sine.inOut'},4.25);
}

playBtn.addEventListener('click',()=>{initAudio();playScene1();});
replayBtn.addEventListener('click',()=>{resetScene1ToStart();});
soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;soundBtn.textContent='🔊 Sound: '+(soundEnabled?'ON':'OFF');if(soundEnabled)initAudio();});
window.addEventListener('load',()=>{resetScene1ToStart();setTimeout(playScene1,250);});
</script>
</body></html>
