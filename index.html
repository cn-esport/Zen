<script>
const $=id=>document.getElementById(id),playBtn=$('playBtn'),replayBtn=$('replayBtn'),soundBtn=$('soundBtn');
const DUR=5.5;
/* ---- AUDIO helpers ---- */
let audioCtx=null,soundEnabled=true,chimeBus=null,chimeBusGain=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(type,f0,f1,d,g,when=0){if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime+when,o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,type,f,q,g,att,when=0){if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime+when,n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);}
function bed(d,type,f,q,g){ // steady ambience: fades in 0.4s, holds, fades out 0.5s
 if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+.4);v.gain.setValueAtTime(g,t+d-.5);v.gain.linearRampToValueAtTime(.0001,t+d);s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);}
/* scene-specific audio */
function ambience(){ // hushed chime bed (sine 523 + 784, detuned, vibrato) on a "chime bus" we can lowpass-sweep shut, plus faint wind
 if(!audioCtx||!soundEnabled)return;const ctx=audioCtx,t=ctx.currentTime,E=t+5.55;
 chimeBus=ctx.createBiquadFilter();chimeBus.type='lowpass';chimeBus.frequency.value=9000;chimeBusGain=ctx.createGain();chimeBusGain.gain.value=1;chimeBus.connect(chimeBusGain).connect(ctx.destination);
 [[523,-4,2.2,4.4],[784,5,3.2,5.1]].forEach(([f,det,vib,rate])=>{
  const o=ctx.createOscillator(),v=ctx.createGain(),lfo=ctx.createOscillator(),lg=ctx.createGain();o.type='sine';o.frequency.value=f;o.detune.value=det;
  lfo.frequency.value=rate;lg.gain.value=vib;lfo.connect(lg).connect(o.frequency);                      // detuned vibrato
  v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(.01,t+.9);v.gain.setValueAtTime(.01,t+5);v.gain.linearRampToValueAtTime(.0001,t+5.5);
  o.connect(v).connect(chimeBus);o.start(t);lfo.start(t);o.stop(E);lfo.stop(E);});
 const n=ctx.sampleRate*4,b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=.5;
 const mod=ctx.createGain();mod.gain.value=.8;const wl=ctx.createOscillator(),wg=ctx.createGain();wl.frequency.value=.25;wg.gain.value=.2;wl.connect(wg).connect(mod.gain);
 const mg=ctx.createGain();mg.gain.setValueAtTime(.0001,t);mg.gain.linearRampToValueAtTime(.014,t+.8);mg.gain.setValueAtTime(.014,t+5);mg.gain.linearRampToValueAtTime(.0001,t+5.5);
 s.connect(bp).connect(mod).connect(mg).connect(ctx.destination);s.start(t);s.stop(E);wl.start(t);wl.stop(E);}
function chime(f=1200){ // gentle chime, 0.4s decay, gain .015 (goes through the chime bus)
 if(!audioCtx||!soundEnabled)return;const ctx=audioCtx,t=ctx.currentTime,dest=chimeBus||ctx.destination;
 [[f,.015],[f*2,.004]].forEach(([fr,g])=>{const o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';o.frequency.value=fr;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(v).connect(dest);o.start(t);o.stop(t+.42);});}
function cutChimes(){ // quick lowpass sweep shuts the chimes
 if(!audioCtx||!chimeBus)return;const t=audioCtx.currentTime;chimeBus.frequency.cancelScheduledValues(t);chimeBus.frequency.setValueAtTime(9000,t);chimeBus.frequency.exponentialRampToValueAtTime(90,t+.25);
 chimeBusGain.gain.setValueAtTime(1,t+.15);chimeBusGain.gain.linearRampToValueAtTime(.0001,t+.3);}
const playFlutter=(g=1)=>{noise(.07,'bandpass',2000,.9,.03*g,.004);noise(.09,'bandpass',2300,.9,.022*g,.004,.09);}; // paper flutter, quick bursts
const playTick=()=>{tone('sine',3000,2600,.012,.07);noise(.01,'highpass',3000,.7,.05,.001);};                    // dry click

/* ===== ZChar v1 — Zenspiris base character rig (copy verbatim, never redraw) ===== */
const ZNS='http://www.w3.org/2000/svg',ZD=Math.PI/180;
const ZDEF={stride:16,legOffset:0,kneeStatic:4,kneeBend:30,bob:2,armTilt:10,elbow:10,arm:18,height:1,torsoLen:0,legLen:1,tw:24,bw:22,torsoBot:-48,belly:0,tilt:0,headNod:2,headR:22,limb:11,footSize:1,eyeGap:7.5,eyeR:2.1,lookRange:4};
const ZHATS={none:[],chef:[['M -16 -12 L -18 -34 Q -26 -52 -8 -54 Q 0 -66 11 -55 Q 26 -52 18 -34 L 16 -12 Z','#ece8dc'],['M -17 -20 H 17 V -16 H -17 Z','#cfc9b8']],cap:[['M -20 -8 Q -20 -30 0 -30 Q 20 -30 20 -8 Z','#2b4a6b'],['M 8 -10 L 30 -8 L 30 -4 L 8 -5 Z','#1f3650',1]],flatcap:[['M -21 -10 Q -18 -28 4 -26 Q 22 -24 22 -10 Z','#3a3f4a'],['M 12 -11 L 27 -9 L 27 -6 L 12 -8 Z','#2a2e38',1]],top:[['M -14 -16 V -52 H 14 V -16 Z','#2b2f3d'],['M -24 -18 H 24 V -13 H -24 Z','#2b2f3d'],['M -14 -24 H 14 V -20 H -14 Z','#6b3a3a']],hood:[['M -26 8 Q -31 -30 0 -35 Q 31 -30 26 8 Q 20 -15 0 -17 Q -20 -15 -26 8 Z','#5b4a3a']],helmet:[['M -23 -4 Q -24 -34 0 -34 Q 24 -34 23 -4 Z','#7b8596'],['M -23 -8 H 23 V -4 H -23 Z','#5d6675']],beanie:[['M -21 -8 Q -22 -34 0 -34 Q 22 -34 21 -8 Z','#8b2e2e'],['M -21 -12 H 21 V -7 H -21 Z','#6d2222']]};
const ZSHOES={none:null,bare:[['M -5 -4 L 6 -4 L 8 1 L 14 3 L 14 6 L -6 6 Z','#0d0b12']],shoe:[['M -6 -5 L 7 -5 L 9 0 L 15 2 L 16 6 L -7 6 Z','#0d0b12'],['M -7 4 L 16 4 L 16 6 L -7 6 Z','#3a3f4d']],boot:[['M -7 -5 L 8 -5 L 9 0 L 16 2 L 17 6 L -8 6 Z','#3b2a1d'],['M -8 4 L 17 4 L 17 6 L -8 6 Z','#1f150e']],sandal:[['M -5 -4 L 6 -4 L 8 1 L 14 3 L 14 6 L -6 6 Z','#0d0b12'],['M -7 4 L 16 4 L 16 6 L -7 6 Z','#8a6a3d'],['M -5 -1 H 7 V 0.5 H -5 Z','#8a6a3d']]};
/* outfit = {shirt:[color,dTop,bottomY,pad,flare], sl:[len 's'|'l',color], pa:[len 'l'|'k',color], hat, shoe, ex:'apron'|'tie'|'belt'} — any field optional. Example outfits, NOT a limit: invent new ones per story. */
const ZOUT={'Tee + Jeans':{shirt:['#3d5a80',0,-36,2,1],sl:['s','#3d5a80'],pa:['l','#2a3f66'],hat:'none',shoe:'shoe'},'Hoodie + Joggers':{shirt:['#4a4f5c',0,-30,4,3],sl:['l','#4a4f5c'],pa:['l','#2e3340'],hat:'hood',shoe:'shoe'},'Suit + Tie':{shirt:['#1f2433',0,-24,3,4],sl:['l','#1f2433'],pa:['l','#1f2433'],hat:'none',shoe:'shoe',ex:'tie'},
'Baker':{shirt:['#1e2330',0,-26,2,2],sl:['l','#1e2330'],pa:['l','#15171f'],hat:'chef',shoe:'shoe',ex:'apron'},'Gentleman':{shirt:['#2a2630',0,-10,3,8],sl:['l','#2a2630'],pa:['l','#1a1a22'],hat:'top',shoe:'boot'},'Worker':{shirt:['#6b5a45',0,-34,2,2],sl:['l','#b8ad98'],pa:['l','#4a4034'],hat:'flatcap',shoe:'boot'},
'Peasant':{shirt:['#7a6446',0,-18,2,6],sl:['s','#7a6446'],pa:['l','#5a4a36'],hat:'none',shoe:'bare'},'Monk robe':{shirt:['#5b4a3a',0,-4,3,12],sl:['l','#5b4a3a'],hat:'hood',shoe:'sandal'},'Knight':{shirt:['#7b8596',0,-30,5,3],sl:['l','#7b8596'],pa:['l','#6b7586'],hat:'helmet',shoe:'boot',ex:'belt'},
'Roman tunic':{shirt:['#d9d2c0',0,-26,2,4],sl:['s','#d9d2c0'],hat:'none',shoe:'sandal',ex:'belt'},'Toga':{shirt:['#e8e2d0',0,-6,4,8],sl:['s','#e8e2d0'],hat:'none',shoe:'sandal'},'Kilt (bare chest)':{shirt:['#e8e2d0',48,-24,3,8],hat:'none',shoe:'sandal'}};
const ZT=`<ellipse data-r="shd" cx="0" cy="2" rx="32" ry="6" fill="#000" opacity=".9"/><g data-r="ch">
<path data-r="lbp" stroke="#08070c" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path data-r="lbo" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path data-r="lbb" fill="none"/><g data-r="lbs"></g>
<path data-r="lfp" stroke="#0d0b12" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path data-r="lfo" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path data-r="lfb" fill="none"/><g data-r="lfs"></g>
<path data-r="fap" stroke="#18202c" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path data-r="fso" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path data-r="tr" fill="#fcd34d" opacity=".4"/><path data-r="tc" fill="#0d0b12"/>
<path data-r="gt"/><path data-r="ga" fill="#d9d5c8"/><path data-r="gi" fill="#7a2e3a"/><path data-r="gb" fill="#3b2a1d"/>
<path data-r="nap" stroke="#0d0b12" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path data-r="nso" stroke-linecap="round" stroke-linejoin="round" fill="none"/><g data-r="hn"></g>
<g data-r="hd"><circle data-r="rim" cx="1.6" cy="0" r="22" fill="#fcd34d" opacity=".5"/><circle data-r="hc" cx="0" cy="0" r="22" fill="#0d0b12"/><g data-r="hatg"></g>
<ellipse data-r="e1" fill="#f2ede2"/><ellipse data-r="e2" fill="#f2ede2"/><line data-r="l1" stroke="#f2ede2" stroke-width="2.1" stroke-linecap="round"/><line data-r="l2" stroke="#f2ede2" stroke-width="2.1" stroke-linecap="round"/>
<path data-r="a1" fill="none" stroke="#f2ede2" stroke-width="2.1" stroke-linecap="round"/><path data-r="a2" fill="none" stroke="#f2ede2" stroke-width="2.1" stroke-linecap="round"/>
<line data-r="b1" stroke="#f2ede2" stroke-width="1.8" stroke-linecap="round"/><line data-r="b2" stroke="#f2ede2" stroke-width="1.8" stroke-linecap="round"/>
<path data-r="mp" fill="none" stroke="#f2ede2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
/* Usage: const c=ZChar(parentG,{outfit:'Baker',params:{height:1.05},rim:'#fcd34d'}); c.update({x:200,y:785,walk:1,ph:cycles,yaw:0,headTurn:0,lookX:0,lookY:0,eyes:'deadpan',mouth:'flat',brow:'none',tilt:0,lean:0,na:[tilt,elbow],fa:[tilt,elbow],t:seconds,blink:true})
   yaw: 0 faces right, 90 faces camera, 180 faces left, 270 back. Props: append to c.hand (a <g> at the near hand, local origin = hand). */
function ZChar(parent,o){
 o=o||{};const P=Object.assign({},ZDEF,o.params||{}),g=document.createElementNS(ZNS,'g');g.innerHTML=ZT;parent.appendChild(g);
 const E={};['shd','ch','lbp','lbo','lbb','lbs','lfp','lfo','lfb','lfs','fap','fso','tr','tc','gt','ga','gi','gb','nap','nso','hn','hd','rim','hc','hatg','e1','e2','l1','l2','a1','a2','b1','b2','mp'].forEach(r=>E[r]=g.querySelector('[data-r="'+r+'"]'));
 const C={g,P,hand:E.hn,outfit:null,hat:'none',shoe:'shoe'};
 C.setOutfit=v=>{C.outfit=typeof v==='string'?(ZOUT[v]||null):(v||null);return C;};
 C.setHat=h=>{C.hat=h;E.hatg.innerHTML=(ZHATS[h]||[]).map(([d,f,b])=>`<path ${b?'class="hb" ':''}d="${d}" fill="${f}"/>`).join('');return C;};
 C.setShoe=n=>{C.shoe=n;const S=ZSHOES[n];[E.lbs,E.lfs].forEach(e=>{e.style.display=S?'':'none';e.innerHTML=S?S.map(([d,f])=>`<path d="${d}" fill="${f}"/>`).join(''):'';});return C;};
 C.setRim=col=>{E.rim.setAttribute('fill',col);E.tr.setAttribute('fill',col);return C;};
 C.update=function(s){
  s=s||{};const O=C.outfit,h=P.height,tl=P.torsoLen,wk=s.walk==null?0:s.walk,ph=2*Math.PI*(s.ph||0),sn=Math.sin(ph),tt=s.t||0;
  const yaw=s.yaw||0,cyw=Math.cos(yaw*ZD),sg=cyw>=0?1:-1,c=Math.abs(cyw),yh=(yaw+(s.headTurn||0))*ZD,hcx=Math.cos(yh)*sg,hs=Math.sin(yh),hw=4+3*(1-c);

}
