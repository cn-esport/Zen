<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 1: The Hook & The Knock (5.5s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #fcd34d;
      --coat: #1e2330;
      --coat-dark: #141822;
      --scarf: #b91c1c;
      --scarf-hi: #dc2626;
      --bamboo: #b45309;
      --bamboo-hi: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #070911;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 46%, transparent 38%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Pre-Dawn 1800s Sky -->
        <linearGradient id="s1SkyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#05070e"/>
          <stop offset="65%" stop-color="#0d1322"/>
          <stop offset="100%" stop-color="#151d30"/>
        </linearGradient>

        <!-- Soft Moon Halo -->
        <radialGradient id="s1MoonHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
        </radialGradient>

        <!-- Classic Gas Streetlamp Glow -->
        <radialGradient id="s1GasGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.72"/>
          <stop offset="32%" stop-color="#f59e0b" stop-opacity="0.26"/>
          <stop offset="70%" stop-color="#d97706" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>

        <!-- Window Glass Reflection -->
        <linearGradient id="s1GlassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e293b"/>
          <stop offset="55%" stop-color="#0f172a"/>
          <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>

        <!-- Cobblestone Ground -->
        <linearGradient id="s1GroundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#10131c"/>
          <stop offset="100%" stop-color="#050609"/>
        </linearGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s1Camera">
        <!-- Night Sky -->
        <rect width="540" height="790" fill="url(#s1SkyGrad)"/>

        <!-- Subtle Pale Moon in Top-Left Sky -->
        <circle cx="115" cy="145" r="55" fill="url(#s1MoonHalo)"/>
        <circle cx="115" cy="145" r="14" fill="#475569" opacity="0.45"/>

        <!-- Distant Victorian Rooftops & Chimneys -->
        <path d="M 0 565 L 0 435 L 55 415 L 55 390 L 72 390 L 72 410 L 155 392 L 225 425 L 225 565 Z" fill="#090c14"/>

        <!-- Main Brick Townhouse Facade (Right Side) -->
        <rect x="245" y="125" width="295" height="665" fill="#0c0f18"/>
        <!-- Roof Cornice -->
        <rect x="235" y="118" width="305" height="14" rx="2" fill="#151a28"/>
        <!-- Subtle Brick Texture Lines -->
        <line x1="260" y1="210" x2="315" y2="210" stroke="#151b29" stroke-width="2"/>
        <line x1="470" y1="260" x2="528" y2="260" stroke="#151b29" stroke-width="2"/>
        <line x1="260" y1="465" x2="320" y2="465" stroke="#151b29" stroke-width="2"/>

        <!-- UPSTAIRS TARGET BEDROOM WINDOW -->
        <g transform="translate(318, 205)">
          <!-- Stone Window Frame -->
          <rect x="-10" y="-10" width="156" height="205" rx="3" fill="#171d2c"/>
          <!-- Dark Interior / Glass Pane -->
          <rect x="0" y="0" width="136" height="185" fill="url(#s1GlassGrad)"/>
          <!-- Subtle Interior Warm Stirring Glow on Final Tap -->
          <rect id="s1WindowStir" x="0" y="0" width="136" height="185" fill="#f59e0b" opacity="0"/>
          <!-- Diagonal Glass Sheen -->
          <polygon points="15,0 42,0 10,115 0,115" fill="#94a3b8" opacity="0.07"/>
          <!-- Wooden Mullions -->
          <rect x="65" y="0" width="6" height="185" fill="#090b10"/>
          <rect x="0" y="90" width="136" height="6" fill="#090b10"/>
          <!-- Stone Sill -->
          <rect x="-15" y="185" width="166" height="12" rx="2" fill="#1f273b"/>

          <!-- Glass Tap Ripple Rings (Hidden at 0.0s, Triggers Only on Impact at x=34, y=135) -->
          <circle id="s1Ripple1" cx="34" cy="135" r="3" fill="none" stroke="#fde68a" stroke-width="2" opacity="0"/>
          <circle id="s1Ripple2" cx="34" cy="135" r="3" fill="none" stroke="#fcd34d" stroke-width="1.5" opacity="0"/>
        </g>

        <!-- Downstairs Window (Matches Reference Architecture) -->
        <g transform="translate(318, 485)">
          <rect x="-10" y="-10" width="156" height="195" rx="3" fill="#151b29"/>
          <rect x="0" y="0" width="136" height="175" fill="#0a0e17"/>
          <rect x="65" y="0" width="6" height="175" fill="#07090e"/>
          <rect x="0" y="85" width="136" height="6" fill="#07090e"/>
          <rect x="-15" y="175" width="166" height="11" rx="2" fill="#1b2233"/>
        </g>

        <!-- CLASSIC VICTORIAN GAS STREETLAMP (Matches Reference Lantern Silhouette) -->
        <g transform="translate(86, 365)">
          <!-- Fluted Cast-Iron Base & Post -->
          <path d="M -12 425 L 12 425 L 8 385 L -8 385 Z" fill="#090b10"/>
          <rect x="-5" y="340" width="10" height="48" rx="2" fill="#090b10"/>
          <rect x="-3.2" y="42" width="6.4" height="302" fill="#090b10"/>
          <!-- Crossbar & Collar -->
          <rect x="-13" y="48" width="26" height="3.5" rx="1.5" fill="#090b10"/>
          <rect x="-10" y="40" width="20" height="4" rx="1.5" fill="#090b10"/>

          <!-- Ambient Radial Warm Glow -->
          <circle cx="0" cy="24" r="135" fill="url(#s1GasGlow)"/>

          <!-- Tapered Victorian Lantern Housing -->
          <polygon points="-9,40 9,40 13,12 -13,12" fill="#fef9c3" stroke="#090b10" stroke-width="2.5"/>
          <!-- Lantern Vertical Cage Bars -->
          <line x1="-3.5" y1="40" x2="-4.5" y2="12" stroke="#090b10" stroke-width="1.6"/>
          <line x1="3.5" y1="40" x2="4.5" y2="12" stroke="#090b10" stroke-width="1.6"/>
          <!-- Tiered Lantern Roof & Finial Spire -->
          <polygon points="-16,12 16,12 10,4 -10,4" fill="#090b10"/>
          <polygon points="-8,4 8,4 0,-4" fill="#090b10"/>
          <circle cx="0" cy="-6" r="2.2" fill="#090b10"/>
        </g>

        <!-- Cobblestone Street -->
        <rect x="0" y="790" width="540" height="170" fill="url(#s1GroundGrad)"/>
        <!-- Subtle Warm Lamp Pool on Street -->
        <ellipse cx="115" cy="793" rx="68" ry="6" fill="#f59e0b" opacity="0.08"/>
        <ellipse cx="245" cy="798" rx="34" ry="4.5" fill="#151926"/>
        <ellipse cx="335" cy="793" rx="26" ry="3.5" fill="#181d2b"/>

        <!-- KNOCKER-UPPER CHARACTER RIG (Victorian Overcoat, Red Scarf & Defined Flat Cap) -->
        <g id="s1Knocker" transform="translate(175, 595)">
          <!-- Ground Shadow -->
          <ellipse cx="12" cy="196" rx="36" ry="6.5" fill="#030407" opacity="0.9"/>

          <!-- Back Leg & Forward-Facing Boot -->
          <g id="s1LegBack">
            <path d="M 8 118 L 4 156 L 0 192" fill="none" stroke="#08070c" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M -5 192 L 15 192 Q 19 192 19 196 L -5 196 Z" fill="#08070c"/>
          </g>

          <!-- Front Leg & Forward-Facing Boot -->
          <g id="s1LegFront">
            <path d="M 16 118 L 20 156 L 22 192" fill="none" stroke="var(--head)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 17 192 L 37 192 Q 41 192 41 196 L 17 196 Z" fill="var(--head)"/>
          </g>

          <!-- Upper Torso, Tailored Overcoat, Red Scarf, Head & Bamboo Pole -->
          <g id="s1Torso">
            <!-- Long Victorian Overcoat (Warm Left Gaslight Rim Highlight) -->
            <path d="M -3 33 L 25 33 L 33 142 L -11 142 Z" fill="var(--rim)" opacity="0.48"/>
            <path d="M -1 33 L 25 33 L 33 142 L -9 142 Z" fill="var(--coat)"/>
            <!-- Coat Seam & Buttons -->
            <line x1="17" y1="45" x2="21" y2="140" stroke="var(--coat-dark)" stroke-width="1.5"/>
            <circle cx="20" cy="64" r="1.6" fill="#475569"/>
            <circle cx="21" cy="82" r="1.6" fill="#475569"/>
            <circle cx="22" cy="100" r="1.6" fill="#475569"/>
            <!-- Folded Lapel Collar -->
            <polygon points="10,34 24,34 21,49 14,46" fill="#283042"/>

            <!-- RED SCARF (Wrapped Snugly Around Neck + Trailing Ends Over Back) -->
            <path d="M -16 39 Q -6 47 2 38 L 0 46 Q -9 54 -19 45 Z" fill="var(--scarf)"/>
            <path d="M -12 41 Q -4 49 3 42 L 1 48 Q -7 55 -15 47 Z" fill="var(--scarf-hi)" opacity="0.85"/>
            <path d="M -2 30 Q 12 36 25 30 L 24 38 Q 12 43 -2 38 Z" fill="var(--scarf)"/>
            <path d="M 0 31 Q 12 36 24 31" fill="none" stroke="var(--scarf-hi)" stroke-width="1.5"/>

            <!-- Back Support Arm Holding Lower Pole -->
            <path d="M 10 46 L 26 62 L 42 54" fill="none" stroke="var(--coat-dark)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Zenspiris Signature Head (Exact r=22, Tilted Up Looking at Upstairs Window) -->
            <g id="s1Head" transform="translate(13, 9)">
              <!-- Warm Left Gaslight Rim -->
              <circle cx="-1.6" cy="0" r="22" fill="var(--rim)" opacity="0.55"/>
              <circle cx="0" cy="0" r="22" fill="var(--head)"/>

              <!-- Distinct Tailored Flat Cap Sitting Cleanly on Top of Head -->
              <g transform="rotate(-8)">
                <!-- Cap Crown with Subtle Warm Rim -->
                <path d="M -21 -11 C -21 -25, 19 -26, 22 -12 Z" fill="var(--rim)" opacity="0.45"/>
                <path d="M -20 -11 C -20 -24, 19 -25, 22 -12 Z" fill="#252b3b"/>
                <!-- Cap Band & Forward Visor Brim -->
                <path d="M -20 -11 L 22 -12 L 32 -8 Q 22 -5 12 -8 L -20 -8 Z" fill="#141822"/>
              </g>

              <!-- Crisp Off-White Eyes Looking Up-Right Toward Window -->
              <circle cx="11" cy="-2" r="2.1" fill="var(--face)"/>
              <circle cx="17.5" cy="-2" r="2.1" fill="var(--face)"/>
              <line x1="12" y1="7" x2="16.5" y2="6.5" stroke="var(--face)" stroke-width="1.8" stroke-linecap="round"/>
            </g>

            <!-- LONG BAMBOO POLE & FRONT TAPPING ARM -->
            <g id="s1PoleRig">
              <!-- Long Bamboo Pole Reaching Up to Upstairs Window (352, 340 in stage coords) -->
              <line x1="14" y1="86" x2="177" y2="-255" stroke="var(--bamboo)" stroke-width="4.2" stroke-linecap="round"/>
              <line x1="13" y1="86" x2="176" y2="-255" stroke="var(--bamboo-hi)" stroke-width="1.1" opacity="0.65" stroke-linecap="round"/>
              <!-- Bamboo Segment Nodes -->
              <circle cx="55" cy="1" r="2.4" fill="#78350f"/>
              <circle cx="96" cy="-84" r="2.4" fill="#78350f"/>
              <circle cx="137" cy="-170" r="2.4" fill="#78350f"/>
              <!-- Soft Knocking Tip -->
              <circle cx="177" cy="-255" r="3.2" fill="#fde68a"/>

              <!-- Front Coat Sleeve & Hand Gripping Pole -->
              <path d="M 16 44 L 34 56 L 44 26" fill="none" stroke="var(--coat)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="44" cy="26" r="4.2" fill="var(--head)"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button class="primary" id="playBtn">▶ Play (5.5s)</button>
    <button id="replayBtn">↺ 0.0s</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Subtle Pre-Dawn Street Breeze
    function playNightWind(duration = 5.2) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(260, now);
      filter.frequency.linearRampToValueAtTime(340, now + duration * 0.5);
      filter.frequency.linearRampToValueAtTime(240, now + duration);
      filter.Q.setValueAtTime(2.8, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.032, now + 0.8);
      gain.gain.linearRampToValueAtTime(0.025, now + duration - 0.6);
      gain.gain.linearRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    // Cobblestone Boot Footstep
    function playCobblestoneStep() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(135, now);
      osc.frequency.exponentialRampToValueAtTime(48, now + 0.08);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    // Crisp Bamboo-on-Window-Glass Tap Foley SFX
    function playGlassTap() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      [1980, 3420].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.82, now + 0.075);
        gain.gain.setValueAtTime(i === 0 ? 0.16 : 0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      });
    }

    let sceneTl = null;

    function triggerGlassRipple(tl, time) {
      tl.call(() => playGlassTap(), null, time);
      tl.fromTo('#s1Ripple1',
        { attr: { r: 3 }, opacity: 0.9 },
        { attr: { r: 28 }, opacity: 0, duration: 0.55, ease: 'power2.out', immediateRender: false },
        time
      );
      tl.fromTo('#s1Ripple2',
        { attr: { r: 2 }, opacity: 0.7 },
        { attr: { r: 18 }, opacity: 0, duration: 0.45, ease: 'power2.out', immediateRender: false },
        time + 0.06
      );
    }

    function playScene1() {
      if (sceneTl) sceneTl.kill();

      // Reset cleanly to 0.0s
      gsap.set('#s1Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s1Knocker', { x: 118, y: 595 });
      gsap.set('#s1Torso', { y: 0, rotation: 0 });
      gsap.set('#s1Head', { rotation: -12, svgOrigin: '13 9' });
      gsap.set('#s1PoleRig', { rotation: -6, svgOrigin: '34 56' });
      gsap.set('#s1LegFront', { rotation: 0, svgOrigin: '16 118' });
      gsap.set('#s1LegBack', { rotation: 0, svgOrigin: '8 118' });
      gsap.set('#s1WindowStir', { opacity: 0 });
      gsap.set(['#s1Ripple1', '#s1Ripple2'], { opacity: 0, attr: { r: 3 } });

      sceneTl = gsap.timeline();

      // Pre-dawn night wind
      sceneTl.call(() => playNightWind(5.3), null, 0.05);

      // Slow atmospheric camera push-in
      sceneTl.to('#s1Camera', {
        scale: 1.07,
        svgOrigin: '270 430',
        duration: 5.5,
        ease: 'power1.inOut'
      }, 0);

      // 0.0s - 1.2s: Knocker-Upper walks up to the townhouse
      sceneTl.to('#s1Knocker', {
        x: 175,
        duration: 1.2,
        ease: 'power1.out'
      }, 0);

      // Natural walk cycle (3 steps)
      [0.15, 0.55, 0.95].forEach((stepTime, idx) => {
        sceneTl.call(() => playCobblestoneStep(), null, stepTime);
        const dir = idx % 2 === 0 ? 1 : -1;
        sceneTl.to('#s1LegFront', { rotation: 16 * dir, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime - 0.1);
        sceneTl.to('#s1LegBack', { rotation: -16 * dir, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime - 0.1);
        sceneTl.to('#s1Torso', { y: -2.5, duration: 0.18, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime - 0.1);
      });

      // 1.15s: Tilts head up toward the upstairs bedroom window
      sceneTl.to('#s1Head', {
        rotation: -22,
        duration: 0.45,
        ease: 'power2.out'
      }, 1.15);

      // Three firm bamboo taps ("Every. Single. Morning.")
      const tapTimes = [1.65, 3.05, 4.45];
      tapTimes.forEach((t) => {
        // Pole swings forward to tap glass at (352, 340)
        sceneTl.to('#s1PoleRig', {
          rotation: 0,
          duration: 0.14,
          ease: 'power2.in'
        }, t - 0.14);

        triggerGlassRipple(sceneTl, t);

        // Slight recoil after tap
        sceneTl.to('#s1PoleRig', {
          rotation: -3.2,
          duration: 0.35,
          ease: 'power2.out'
        }, t + 0.02);
      });

      // Subtle warm flicker inside the bedroom on the final tap
      sceneTl.to('#s1WindowStir', {
        opacity: 0.22,
        duration: 0.65,
        ease: 'power1.out'
      }, 4.65);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene1();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      if (sceneTl) sceneTl.pause(0);
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene1, 250);
    });
  </script>
</body>
</html>
