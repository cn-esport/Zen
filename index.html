<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Last Soul Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="studio-shell">
    <!-- Top Studio Header -->
    <header class="studio-header ui-chrome">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>LAST SOUL <span class="brand-sub">STUDIO</span></h1>
      </div>

      <div class="header-controls">
        <select id="sceneSelect" class="glass-select" aria-label="Select Episode"></select>

        <div class="segmented-control" role="group" aria-label="Aspect Ratio">
          <button id="ratio916" class="seg-btn active" data-ratio="9:16">9:16</button>
          <button id="ratio169" class="seg-btn" data-ratio="16:9">16:9</button>
        </div>
      </div>
    </header>

    <!-- Main Stage Viewport -->
    <main class="stage-wrapper">
      <div id="stageFrame" class="stage-frame ratio-9-16">
        <!-- 60fps 2D Canvas -->
        <canvas id="studioCanvas"></canvas>

        <!-- Atmospheric Film Grain & Letterbox -->
        <div class="film-grain"></div>
        <div id="letterboxTop" class="letterbox top"></div>
        <div id="letterboxBottom" class="letterbox bottom"></div>

        <!-- Optional Shorts/Reels Safe Zone Overlay -->
        <div id="safeZoneOverlay" class="safe-zone hidden">
          <div class="sz-right">UI ICONS</div>
          <div class="sz-bottom">CAPTION &amp; TITLE SAFE AREA</div>
        </div>

        <!-- Live Director Camera HUD (Hidden during Record Mode) -->
        <div id="cameraHud" class="camera-hud ui-chrome">
          <span class="rec-indicator">● LIVE RIG</span>
          <span id="hudLens">WIDE · 24MM</span>
          <span id="hudSceneBeat">BEAT 01</span>
        </div>

        <!-- Cinematic Subtitles -->
        <div id="subtitleBox" class="subtitle-box">
          <p id="subtitleText"></p>
        </div>

        <!-- 3-2-1 Record Countdown Overlay -->
        <div id="countdownOverlay" class="countdown-overlay hidden">
          <div class="countdown-ring">
            <span id="countdownNumber">3</span>
          </div>
          <p class="countdown-hint">START PHONE SCREEN RECORDER NOW</p>
        </div>

        <!-- Tap to Exit Clean Record Mode (Invisible Corner Trigger) -->
        <button id="exitRecordBtn" class="exit-record-btn hidden" title="Exit Clean Record Mode">✕</button>
      </div>
    </main>

    <!-- Bottom Director Transport & Timeline -->
    <footer class="studio-footer ui-chrome">
      <!-- Timeline Scrubber + Chapter Beat Markers -->
      <div class="timeline-row">
        <span id="timeCurrent" class="timecode">00:00.0</span>
        <div id="timelineTrack" class="timeline-track">
          <div id="timelineProgress" class="timeline-progress"></div>
          <div id="beatMarkers" class="beat-markers"></div>
        </div>
        <span id="timeTotal" class="timecode">00:00.0</span>
      </div>

      <!-- Control Bar -->
      <div class="transport-row">
        <div class="transport-left">
          <button id="btnRestart" class="icon-btn" title="Restart Scene">↺</button>
          <button id="btnPlayPause" class="primary-btn" title="Play / Pause">▶ PLAY</button>
        </div>

        <div class="transport-right">
          <button id="btnSubtitles" class="toggle-btn active" title="Toggle Subtitles">CC</button>
          <button id="btnSound" class="toggle-btn active" title="Toggle Synthesized Foley Audio">SFX</button>
          <button id="btnLetterbox" class="toggle-btn active" title="Cinema Bars">2.39:1</button>
          <button id="btnSafeZone" class="toggle-btn" title="Reels/Shorts Safe Zone">SAFE</button>
          <button id="btnRecord" class="record-btn" title="Clean Screen Record Mode">● REC MODE</button>
        </div>
      </div>
    </footer>
  </div>

  <script src="scenes.js"></script>
  <script src="engine.js"></script>
</body>
</html>
