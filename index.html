<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Last Soul Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="v">
  <div id="app">
    <header id="top-bar">
      <span class="brand">LAST SOUL STUDIO</span>
      <span id="timer">00:00 / 00:15</span>
    </header>

    <main id="preview-area">
      <div id="stage">
        <div id="camera">
          <svg id="L-bg" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
          <svg id="L-mid" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
          <svg id="L-char" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
          <svg id="L-fg" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
          <div id="dust"></div>
        </div>

        <div id="vignette"></div>
        <div id="caps"></div>
        <div id="fade"></div>
        <div id="fs-hint">Tap anywhere to exit Full Screen</div>
      </div>
    </main>

    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>

    <nav id="bottom-controls">
      <button class="nav-btn" id="muteBtn">
        <span class="icon">🔊</span>
        <span>Sound</span>
      </button>

      <button class="nav-btn primary" id="playPauseBtn">
        <span class="icon" id="playIcon">⏸</span>
        <span id="playText">Pause</span>
      </button>

      <button class="nav-btn" id="replayBtn">
        <span class="icon">↺</span>
        <span>Replay</span>
      </button>

      <button class="nav-btn" id="fullBtn">
        <span class="icon">⛶</span>
        <span>Full Screen</span>
      </button>
    </nav>
  </div>

  <!-- Loads your scene first, then runs the studio engine -->
  <script src="scene.js"></script>
  <script src="engine.js"></script>
</body>
</html>
