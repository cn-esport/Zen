<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 2: Waking Up & The Candle (6.0s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim-cool: #60a5fa;
      --rim-warm: #fcd34d;
      --shirt: #2d3748;
      --blanket: #1e293b;
      --blanket-fold: #334155;
      --wood: #171316;
      --bamboo: #b45309;
      --bamboo-hi: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #070911;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Dark 1800s Interior Wall -->
        <linearGradient id="s2WallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070911"/>
          <stop offset="65%" stop-color="#0d111d"/>
          <stop offset="100%" stop-color="#131826"/>
        </linearGradient>

        <!-- Pre-Dawn Window Sky Outside -->
        <linearGradient id="s2OutsideSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#09101f"/>
          <stop offset="100%" stop-color="#17233b"/>
        </linearGradient>

        <!-- Realistic Diagonal Pre-Dawn Window Beam -->
        <linearGradient id="s2WindowBeam" x1="0.8" y1="0" x2="0.2" y2="1">
          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.15"/>
          <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
        </linearGradient>

        <!-- Warm Candlelight Radial Glow -->
        <radialGradient id="s2CandleGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.88"/>
          <stop offset="28%" stop-color="#f59e0b" stop-opacity="0.38"/>
          <stop offset="65%" stop-color="#d97706" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>

        <!-- Wooden Floor -->
        <linearGradient id="s2FloorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0c0e14"/>
          <stop offset="100%" stop-color="#050609"/>
        </linearGradient>

        <!-- Strict Clip Path Inside Window Glass -->
        <clipPath id="s2GlassClip">
          <rect x="0" y="0" width="136" height="205"/>
        </clipPath>
      </defs>

      <!-- Camera Group -->
      <g id="s2Camera">
        <!-- Bedroom Wall & Floor (Floor line at y=775) -->
        <rect width="540" height="775" fill="url(#s2WallGrad)"/>
        <rect x="0" y="555" width="540" height="5" fill="#141927"/>
        <rect x="0" y="775" width="540" height="185" fill="url(#s2FloorGrad)"/>

        <!-- Warm Candle Ambient Room Wash -->
        <circle id="s2RoomWarmWash" cx="152" cy="645" r="340" fill="url(#s2CandleGlow)" opacity="0"/>

        <!-- BEDROOM WINDOW (Lowered to y=275 for Natural Room Proportions) -->
        <g transform="translate(330, 275)">
          <rect x="-10" y="-10" width="156" height="225" rx="3" fill="#181f30"/>
          <rect x="0" y="0" width="136" height="205" fill="url(#s2OutsideSky)"/>

          <!-- Clipped Glass Interior for Bamboo Pole -->
          <g clip-path="url(#s2GlassClip)">
            <g id="s2OutsidePole">
              <line x1="126" y1="210" x2="54" y2="122" stroke="var(--bamboo)" stroke-width="5" stroke-linecap="round"/>
              <line x1="125" y1="210" x2="53" y2="122" stroke="var(--bamboo-hi)" stroke-width="1.3" opacity="0.7" stroke-linecap="round"/>
              <circle cx="90" cy="166" r="2.8" fill="#78350f"/>
              <circle cx="54" cy="122" r="3.5" fill="#fde68a"/>
            </g>
          </g>

          <!-- Window Panes & Sill -->
          <rect x="65" y="0" width="6" height="205" fill="#0d1018"/>
          <rect x="0" y="100" width="136" height="6" fill="#0d1018"/>
          <rect x="-15" y="205" width="166" height="12" rx="2" fill="#212a3f"/>

          <!-- Indoor Glass Tap Ripples -->
          <circle id="s2Ripple1" cx="54" cy="122" r="3" fill="none" stroke="#fde68a" stroke-width="2" opacity="0"/>
          <circle id="s2Ripple2" cx="54" cy="122" r="3" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0"/>
        </g>

        <!-- Realistic Diagonal Pre-Dawn Window Light Beam (Aligned to Lowered Window y=275..480) -->
        <polygon points="330,275 466,275 466,480 345,775 135,775 330,480" fill="url(#s2WindowBeam)" pointer-events="none"/>

        <!-- LOW BEDSIDE CABINET WITH SHORT STUBBY FEET (Matches Mattress Height, Floor y=775) -->
        <g transform="translate(116, 709)">
          <ellipse cx="36" cy="68" rx="42" ry="4.5" fill="#020305" opacity="0.9"/>
          <!-- Short Stubby Wooden Legs -->
          <rect x="9" y="54" width="6" height="12" rx="1" fill="#0c0a0d"/>
          <rect x="57" y="54" width="6" height="12" rx="1" fill="#0c0a0d"/>
          <!-- Compact Cabinet Body (Two Drawers) -->
          <rect x="5" y="6" width="62" height="50" rx="2" fill="var(--wood)"/>
          <rect x="10" y="11" width="52" height="17" rx="1.5" fill="#211c20"/>
          <circle cx="36" cy="19.5" r="1.7" fill="#94a3b8"/>
          <rect x="10" y="32" width="52" height="18" rx="1.5" fill="#211c20"/>
          <circle cx="36" cy="41" r="1.7" fill="#94a3b8"/>
          <!-- Cabinet Top Surface -->
          <rect x="2" y="0" width="68" height="6.5" rx="2" fill="#262025"/>

          <!-- Brass Chamberstick Holder & Wax Candle -->
          <g transform="translate(36, 0)">
            <ellipse cx="0" cy="-1.5" rx="13" ry="2.5" fill="#b45309"/>
            <path d="M 11 -2 Q 18 -2 18 -7 Q 18 -11 12 -10" fill="none" stroke="#d97706" stroke-width="1.8"/>
            <rect x="-3.8" y="-28" width="7.6" height="26" rx="1.5" fill="#e2e8f0"/>
            <path d="M -3.8 -26 Q -5 -19 -3.8 -15" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="0" y1="-28" x2="0" y2="-33" stroke="#090b10" stroke-width="1.4"/>

            <!-- CANDLE FLAME & LOCAL HALO -->
            <g id="s2CandleFlameGroup" opacity="0" transform="translate(0, -39)">
              <circle cx="0" cy="0" r="44" fill="url(#s2CandleGlow)"/>
              <path id="s2FlameShape" d="M 0 -9.5 C 4.2 -3.2, 4.2 3.2, 0 6 C -4.2 3.2, -4.2 -3.2, 0 -9.5 Z" fill="#f59e0b"/>
              <path d="M 0 -5 C 2 -1.6, 2 2.5, 0 4.2 C -2 2.5, -2 -1.6, 0 -5 Z" fill="#fef9c3"/>
            </g>
          </g>
        </g>

        <!-- LOW-PROFILE 1800s WOODEN BED & SLEEPER RIG (Floor y=775) -->
        <g transform="translate(202, 575)">
          <!-- Bed Floor Shadow -->
          <ellipse cx="106" cy="202" rx="118" ry="6.5" fill="#020305" opacity="0.95"/>

          <!-- Low Wooden Headboard (Left) & Footboard (Right) -->
          <rect x="0" y="72" width="11" height="128" rx="2.5" fill="#141115"/>
          <circle cx="5.5" cy="68" r="6" fill="#1e1920"/>
          <rect x="202" y="114" width="10" height="86" rx="2.5" fill="#141115"/>
          <circle cx="207" cy="110" r="5.5" fill="#1e1920"/>

          <!-- Mattress & Fluffed Pillow -->
          <rect x="11" y="144" width="191" height="26" rx="4" fill="#1e2433"/>
          <path d="M 13 144 Q 42 126 70 145 Z" fill="#cbd5e1" opacity="0.88"/>

          <!-- CHARACTER ANCHORED DIRECTLY INSIDE MATTRESS (x=80, y=146) -->
          <g transform="translate(80, 146)">
            <g id="s2SleeperPivot" transform="rotate(-74)">
              <!-- Upper Torso (Extended Deep Beneath Blanket) -->
              <path d="M -13 -44 L 14 -44 L 18 24 L -16 24 Z" fill="var(--shirt)"/>
              <path d="M -7 -44 Q 0.5 -36 8 -44" fill="none" stroke="#94a3b8" stroke-width="1.8"/>

              <!-- Back Arm (Resting Parallel on Blanket — Zero 'X' Crossing) -->
              <path id="s2ArmBack" d="M 4 -32 L 17 -14 L 31 -12" fill="none" stroke="#1e2533" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- Zenspiris Signature Head (Exact r=22) -->
              <g transform="translate(1, -67)">
                <g id="s2Head" transform="rotate(14)">
                  <!-- Cool Window Rim (Right) -->
                  <circle cx="1.6" cy="0" r="22" fill="var(--rim-cool)" opacity="0.45"/>
                  <!-- Warm Candle Rim (Left) -->
                  <circle id="s2HeadWarmRim" cx="-1.8" cy="0" r="22" fill="var(--rim-warm)" opacity="0"/>
                  <circle cx="0" cy="0" r="22" fill="var(--head)"/>

                  <!-- Sleeping Closed Eyes (Downward Curved ◡ ◡) -->
                  <g id="s2EyesClosed">
                    <path d="M 5 -2 Q 8 1.5 11 -2" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                    <path d="M 13 -2 Q 16 1.5 19 -2" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                  </g>

                  <!-- Awake Open Eyes -->
                  <g id="s2EyesOpen" opacity="0">
                    <circle id="s2EyeL" cx="8" cy="-2" r="2.2" fill="var(--face)"/>
                    <circle id="s2EyeR" cx="16" cy="-2" r="2.2" fill="var(--face)"/>
                  </g>

                  <!-- Mouth -->
                  <line id="s2Mouth" x1="9" y1="7" x2="15" y2="7" stroke="var(--face)" stroke-width="1.8" stroke-linecap="round"/>
                </g>
              </g>

              <!-- Front Arm (Resting Together in Same Direction on Lap, Then Reaches Left to Light Candle) -->
              <path id="s2ArmFront" d="M 1 -32 L 13 -13 L 26 -10" fill="none" stroke="var(--head)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Floating Sleeping "z Z Z" Indicators Above Pillow -->
          <g id="s2ZzzGroup" fill="#94a3b8" font-family="sans-serif" font-weight="700">
            <text id="s2Z1" x="26" y="114" font-size="13" opacity="0">z</text>
            <text id="s2Z2" x="38" y="96" font-size="16" opacity="0">Z</text>
            <text id="s2Z3" x="52" y="76" font-size="19" opacity="0">Z</text>
          </g>

          <!-- HEAVY WOOL BLANKET FOREGROUND LAYER -->
          <path d="M 58 143 Q 130 134 202 145 L 202 170 L 58 170 Z" fill="var(--blanket)"/>
          <!-- Blanket Folded Cuff -->
          <path d="M 54 141 Q 70 138 79 143 L 76 168 L 54 168 Z" fill="var(--blanket-fold)"/>

          <!-- Low Wooden Bed Frame Rail -->
          <rect x="11" y="168" width="191" height="16" fill="#1c171d"/>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button class="primary" id="playBtn">▶ Play (6.0s)</button>
    <button id="replayBtn">↺ 0.0s</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playIndoorGlassTap() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      [1420, 2450].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.78, now + 0.07);
        gain.gain.setValueAtTime(i === 0 ? 0.14 : 0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      });
    }

    function playBedRustle() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const duration = 0.42;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(750, now);
      filter.Q.setValueAtTime(1.4, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.075, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    function playCandleSpark() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const duration = 0.35;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(2200, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.09, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, now + 0.05);
      osc.frequency.exponentialRampToValueAtTime(380, now + 0.32);
      oscGain.gain.setValueAtTime(0.001, now + 0.05);
      oscGain.gain.linearRampToValueAtTime(0.045, now + 0.14);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now + 0.05);
      osc.stop(now + 0.4);
    }

    let sceneTl = null;
    const pivotEl = document.getElementById('s2SleeperPivot');
    const headEl = document.getElementById('s2Head');

    function triggerIndoorRipple(tl, time) {
      tl.call(() => playIndoorGlassTap(), null, time);
      tl.fromTo('#s2Ripple1',
        { attr: { r: 3 }, opacity: 0.85 },
        { attr: { r: 26 }, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false },
        time
      );
      tl.fromTo('#s2Ripple2',
        { attr: { r: 2 }, opacity: 0.65 },
        { attr: { r: 16 }, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false },
        time + 0.05
      );
    }

    function playScene2() {
      if (sceneTl) sceneTl.kill();

      pivotEl.setAttribute('transform', 'rotate(-74)');
      headEl.setAttribute('transform', 'rotate(14)');
      const state = { bodyAngle: -74, headAngle: 14 };

      gsap.set('#s2Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s2EyesClosed', { opacity: 1 });
      gsap.set('#s2EyesOpen', { opacity: 0 });
      gsap.set('#s2EyeL', { attr: { cx: 8 } });
      gsap.set('#s2EyeR', { attr: { cx: 16 } });
      gsap.set('#s2Mouth', { attr: { x1: 9, x2: 15 } });
      gsap.set('#s2HeadWarmRim', { opacity: 0 });
      gsap.set('#s2OutsidePole', { rotation: -7, transformOrigin: '126px 210px', opacity: 1 });
      gsap.set('#s2ArmFront', { attr: { d: 'M 1 -32 L 13 -13 L 26 -10' } });
      gsap.set('#s2ArmBack', { attr: { d: 'M 4 -32 L 17 -14 L 31 -12' } });
      gsap.set('#s2CandleFlameGroup', { opacity: 0, scale: 0.4, transformOrigin: '0px 0px' });
      gsap.set('#s2RoomWarmWash', { opacity: 0 });
      gsap.set(['#s2Ripple1', '#s2Ripple2'], { opacity: 0, attr: { r: 3 } });
      gsap.set(['#s2Z1', '#s2Z2', '#s2Z3'], { opacity: 0, y: 0 });

      sceneTl = gsap.timeline();

      // Gentle camera drift
      sceneTl.to('#s2Camera', {
        scale: 1.06,
        transformOrigin: '260px 510px',
        duration: 6.0,
        ease: 'power1.inOut'
      }, 0);

      // 0.0s - 1.6s: Floating z Z Z while sleeping
      ['#s2Z1', '#s2Z2', '#s2Z3'].forEach((zId, idx) => {
        sceneTl.fromTo(zId,
          { opacity: 0, y: 4 },
          { opacity: 0.75, y: -12, duration: 0.9, ease: 'sine.out', immediateRender: false },
          idx * 0.35
        );
      });

      // Two muffled glass taps outside window (0.75s & 1.55s)
      [0.75, 1.55].forEach((t) => {
        sceneTl.to('#s2OutsidePole', {
          rotation: 0,
          duration: 0.13,
          ease: 'power2.in'
        }, t - 0.13);

        triggerIndoorRipple(sceneTl, t);

        sceneTl.to('#s2OutsidePole', {
          rotation: -4,
          duration: 0.3,
          ease: 'power2.out'
        }, t + 0.02);
      });

      // 1.75s: Startled awake — z Z Z vanishes, eyes open, sits upright cleanly inside bed
      sceneTl.to(['#s2Z1', '#s2Z2', '#s2Z3'], { opacity: 0, duration: 0.2 }, 1.72);
      sceneTl.set('#s2EyesClosed', { opacity: 0 }, 1.78);
      sceneTl.set('#s2EyesOpen', { opacity: 1 }, 1.78);
      sceneTl.call(() => playBedRustle(), null, 1.8);

      sceneTl.to(state, {
        bodyAngle: 0,
        headAngle: 0,
        duration: 0.72,
        ease: 'back.out(1.15)',
        onUpdate: () => {
          pivotEl.setAttribute('transform', `rotate(${state.bodyAngle.toFixed(2)})`);
          headEl.setAttribute('transform', `rotate(${state.headAngle.toFixed(2)})`);
        }
      }, 1.8);

      // 2.65s: Outside bamboo pole lowers away
      sceneTl.to('#s2OutsidePole', {
        rotation: -28,
        opacity: 0.25,
        duration: 0.9,
        ease: 'power2.in'
      }, 2.65);

      // 3.15s: Looks left toward the low bedside cabinet & reaches front hand out to light candle
      sceneTl.to(state, {
        headAngle: -10,
        duration: 0.35,
        ease: 'power2.out',
        onUpdate: () => {
          headEl.setAttribute('transform', `rotate(${state.headAngle.toFixed(2)})`);
        }
      }, 3.15);

      sceneTl.to('#s2EyeL', { attr: { cx: -16 }, duration: 0.28, ease: 'power2.out' }, 3.15);
      sceneTl.to('#s2EyeR', { attr: { cx: -8 }, duration: 0.28, ease: 'power2.out' }, 3.15);
      sceneTl.to('#s2Mouth', { attr: { x1: -15, x2: -9 }, duration: 0.28, ease: 'power2.out' }, 3.15);

      // Front arm reaches cleanly left toward candle wick while back arm stays resting on blanket
      sceneTl.to('#s2ArmFront', {
        attr: { d: 'M -1 -32 L -46 -22 L -92 -14' },
        duration: 0.45,
        ease: 'power2.out'
      }, 3.35);

      // 3.85s: Candle lights up & warm golden glow fills the room
      sceneTl.call(() => playCandleSpark(), null, 3.85);

      sceneTl.to('#s2CandleFlameGroup', {
        opacity: 1,
        scale: 1,
        duration: 0.4,
        ease: 'back.out(1.6)'
      }, 3.85);

      sceneTl.to('#s2RoomWarmWash', {
        opacity: 0.95,
        duration: 0.85,
        ease: 'power2.out'
      }, 3.88);

      sceneTl.to('#s2HeadWarmRim', {
        opacity: 0.65,
        duration: 0.75,
        ease: 'power2.out'
      }, 3.9);

      // Front arm returns to rest naturally alongside the other arm on the blanket
      sceneTl.to('#s2ArmFront', {
        attr: { d: 'M 1 -32 L 13 -13 L 26 -10' },
        duration: 0.5,
        ease: 'power2.inOut'
      }, 4.35);

      sceneTl.to(state, {
        headAngle: -4,
        duration: 0.5,
        ease: 'power1.inOut',
        onUpdate: () => {
          headEl.setAttribute('transform', `rotate(${state.headAngle.toFixed(2)})`);
        }
      }, 4.35);

      sceneTl.to('#s2FlameShape', {
        scaleX: 0.88,
        scaleY: 1.08,
        rotation: 3,
        transformOrigin: '0px 0px',
        duration: 0.35,
        yoyo: true,
        repeat: 4,
        ease: 'sine.inOut'
      }, 4.25);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene2();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      if (sceneTl) sceneTl.pause(0);
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene2, 250);
    });
  </script>
</body>
</html>
