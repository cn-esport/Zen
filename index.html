<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 3: Paying the Coin & Walking Down the Street (5.5s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #fcd34d;
      --coat: #1e2430;
      --coat-dark: #141821;
      --scarf: #7c2d12;
      --trousers: #2c2825;
      --trousers-back: #1d1a18;
      --cap: #161922;
      --client-shirt: #3b4252;
      --coin: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #080b12;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="s3SkyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070b16"/>
          <stop offset="50%" stop-color="#111b30"/>
          <stop offset="100%" stop-color="#1b2842"/>
        </linearGradient>

        <radialGradient id="s3LampHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.88"/>
          <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.35"/>
          <stop offset="60%" stop-color="#b45309" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="s3DoorGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.65"/>
          <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="s3GroundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d1017"/>
          <stop offset="100%" stop-color="#050608"/>
        </linearGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s3Camera">
        <!-- Sky -->
        <rect width="540" height="825" fill="url(#s3SkyGrad)"/>

        <!-- Distant 1800s Rowhouses Silhouette -->
        <path d="M 0 580 L 0 420 L 90 395 L 90 365 L 115 365 L 115 392 L 220 375 L 265 415 L 540 415 L 540 580 Z" fill="#090e1a"/>

        <!-- Distant Gas Streetlamp (Right Side) -->
        <g id="s3Streetlamp">
          <circle id="s3LampGlow" cx="445" cy="485" r="200" fill="url(#s3LampHalo)"/>
          <rect x="442" y="505" width="6" height="320" fill="#07080c"/>
          <path d="M 435 825 L 455 825 L 451 775 L 439 775 Z" fill="#07080c"/>
          <rect x="435" y="502" width="20" height="5" rx="2" fill="#07080c"/>
          <polygon points="434,470 456,470 452,502 438,502" fill="#fef3c7"/>
          <polygon points="434,470 456,470 452,502 438,502" fill="none" stroke="#07080c" stroke-width="2.5"/>
          <line x1="445" y1="470" x2="445" y2="502" stroke="#07080c" stroke-width="1.5"/>
          <polygon points="429,470 445,454 461,470" fill="#07080c"/>
          <circle cx="445" cy="451" r="3" fill="#07080c"/>
        </g>

        <!-- 1800s BRICK TOWNHOUSE FRONT DOORWAY (Left Side) -->
        <g id="s3Townhouse">
          <rect x="0" y="130" width="235" height="695" fill="#0b0e17"/>
          <rect x="232" y="130" width="3" height="695" fill="var(--rim)" opacity="0.2"/>
          <rect x="0" y="122" width="244" height="14" fill="#06080e"/>

          <!-- Upper Window -->
          <rect x="65" y="210" width="110" height="145" rx="3" fill="#06080d" stroke="#1e293b" stroke-width="2.5"/>
          <rect x="72" y="217" width="96" height="131" fill="#182438"/>
          <rect x="118" y="217" width="4" height="131" fill="#07090f"/>
          <rect x="72" y="280" width="96" height="4" fill="#07090f"/>

          <!-- Open Doorway Frame & Warm Interior Candlelight -->
          <rect x="52" y="545" width="118" height="262" rx="3" fill="#06080d" stroke="#1e293b" stroke-width="3"/>
          <!-- Warm Interior Candlelight Spill -->
          <rect x="56" y="549" width="110" height="258" fill="#451a03"/>
          <circle cx="111" cy="675" r="95" fill="url(#s3DoorGlow)"/>

          <!-- Stone Doorstep -->
          <rect x="44" y="807" width="142" height="18" rx="2" fill="#1a1f2c"/>

          <!-- CLIENT CHARACTER IN DOORWAY (Zenspiris Rig, Handing Over Coin!) -->
          <g transform="translate(15, 660)">
            <!-- Client Legs -->
            <path d="M 98 85 L 96 146 L 104 146" fill="none" stroke="#1f2430" stroke-width="6.5" stroke-linecap="round"/>
            <path d="M 104 85 L 106 146 L 114 146" fill="none" stroke="#2d3445" stroke-width="7" stroke-linecap="round"/>

            <!-- Client Torso -->
            <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 25 105 28.5 Q 110 29.5 110 34 L 110 87 L 92 87 Z" fill="var(--client-shirt)"/>

            <!-- Client Head (Exact r=22) -->
            <g id="s3ClientHead">
              <circle cx="99.5" cy="4" r="22" fill="#fde68a" opacity="0.45"/>
              <circle cx="101" cy="4" r="22" fill="var(--head)"/>
              <circle cx="111" cy="2.5" r="2.1" fill="var(--face)"/>
              <circle cx="118.8" cy="2.5" r="2.1" fill="var(--face)"/>
              <line x1="112" y1="11.5" x2="118" y2="11.5" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
            </g>

            <!-- Client Extended Arm Handing Over Coin -->
            <g id="s3ClientArm">
              <path d="M 103 36 L 125 46 L 146 43" fill="none" stroke="var(--head)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 101 34 L 114 40" fill="none" stroke="var(--client-shirt)" stroke-width="7.4" stroke-linecap="round"/>
            </g>
          </g>

          <!-- Swung-Open Wooden Front Door -->
          <path d="M 56 549 L 28 558 L 28 815 L 56 807 Z" fill="#14110f" stroke="#29231f" stroke-width="1.5"/>
        </g>

        <!-- Ground -->
        <rect x="0" y="825" width="540" height="135" fill="url(#s3GroundGrad)"/>
        <ellipse cx="445" cy="842" rx="95" ry="9" fill="#f59e0b" opacity="0.12"/>

        <!-- Gold/Copper Penny Coin Passing Between Hands -->
        <g id="s3CoinGroup">
          <circle cx="163" cy="702" r="7" fill="#fef08a" opacity="0.45"/>
          <circle cx="163" cy="702" r="3.6" fill="var(--coin)" stroke="#b45309" stroke-width="1"/>
        </g>

        <!-- KNOCKER-UPPER CHARACTER (Receives Coin, Nods Thanks, Walks Off Right Down Street) -->
        <g id="s3KnockerGroup" transform="translate(115, 678)">
          <!-- Ground Shadow -->
          <ellipse cx="103" cy="148" rx="26" ry="5" fill="#030406" opacity="0.85"/>

          <!-- Animated Walking Legs -->
          <path id="s3LegBack" d="M 101 85 L 95 116 L 92 144 L 85 144"
                fill="none" stroke="var(--trousers-back)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="s3LegFront" d="M 103 85 L 109 116 L 112 144 L 120 144"
                fill="none" stroke="var(--trousers)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- Torso & Coat -->
          <g id="s3TorsoGroup">
            <path d="M 91 34 Q 91 29.5 96.5 28.5 Q 101 24.5 105.5 28.5 Q 112 29.5 112.5 34 L 115 104 L 88 104 Z"
                  fill="var(--rim)" opacity="0.45"/>
            <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 25 105 28.5 Q 110.5 29.5 111 34 L 114 104 L 89 104 Z"
                  fill="var(--coat)"/>
            <line x1="103" y1="36" x2="104" y2="104" stroke="#0d1017" stroke-width="1.2" opacity="0.75"/>

            <!-- Rust Scarf -->
            <path d="M 91 33 L 85 52 L 91 53 L 96 35 Z" fill="#63220d"/>
            <rect x="92" y="27" width="18.5" height="6.5" rx="3" fill="var(--scarf)"/>

            <!-- Back Arm Holding Bamboo Pole Upright on Shoulder -->
            <g id="s3PoleArmGroup">
              <!-- Long Bamboo Pole Resting Against Shoulder -->
              <line x1="88" y1="142" x2="128" y2="-340" stroke="#07080c" stroke-width="4.2" stroke-linecap="round"/>
              <line x1="87" y1="142" x2="127" y2="-340" stroke="#94a3b8" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
              <path d="M 104 36 L 114 52 L 106 64" fill="none" stroke="var(--head)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 102 34 L 109 45" fill="none" stroke="var(--coat-dark)" stroke-width="7.4" stroke-linecap="round"/>
            </g>

            <!-- Head Group (Starts Facing Left Toward Client -> Turns Right to Walk Away) -->
            <g id="s3Head">
              <circle cx="102.5" cy="4" r="22" fill="var(--rim)" opacity="0.55"/>
              <circle cx="101" cy="4" r="22" fill="var(--head)"/>

              <!-- 1800s Flat Cap (Flips direction smoothly when turning around) -->
              <path id="s3CapLeft" d="M 122 -10 C 120 -22, 88 -23, 81 -11 L 72 -8 L 122 -7 Z" fill="var(--cap)"/>
              <path id="s3CapRight" d="M 80 -10 C 82 -22, 114 -23, 121 -11 L 130 -8 L 80 -7 Z" fill="var(--cap)" opacity="0"/>

              <!-- Left-Facing Face (Receiving Coin from Client) -->
              <g id="s3FaceLeft">
                <circle cx="91" cy="2.5" r="2.1" fill="var(--face)"/>
                <circle cx="83.2" cy="2.5" r="2.1" fill="var(--face)"/>
                <path d="M 84 11 Q 87 13 90 11" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
              </g>

              <!-- Right-Facing Face (Walking Down Street) -->
              <g id="s3FaceRight" opacity="0">
                <circle cx="111" cy="2.5" r="2.1" fill="var(--face)"/>
                <circle cx="118.8" cy="2.5" r="2.1" fill="var(--face)"/>
                <line x1="112" y1="11.5" x2="118" y2="11.5" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Front Arm (Reaches Left to Take Coin -> Pockets Coin -> Swings While Walking) -->
            <g id="s3FrontArm">
              <path d="M 98 36 L 76 46 L 54 42" fill="none" stroke="var(--head)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 100 34 L 87 40" fill="none" stroke="var(--coat)" stroke-width="7.6" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button class="primary" id="playBtn">▶ Play (5.5s)</button>
    <button id="replayBtn">↺ 0.0s</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Crisp Copper/Silver Coin Clink Foley SFX
    function playCoinClink() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      const freqs = [2450, 3680];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + idx * 0.03);
        gain.gain.setValueAtTime(0.14, now + idx * 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.03 + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.03);
        osc.stop(now + idx * 0.03 + 0.3);
      });
    }

    // Soft Cobblestone Footstep Foley SFX
    function playFootstep() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(145, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.08);
      gain.gain.setValueAtTime(0.13, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    let sceneTl = null;

    function playScene3() {
      if (sceneTl) sceneTl.kill();

      // Reset to 0.0s
      gsap.set('#s3Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s3KnockerGroup', { x: 115, y: 678 });
      gsap.set('#s3Head', { rotation: 0, svgOrigin: '101 4' });
      gsap.set('#s3FaceLeft', { opacity: 1 });
      gsap.set('#s3FaceRight', { opacity: 0 });
      gsap.set('#s3CapLeft', { opacity: 1 });
      gsap.set('#s3CapRight', { opacity: 0 });
      gsap.set('#s3FrontArm', { rotation: 0, svgOrigin: '98 36' });
      gsap.set('#s3ClientArm', { rotation: 0, svgOrigin: '103 36' });
      gsap.set('#s3CoinGroup', { x: 0, y: 0, opacity: 1 });
      gsap.set('#s3LegBack', { rotation: 0, svgOrigin: '101 85' });
      gsap.set('#s3LegFront', { rotation: 0, svgOrigin: '103 85' });
      gsap.set('#s3TorsoGroup', { y: 0 });

      sceneTl = gsap.timeline();

      // Slow cinematic pan following the coin exchange into the street walk
      sceneTl.to('#s3Camera', {
        scale: 1.07,
        x: -18,
        svgOrigin: '270 550',
        duration: 5.5,
        ease: 'none'
      }, 0);

      // 0.7s: Coin clinks into Knocker-Upper's hand
      sceneTl.call(() => playCoinClink(), null, 0.75);
      sceneTl.to('#s3CoinGroup', {
        x: 6,
        y: 2,
        duration: 0.35,
        ease: 'power2.out'
      }, 0.55);

      // 1.15s: Knocker-Upper pockets the coin & gives a polite nod
      sceneTl.to('#s3FrontArm', {
        rotation: -52,
        svgOrigin: '98 36',
        duration: 0.45,
        ease: 'power2.inOut'
      }, 1.1);

      sceneTl.to('#s3CoinGroup', {
        x: 48,
        y: 28,
        opacity: 0,
        duration: 0.35,
        ease: 'power2.in'
      }, 1.1);

      sceneTl.to('#s3Head', {
        rotation: -12,
        svgOrigin: '101 4',
        duration: 0.25,
        yoyo: true,
        repeat: 1,
        ease: 'sine.inOut'
      }, 1.2);

      // Client lowers arm back inside doorway
      sceneTl.to('#s3ClientArm', {
        rotation: 45,
        svgOrigin: '103 36',
        duration: 0.5,
        ease: 'power2.inOut'
      }, 1.45);

      // 1.85s: Knocker-Upper turns toward the right (down the street)
      sceneTl.to('#s3FaceLeft', { opacity: 0, duration: 0.12 }, 1.85);
      sceneTl.to('#s3CapLeft', { opacity: 0, duration: 0.12 }, 1.85);
      sceneTl.to('#s3FaceRight', { opacity: 1, duration: 0.15 }, 1.92);
      sceneTl.to('#s3CapRight', { opacity: 1, duration: 0.15 }, 1.92);

      // 2.0s - 5.5s: Walks down the cobblestone street toward the next house
      sceneTl.to('#s3KnockerGroup', {
        x: 335,
        duration: 3.5,
        ease: 'none'
      }, 2.0);

      // Walking stride cycle + synchronized cobblestone footsteps
      const stepTimes = [2.1, 2.55, 3.0, 3.45, 3.9, 4.35, 4.8, 5.25];
      stepTimes.forEach((st, idx) => {
        const dir = idx % 2 === 0 ? 1 : -1;
        sceneTl.call(() => playFootstep(), null, st);

        sceneTl.to('#s3LegFront', {
          rotation: dir * 20,
          svgOrigin: '103 85',
          duration: 0.42,
          ease: 'sine.inOut'
        }, st - 0.1);

        sceneTl.to('#s3LegBack', {
          rotation: -dir * 20,
          svgOrigin: '101 85',
          duration: 0.42,
          ease: 'sine.inOut'
        }, st - 0.1);

        sceneTl.to('#s3TorsoGroup', {
          y: -2.5,
          duration: 0.21,
          yoyo: true,
          repeat: 1,
          ease: 'sine.inOut'
        }, st - 0.1);
      });
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene3();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      if (sceneTl) sceneTl.pause(0);
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene3, 250);
    });
  </script>
</body>
</html>
