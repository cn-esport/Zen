<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Scene 2: 1720s Rewind & Village Walk</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #f4c28a;
      --outfit-top: #7c4a32;
      --outfit-bottom: #e8dcc0;
      --outfit-bottom-back: #b8ac92;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #080b14;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(4, 4, 8, 0.9) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Deep 18th Century Midnight Sky -->
        <linearGradient id="nightSky1720" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070a14"/>
          <stop offset="55%" stop-color="#111930"/>
          <stop offset="100%" stop-color="#1a2440"/>
        </linearGradient>

        <!-- Ground Path Gradient -->
        <linearGradient id="earthGround" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#14161f"/>
          <stop offset="40%" stop-color="#0d0e14"/>
          <stop offset="100%" stop-color="#06070a"/>
        </linearGradient>

        <!-- Rewind Clock Ambient Halo -->
        <radialGradient id="clockHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f4c28a" stop-opacity="0.22"/>
          <stop offset="60%" stop-color="#d97706" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
        </radialGradient>

        <!-- Symmetrical Lantern Light Cone -->
        <linearGradient id="lanternCone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.44"/>
          <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="lanternHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.65"/>
          <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s2Camera">
        <rect width="540" height="960" fill="url(#nightSky1720)"/>

        <!-- Crescent Moon & Twinkling Stars -->
        <circle cx="430" cy="185" r="24" fill="#f3f4f6" opacity="0.9"/>
        <circle cx="439" cy="178" r="20" fill="#0d1324"/>

        <g id="s2Stars" fill="#f2ede2">
          <circle class="star" cx="95" cy="165" r="2"/>
          <circle class="star" cx="175" cy="135" r="1.8"/>
          <circle class="star" cx="255" cy="195" r="2.2"/>
          <circle class="star" cx="345" cy="140" r="1.8"/>
          <circle class="star" cx="120" cy="275" r="1.8"/>
          <circle class="star" cx="465" cy="265" r="2"/>
          <circle class="star" cx="210" cy="245" r="1.5"/>
        </g>

        <!-- Distant Rolling Hills & 18th Century Village Cottages -->
        <g id="s2VillageBg">
          <path d="M -60 645 Q 180 575 380 635 T 640 615 L 640 760 L -60 760 Z" fill="#0e1324"/>

          <!-- Cottage 1 -->
          <g transform="translate(85, 558)">
            <rect x="0" y="25" width="76" height="52" fill="#090c17"/>
            <polygon points="-8,25 38,-6 84,25" fill="#06080f"/>
            <rect x="54" y="2" width="10" height="18" fill="#06080f"/>
            <rect x="28" y="42" width="16" height="18" rx="2" fill="#f59e0b" opacity="0.55"/>
          </g>

          <!-- Cottage 2 -->
          <g transform="translate(365, 568)">
            <rect x="0" y="22" width="68" height="46" fill="#090c17"/>
            <polygon points="-7,22 34,-5 75,22" fill="#06080f"/>
            <rect x="24" y="38" width="14" height="15" rx="2" fill="#f59e0b" opacity="0.35"/>
          </g>

          <!-- Bare Silhouette Trees -->
          <g stroke="#080b14" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M 245 628 L 245 572 M 245 595 L 230 580 M 245 588 L 260 574"/>
            <path d="M 485 632 L 485 582 M 485 602 L 472 588 M 485 596 L 498 584"/>
          </g>
        </g>

        <!-- Foreground Dirt Path (Flat Surface at y = 735) -->
        <rect x="0" y="735" width="540" height="225" fill="url(#earthGround)"/>
        <line x1="0" y1="735" x2="540" y2="735" stroke="#1e2538" stroke-width="2"/>

        <!-- ANTIQUE POCKET CLOCK REWINDING IN NIGHT SKY (x=270, y=315) -->
        <g id="rewindClock">
          <circle cx="270" cy="315" r="105" fill="url(#clockHalo)"/>
          <circle cx="270" cy="315" r="68" fill="none" stroke="#f4c28a" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.75"/>
          <circle cx="270" cy="315" r="56" fill="rgba(9, 11, 20, 0.72)" stroke="#f4c28a" stroke-width="2"/>
          <line x1="270" y1="265" x2="270" y2="273" stroke="#f4c28a" stroke-width="2.5"/>
          <line x1="270" y1="357" x2="270" y2="365" stroke="#f4c28a" stroke-width="2.5"/>
          <line x1="220" y1="315" x2="228" y2="315" stroke="#f4c28a" stroke-width="2.5"/>
          <line x1="312" y1="315" x2="320" y2="315" stroke="#f4c28a" stroke-width="2.5"/>

          <line id="clockHour" x1="270" y1="315" x2="270" y2="283" stroke="#f2ede2" stroke-width="3.5" stroke-linecap="round"/>
          <line id="clockMin" x1="270" y1="315" x2="308" y2="315" stroke="#f4c28a" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="270" cy="315" r="4.5" fill="#f4c28a"/>
        </g>

        <!-- =====================================================
             EXACT SCENE 1 CHARACTER RIG WALKING WITH LANTERN
             Feet grounded precisely on path at y = 735
             Hip anchored at (0, 0) -> placed at (125, 677) so foot reaches y = 735
             ===================================================== -->
        <g id="s2Walker" transform="translate(125, 677)">
          <!-- Ground Contact Shadow -->
          <ellipse cx="3" cy="58" rx="28" ry="6" fill="#040508" opacity="0.85"/>

          <!-- 1. Back Leg (Hip pivot at 0, 0 -> knee bend + forward rounded foot at y = 58) -->
          <g id="s2LegBack">
            <path d="M -2 0 L 0 29 L -1 58 L 8 58"
                  fill="none" stroke="var(--outfit-bottom-back)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- 2. Back Arm & Integrated Sleeve (Shoulder pivot at -1, -55) -->
          <g id="s2ArmBack">
            <path d="M -1 -55 L -6 -32 L -4 -14"
                  fill="none" stroke="#07060a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M -1 -57 L -3.5 -45.5"
                  fill="none" stroke="#5e3623" stroke-width="8.4" stroke-linecap="round"/>
            <path d="M -2.2 -51 L -3.5 -45.5"
                  fill="none" stroke="#5e3623" stroke-width="8.4" stroke-linecap="butt"/>
          </g>

          <!-- 3. Slim Torso with Rounded Collar Peak at Top (x=0, y=-66) & Warm Right Rim -->
          <path d="M -11 -56 Q -11 -61 -5 -62 Q 0 -66.5 5 -62 Q 12.5 -61 12.5 -56 L 12.5 5 L -11 5 Z"
                fill="var(--rim)" opacity="0.45"/>
          <path d="M -11 -56 Q -11 -61 -5 -62 Q 0 -66 5 -62 Q 11 -61 11 -56 L 11 5 L -11 5 Z"
                fill="var(--outfit-top)"/>

          <!-- 4. Front Leg with Rounded Hip Cap Overlapping Shirt Bottom (Hip pivot at 0, 0 -> foot at y = 58) -->
          <g id="s2LegFront">
            <path d="M 0 0 L 2 29 L 1 58 L 11 58"
                  fill="none" stroke="var(--outfit-bottom)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- 5. Head Group (Centered at 0, -87.5, r=22.5 -> bottom at y=-65 overlaps collar peak cleanly!) -->
          <g id="s2Head">
            <circle cx="-1.2" cy="-87.5" r="22.5" fill="var(--rim)" opacity="0.35"/>
            <circle cx="1.5" cy="-87.5" r="22.5" fill="var(--rim)" opacity="0.68"/>
            <circle cx="0" cy="-87.5" r="22.5" fill="var(--head)"/>

            <!-- 3/4 Side-Offset Face Features (Looking forward along the dark path) -->
            <g id="s2Face">
              <circle class="walker-eye" cx="10.5" cy="-90" r="2.2" fill="var(--face)"/>
              <circle class="walker-eye" cx="18.5" cy="-90" r="2.2" fill="var(--face)"/>
              <line x1="11.5" y1="-80.5" x2="17.5" y2="-80.5" stroke="var(--face)" stroke-width="2" stroke-linecap="round"/>
            </g>
          </g>

          <!-- 6. Front Arm & Unified Sleeve Holding Glowing Lantern (Shoulder pivot at 1, -55) -->
          <g id="s2ArmFront">
            <!-- Arm Rim Light -->
            <path d="M 1 -55.5 L 14 -37 L 28 -30"
                  fill="none" stroke="var(--rim)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
            <!-- Sleek Black Arm -->
            <path d="M 1 -55 L 14 -36 L 28 -29"
                  fill="none" stroke="var(--head)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Unified Short Sleeve -->
            <path d="M -1 -57.9 L 7.5 -45.5"
                  fill="none" stroke="var(--outfit-top)" stroke-width="8.6" stroke-linecap="round"/>
            <path d="M 3.2 -51.7 L 7.5 -45.5"
                  fill="none" stroke="var(--outfit-top)" stroke-width="8.6" stroke-linecap="butt"/>

            <!-- Antique Lantern & Symmetrical Light Cone (Anchored at hand 28, -29) -->
            <g id="s2Lantern" transform="translate(28, -29)">
              <!-- Symmetrical Downward Cone onto Dirt Path (Reaches y = 87 -> ground level) -->
              <polygon points="-6,18 6,18 48,87 -48,87" fill="url(#lanternCone)"/>
              <!-- Warm Lantern Halo -->
              <circle cx="0" cy="12" r="54" fill="url(#lanternHalo)"/>
              <!-- Lantern Handle & Frame -->
              <path d="M -5 0 Q 0 -6 5 0" fill="none" stroke="var(--head)" stroke-width="2"/>
              <rect x="-6" y="2" width="12" height="16" rx="3" fill="var(--head)"/>
              <!-- Glowing Candle Core -->
              <rect x="-3.5" y="5" width="7" height="10" rx="1.5" fill="#fde68a"/>
              <circle cx="0" cy="10" r="2.5" fill="#ffffff"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play Scene 2 (9.0s)</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playRewindEffect() {
      playTone(180, 'sine', 1.4, 0.14, 65);
      for (let i = 0; i < 14; i++) {
        setTimeout(() => {
          playTone(720 - i * 32, 'triangle', 0.06, 0.06);
        }, i * 110);
      }
    }

    let sceneTl = null;

    function playScene2() {
      if (sceneTl) sceneTl.kill();

      gsap.set('#s2Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s2VillageBg', { x: 0 });
      gsap.set('#clockMin', { rotation: 0, svgOrigin: '270 315' });
      gsap.set('#clockHour', { rotation: 0, svgOrigin: '270 315' });
      gsap.set('#s2Walker', { x: 125, y: 677 });
      gsap.set('#s2LegFront', { rotation: 0, svgOrigin: '0 0' });
      gsap.set('#s2LegBack', { rotation: 0, svgOrigin: '0 0' });
      gsap.set('#s2ArmBack', { rotation: 0, svgOrigin: '-1 -55' });
      gsap.set('#s2ArmFront', { rotation: 0, svgOrigin: '1 -55' });
      gsap.set('.walker-eye', { scaleY: 1, svgOrigin: '14.5 -90' });

      sceneTl = gsap.timeline();

      // 0.0s: Clock hands spin rapidly backward (Rewind into 1720s)
      sceneTl.call(() => playRewindEffect(), null, 0);
      sceneTl.to('#clockMin', {
        rotation: -1440,
        svgOrigin: '270 315',
        duration: 5.5,
        ease: 'power2.inOut'
      }, 0);
      sceneTl.to('#clockHour', {
        rotation: -360,
        svgOrigin: '270 315',
        duration: 5.5,
        ease: 'power2.inOut'
      }, 0);

      // Twinkling stars
      sceneTl.to('.star', {
        opacity: 0.25,
        duration: 0.8,
        stagger: 0.18,
        yoyo: true,
        repeat: 9
      }, 0);

      // Subtle parallax drift on distant village hills
      sceneTl.to('#s2VillageBg', {
        x: -24,
        duration: 9.0,
        ease: 'none'
      }, 0);

      // Smooth human walk cycle across the dirt path (0.2s to 9.0s)
      sceneTl.to('#s2Walker', {
        x: 375,
        duration: 8.8,
        ease: 'none'
      }, 0.2);

      // Subtle vertical body bob (2px) synced with steps
      sceneTl.to('#s2Walker', {
        y: 675,
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      // Alternating Leg Swing anchored strictly at hip (0, 0)
      sceneTl.to('#s2LegFront', {
        rotation: 22,
        svgOrigin: '0 0',
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      sceneTl.to('#s2LegBack', {
        rotation: -22,
        svgOrigin: '0 0',
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      // Opposite Back Arm Swing anchored at shoulder (-1, -55)
      sceneTl.to('#s2ArmBack', {
        rotation: 18,
        svgOrigin: '-1 -55',
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      // Subtle Lantern Sway anchored at front shoulder (1, -55)
      sceneTl.to('#s2ArmFront', {
        rotation: -4,
        svgOrigin: '1 -55',
        duration: 0.72,
        yoyo: true,
        repeat: 11,
        ease: 'sine.inOut'
      }, 0.2);

      // Natural Eye Blink at 3.2s & 6.8s
      sceneTl.to('.walker-eye', {
        scaleY: 0.1,
        svgOrigin: '14.5 -90',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 3.2);

      sceneTl.to('.walker-eye', {
        scaleY: 0.1,
        svgOrigin: '14.5 -90',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 6.8);

      // Gentle cinematic camera push-in
      sceneTl.to('#s2Camera', {
        scale: 1.12,
        svgOrigin: '270 540',
        duration: 9.0,
        ease: 'sine.inOut'
      }, 0);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene2();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene2, 300);
    });
  </script>
</body>
</html>
