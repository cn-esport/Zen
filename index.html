<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zenspiris - Knocker-Uppers Scene 1</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Full-Width 9:16 Stage with Top & Bottom Crop Lines Only */
  #stage {
    position: relative;
    width: 100vw;
    height: 177.78vw; /* Exact 9:16 Aspect Ratio */
    max-width: 56.25vh;
    max-height: 100vh;
    background: #080c16;
    border-top: 2px solid #f5b041;    /* Top Crop Guide Line */
    border-bottom: 2px solid #f5b041; /* Bottom Crop Guide Line */
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Playback Controls Outside the 9:16 Frame */
  #controls {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111827;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid #1f2937;
    z-index: 30;
  }
  button {
    background: #1f2937;
    color: #f8fafc;
    border: 1px solid #374151;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active {
    opacity: 0.8;
  }
  button.primary {
    background: #f5b041;
    color: #090d16;
    border-color: #f5b041;
  }
  #timer {
    color: #cbd5e1;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    min-width: 72px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="stage">
  <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Nocturne Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#070b14"/>
        <stop offset="45%" stop-color="#0f172a"/>
        <stop offset="85%" stop-color="#1a253a"/>
        <stop offset="100%" stop-color="#0a0e17"/>
      </linearGradient>

      <!-- Warm Gas Streetlamp Glow -->
      <radialGradient id="lampHalo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffdfa0" stop-opacity="0.95"/>
        <stop offset="22%" stop-color="#f5b041" stop-opacity="0.45"/>
        <stop offset="55%" stop-color="#d68910" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
      </radialGradient>

      <!-- Distant Moon Glow -->
      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.28"/>
        <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
      </radialGradient>

      <!-- Fog Gradient -->
      <linearGradient id="fogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#64748b" stop-opacity="0"/>
        <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#475569" stop-opacity="0.25"/>
      </linearGradient>
    </defs>

    <!-- 1. Sky Background -->
    <rect width="1080" height="1920" fill="url(#skyGrad)"/>

    <!-- Subtle Moonlit Cloud Glow -->
    <circle cx="320" cy="340" r="380" fill="url(#moonGlow)"/>
    <circle cx="260" cy="270" r="38" fill="#cbd5e1" opacity="0.22"/>

    <!-- 2. Distant Victorian Rooftops Silhouette -->
    <path d="M0 1120 L0 860 L140 820 L140 760 L185 760 L185 810 L320 780 L380 860 L540 860 L540 1120 Z" fill="#0b111e"/>
    <rect x="65" y="790" width="22" height="55" fill="#0b111e"/>
    <rect x="275" y="735" width="26" height="60" fill="#0b111e"/>

    <!-- 3. Victorian Gas Streetlamp (Key Light Source on Left) -->
    <g id="streetlamp">
      <circle id="lampHaloCircle" cx="215" cy="965" r="460" fill="url(#lampHalo)" opacity="0.9"/>
      <rect x="208" y="1010" width="14" height="680" fill="#070a10"/>
      <path d="M196 1690 L234 1690 L226 1560 L204 1560 Z" fill="#070a10"/>
      <rect x="195" y="1005" width="40" height="10" rx="3" fill="#070a10"/>
      <path id="lampGlass" d="M192 940 L238 940 L230 1005 L200 1005 Z" fill="#ffe8b3" opacity="0.92"/>
      <path d="M192 940 L238 940 L230 1005 L200 1005 Z" fill="none" stroke="#070a10" stroke-width="5"/>
      <line x1="215" y1="940" x2="215" y2="1005" stroke="#070a10" stroke-width="3"/>
      <path d="M182 940 L215 908 L248 940 Z" fill="#070a10"/>
      <circle cx="215" cy="903" r="6" fill="#070a10"/>
    </g>

    <!-- 4. Atmospheric Drifting Fog -->
    <g id="fogGroup">
      <rect x="-120" y="950" width="1320" height="750" fill="url(#fogGrad)"/>
    </g>

    <!-- 5. Brick Townhouse Building (Right Side) -->
    <g id="building">
      <rect x="580" y="180" width="500" height="1510" fill="#090d16"/>
      <rect x="580" y="180" width="6" height="1510" fill="#eab308" opacity="0.16"/>
      <rect x="562" y="170" width="518" height="28" fill="#06090f"/>
      <rect x="572" y="198" width="508" height="14" fill="#0d1322"/>

      <!-- Second Floor Bedroom Window -->
      <g id="targetWindow">
        <rect x="680" y="390" width="230" height="310" rx="4" fill="#05070c" stroke="#1e293b" stroke-width="4"/>
        <rect x="694" y="404" width="202" height="282" fill="#172338"/>
        <polygon points="694,404 775,404 694,550" fill="#334155" opacity="0.28"/>
        <rect x="791" y="404" width="8" height="282" fill="#070a10"/>
        <rect x="694" y="538" width="202" height="8" fill="#070a10"/>
        <rect x="668" y="698" width="254" height="18" rx="2" fill="#111827"/>
      </g>

      <!-- Lower Floor Window -->
      <rect x="680" y="960" width="230" height="300" rx="4" fill="#06090f" stroke="#141c2b" stroke-width="3"/>
      <rect x="694" y="974" width="202" height="272" fill="#0d1524"/>
      <rect x="791" y="974" width="8" height="272" fill="#06090f"/>
      <rect x="694" y="1104" width="202" height="8" fill="#06090f"/>
      <rect x="668" y="1258" width="254" height="16" fill="#0d1320"/>
    </g>

    <!-- 6. Glass Tap Visual Ripple Effect -->
    <circle id="tapRipple" cx="732" cy="538" r="24" fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0"/>

    <!-- 7. Zenspiris Signature Human-Proportioned Character (Scaled to Building) -->
    <g id="knocker-upper">
      <!-- Ground Contact Shadow -->
      <ellipse cx="410" cy="1688" rx="85" ry="12" fill="#030407" opacity="0.85"/>

      <!-- Character Body (Natural Human Stance, Scaled Proportionally) -->
      <g id="charBody">
        <!-- Back Leg (Stepping Slightly Back for Leverage) -->
        <path d="M394 1525 L372 1605 L364 1682 L384 1682 L396 1608 L412 1528 Z" fill="#05070b"/>
        <!-- Back Boot -->
        <path d="M362 1674 L394 1674 L397 1687 L360 1687 Z" fill="#05070b"/>

        <!-- Front Leg (Stepping Forward) -->
        <path d="M412 1525 L432 1605 L446 1682 L466 1682 L454 1602 L430 1525 Z" fill="#05070b"/>
        <!-- Front Boot -->
        <path d="M444 1674 L478 1674 L482 1687 L443 1687 Z" fill="#05070b"/>

        <!-- Human Torso & Fitted Long Overcoat (Natural Shoulders, Waist & Coat Tails) -->
        <path d="M388 1388 
                 C384 1430, 386 1475, 376 1558 
                 L414 1554 
                 L420 1515 
                 L428 1558 
                 L454 1552 
                 C442 1480, 434 1430, 426 1388 Z" fill="#05070b"/>
        <!-- Subtle Warm Rim Light on Back of Shoulders & Coat -->
        <path d="M388 1390 C384 1430, 386 1475, 377 1555" fill="none" stroke="#f5b041" stroke-width="2.2" opacity="0.4"/>

        <!-- Neck & Scarf -->
        <rect x="401" y="1370" width="16" height="22" rx="6" fill="#05070b"/>
        <path d="M390 1380 Q410 1392 428 1378 L431 1394 Q410 1406 388 1394 Z" fill="#0f172a"/>
        <!-- Scarf Trailing End -->
        <path d="M390 1390 L376 1445 L390 1448 L400 1392 Z" fill="#0a0f1a"/>

        <!-- Zenspiris Signature Head (Proper 1:6.5 Human Head-to-Body Ratio, Tilted Up) -->
        <g transform="translate(412, 1344) rotate(-25)">
          <!-- Smooth Bald Silhouette Head -->
          <ellipse cx="0" cy="0" rx="26" ry="30" fill="#05070b"/>
          <!-- Subtle Nose & Chin Profile -->
          <path d="M22 -5 L29 2 L22 7" fill="#05070b"/>
          <!-- Warm Rim Light on Back of Head -->
          <path d="M-23 -10 A26 30 0 0 0 -13 24" fill="none" stroke="#f5b041" stroke-width="2" opacity="0.38"/>

          <!-- Expressive White Eye & Eyebrow Looking Up at Window -->
          <ellipse cx="14" cy="-3" rx="4.5" ry="3.4" fill="#f8fafc"/>
          <circle cx="15.8" cy="-3.5" r="1.6" fill="#05070b"/>
          <path d="M8 -10 L20 -8" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>

          <!-- Fitted 1800s Flat Cap -->
          <path d="M-27 -13 C-25 -32, 18 -34, 28 -15 L42 -10 L-27 -8 Z" fill="#05070b"/>
          <path d="M-24 -17 C-14 -29, 8 -30, 21 -21" fill="none" stroke="#f5b041" stroke-width="2" opacity="0.35"/>
        </g>

        <!-- Back Left Arm (Bent at Elbow Holding Lower Pole) -->
        <path d="M392 1400 L378 1448 L404 1478 L414 1468 L394 1444 L406 1404 Z" fill="#05070b"/>
      </g>

      <!-- Animated Front Arm + Long Bamboo Pole -->
      <g id="poleArmGroup">
        <!-- Long Bamboo Pole Reaching Up to Second Floor Window (732, 538) -->
        <line x1="396" y1="1495" x2="732" y2="538" stroke="#05070b" stroke-width="7.5" stroke-linecap="round"/>
        <!-- Subtle Highlight Along Pole Edge for Visibility -->
        <line x1="394" y1="1494" x2="730" y2="537" stroke="#94a3b8" stroke-width="1.8" opacity="0.48" stroke-linecap="round"/>
        <!-- Bamboo Node Rings -->
        <circle cx="480" cy="1253" r="4.5" fill="#05070b"/>
        <circle cx="565" cy="1012" r="4.5" fill="#05070b"/>
        <circle cx="650" cy="770" r="4" fill="#05070b"/>
        <!-- Soft Tip -->
        <circle cx="732" cy="538" r="6.5" fill="#1e293b"/>

        <!-- Front Right Arm (Bent at Elbow Gripping Upper Pole) -->
        <path d="M418 1398 L446 1428 L434 1440 L408 1410 Z" fill="#05070b"/>
        <path d="M446 1428 L428 1402 L418 1408 L434 1440 Z" fill="#05070b"/>
        <!-- Hand Fist on Pole -->
        <circle cx="424" cy="1404" r="7" fill="#05070b"/>
        <circle cx="406" cy="1472" r="7" fill="#05070b"/>
      </g>
    </g>

    <!-- 8. Cobblestone Ground -->
    <rect x="0" y="1685" width="1080" height="235" fill="#05070b"/>
    <ellipse cx="230" cy="1715" rx="190" ry="18" fill="#f5b041" opacity="0.12"/>
  </svg>
</div>

<!-- External Playback Controls (Outside the Top/Bottom Crop Lines) -->
<div id="controls">
  <button id="playBtn" class="primary" type="button">Play</button>
  <button id="pauseBtn" type="button">Pause</button>
  <button id="replayBtn" type="button">Replay 0.0s</button>
  <span id="timer">0.0s / 5.0s</span>
</div>

<script>
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const replayBtn = document.getElementById('replayBtn');
  const timerDisplay = document.getElementById('timer');

  const poleArmGroup = document.getElementById('poleArmGroup');
  const charBody = document.getElementById('charBody');
  const tapRipple = document.getElementById('tapRipple');
  const targetWindow = document.getElementById('targetWindow');
  const fogGroup = document.getElementById('fogGroup');
  const lampHaloCircle = document.getElementById('lampHaloCircle');

  let isPlaying = false;
  let elapsed = 0;
  let lastTimestamp = null;
  const duration = 5.0;

  // Helper to compute single tap pulse (0 to 1) around a target beat time
  function getTapPulse(t, tapTime) {
    const dt = t - tapTime;
    if (dt < -0.25 || dt > 0.45) return 0;
    if (dt < 0) {
      // Wind-up and strike forward
      return Math.sin(((dt + 0.25) / 0.25) * (Math.PI / 2));
    } else {
      // Bounce back smoothly
      return Math.cos((dt / 0.45) * (Math.PI / 2));
    }
  }

  function renderFrame(t) {
    // 1. Subtle Fog & Lamp Flicker
    const fogX = Math.sin((t / duration) * Math.PI * 2) * 35;
    fogGroup.setAttribute('transform', `translate(${fogX.toFixed(1)}, 0)`);

    const lampOp = 0.88 + Math.sin(t * 9) * 0.06;
    lampHaloCircle.setAttribute('opacity', lampOp.toFixed(2));

    // 2. Three Rhythmic Taps at 0.9s, 2.1s, 3.3s ("Every. Single. Morning.")
    const tapTimes = [0.9, 2.1, 3.3];
    let poleAngle = 0;
    let bodyLift = 0;
    let rippleOp = 0;
    let rippleScale = 0.3;
    let winShake = 0;

    tapTimes.forEach(tapTime => {
      const pulse = getTapPulse(t, tapTime);
      if (pulse > 0) {
        poleAngle = Math.max(poleAngle, pulse * 4.8);
        bodyLift = Math.max(bodyLift, pulse * 4);
      }
      // Ripple & Window shake right after impact (t >= tapTime)
      const post = t - tapTime;
      if (post >= 0 && post <= 0.55) {
        const pNorm = post / 0.55;
        rippleOp = Math.max(rippleOp, (1 - pNorm) * 0.9);
        rippleScale = Math.max(rippleScale, 0.4 + pNorm * 1.6);
        if (post <= 0.18) {
          winShake = Math.sin(post * 90) * 3 * (1 - post / 0.18);
        }
      }
    });

    poleArmGroup.setAttribute('transform', `rotate(${poleAngle.toFixed(2)}, 410, 1410)`);
    charBody.setAttribute('transform', `translate(0, ${(-bodyLift).toFixed(1)})`);
    targetWindow.setAttribute('transform', `translate(${winShake.toFixed(1)}, 0)`);

    tapRipple.setAttribute('opacity', rippleOp.toFixed(2));
    tapRipple.setAttribute('transform', `translate(732, 538) scale(${rippleScale.toFixed(2)}) translate(-732, -538)`);
  }

  function loop(timestamp) {
    if (!isPlaying) return;
    if (lastTimestamp === null) lastTimestamp = timestamp;
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    elapsed += delta;
    if (elapsed >= duration) {
      elapsed = duration;
      isPlaying = false;
      playBtn.textContent = 'Play';
    }

    renderFrame(elapsed);
    timerDisplay.textContent = `${elapsed.toFixed(1)}s / 5.0s`;

    if (isPlaying) {
      requestAnimationFrame(loop);
    }
  }

  playBtn.addEventListener('click', () => {
    if (elapsed >= duration) {
      elapsed = 0;
    }
    if (!isPlaying) {
      isPlaying = true;
      lastTimestamp = null;
      playBtn.textContent = 'Playing...';
      requestAnimationFrame(loop);
    }
  });

  pauseBtn.addEventListener('click', () => {
    isPlaying = false;
    playBtn.textContent = 'Play';
  });

  replayBtn.addEventListener('click', () => {
    isPlaying = false;
    elapsed = 0;
    lastTimestamp = null;
    playBtn.textContent = 'Play';
    renderFrame(0);
    timerDisplay.textContent = `0.0s / 5.0s`;
  });

  // Initial render at 0.0s
  renderFrame(0);
</script>

</body>
</html>
