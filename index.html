function bed(d,type,f,q,g){
 if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+.4);v.gain.setValueAtTime(g,t+d-.5);v.gain.linearRampToValueAtTime(.0001,t+d);s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);}
function ambience(){
 if(!audioCtx||!soundEnabled)return;const ctx=audioCtx,t=ctx.currentTime,E=t+7.05;
 const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=200;
 const pg=ctx.createGain();pg.gain.setValueAtTime(.0001,t);pg.gain.linearRampToValueAtTime(.016,t+.6);pg.gain.linearRampToValueAtTime(.03,t+6.3);pg.gain.linearRampToValueAtTime(.0001,t+7);
 [55,55.5].forEach(f=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start(t);o.stop(E);});lp.connect(pg).connect(ctx.destination);
 const n=ctx.sampleRate*4,b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=ctx.createBufferSource();s.buffer=b;s.loop=true;
 const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=640;bp.Q.value=1.3;
 const mod=ctx.createGain();mod.gain.value=.85;const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.45;lg.gain.value=.15;lfo.connect(lg).connect(mod.gain);
 const mg=ctx.createGain();
 mg.gain.setValueAtTime(.0001,t);mg.gain.linearRampToValueAtTime(.006,t+.5);mg.gain.linearRampToValueAtTime(.013,t+3.5);
 mg.gain.linearRampToValueAtTime(.0065,t+3.7);mg.gain.setValueAtTime(.0065,t+5.0);mg.gain.linearRampToValueAtTime(.0165,t+5.5);
 mg.gain.linearRampToValueAtTime(.02,t+6.6);mg.gain.linearRampToValueAtTime(.0001,t+7);
 s.connect(bp).connect(mod).connect(mg).connect(ctx.destination);s.start(t);s.stop(E);lfo.start(t);lfo.stop(E);}
function shimmer(){
 if(!audioCtx||!soundEnabled)return;const ctx=audioCtx,t=ctx.currentTime,fl=ctx.createBiquadFilter(),v=ctx.createGain();fl.type='lowpass';fl.frequency.value=1800;
 v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(.02,t+1);v.gain.linearRampToValueAtTime(.0001,t+2);

const ZOUT={'Tee + Jeans':{shirt:['#3d5a80',0,-36,2,1],sl:['s','#3d5a80'],pa:['l','#2a3f66'],hat:'none',shoe:'shoe'},'Hoodie + Joggers':{shirt:['#4a4f5c',0,-30,4,3],sl:['l','#4a4f5c'],pa:['l','#2e3340'],hat:'hood',shoe:'shoe'},'Suit + Tie':{shirt:['#1f2433',0,-24,3,4],sl:['l','#1f2433'],pa:['l','#1f2433'],hat:'none',shoe:'shoe',ex:'tie'},

'Roman tunic':{shirt:['#d9d2c0',0,-26,2,4],sl:['s','#d9d2c0'],hat:'none',shoe:'sandal',ex:'belt'},'Toga':{shirt:['#e8e2d0',0,-6,4,8],sl:['s','#e8e2d0'],hat:'none',shoe:'sandal'},'Kilt (bare chest)':{shirt:['#e8e2d0',48,-24,3,8],hat:'none',shoe:'sandal'}};

function ZChar(parent,o){
 o=o||{};const P=Object.assign({},ZDEF,o.params||{}),g=document.createElementNS(ZNS,'g');g.innerHTML=ZT;parent.appendChild(g);
 const E={};['shd','ch','lbp','lbo','lbb','lbs','lfp','lfo','lfb','lfs','fap','fso','tr','tc','gt','ga','gi','gb','nap','nso','hn','hd','rim','hc','hatg','e1','e2','l1','l2','a1','a2','b1','b2','mp'].forEach(r=>E[r]=g.querySelector('[data-r="'+r+'"]'));
 const C={g,P,hand:E.hn,outfit:null,hat:'none',shoe:'shoe'};
