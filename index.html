<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — The Baker's Alarm Scene 1: Oven Door (6.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(252,211,77,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(252,211,77,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style></head>
<body>
<div class="stage-wrapper">
<div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="s1Wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06080f"/><stop offset="1" stop-color="#111726"/></linearGradient>
 <linearGradient id="s1Floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b101b"/><stop offset="1" stop-color="#04060c"/></linearGradient>
 <linearGradient id="s1Glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b101d"/><stop offset="1" stop-color="#1b2c48"/></linearGradient>
 <radialGradient id="s1OvenG"><stop offset="0" stop-color="#fef08a" stop-opacity=".9"/><stop offset=".3" stop-color="#f59e0b" stop-opacity=".55"/><stop offset=".65" stop-color="#d97706" stop-opacity=".2"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></radialGradient>
 <radialGradient id="s1WashG"><stop offset="0" stop-color="#f59e0b" stop-opacity=".55"/><stop offset=".5" stop-color="#d97706" stop-opacity=".18"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></radialGradient>
 <linearGradient id="s1Open" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef08a"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
</defs>
<g id="s1Camera">
 <!-- wall + floor -->
 <rect x="0" y="0" width="540" height="790" fill="url(#s1Wall)"/>
 <rect x="0" y="785" width="540" height="175" fill="url(#s1Floor)"/>
 <g stroke="#0e1422" stroke-width="2"><line x1="0" y1="830" x2="540" y2="830"/><line x1="0" y1="885" x2="540" y2="885"/></g>
 <!-- window + dawn beam -->
 <polygon points="70,400 160,400 330,785 200,785" fill="#60a5fa" opacity=".05"/>
 <rect x="62" y="372" width="106" height="134" fill="#161d2e"/>
 <rect x="70" y="380" width="90" height="118" fill="url(#s1Glass)"/>
 <polygon points="70,380 112,380 70,450" fill="#bae6fd" opacity=".06"/>
 <g stroke="#181f30" stroke-width="4"><line x1="115" y1="380" x2="115" y2="498"/><line x1="70" y1="439" x2="160" y2="439"/></g>
 <rect x="56" y="504" width="118" height="9" fill="#181f30"/>
 <!-- shelf with loaves -->
 <rect x="40" y="300" width="240" height="8" fill="#1a1410"/>
 <g fill="#231510"><ellipse cx="80" cy="289" rx="22" ry="11"/><ellipse cx="140" cy="289" rx="22" ry="11"/><ellipse cx="200" cy="289" rx="22" ry="11"/><ellipse cx="252" cy="291" rx="18" ry="9"/></g>
 <g fill="#fcd34d" opacity=".12"><ellipse cx="86" cy="286" rx="14" ry="5"/><ellipse cx="146" cy="286" rx="14" ry="5"/><ellipse cx="206" cy="286" rx="14" ry="5"/></g>
 <!-- flour sack -->
 <path d="M 30 785 L 36 712 Q 70 698 104 712 L 112 785 Z" fill="#3a372f"/>
 <rect x="48" y="740" width="46" height="14" fill="#2a2824"/>
 <!-- oven glow layers -->
 <circle id="s1OvenGlow" cx="395" cy="690" r="240" fill="url(#s1OvenG)" opacity=".55"/>
 <g id="s1Flick"><ellipse cx="300" cy="792" rx="170" ry="22" fill="#f59e0b" opacity=".16"/></g>
 <!-- chimney -->
 <rect x="440" y="0" width="28" height="575" fill="#0f0d10"/>
 <!-- oven -->
 <g id="s1Oven">
  <path d="M 310 785 L 310 612 Q 310 560 362 560 L 458 560 Q 510 560 510 612 L 510 785 Z" fill="#1c1816"/>
  <g stroke="#0e0b0a" stroke-width="2"><line x1="310" y1="600" x2="510" y2="600"/><line x1="310" y1="760" x2="510" y2="760"/><line x1="470" y1="760" x2="470" y2="785"/><line x1="350" y1="760" x2="350" y2="785"/></g>
  <rect x="336" y="626" width="118" height="128" rx="14" fill="#0a0605"/>
  <rect id="s1OpenGlow" x="340" y="630" width="110" height="120" rx="12" fill="url(#s1Open)" opacity="0"/>
  <g id="s1Door">
   <rect x="0" y="0" width="110" height="120" rx="12" fill="#15100e" stroke="#2a211c" stroke-width="3"/>
   <rect x="16" y="22" width="78" height="22" rx="6" fill="#f59e0b" opacity=".9"/>
   <rect x="92" y="56" width="7" height="30" rx="3" fill="#d97706"/>
  </g>
 </g>
 <!-- smoke from oven -->
 <g fill="#94a3b8"><circle class="s1p s1pA" cx="372" cy="668" r="10"/><circle class="s1p s1pA" cx="398" cy="660" r="10"/><circle class="s1p s1pA" cx="424" cy="668" r="10"/><circle class="s1p s1pA" cx="410" cy="690" r="10"/>
  <circle class="s1p s1pB" cx="380" cy="680" r="10"/><circle class="s1p s1pB" cx="408" cy="672" r="10"/><circle class="s1p s1pB" cx="430" cy="684" r="10"/></g>
 <circle id="s1Wash" cx="395" cy="690" r="400" fill="url(#s1WashG)" opacity=".3"/>
 <!-- baker -->
 <g id="s1Char">
  <ellipse cx="0" cy="2" rx="32" ry="6" fill="#000" opacity=".9"/>
  <g id="s1LegB" transform="translate(-4,-50)"><path d="M 0 0 L -1 26 L -3 47" stroke="#08070c" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M -6 44 L 10 44 L 11 50 L -8 50 Z" fill="#08070c"/></g>
  <g id="s1LegF" transform="translate(4,-50)"><path d="M 0 0 L 1 26 L 4 47" class="hs" stroke="#0d0b12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M 0 44 L 14 44 L 15 50 L -2 50 Z" class="hd"/></g>
  <path d="M -6 -100 L -12 -78 L -10 -58" stroke="#18202c" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M -11.5 -108 L 15.5 -108 L 20.5 -26 L -15.5 -26 Z" fill="#fcd34d" opacity=".4"/>
  <path d="M -13 -108 L 14 -108 L 19 -26 L -17 -26 Z" fill="#1e2330"/>
  <g fill="#cbd5e1" opacity=".22"><circle cx="-8" cy="-92" r="2"/><circle cx="-4" cy="-64" r="2.4"/><circle cx="12" cy="-100" r="1.8"/><circle cx="-12" cy="-44" r="2.2"/></g>
  <path d="M -1 -98 L 17 -98 L 21 -28 L -3 -28 Z" fill="#d9d5c8"/>
  <circle cx="7" cy="-72" r="2" fill="#b8b3a3"/>
  <path id="s1Arm" d="M 3 -100 L 10 -78 L 14 -58" stroke="#0d0b12" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g id="s1Head" transform="translate(2,-130) rotate(6)">
   <circle id="s1HeadRim" cx="1.6" cy="0" r="22" fill="#fcd34d" opacity=".5"/>
   <circle cx="0" cy="0" r="22" class="hd"/>
   <path d="M -16 -12 L -18 -34 Q -26 -52 -8 -54 Q 0 -66 11 -55 Q 26 -52 18 -34 L 16 -12 Z" transform="translate(1.6,0)" fill="#fcd34d" opacity=".45"/>
   <path d="M -16 -12 L -18 -34 Q -26 -52 -8 -54 Q 0 -66 11 -55 Q 26 -52 18 -34 L 16 -12 Z" fill="#ece8dc"/>
   <rect x="-17" y="-20" width="34" height="4" fill="#cfc9b8"/>
   <g id="s1FG" class="fs"><line x1="8" y1="-2" x2="13" y2="-2" stroke-width="2.1"/><line x1="15.5" y1="-2" x2="20.5" y2="-2" stroke-width="2.1"/><line x1="9" y1="7" x2="15" y2="7" stroke-width="1.8"/></g>
   <g id="s1FO" opacity="0"><circle class="fc eo" cx="11" cy="-2" r="2.1"/><circle class="fc eo" cx="18.5" cy="-2" r="2.1"/><line class="fs" x1="9" y1="7" x2="15" y2="7" stroke-width="1.8"/></g>
   <g id="s1FF" opacity="0"><circle class="fc" cx="-4" cy="-2" r="2.2"/><circle class="fc" cx="4" cy="-2" r="2.2"/><line class="fs" x1="-3" y1="7" x2="3" y2="7" stroke-width="1.8"/></g>
  </g>
 </g>
 <!-- burnt loaf (follows hand) -->
 <g id="s1Loaf" opacity="0">
  <ellipse cx="1" cy="0" rx="24" ry="12" fill="#fcd34d" opacity=".35"/>
  <ellipse cx="0" cy="0" rx="23" ry="11" fill="#1a1208"/>
  <g stroke="#3a2412" stroke-width="2.4" stroke-linecap="round"><line x1="-10" y1="-5" x2="-5" y2="3"/><line x1="-1" y1="-6" x2="4" y2="3"/><line x1="8" y1="-5" x2="13" y2="2"/></g>
 </g>
 <g fill="#64748b"><circle class="s1p s1pW" cx="304" cy="684" r="5"/><circle class="s1p s1pW" cx="312" cy="682" r="5"/><circle class="s1p s1pW" cx="308" cy="686" r="5"/></g>
</g>
</svg>
</div>
<div class="controls">
 <button id="playBtn" class="primary">▶ Play (6.0s)</button>
 <button id="replayBtn">↺ 0.0s</button>
 <button id="soundBtn">🔊 Sound: ON</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const playBtn=$('playBtn'),replayBtn=$('replayBtn'),soundBtn=$('soundBtn');
// ---------- AUDIO (procedural foley) ----------
let audioCtx=null,soundEnabled=true;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(type,f0,f1,d,g){if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,type,f,q,g,att){if(!audioCtx||!soundEnabled)return;const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);}
function playOvenDoor(){tone('triangle',170,48,.2,.16);noise(.12,'bandpass',1400,1,.1,.005);tone('sine',640,610,.5,.05);}
function playSmoke(){noise(.55,'bandpass',650,.8,.07,.06);}
function playStep(){tone('triangle',130,46,.08,.11);}
// ---------- RIG STATE ----------
const st={x:190,bob:0,head:6,stride:0,arm:0,door:1};
const IDLE={e:[10,-78],h:[14,-58]},REACH={e:[38,-96],h:[80,-90]},HOLD={e:[26,-82],h:[48,-84]};
const lerp=(a,b,t)=>a+(b-a)*t;
function pose(a){const[p,q,t]=a<=1?[IDLE,REACH,a]:[REACH,HOLD,a-1];return{e:[lerp(p.e[0],q.e[0],t),lerp(p.e[1],q.e[1],t)],h:[lerp(p.h[0],q.h[0],t),lerp(p.h[1],q.h[1],t)]};}
function render(){
 const p=pose(st.arm);
 $('s1Char').setAttribute('transform',`translate(${st.x},${785+st.bob})`);
 $('s1Head').setAttribute('transform',`translate(2,-130) rotate(${st.head})`);
 $('s1LegF').setAttribute('transform',`translate(4,-50) rotate(${st.stride})`);
 $('s1LegB').setAttribute('transform',`translate(-4,-50) rotate(${-st.stride})`);
 $('s1Arm').setAttribute('d',`M 3 -100 L ${p.e[0]} ${p.e[1]} L ${p.h[0]} ${p.h[1]}`);
 $('s1Loaf').setAttribute('transform',`translate(${st.x+p.h[0]+3},${785+st.bob+p.h[1]-8})`);
 $('s1Door').setAttribute('transform',`translate(340,630) scale(${st.door},1)`);
}
// ---------- TIMELINE ----------
let sceneTl=null;
function resetScene1ToStart(){
 if(sceneTl){sceneTl.kill();sceneTl=null;}
 Object.assign(st,{x:190,bob:0,head:6,stride:0,arm:0,door:1});
 gsap.set('#s1Camera',{scale:1,svgOrigin:'260 530'});
 gsap.set('#s1FG',{opacity:1});gsap.set('#s1FO,#s1FF',{opacity:0});
 gsap.set('.eo',{attr:{r:2.1}});gsap.set('#s1HeadRim',{attr:{cx:1.6}});
 gsap.set('#s1Loaf,#s1OpenGlow',{opacity:0});
 gsap.set('#s1OvenGlow',{opacity:.55});gsap.set('#s1Wash',{opacity:.3});
 gsap.set('#s1Oven',{x:0});gsap.set('#s1Flick',{opacity:1});
 gsap.set('.s1p',{opacity:0,x:0,y:0});
 gsap.set('.s1pA,.s1pB',{attr:{r:10}});gsap.set('.s1pW',{attr:{r:5}});
 render();replayBtn.textContent='↺ 0.0s';
}
function puff(sel,t,r0,r1,dy,dur){
 sceneTl.fromTo(sel,{opacity:0,y:0,x:0,attr:{r:r0}},{opacity:.6,y:-30,attr:{r:r0*2.2},duration:.25,ease:'power2.out',stagger:.07,immediateRender:false},t)
  .to(sel,{y:dy,x:i=>i%2?16:-12,attr:{r:r1},opacity:0,duration:dur,ease:'sine.out',stagger:.07},t+.25);
}
function playScene1(){
 resetScene1ToStart();
 sceneTl=gsap.timeline({
  onUpdate:()=>{render();replayBtn.textContent=`↺ ${sceneTl.time().toFixed(1)}s`;},
  onComplete:()=>replayBtn.textContent='↺ 6.0s'
 });
 // camera slow push-in (whole scene)
 sceneTl.to('#s1Camera',{scale:1.06,svgOrigin:'260 530',duration:6.0,ease:'power1.inOut'},0);
 // 0.0-1.5s: calm, oven glows, baker sleepy-nods
 sceneTl.to(st,{head:13,duration:1.3,ease:'sine.inOut'},0.1);
 sceneTl.to('#s1Flick',{opacity:.78,duration:.45,yoyo:true,repeat:12,ease:'sine.inOut'},0);
 // 1.5s: oven door pops open with a bang + smoke puff
 sceneTl.call(playOvenDoor,null,1.5);
 sceneTl.to(st,{door:.16,duration:.12,ease:'power4.out'},1.5);
 sceneTl.to(st,{door:.22,duration:.35,ease:'back.out(2)'},1.62);
 sceneTl.fromTo('#s1OpenGlow',{opacity:0},{opacity:1,duration:.12,immediateRender:false},1.5);
 sceneTl.to('#s1OvenGlow',{opacity:.95,duration:.4},1.5);
 sceneTl.to('#s1Wash',{opacity:.55,duration:.5},1.5);
 sceneTl.fromTo('#s1Oven',{x:0},{x:3,duration:.04,yoyo:true,repeat:5,ease:'sine.inOut',immediateRender:false},1.5);
 sceneTl.call(playSmoke,null,1.55);
 puff('.s1pA',1.55,10,40,-120,1.2);
 // 2.7s: baker reacts - deadpan eyes open, head lifts
 sceneTl.set('#s1FG',{opacity:0},2.7).set('#s1FO',{opacity:1},2.7);
 sceneTl.to('.eo',{attr:{r:3.2},duration:.1,yoyo:true,repeat:1},2.7);
 sceneTl.to(st,{head:0,duration:.3,ease:'power2.out'},2.7);
 // 3.0s + 3.45s: two footsteps toward the oven
 [[3.0,225],[3.45,258]].forEach(([t,x])=>{
  sceneTl.to(st,{x:x,duration:.4,ease:'power1.out'},t)
   .to(st,{stride:9,duration:.2,yoyo:true,repeat:1,ease:'sine.inOut'},t)
   .to(st,{bob:-2,duration:.2,yoyo:true,repeat:1,ease:'sine.inOut'},t)
   .call(playStep,null,t);
 });
 sceneTl.call(()=>{st.stride=0;st.bob=0;render();},null,3.88);
 // 3.45s: arm reaches into the oven
 sceneTl.to(st,{arm:1,duration:.5,ease:'power2.out'},3.45);
 // 4.0s: pulls out the burnt loaf + smoke puff
 sceneTl.set('#s1Loaf',{opacity:1},4.0);
 sceneTl.to(st,{arm:2,duration:.55,ease:'power2.inOut'},4.0);
 sceneTl.call(playSmoke,null,4.0);
 puff('.s1pB',4.0,10,34,-100,1.2);
 // 4.5s: loaf wisps rise
 puff('.s1pW',4.5,5,12,-60,1.0);
 // 5.0s: turns to camera, deadpan hold (loop point)
 sceneTl.set('#s1FO',{opacity:0},5.0).set('#s1FF',{opacity:1},5.0).set('#s1HeadRim',{attr:{cx:0}},5.0);
 sceneTl.to(st,{head:-4,duration:.6,ease:'sine.inOut'},5.1);
}
playBtn.addEventListener('click',()=>{initAudio();playScene1();});
replayBtn.addEventListener('click',()=>{resetScene1ToStart();});
soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;soundBtn.textContent='🔊 Sound: '+(soundEnabled?'ON':'OFF');if(soundEnabled)initAudio();});
window.addEventListener('load',()=>{resetScene1ToStart();setTimeout(playScene1,250);});
</script>
</body></html>
