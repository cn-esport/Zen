<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — Okage Mairi Scene 3: Roadside Kindness (12.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(252,211,77,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(252,211,77,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style>
</head>

<div class="controls">
  <button id="playBtn" class="primary">▶ Play (12.0s)</button>
  <button id="replayBtn">↺ 0.0s</button>
  <button id="soundBtn">🔊 Sound: ON</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const playBtn = $('playBtn'), replayBtn = $('replayBtn'), soundBtn = $('soundBtn');

// ---------- PROCEDURAL WEB AUDIO FOLEY ----------
let audioCtx = null, soundEnabled = true;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Low-in-mix dirt footsteps as traveler slows down
function playSoftStep(vol = 0.048) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(98, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.095);
}

// Soft ceramic bowl clink (delicate high bell-like porcelain resonance)
function playCeramicClink() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;

  const partials = [
    { freq: 2180, gain: 0.085, dur: 0.24 },
    { freq: 3490, gain: 0.045, dur: 0.16 },
    { freq: 5120, gain: 0.022, dur: 0.09 }
  ];

  partials.forEach(p => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(p.freq, t);
    osc.frequency.exponentialRampToValueAtTime(p.freq * 0.985, t + p.dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(p.gain, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + p.dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + p.dur + 0.02);
  });
}

// 12.0s Ambient Layer: Faint lantern fire crackle + warm quiet murmur + warmer harmonic music
function playScene3Ambience(dur = 11.9) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;

  // 1. Faint lantern fire crackle (sparse micro-pops over 12s)
  const crackleCount = 26;
  for (let i = 0; i < crackleCount; i++) {
    const offset = 0.2 + Math.random() * (dur - 0.5);
    const popTime = t + offset;
    const popDur = 0.018 + Math.random() * 0.02;
    const n = Math.floor(audioCtx.sampleRate * popDur);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let j = 0; j < n; j++) d[j] = (Math.random() * 2 - 1) * Math.exp(-j / (n * 0.35));

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1800 + Math.random() * 1400;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.018 + Math.random() * 0.016, popTime);
    g.gain.exponentialRampToValueAtTime(0.0001, popTime + popDur);
    src.connect(hp).connect(g).connect(audioCtx.destination);
    src.start(popTime);
  }

  // 2. Warm, quiet murmur of distant voices (low-mid modulated formant hum)
  const mLen = Math.floor(audioCtx.sampleRate * dur);
  const mBuf = audioCtx.createBuffer(1, mLen, audioCtx.sampleRate);
  const mData = mBuf.getChannelData(0);
  for (let i = 0; i < mLen; i++) {
    const sec = i / audioCtx.sampleRate;
    const mod = 0.5 + 0.5 * Math.sin(sec * 2.1) * Math.cos(sec * 3.7);
    mData[i] = (Math.random() * 2 - 1) * mod;
  }
  const mSrc = audioCtx.createBufferSource();
  mSrc.buffer = mBuf;
  const mFilter = audioCtx.createBiquadFilter();
  mFilter.type = 'bandpass';
  mFilter.frequency.value = 360;
  mFilter.Q.value = 3.5;
  const mGain = audioCtx.createGain();
  mGain.gain.setValueAtTime(0.0001, t);
  mGain.gain.linearRampToValueAtTime(0.024, t + 1.8);
  mGain.gain.linearRampToValueAtTime(0.02, t + dur - 0.8);
  mGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  mSrc.connect(mFilter).connect(mGain).connect(audioCtx.destination);
  mSrc.start(t);

  // 3. Warmer musical pad swell (F major 9th / warm fifths: F2, C3, A3, E4)
  const chord = [
    { freq: 87.31, type: 'sine',     peak: 0.045, start: 0.0 },  // F2
    { freq: 130.81, type: 'triangle', peak: 0.032, start: 0.4 }, // C3
    { freq: 220.00, type: 'sine',     peak: 0.026, start: 2.2 }, // A3 (warm major 3rd enters)
    { freq: 329.63, type: 'sine',     peak: 0.016, start: 4.5 }  // E4 (gentle warmth)
  ];

  chord.forEach(note => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = note.type;
    osc.frequency.setValueAtTime(note.freq, t + note.start);
    gain.gain.setValueAtTime(0.0001, t + note.start);
    gain.gain.linearRampToValueAtTime(note.peak, t + note.start + 2.4);
    gain.gain.linearRampToValueAtTime(note.peak * 0.9, t + dur - 1.2);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t + note.start);
    osc.stop(t + dur + 0.05);
  });
}

// ---------- RIG STATE ----------
const st = {
  travX: 120,
  travStride: 0,
  travBob: 0,
  travHead: 2,
  travArm: 0,    // 0 = walking swing, 1 = reaching out for bowl, 2 = holding bowl
  vilOffer: 0,   // 0 = holding near chest, 1 = extended toward traveler, 2 = hands resting after handoff
  vilHead: -3,
  bowlMode: 0,   // 0 = carried by villager, 1 = held by traveler
  bgWalk: 0
};

const lerp = (a, b, t) => a + (b - a) * t;

function render() {
  // Traveler position & legs
  $('s3Traveler').setAttribute('transform', `translate(${st.travX.toFixed(1)},${(785 + st.travBob).toFixed(1)})`);
  $('s3TravHead').setAttribute('transform', `translate(1,-130) rotate(${st.travHead.toFixed(2)})`);
  $('s3TravLegF').setAttribute('transform', `translate(4,-50) rotate(${st.travStride.toFixed(2)})`);
  $('s3TravLegB').setAttribute('transform', `translate(-4,-50) rotate(${(-st.travStride).toFixed(2)})`);

  // Traveler front arm interpolation: Idle/Walk -> Reach -> Hold Bowl
  let tEx, tEy, tHx, tHy;
  if (st.travArm <= 1) {
    tEx = lerp(10 - st.travStride * 0.35, 28, st.travArm);
    tEy = lerp(-78, -84, st.travArm);
    tHx = lerp(13 - st.travStride * 0.8, 52, st.travArm);
    tHy = lerp(-57, -83, st.travArm);
  } else {
    const k = st.travArm - 1;
    tEx = lerp(28, 22, k);
    tEy = lerp(-84, -81, k);
    tHx = lerp(52, 36, k);
    tHy = lerp(-83, -81, k);
  }
  $('s3TravArmF').setAttribute('d', `M 3 -100 L ${tEx.toFixed(1)} ${tEy.toFixed(1)} L ${tHx.toFixed(1)} ${tHy.toFixed(1)}`);

  // Villager head & offering arms
  $('s3VilHead').setAttribute('transform', `translate(-1,-130) rotate(${st.vilHead.toFixed(2)})`);
  let vEx, vEy, vHx, vHy;
  if (st.vilOffer <= 1) {
    vEx = lerp(-15, -26, st.vilOffer);
    vEy = lerp(-83, -85, st.vilOffer);
    vHx = lerp(-30, -54, st.vilOffer);
    vHy = lerp(-82, -83, st.vilOffer);
  } else {
    const k = st.vilOffer - 1;
    vEx = lerp(-26, -12, k);
    vEy = lerp(-85, -78, k);
    vHx = lerp(-54, -14, k);
    vHy = lerp(-83, -58, k);
  }
  $('s3VilArmF').setAttribute('d', `M -3 -100 L ${vEx.toFixed(1)} ${vEy.toFixed(1)} L ${vHx.toFixed(1)} ${vHy.toFixed(1)}`);
  $('s3VilArmB').setAttribute('d', `M 6 -100 L ${(vEx + 6).toFixed(1)} ${(vEy - 1).toFixed(1)} L ${(vHx + 4).toFixed(1)} ${(vHy - 1).toFixed(1)}`);

  // Bowl position follows either villager's hand or traveler's hand
  let bowlX, bowlY;
  if (st.bowlMode < 0.5) {
    bowlX = 338 + vHx - 6;
    bowlY = 785 + vHy;
  } else {
    bowlX = st.travX + tHx + 6;
    bowlY = 785 + st.travBob + tHy;
  }
  $('s3Bowl').setAttribute('transform', `translate(${bowlX.toFixed(1)},${bowlY.toFixed(1)})`);

  // Subtle distant background pilgrims drifting slowly left-to-right
  $('s3BgP1').setAttribute('transform', `translate(${(60 + st.bgWalk).toFixed(1)}, 745) scale(0.42)`);
  $('s3BgP2').setAttribute('transform', `translate(${(15 + st.bgWalk * 0.85).toFixed(1)}, 748) scale(0.36)`);
}

// ---------- TIMELINE (12.0s) ----------
let sceneTl = null;

function resetScene3ToStart() {
  if (sceneTl) { sceneTl.kill(); sceneTl = null; }
  Object.assign(st, {
    travX: 120,
    travStride: 0,
    travBob: 0,
    travHead: 2,
    travArm: 0,
    vilOffer: 0,
    vilHead: -3,
    bowlMode: 0,
    bgWalk: 0
  });
  gsap.set('#s3Camera', { scale: 1, svgOrigin: '270 660' });
  gsap.set('#s3LanternHalo', { opacity: 0.82 });
  gsap.set('#s3LanternFlame', { scale: 1, transformOrigin: '272px 764px' });
  gsap.set('#s3ClinkR1, #s3ClinkR2', { attr: { r: 3 }, opacity: 0 });
  gsap.set('.s3Steam', { opacity: 0, y: 0, x: 0 });
  gsap.set('.s3Spark', { opacity: 0, y: 0, x: 0 });
  render();
  replayBtn.textContent = '↺ 0.0s';
}

function playScene3() {
  resetScene3ToStart();
  sceneTl = gsap.timeline({
    onUpdate: () => {
      render();
      replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
    },
    onComplete: () => replayBtn.textContent = '↺ 12.0s'
  });

  // 0.00s - 12.00s: Slow cinematic camera push-in centered between villager, lantern & traveler
  sceneTl.to('#s3Camera', { scale: 1.06, svgOrigin: '270 670', duration: 12.0, ease: 'power1.inOut' }, 0);

  // 0.00s: Warm music, fire crackle, and distant murmur begin
  sceneTl.call(() => playScene3Ambience(11.9), null, 0.02);

  // Continuous gentle lantern flame flicker & rising ember sparks
  sceneTl.to('#s3LanternHalo', { opacity: 0.96, duration: 0.65, yoyo: true, repeat: 17, ease: 'sine.inOut' }, 0);
  sceneTl.to('#s3LanternFlame', { scaleY: 1.14, scaleX: 0.92, duration: 0.45, yoyo: true, repeat: 25, ease: 'sine.inOut' }, 0);
  sceneTl.fromTo('.s3Spark',
    { opacity: 0, y: 0, x: 0 },
    { opacity: 0.85, y: -38, x: i => (i % 2 ? 7 : -6), duration: 2.2, stagger: 0.9, repeat: 3, ease: 'sine.out', immediateRender: false },
    0.5
  );

  // Distant pilgrims walk slowly in the background
  sceneTl.to(st, { bgWalk: 145, duration: 12.0, ease: 'none' }, 0);

  // Continuous warm steam rising from the bowl
  sceneTl.fromTo('.s3Steam',
    { opacity: 0, y: 0, x: 0 },
    { opacity: 0.65, y: -26, x: i => (i % 2 ? 6 : -5), duration: 2.4, stagger: 0.5, repeat: 3, ease: 'sine.out', immediateRender: false },
    0.3
  );

  // 0.00s - 2.60s: Traveler walks up quietly along the road and stops before the ember lantern
  const steps = [
    [0.10, 144, 8.0],
    [0.68, 168, -8.0],
    [1.26, 192, 7.0],
    [1.84, 214, -5.5]
  ];
  steps.forEach(([t, targetX, strideVal]) => {
    sceneTl.call(() => playSoftStep(0.045), null, t)
      .to(st, { travX: targetX, duration: 0.54, ease: 'power1.out' }, t)
      .to(st, { travStride: strideVal, duration: 0.27, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t)
      .to(st, { travBob: -1.8, duration: 0.27, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t);
  });
  sceneTl.call(() => { st.travStride = 0; st.travBob = 0; render(); }, null, 2.42);

  // 2.60s - 4.40s: Villager leans head slightly in a warm nod and extends the ceramic bowl forward
  sceneTl.to(st, { vilHead: -9, duration: 0.65, ease: 'sine.inOut' }, 2.6);
  sceneTl.to(st, { vilHead: -3, duration: 0.65, ease: 'sine.inOut' }, 3.35);
  sceneTl.to(st, { vilOffer: 1, duration: 1.15, ease: 'power2.out' }, 2.75);

  // 3.50s - 4.85s: Traveler reaches out to receive the bowl over the warm lantern
  sceneTl.to(st, { travHead: 7, duration: 0.6, ease: 'sine.inOut' }, 3.5);
  sceneTl.to(st, { travArm: 1, duration: 1.05, ease: 'power2.out' }, 3.7);

  // 4.80s: Hands meet at the bowl -> soft ceramic bowl clink + warm ripple
  sceneTl.call(playCeramicClink, null, 4.8);
  sceneTl.fromTo('#s3ClinkR1', { attr: { r: 3 }, opacity: 0.65 }, { attr: { r: 24 }, opacity: 0, duration: 0.7, ease: 'power2.out', immediateRender: false }, 4.8);
  sceneTl.fromTo('#s3ClinkR2', { attr: { r: 3 }, opacity: 0.45 }, { attr: { r: 36 }, opacity: 0, duration: 0.85, ease: 'power2.out', immediateRender: false }, 4.88);

  // 5.10s - 6.80s: Bowl transfers smoothly to traveler; villager lowers arms calmly
  sceneTl.set(st, { bowlMode: 1 }, 5.1);
  sceneTl.to(st, { travArm: 2, duration: 1.2, ease: 'power2.inOut' }, 5.15);
  sceneTl.to(st, { vilOffer: 2, duration: 1.3, ease: 'power2.inOut' }, 5.25);

  // 7.20s - 12.00s: Traveler gives a grateful deadpan nod, holds warm bowl by the ember lantern
  sceneTl.to(st, { travHead: 10, duration: 0.7, ease: 'sine.inOut' }, 7.2);
  sceneTl.to(st, { travHead: 3, duration: 0.8, ease: 'sine.inOut' }, 8.1);
  sceneTl.to(st, { vilHead: -6, duration: 1.2, ease: 'sine.inOut' }, 8.5);
}

playBtn.addEventListener('click', () => { initAudio(); playScene3(); });
replayBtn.addEventListener('click', () => { resetScene3ToStart(); });
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = '🔊 Sound: ' + (soundEnabled ? 'ON' : 'OFF');
  if (soundEnabled) initAudio();
});

window.addEventListener('load', () => {
  resetScene3ToStart();
  setTimeout(playScene3, 250);
});
</script>
</body>
</html>
