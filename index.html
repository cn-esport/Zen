<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — The Quiet Departure Scene 1: Sliding Door (5.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(252,211,77,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(252,211,77,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style></head>
<body>
<div class="stage-wrapper">
<div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="s1TealWall" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#060d10"/>
  <stop offset="0.55" stop-color="#0a191e"/>
  <stop offset="1" stop-color="#0e2228"/>
 </linearGradient>
 <linearGradient id="s1WoodFloor" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0d1318"/>
  <stop offset="1" stop-color="#040609"/>
 </linearGradient>
 <linearGradient id="s1EmberDoor" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#f97316"/>
  <stop offset="0.45" stop-color="#ea580c"/>
  <stop offset="1" stop-color="#7c2d12"/>
 </linearGradient>
 <linearGradient id="s1LightBeam" x1="1" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fb923c" stop-opacity=".28"/>
  <stop offset="0.6" stop-color="#f59e0b" stop-opacity=".1"/>
  <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="s1DoorGlow">
  <stop offset="0" stop-color="#fdba74" stop-opacity=".75"/>
  <stop offset="0.4" stop-color="#ea580c" stop-opacity=".35"/>
  <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
 </radialGradient>
</defs>

<g id="s1Camera">
 <!-- dark teal interior wall + wooden floor -->
 <rect x="0" y="0" width="540" height="788" fill="url(#s1TealWall)"/>
 <rect x="0" y="785" width="540" height="175" fill="url(#s1WoodFloor)"/>
 <!-- subtle wall & floor lines -->
 <line x1="0" y1="785" x2="540" y2="785" stroke="#162a30" stroke-width="3"/>
 <g stroke="#090e13" stroke-width="2">
  <line x1="0" y1="825" x2="540" y2="825"/>
  <line x1="0" y1="875" x2="540" y2="875"/>
  <line x1="0" y1="930" x2="540" y2="930"/>
 </g>

 <!-- right side sliding door (shoji / timber frame) with warm ember glow -->
 <circle id="s1EmberAura" cx="445" cy="560" r="260" fill="url(#s1DoorGlow)" opacity=".65"/>
 <rect x="374" y="310" width="146" height="475" fill="#090d10" stroke="#172429" stroke-width="4"/>
 <rect x="382" y="318" width="130" height="467" fill="url(#s1EmberDoor)" opacity=".88"/>
 <!-- sliding door lattice -->
 <g stroke="#1a120d" stroke-width="3" opacity=".7">
  <line x1="425" y1="318" x2="425" y2="785"/>
  <line x1="468" y1="318" x2="468" y2="785"/>
  <line x1="382" y1="415" x2="512" y2="415"/>
  <line x1="382" y1="515" x2="512" y2="515"/>
  <line x1="382" y1="615" x2="512" y2="615"/>
  <line x1="382" y1="710" x2="512" y2="710"/>
 </g>
 <!-- sliding panel moving slightly open -->
 <g id="s1SlidingPanel" transform="translate(0,0)">
  <rect x="378" y="314" width="68" height="471" fill="#0d1418" stroke="#1f3138" stroke-width="3"/>
  <rect x="434" y="535" width="6" height="36" rx="2" fill="#9a3412"/>
 </g>

 <!-- thin beam of warm light across the floor -->
 <polygon id="s1FloorBeam" points="382,318 485,318 220,795 95,795" fill="url(#s1LightBeam)" opacity=".85"/>

 <!-- floating dust motes in the light beam -->
 <g fill="#fde68a">
  <circle class="s1Dust" cx="250" cy="520" r="2.2" opacity=".35"/>
  <circle class="s1Dust" cx="295" cy="460" r="1.7" opacity=".28"/>
  <circle class="s1Dust" cx="330" cy="580" r="2.5" opacity=".32"/>
  <circle class="s1Dust" cx="215" cy="640" r="1.8" opacity=".25"/>
  <circle class="s1Dust" cx="355" cy="430" r="2" opacity=".3"/>
  <circle class="s1Dust" cx="270" cy="700" r="2.3" opacity=".28"/>
 </g>

 <!-- servant character (left of center, simple kimono silhouette) -->
 <g id="s1Char">
  <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".9"/>
  <!-- back & front legs inside kimono -->
  <g id="s1LegB" transform="translate(-4,-46)">
   <path d="M 0 0 L -2 24 L -3 43" stroke="#08070c" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <path d="M -7 41 L 9 41 L 10 46 L -8 46 Z" fill="#08070c"/>
  </g>
  <g id="s1LegF" transform="translate(4,-46)">
   <path d="M 0 0 L 2 24 L 3 43" stroke="#0d0b12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <path d="M -2 41 L 13 41 L 14 46 L -3 46 Z" class="hd"/>
  </g>

  <!-- kimono torso + wide sleeves -->
  <g id="s1TorsoGroup">
   <!-- warm rim light behind kimono -->
   <path id="s1KimonoRim" d="M -13.5 -104 L 15.5 -104 L 23 -18 L -19 -18 Z" fill="#fcd34d" opacity=".42"/>
   <!-- simple kimono body -->
   <path d="M -15 -104 L 14 -104 L 21 -18 L -20 -18 Z" fill="#131c22"/>
   <!-- sash / obi -->
   <rect x="-16" y="-66" width="31" height="10" rx="2" fill="#090d10"/>
   <!-- wide kimono sleeve silhouette -->
   <path id="s1Sleeve" d="M -4 -98 L 14 -82 L 22 -52 L 8 -48 L 2 -74 Z" fill="#162128"/>
  </g>

  <!-- arm holding/lowering broom -->
  <path id="s1Arm" d="M 3 -98 L 16 -76 L 24 -56" stroke="#0d0b12" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- head (r=22, rim light, minimal face, no nose/ears) -->
  <g id="s1Head" transform="translate(0,-128) rotate(8)">
   <circle id="s1HeadRim" cx="-1.6" cy="0" r="22" fill="#fcd34d" opacity=".48"/>
   <circle cx="0" cy="0" r="22" class="hd"/>
   <!-- simple topknot / servant hair tie -->
   <circle cx="-4" cy="-23" r="6" class="hd"/>
   <!-- face looking right -->
   <g id="s1FaceRight">
    <circle class="fc" cx="11" cy="-2" r="2.1"/>
    <circle class="fc" cx="18.5" cy="-2" r="2.1"/>
    <line class="fs" x1="10" y1="7" x2="16" y2="7" stroke-width="1.8"/>
   </g>
   <!-- face looking toward camera/doorway -->
   <g id="s1FaceFront" opacity="0">
    <circle class="fc" cx="7" cy="-2" r="2.1"/>
    <circle class="fc" cx="14.5" cy="-2" r="2.1"/>
    <line class="fs" x1="6" y1="7" x2="12" y2="7" stroke-width="1.8"/>
   </g>
  </g>
 </g>

 <!-- long broom (starts in hand, then leans against wall in foreground) -->
 <g id="s1Broom" transform="translate(214,729) rotate(0)">
  <!-- handle -->
  <line x1="0" y1="0" x2="0" y2="-250" stroke="#261d17" stroke-width="6.5" stroke-linecap="round"/>
  <!-- straw bristles -->
  <path d="M -14 0 L 14 0 L 22 56 L -22 56 Z" fill="#1c1612"/>
  <g stroke="#36291e" stroke-width="1.5">
   <line x1="-10" y1="4" x2="-15" y2="54"/>
   <line x1="-3" y1="4" x2="-5" y2="54"/>
   <line x1="4" y1="4" x2="5" y2="54"/>
   <line x1="11" y1="4" x2="15" y2="54"/>
  </g>
  <!-- twine binding -->
  <rect x="-15" y="-4" width="30" height="7" rx="2" fill="#5c4632"/>
 </g>
</g>
</svg>
</div>
<div class="controls">
 <button id="playBtn" class="primary">▶ Play (5.0s)</button>
 <button id="replayBtn">↺ 0.0s</button>
 <button id="soundBtn">🔊 Sound: ON</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const playBtn=$('playBtn'),replayBtn=$('replayBtn'),soundBtn=$('soundBtn');

// ---------- PROCEDURAL WEB AUDIO FOLEY ----------
let audioCtx=null,soundEnabled=true;
function initAudio(){
 if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
}
function tone(type,f0,f1,d,g){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,type,f,q,g,att){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();
 s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);
}

// 0:00 soft wooden knock when broom is set down
function playSoftWoodKnock(){
 tone('triangle',155,58,.09,.12);
 noise(.08,'bandpass',920,2.2,.06,.004);
}
// 0:02 quiet footsteps on wood
function playQuietWoodStep(){
 tone('triangle',115,44,.075,.075);
 noise(.06,'lowpass',480,1.2,.03,.005);
}
// 0:02 sliding door sound
function playSlidingDoor(){
 noise(.75,'bandpass',380,3.2,.055,.12);
 tone('sine',120,96,.7,.025);
}
// soft wind + low drone fading in
function playAmbientBed(){
 noise(4.9,'bandpass',260,2.5,.028,.8);
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type='sine';o.frequency.setValueAtTime(64,t);o.frequency.linearRampToValueAtTime(72,t+4.8);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.035,t+2.2);g.gain.exponentialRampToValueAtTime(.0001,t+4.95);
 o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+5.0);
}

// ---------- RIG STATE ----------
const st={x:190,bob:0,head:8,stride:0,arm:0,broomX:214,broomY:729,broomRot:0,doorSlide:0,charOpacity:1};
const ARM_UP={e:[16,-76],h:[24,-56]};
const ARM_LOW={e:[22,-66],h:[26,-46]};
const ARM_WALK={e:[12,-78],h:[18,-62]};
const lerp=(a,b,t)=>a+(b-a)*t;

function getArmPose(a){
 if(a<=1)return{e:[lerp(ARM_UP.e[0],ARM_LOW.e[0],a),lerp(ARM_UP.e[1],ARM_LOW.e[1],a)],h:[lerp(ARM_UP.h[0],ARM_LOW.h[0],a),lerp(ARM_UP.h[1],ARM_LOW.h[1],a)]};
 return{e:[lerp(ARM_LOW.e[0],ARM_WALK.e[0],a-1),lerp(ARM_LOW.e[1],ARM_WALK.e[1],a-1)],h:[lerp(ARM_LOW.h[0],ARM_WALK.h[0],a-1),lerp(ARM_LOW.h[1],ARM_WALK.h[1],a-1)]};
}

function render(){
 const p=getArmPose(st.arm);
 $('s1Char').setAttribute('transform',`translate(${st.x},${785+st.bob})`);
 gsap.set('#s1Char',{opacity:st.charOpacity});
 $('s1Head').setAttribute('transform',`translate(0,-128) rotate(${st.head})`);
 $('s1LegF').setAttribute('transform',`translate(4,-46) rotate(${st.stride})`);
 $('s1LegB').setAttribute('transform',`translate(-4,-46) rotate(${-st.stride})`);
 $('s1Arm').setAttribute('d',`M 3 -98 L ${p.e[0]} ${p.e[1]} L ${p.h[0]} ${p.h[1]}`);
 $('s1Broom').setAttribute('transform',`translate(${st.broomX},${st.broomY}) rotate(${st.broomRot})`);
 $('s1SlidingPanel').setAttribute('transform',`translate(${st.doorSlide},0)`);
}

// ---------- TIMELINE (5.0s) ----------
let sceneTl=null;
function resetScene1ToStart(){
 if(sceneTl){sceneTl.kill();sceneTl=null;}
 Object.assign(st,{x:190,bob:0,head:8,stride:0,arm:0,broomX:214,broomY:729,broomRot:0,doorSlide:0,charOpacity:1});
 gsap.set('#s1Camera',{scale:1,x:0,y:0,svgOrigin:'290 560'});
 gsap.set('#s1FaceRight',{opacity:1});gsap.set('#s1FaceFront',{opacity:0});
 gsap.set('#s1HeadRim',{attr:{cx:-1.6}});
 gsap.set('#s1EmberAura',{opacity:.65});gsap.set('#s1FloorBeam',{opacity:.85});
 gsap.set('.s1Dust',{x:0,y:0});
 render();
 replayBtn.textContent='↺ 0.0s';
}

function playScene1(){
 resetScene1ToStart();
 sceneTl=gsap.timeline({
  onUpdate:()=>{render();replayBtn.textContent=`↺ ${sceneTl.time().toFixed(1)}s`;},
  onComplete:()=>replayBtn.textContent='↺ 5.0s'
 });

 // ambient wind + drone fade-in
 sceneTl.call(playAmbientBed,null,0.05);

 // very slow push-in toward doorway
 sceneTl.to('#s1Camera',{scale:1.05,x:-12,y:-6,svgOrigin:'320 560',duration:5.0,ease:'power1.inOut'},0);

 // subtle drifting dust motes through light beam
 sceneTl.to('.s1Dust',{x:-18,y:-24,duration:5.0,ease:'sine.inOut',stagger:{each:.25,repeat:-1,yoyo:true}},0);

 // 0:00 - servant holds long broom upright, head slightly bowed + soft wooden knock as broom is set down
 sceneTl.call(playSoftWoodKnock,null,0.05);
 sceneTl.to(st,{broomRot:-6,duration:.35,ease:'power2.out'},0.05);
 sceneTl.to(st,{broomRot:-4,duration:.3,ease:'sine.inOut'},0.40);

 // 0:01 - slowly lowers broom and leans it against wall (tilts slightly and settles)
 sceneTl.to(st,{arm:1,head:11,duration:.85,ease:'power2.inOut'},1.0);
 sceneTl.to(st,{broomX:236,broomY:732,broomRot:-19,duration:.85,ease:'power2.inOut'},1.0);
 sceneTl.to(st,{broomRot:-17.5,duration:.25,ease:'sine.out'},1.85);

 // 0:02 - straightens up, turns toward glowing door, quiet footsteps + door slides
 sceneTl.to(st,{head:0,bob:-2,arm:2,duration:.45,ease:'power2.out'},2.05);
 sceneTl.set('#s1FaceRight',{opacity:0},2.2).set('#s1FaceFront',{opacity:1},2.2).set('#s1HeadRim',{attr:{cx:1.6}},2.2);
 sceneTl.call(playSlidingDoor,null,2.25);
 sceneTl.to(st,{doorSlide:26,duration:.85,ease:'power2.inOut'},2.25);

 // 0:03 - walks slowly and steadily to doorway, shoulders relaxed, no looking back
 [[2.35,232],[2.85,276],[3.35,322],[3.85,366]].forEach(([t,targetX])=>{
  sceneTl.to(st,{x:targetX,duration:.48,ease:'power1.inOut'},t)
   .to(st,{stride:7.5,duration:.24,yoyo:true,repeat:1,ease:'sine.inOut'},t)
   .to(st,{bob:-1.5,duration:.24,yoyo:true,repeat:1,ease:'sine.inOut'},t)
   .call(playQuietWoodStep,null,t);
 });
 sceneTl.call(()=>{st.stride=0;st.bob=0;render();},null,4.34);

 // 0:04 - steps into the light and becomes a thin dark outline
 sceneTl.to(st,{x:406,charOpacity:0.28,duration:.65,ease:'power2.in'},4.25);
 sceneTl.to('#s1EmberAura',{opacity:.92,duration:.65,ease:'sine.inOut'},4.25);
 sceneTl.to('#s1FloorBeam',{opacity:1,duration:.65,ease:'sine.inOut'},4.25);
}

playBtn.addEventListener('click',()=>{initAudio();playScene1();});
replayBtn.addEventListener('click',()=>{resetScene1ToStart();});
soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;soundBtn.textContent='🔊 Sound: '+(soundEnabled?'ON':'OFF');if(soundEnabled)initAudio();});
window.addEventListener('load',()=>{resetScene1ToStart();setTimeout(playScene1,250);});
</script>
</body></html>
