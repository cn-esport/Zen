<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — The Crossroads Scene 4: Shadows Pass (6.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#22d3ee}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(34,211,238,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(34,211,238,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style></head>
<body>
<div class="stage-wrapper">
<div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="s4Sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04060c"/><stop offset=".55" stop-color="#081018"/><stop offset="1" stop-color="#0e1a22"/></linearGradient>
 <linearGradient id="s4Road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1218"/><stop offset="1" stop-color="#04060c"/></linearGradient>
 <radialGradient id="s4FogG"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset=".5" stop-color="#0e7490" stop-opacity=".12"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
 <radialGradient id="s4EmberG"><stop offset="0" stop-color="#fef08a" stop-opacity="1"/><stop offset=".35" stop-color="#f59e0b" stop-opacity=".6"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></radialGradient>
 <radialGradient id="s4Vig"><stop offset=".4" stop-color="#04060c" stop-opacity="0"/><stop offset="1" stop-color="#04060c" stop-opacity=".8"/></radialGradient>
 <filter id="s4Blur"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g id="s4Camera">
 <!-- sky + distant haze -->
 <rect x="0" y="0" width="540" height="960" fill="url(#s4Sky)"/>
 <circle cx="270" cy="640" r="380" fill="url(#s4FogG)" opacity=".55"/>
 <!-- far tree/telegraph silhouettes for depth -->
 <g fill="#04060c" opacity=".85">
  <path d="M 40 640 L 60 560 L 74 600 L 88 560 L 104 640 Z"/>
  <path d="M 430 640 L 450 566 L 462 604 L 478 560 L 496 640 Z"/>
  <rect x="256" y="470" width="6" height="180"/><path d="M 244 486 L 274 486 L 272 492 L 246 492 Z"/>
 </g>
 <!-- crossroads ground -->
 <rect x="0" y="620" width="540" height="340" fill="url(#s4Road)"/>
 <!-- fork roads -->
 <polygon points="270,620 150,960 390,960" fill="#0b141c" opacity=".9"/>
 <polygon points="0,660 540,660 540,700 0,700" fill="#0d1822" opacity=".75"/>
 <!-- cobble hints -->
 <g stroke="#1a2a36" stroke-width="1.5" opacity=".6">
  <line x1="80" y1="720" x2="140" y2="720"/><line x1="180" y1="760" x2="250" y2="760"/>
  <line x1="320" y1="800" x2="390" y2="800"/><line x1="120" y1="840" x2="200" y2="840"/>
  <line x1="360" y1="870" x2="440" y2="870"/>
 </g>
 <!-- fog bands (animated drift) -->
 <ellipse class="s4fog" cx="140" cy="700" rx="220" ry="40" fill="#22d3ee" opacity=".07"/>
 <ellipse class="s4fog" cx="400" cy="760" rx="260" ry="46" fill="#22d3ee" opacity=".06"/>
 <ellipse class="s4fog" cx="260" cy="820" rx="300" ry="52" fill="#22d3ee" opacity=".05"/>
 <!-- ember on the road (warm accent) -->
 <g id="s4Ember">
  <circle cx="360" cy="806" r="60" fill="url(#s4EmberG)" opacity=".8"/>
  <ellipse cx="360" cy="806" rx="7" ry="4" fill="#fef08a"/>
  <ellipse cx="360" cy="806" rx="3" ry="1.8" fill="#fff"/>
 </g>
 <!-- shadow streamers (two directions) -->
 <g id="s4ShadowsL" filter="url(#s4Blur)">
  <g class="sh" fill="#04060c" opacity=".9"><circle cx="0" cy="-140" r="20"/><path d="M -12 -122 L 12 -122 L 16 -40 L -16 -40 Z"/><path d="M -16 -40 L -20 40 L -8 40 L -6 -40 Z"/><path d="M 6 -40 L 8 40 L 20 40 L 16 -40 Z"/></g>
  <g class="sh" fill="#04060c" opacity=".8"><circle cx="0" cy="-140" r="20"/><path d="M -12 -122 L 12 -122 L 16 -40 L -16 -40 Z"/><path d="M -16 -40 L -20 40 L -8 40 L -6 -40 Z"/><path d="M 6 -40 L 8 40 L 20 40 L 16 -40 Z"/></g>
  <g class="sh" fill="#04060c" opacity=".7"><circle cx="0" cy="-140" r="20"/><path d="M -12 -122 L 12 -122 L 16 -40 L -16 -40 Z"/><path d="M -16 -40 L -20 40 L -8 40 L -6 -40 Z"/><path d="M 6 -40 L 8 40 L 20 40 L 16 -40 Z"/></g>
 </g>
 <g id="s4ShadowsR" filter="url(#s4Blur)">
  <g class="sh" fill="#04060c" opacity=".85"><circle cx="0" cy="-130" r="18"/><path d="M -11 -114 L 11 -114 L 14 -38 L -14 -38 Z"/><path d="M -14 -38 L -18 34 L -7 34 L -5 -38 Z"/><path d="M 5 -38 L 7 34 L 18 34 L 14 -38 Z"/></g>
  <g class="sh" fill="#04060c" opacity=".75"><circle cx="0" cy="-130" r="18"/><path d="M -11 -114 L 11 -114 L 14 -38 L -14 -38 Z"/><path d="M -14 -38 L -18 34 L -7 34 L -5 -38 Z"/><path d="M 5 -38 L 7 34 L 18 34 L 14 -38 Z"/></g>
 </g>
 <!-- HERO: standing still at crossroads, facing camera, teal rim -->
 <g id="s4Char" transform="translate(270,785)">
  <ellipse cx="0" cy="4" rx="34" ry="7" fill="#000" opacity=".9"/>
  <!-- legs (still, planted) -->
  <path d="M -6 -50 L -7 44" stroke="#08070c" stroke-width="11" stroke-linecap="round"/>
  <path d="M 6 -50 L 7 44" stroke="#0d0b12" stroke-width="11" stroke-linecap="round"/>
  <path d="M -13 44 L 2 44 L 3 50 L -14 50 Z" fill="#08070c"/>
  <path d="M 2 44 L 16 44 L 17 50 L 1 50 Z" class="hd"/>
  <!-- far arm -->
  <path d="M -12 -100 L -16 -76 L -12 -56" stroke="#18202c" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- coat with teal rim -->
  <path d="M -13 -108 L 14 -108 L 19 -26 L -17 -26 Z" fill="#22d3ee" opacity=".38" transform="translate(2,0)"/>
  <path d="M -13 -108 L 14 -108 L 19 -26 L -17 -26 Z" fill="#1e2330"/>
  <!-- coat seam lines -->
  <g stroke="#141a24" stroke-width="1.4"><line x1="0" y1="-104" x2="0" y2="-30"/><line x1="-9" y1="-70" x2="-14" y2="-34"/><line x1="10" y1="-70" x2="15" y2="-34"/></g>
  <!-- scarf accent (teal) -->
  <path d="M -12 -112 Q 0 -104 13 -112 L 13 -102 Q 0 -94 -12 -102 Z" fill="#0e7490"/>
  <path d="M 6 -102 L 14 -70 L 4 -70 L 0 -100 Z" fill="#155e75"/>
  <!-- front arm (still) -->
  <path d="M 3 -100 L 12 -78 L 16 -58" stroke="#0d0b12" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- head -->
  <g id="s4Head" transform="translate(2,-130)">
   <circle cx="1.8" cy="0" r="22" fill="#22d3ee" opacity=".5"/>
   <circle cx="0" cy="0" r="22" class="hd"/>
   <!-- tiny beanie -->
   <path d="M -18 -14 Q -18 -34 0 -34 Q 18 -34 18 -14 Z" fill="#0e7490"/>
   <rect x="-18" y="-16" width="36" height="4" fill="#155e75"/>
   <!-- eyes: calm open dots, deadpan -->
   <g id="s4Face">
    <circle class="fc" cx="-3" cy="0" r="2.2"/>
    <circle class="fc" cx="3.5" cy="0" r="2.2"/>
    <line class="fs" x1="-2" y1="8" x2="3" y2="8" stroke-width="1.8"/>
   </g>
  </g>
 </g>
 <!-- foreground fog wash -->
 <rect x="0" y="820" width="540" height="140" fill="#22d3ee" opacity=".04"/>
 <rect x="0" y="0" width="540" height="960" fill="url(#s4Vig)" opacity=".5"/>
</g>
</svg>
</div>
<div class="controls">
 <button id="playBtn" class="primary">▶ Play (6.0s)</button>
 <button id="replayBtn">↺ 0.0s</button>
 <button id="soundBtn">🔊 Sound: ON</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const playBtn=$('playBtn'),replayBtn=$('replayBtn'),soundBtn=$('soundBtn');

// ---------- AUDIO (procedural foley) ----------
let audioCtx=null,soundEnabled=true;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(type,f0,f1,d,g,att){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);
 if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);
 v.gain.setValueAtTime(.0001,t);
 v.gain.linearRampToValueAtTime(g,t+(att||.01));
 v.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,type,f,q,g,att){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();
 s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAt(.0001,t+d);
 s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);
}
// passing footstep: soft triangle thump
function playStep(pan){
 if(!audioCtx||!soundEnabled)return;
 tone('triangle',130,46,.09,.09);
 if(audioCtx.createStereoPanner){/* pan handled in beat timing, not per-call */}
}
// cold drone: low sine fading downward
function playColdDrone(dur){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();
 o.type='sine';o.frequency.setValueAtTime(55,t);o.frequency.exponentialRampToValueAtTime(38,t+dur);
 v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(.055,t+1.2);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02);
}
// deep slow heartbeat pulse (quiet)
function playPulse(){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();
 o.type='sine';o.frequency.setValueAtTime(58,t);o.frequency.exponentialRampToValueAtTime(42,t+.35);
 v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(.03,t+.05);v.gain.exponentialRampToValueAtTime(.0001,t+.55);
 o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+.6);
}
// thinning wind
function playWind(dur){
 if(!audioCtx||!soundEnabled)return;
 const t=audioCtx.currentTime,n=Math.floor(audioCtx.sampleRate*dur),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),fl=audioCtx.createBiquadFilter(),v=audioCtx.createGain();
 s.buffer=b;fl.type='bandpass';fl.frequency.value=260;fl.Q.value=2.4;
 v.gain.setValueAtTime(.02,t);v.gain.exponentialRampToValueAtTime(.004,t+dur);
 s.connect(fl).connect(v).connect(audioCtx.destination);s.start(t);
}

// ---------- RIG STATE ----------
const st={head:0,bob:0,armSwing:0,emberPulse:1};

function render(){
 const c=$('s4Char');
 c.setAttribute('transform',`translate(270,${785+st.bob})`);
 $('s4Head').setAttribute('transform',`translate(2,-130) rotate(${st.head})`);
}

// ---------- TIMELINE ----------
let sceneTl=null;

function resetScene4ToStart(){
 if(sceneTl){sceneTl.kill();sceneTl=null;}
 Object.assign(st,{head:0,bob:0,armSwing:0,emberPulse:1});
 gsap.set('#s4Camera',{scale:1,svgOrigin:'270 560'});
 gsap.set('#s4Char',{opacity:1});
 gsap.set('#s4Head',{rotation:0});
 gsap.set('.s4fog',{x:0,opacity:o=>o});
 gsap.set('.s4fog',{attr:{opacity:(i)=>[0.07,0.06,0.05][i]}});
 gsap.set('#s4Ember',{opacity:1});
 gsap.set('#s4Ember circle',{attr:{r:(i)=>i===0?60:(i===1?7:3)}});
 gsap.set('#s4ShadowsL .sh, #s4ShadowsR .sh',{opacity:(i,el)=>el.parentNode.id==='s4ShadowsL'?0.9-i*0.1:0.85-i*0.1});
 gsap.set('#s4ShadowsL',{x:-300,y:0,opacity:0});
 gsap.set('#s4ShadowsR',{x:300,y:0,opacity:0});
 gsap.set('#s4Face',{opacity:1});
 render();
 replayBtn.textContent='↺ 0.0s';
}

function playScene4(){
 resetScene4ToStart();
 sceneTl=gsap.timeline({
  onUpdate:()=>{render();replayBtn.textContent=`↺ ${sceneTl.time().toFixed(1)}s`;},
  onComplete:()=>replayBtn.textContent='↺ 6.0s'
 });

 // camera slow push-in, focus on hero
 sceneTl.to('#s4Camera',{scale:1.06,svgOrigin:'270 560',duration:6.0,ease:'power1.inOut'},0);

 // ambience from the start
 sceneTl.call(playColdDrone,null,0.0, [5.8]);
 sceneTl.call(playWind,null,0.0,[5.8]);

 // 0.0-1.0s: hero stands, fog drifts, ember glows
 sceneTl.to(st,{head:2,duration:1.2,ease:'sine.inOut'},0.0);
 sceneTl.to('.s4fog',{x:40,duration:6.0,ease:'sine.inOut'},0);
 sceneTl.to('#s4Ember',{opacity:.65,duration:.6,yoyo:true,repeat:9,ease:'sine.inOut'},0);

 // 0.0s: quiet heartbeat pulse, then every 2s (0.0, 2.0, 4.0)
 sceneTl.call(playPulse,null,0.0);
 sceneTl.call(playPulse,null,2.0);
 sceneTl.call(playPulse,null,4.0);

 // 0.6s-2.4s: shadows stream LEFT -> RIGHT (with footsteps)
 gsap.set('#s4ShadowsL',{x:-320,opacity:0});
 [0,0.18,0.36].forEach((delay,i)=>{
  const t0=0.6+delay;
  sceneTl.fromTo('#s4ShadowsL .sh',{x:-320-i*22,opacity:0.9-i*0.1},{x:560,opacity:0,duration:1.5,ease:'none',immediateRender:false},t0);
  sceneTl.call(playStep,null,t0+0.05+i*0.06);
  sceneTl.call(playStep,null,t0+0.45+i*0.06);
  sceneTl.call(playStep,null,t0+0.95+i*0.06);
 });

 // 2.8s-4.6s: shadows stream RIGHT -> LEFT (returning)
 [0,0.22].forEach((delay,i)=>{
  const t0=2.8+delay;
  sceneTl.fromTo('#s4ShadowsR .sh',{x:560+i*22,opacity:0.85-i*0.1},{x:-320,opacity:0,duration:1.6,ease:'none',immediateRender:false},t0);
  sceneTl.call(playStep,null,t0+0.1+i*0.06);
  sceneTl.call(playStep,null,t0+0.55+i*0.06);
  sceneTl.call(playStep,null,t0+1.1+i*0.06);
 });

 // 3.2s: hero's head turns slightly to follow one shadow (deadpan)
 sceneTl.to(st,{head:-6,duration:0.7,ease:'sine.inOut'},3.2);

 // 4.6s: warm accent drops — ember dims, fog thickens
 sceneTl.to('#s4Ember',{opacity:.4,duration:1.0,ease:'power1.out'},4.6);
 sceneTl.to('#s4Camera',{scale:1.075,duration:1.4,ease:'power1.inOut'},4.6);

 // 5.0s: hero returns to face camera deadpan hold (loop point)
 sceneTl.to(st,{head:0,duration:0.8,ease:'sine.inOut'},5.0);

 // 5.6s: final ember flicker, held still
 sceneTl.to('#s4Ember',{opacity:.5,duration:.4,yoyo:true,repeat:1,ease:'sine.inOut'},5.6);
}

playBtn.addEventListener('click',()=>{initAudio();playScene4();});
replayBtn.addEventListener('click',()=>{resetScene4ToStart();});
soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;soundBtn.textContent='🔊 Sound: '+(soundEnabled?'ON':'OFF');if(soundEnabled)initAudio();});
window.addEventListener('load',()=>{resetScene4ToStart();setTimeout(playScene4,250);});
</script>
</body></html>
