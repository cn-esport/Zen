<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Last Soul - Scene 1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #020305;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 9:16 Full-Bleed Container */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #162133 0%, #090d16 55%, #030407 100%);
      overflow: hidden;
      animation: fadeFromBlack 1.4s ease-out forwards;
    }

    /* Slow Cinematic Camera Zoom & Pan */
    #camera {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      transform-origin: 50% 48%;
      animation: cameraDrift 15s ease-in-out forwards;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Subtle Breathing & Head Tilt */
    #character-torso {
      transform-origin: 50% 85%;
      animation: breathe 4.2s ease-in-out infinite;
    }

    #character-head {
      transform-origin: 50% 56%;
      animation: headTilt 7.5s ease-in-out infinite;
    }

    /* Expressive Glowing White Eyes */
    .eye {
      fill: #ffffff;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
      transform-origin: center;
      transform-box: fill-box;
      animation: blink 5s infinite, eyeFocus 15s ease-in-out forwards;
    }

    /* Phone Screen Glow Pulse */
    #phone-glow {
      animation: screenFlicker 3.5s ease-in-out infinite;
    }

    /* Drifting Dust Motes */
    .dust {
      fill: rgba(210, 225, 255, 0.35);
      animation: floatDust linear infinite;
    }

    /* Synced Subtitles */
    #caption-box {
      position: absolute;
      bottom: 13%;
      left: 8%;
      right: 8%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #caption {
      display: inline-block;
      color: #ffffff;
      font-size: clamp(18px, 4.8vw, 24px);
      font-weight: 500;
      letter-spacing: 0.4px;
      line-height: 1.4;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    #caption.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Subtle Start Hint (Disappears on first tap) */
    #tap-hint {
      position: absolute;
      top: 4%;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    @keyframes fadeFromBlack {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes cameraDrift {
      0% { transform: scale(1) translate(0%, 0%); }
      55% { transform: scale(1.07) translate(-1%, -1.5%); }
      100% { transform: scale(1.13) translate(0.5%, -2.5%); }
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.012); }
    }

    @keyframes headTilt {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-2.5deg); }
      75% { transform: rotate(1.8deg); }
    }

    @keyframes blink {
      0%, 44%, 48%, 92%, 96%, 100% { transform: scaleY(1); }
      46%, 94% { transform: scaleY(0.08); }
    }

    @keyframes eyeFocus {
      0%, 45% { transform: translate(0px, 2px); }
      55%, 80% { transform: translate(-2px, -1px); }
      85%, 100% { transform: translate(0px, 0px) scale(1.08); }
    }

    @keyframes screenFlicker {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.78; }
    }

    @keyframes floatDust {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-140px) translateX(18px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="tap-hint">Tap screen once for audio</div>

    <div id="camera">
      <svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- Moonlight Window Gradient -->
          <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2c436b" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#0b111e" stop-opacity="0.05" />
          </linearGradient>

          <!-- Phone Cold Blue Light Cone -->
          <radialGradient id="phoneLight" cx="50%" cy="62%" r="45%">
            <stop offset="0%" stop-color="#7ab8ff" stop-opacity="0.38" />
            <stop offset="60%" stop-color="#3b6ea8" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#050505" stop-opacity="0" />
          </radialGradient>

          <!-- Rim Light on Silhouette Edge -->
          <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0%" stop-color="#6088c7" stop-opacity="0.55" />
            <stop offset="18%" stop-color="#050505" stop-opacity="1" />
            <stop offset="100%" stop-color="#050505" stop-opacity="1" />
          </linearGradient>
        </defs>

        <!-- Background Midnight Window -->
        <rect x="42" y="65" width="135" height="230" rx="4" fill="url(#windowGlow)" />
        <line x1="109" y1="65" x2="109" y2="295" stroke="#070a10" stroke-width="4" />
        <line x1="42" y1="180" x2="177" y2="180" stroke="#070a10" stroke-width="4" />

        <!-- Subtle Moon -->
        <circle cx="82" cy="115" r="14" fill="#d9e6ff" opacity="0.22" />

        <!-- Floating Dust Particles -->
        <circle class="dust" cx="95" cy="260" r="1.4" style="animation-duration: 9s; animation-delay: 0s;" />
        <circle class="dust" cx="145" cy="310" r="1.1" style="animation-duration: 11s; animation-delay: 2s;" />
        <circle class="dust" cx="220" cy="280" r="1.6" style="animation-duration: 10s; animation-delay: 1s;" />
        <circle class="dust" cx="170" cy="380" r="1.2" style="animation-duration: 8s; animation-delay: 3s;" />
        <circle class="dust" cx="255" cy="340" r="1.5" style="animation-duration: 12s; animation-delay: 0.5s;" />

        <!-- Ambient Phone Glow -->
        <circle id="phone-glow" cx="185" cy="405" r="150" fill="url(#phoneLight)" />

        <!-- Foreground Bed / Desk Edge -->
        <path d="M0 510 Q180 495 360 515 L360 640 L0 640 Z" fill="#030304" />

        <!-- Character Silhouette -->
        <g id="character-torso">
          <!-- Shoulders & Back -->
          <path d="M88 530 C92 435, 130 395, 180 395 C230 395, 268 435, 272 530 Z" fill="url(#rimLight)" />

          <!-- Head & Glowing Eyes -->
          <g id="character-head">
            <!-- Head Silhouette -->
            <ellipse cx="180" cy="332" rx="44" ry="50" fill="url(#rimLight)" />
            <!-- Soft Hair Tuft -->
            <path d="M142 305 Q155 274 185 278 Q212 280 220 306 Q190 294 142 305 Z" fill="#050505" />

            <!-- Left Glowing Eye -->
            <ellipse class="eye" cx="163" cy="336" rx="6.2" ry="3.8" />
            <!-- Right Glowing Eye -->
            <ellipse class="eye" cx="197" cy="336" rx="6.2" ry="3.8" />
          </g>

          <!-- Hands Holding Glowing Phone -->
          <path d="M138 455 Q162 425 182 422 Q202 425 224 455 L212 485 L150 485 Z" fill="#050505" />
          <!-- Phone Side Sliver Glow -->
          <rect x="176" y="396" width="8" height="32" rx="2" fill="#b8dcff" opacity="0.85" />
        </g>
      </svg>
    </div>

    <!-- Synced Story Captions -->
    <div id="caption-box">
      <div id="caption"></div>
    </div>
  </div>

  <script>
    const captions = [
      { time: 600, text: "It’s 2:14 AM… and your mind still refuses to shut off." },
      { time: 5200, text: "You aren’t tired because you worked too hard today." },
      { time: 10200, text: "You’re exhausted from living ten years ahead in your head." },
      { time: 14300, text: "" }
    ];

    const captionEl = document.getElementById("caption");
    const tapHint = document.getElementById("tap-hint");

    // Schedule Captions
    captions.forEach(item => {
      setTimeout(() => {
        if (!item.text) {
          captionEl.classList.remove("visible");
          return;
        }
        captionEl.classList.remove("visible");
        setTimeout(() => {
          captionEl.textContent = item.text;
          captionEl.classList.add("visible");
        }, 250);
      }, item.time);
    });

    // Built-In Free Web Audio API Sound Synthesizer
    let audioStarted = false;

    function startSoundEffects() {
      if (audioStarted) return;
      audioStarted = true;
      tapHint.style.opacity = "0";

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();

      // 1. Deep Nocturnal Room Hum (15 seconds)
      const droneOsc = ctx.createOscillator();
      const droneGain = ctx.createGain();
      droneOsc.type = "sine";
      droneOsc.frequency.setValueAtTime(65.41, ctx.currentTime); // Low C2
      droneGain.gain.setValueAtTime(0.001, ctx.currentTime);
      droneGain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 2.0);
      droneGain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 15.0);
      droneOsc.connect(droneGain);
      droneGain.connect(ctx.destination);
      droneOsc.start();
      droneOsc.stop(ctx.currentTime + 15.1);

      // 2. Soft Clock Ticks Every 1 Second
      for (let sec = 1; sec <= 14; sec++) {
        const t = ctx.currentTime + sec;
        const tickOsc = ctx.createOscillator();
        const tickGain = ctx.createGain();
        tickOsc.type = "triangle";
        tickOsc.frequency.setValueAtTime(sec % 2 === 0 ? 920 : 780, t);
        tickGain.gain.setValueAtTime(0.001, t);
        tickGain.gain.linearRampToValueAtTime(0.035, t + 0.008);
        tickGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
        tickOsc.connect(tickGain);
        tickGain.connect(ctx.destination);
        tickOsc.start(t);
        tickOsc.stop(t + 0.06);
      }

      // 3. Gentle Transition Whooshes on Caption Changes
      [5.2, 10.2].forEach(offset => {
        const t = ctx.currentTime + offset;
        const whooshOsc = ctx.createOscillator();
        const whooshGain = ctx.createGain();
        whooshOsc.type = "sine";
        whooshOsc.frequency.setValueAtTime(140, t);
        whooshOsc.frequency.exponentialRampToValueAtTime(320, t + 0.45);
        whooshGain.gain.setValueAtTime(0.001, t);
        whooshGain.gain.linearRampToValueAtTime(0.04, t + 0.2);
        whooshGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        whooshOsc.connect(whooshGain);
        whooshGain.connect(ctx.destination);
        whooshOsc.start(t);
        whooshOsc.stop(t + 0.65);
      });
    }

    // Unlock audio on first screen tap (mobile browser requirement)
    window.addEventListener("pointerdown", startSoundEffects, { once: true });
  </script>
</body>
  </html>
