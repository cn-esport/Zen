<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — Okage Mairi Scene 2: The Ridge to Ise (10.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(252,211,77,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(252,211,77,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style>
</head>
<body>
<div class="stage-wrapper">
<div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- High-angle dark night sky transitioning into teal haze & early ember sunrise -->
  <linearGradient id="s2Sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#03050a"/>
    <stop offset=".38" stop-color="#08131d"/>
    <stop offset=".64" stop-color="#0e2a34"/>
    <stop offset=".84" stop-color="#222320"/>
    <stop offset="1" stop-color="#5c2d16"/>
  </linearGradient>
  <!-- Faint ember glow low on the horizon -->
  <radialGradient id="s2HorizonEmber" cx="76%" cy="58%" r="58%">
    <stop offset="0" stop-color="#fef08a" stop-opacity=".42"/>
    <stop offset=".38" stop-color="#f59e0b" stop-opacity=".28"/>
    <stop offset=".75" stop-color="#b45309" stop-opacity=".12"/>
    <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
  </radialGradient>
  <!-- Teal valley haze -->
  <linearGradient id="s2TealHaze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#14b8a6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#0d9488" stop-opacity=".26"/>
    <stop offset="1" stop-color="#042f2e" stop-opacity="0"/>
  </linearGradient>
  <!-- Ridge earth gradient -->
  <linearGradient id="s2RidgeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b131d"/>
    <stop offset=".45" stop-color="#070c14"/>
    <stop offset="1" stop-color="#030509"/>
  </linearGradient>
  <!-- Winding dirt path highlight -->
  <linearGradient id="s2DirtPath" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#14212e"/>
    <stop offset=".55" stop-color="#1c2a38"/>
    <stop offset="1" stop-color="#2c241d"/>
  </linearGradient>
</defs>

<!-- Camera starts slightly zoomed in (scale 1.11) and pulls back slowly as crowd grows -->
<g id="s2Camera">
  <!-- Sky & Early Ember Horizon Glow -->
  <rect x="-40" y="-40" width="620" height="720" fill="url(#s2Sky)"/>
  <ellipse id="s2EmberGlow" cx="410" cy="545" rx="360" ry="185" fill="url(#s2HorizonEmber)" opacity=".55"/>

  <!-- Pale distant crescent/moon glow -->
  <circle cx="95" cy="195" r="46" fill="#5eead4" opacity=".06"/>
  <circle cx="95" cy="195" r="10" fill="#ccfbf1" opacity=".42"/>

  <!-- Far distant mountain silhouettes -->
  <path d="M -50 530 Q 85 470 220 515 Q 360 455 485 505 L 600 485 L 600 660 L -50 660 Z" fill="#07121b"/>

  <!-- Upper teal haze layer behind ridge -->
  <rect id="s2HazeBack" x="-80" y="435" width="700" height="175" fill="url(#s2TealHaze)" opacity=".88"/>

  <!-- High-angle Long Ridge Line -->
  <path d="M -60 635 Q 90 580 255 605 Q 410 628 600 570 L 600 1000 L -60 1000 Z" fill="url(#s2RidgeGrad)"/>

  <!-- Winding dirt path across the ridge (matches trajectory of walkers) -->
  <path d="M -60 648 Q 85 595 255 618 Q 415 640 600 585" stroke="url(#s2DirtPath)" stroke-width="24" stroke-linecap="round" fill="none" opacity=".92"/>
  <!-- Faint ember sunrise rim catching the upper edge of the dirt path -->
  <path d="M -60 637 Q 85 584 255 607 Q 415 629 600 574" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity=".32"/>

  <!-- Subtle slope contour lines below ridge -->
  <g stroke="#0e1824" stroke-width="2" fill="none">
    <path d="M -40 705 Q 150 675 340 700 Q 460 715 580 685"/>
    <path d="M -40 780 Q 180 755 390 785 L 580 765"/>
    <path d="M -40 865 Q 210 845 580 875"/>
  </g>

  <!-- ALL SILHOUETTE WALKERS ON THE WINDING RIDGE PATH -->
  <g id="s2WalkersLayer"></g>

  <!-- Low drifting teal mist across the winding path -->
  <rect id="s2MistLow" x="-90" y="555" width="720" height="115" fill="url(#s2TealHaze)" opacity=".72"/>
</g>
</svg>
</div>

<div class="controls">
  <button id="playBtn" class="primary">▶ Play (10.0s)</button>
  <button id="replayBtn">↺ 0.0s</button>
  <button id="soundBtn">🔊 Sound: ON</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const playBtn = $('playBtn'), replayBtn = $('replayBtn'), soundBtn = $('soundBtn');

// ---------- PROCEDURAL WEB AUDIO FOLEY ----------
let audioCtx = null, soundEnabled = true;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Dirt-path footsteps (layers slowly from one lone pair into a soft steady tread)
function playDirtStep(volume = 0.08, pitch = 1.0) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(104 * pitch, t);
  osc.frequency.exponentialRampToValueAtTime(39 * pitch, t + 0.085);
  gain.gain.setValueAtTime(volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.095);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.1);

  // Soft dirt grit texture
  const n = Math.floor(audioCtx.sampleRate * 0.065);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const flt = audioCtx.createBiquadFilter();
  flt.type = 'bandpass';
  flt.frequency.value = 920 * pitch;
  flt.Q.value = 1.8;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(volume * 0.4, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.065);
  src.connect(flt).connect(ng).connect(audioCtx.destination);
  src.start(t);
}

// Gentle wind across ridge + low atmospheric drone that swells slightly
function playWindAndDrone(dur = 9.9) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;

  // Gentle wind
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;

  const windSrc = audioCtx.createBufferSource();
  windSrc.buffer = buf;
  const windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.setValueAtTime(250, t);
  windFilter.frequency.linearRampToValueAtTime(305, t + 5.0);
  windFilter.frequency.linearRampToValueAtTime(260, t + dur);
  windFilter.Q.value = 2.5;

  const windGain = audioCtx.createGain();
  windGain.gain.setValueAtTime(0.022, t);
  windGain.gain.linearRampToValueAtTime(0.03, t + 4.5);
  windGain.gain.linearRampToValueAtTime(0.026, t + dur - 0.5);
  windGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  windSrc.connect(windFilter).connect(windGain).connect(audioCtx.destination);
  windSrc.start(t);

  // Low drone swelling slightly as the river of silhouettes fills the ridge
  const d1 = audioCtx.createOscillator();
  const d2 = audioCtx.createOscillator();
  const d3 = audioCtx.createOscillator();
  const dGain = audioCtx.createGain();

  d1.type = 'sine';
  d2.type = 'triangle';
  d3.type = 'sine';
  d1.frequency.setValueAtTime(65.41, t);  // C2
  d2.frequency.setValueAtTime(98.00, t);  // G2
  d3.frequency.setValueAtTime(130.81, t); // C3

  dGain.gain.setValueAtTime(0.032, t);
  dGain.gain.linearRampToValueAtTime(0.052, t + 5.0);
  dGain.gain.linearRampToValueAtTime(0.074, t + 8.8);
  dGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  d1.connect(dGain);
  d2.connect(dGain);
  d3.connect(dGain);
  dGain.connect(audioCtx.destination);

  d1.start(t); d2.start(t); d3.start(t);
  d1.stop(t + dur + 0.05); d2.stop(t + dur + 0.05); d3.stop(t + dur + 0.05);
}

// ---------- RIDGE PATH MATH & SILHOUETTE BUILDER ----------
// Quadratic bezier matching the winding dirt path across the ridge
function getRidgePoint(u) {
  // u in [-0.15 .. 1.15] maps across x = [-60 .. 600]
  const x = -60 + u * 660;
  // Two-segment curve matching M -60 648 Q 85 595 255 618 Q 415 640 600 585
  let y;
  if (u <= 0.48) {
    const t = u / 0.48;
    const p0 = 648, p1 = 595, p2 = 618;
    y = (1 - t) * (1 - t) * p0 + 2 * (1 - t) * t * p1 + t * t * p2;
  } else {
    const t = (u - 0.48) / 0.52;
    const p0 = 618, p1 = 640, p2 = 585;
    y = (1 - t) * (1 - t) * p0 + 2 * (1 - t) * t * p1 + t * t * p2;
  }
  return { x, y };
}

const svgNS = 'http://www.w3.org/2000/svg';
const walkersLayer = $('s2WalkersLayer');

function createPilgrim({ hasHat = false, hasBundle = false, hasStaff = false, scale = 0.34, phase = 0, spawnTime = 0, startU = 0.05, speedU = 0.048 }) {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('opacity', '0');

  // Conical straw hat (kasa) with warm ember rim highlight
  const hatSVG = hasHat ? `
    <path d="M -27 -136 Q 0 -158 29 -136 Q 0 -132 -27 -136 Z" fill="#fcd34d" opacity=".42" transform="translate(2,0)"/>
    <path d="M -27 -136 Q 0 -158 29 -136 Q 0 -132 -27 -136 Z" fill="#090c14"/>
  ` : '';

  // Small cloth bundle slung over shoulder/back
  const bundleSVG = hasBundle ? `
    <circle cx="-17" cy="-84" r="11" fill="#fcd34d" opacity=".28"/>
    <circle cx="-18" cy="-84" r="10.5" fill="#090c14"/>
  ` : '';

  // Wooden walking staff held in front hand
  const staffSVG = hasStaff ? `
    <line x1="21" y1="-155" x2="25" y2="2" stroke="#fcd34d" stroke-width="3.6" stroke-linecap="round" opacity=".35"/>
    <line x1="19.5" y1="-155" x2="23.5" y2="2" stroke="#090c14" stroke-width="3.6" stroke-linecap="round"/>
  ` : '';

  g.innerHTML = `
    <ellipse cx="0" cy="2" rx="22" ry="4.5" fill="#000" opacity=".7"/>
    <!-- back leg -->
    <g class="legB" transform="translate(-3,-46)">
      <path d="M 0 0 L -1 24 L -2 44" stroke="#05070c" stroke-width="9.5" stroke-linecap="round" fill="none"/>
    </g>
    <!-- front leg -->
    <g class="legF" transform="translate(3,-46)">
      <path d="M 0 0 L 1 24 L 3 44" stroke="#090c14" stroke-width="10" stroke-linecap="round" fill="none"/>
    </g>
    ${bundleSVG}
    <!-- torso warm ember rim -->
    <path d="M -11 -104 L 14 -104 L 18 -24 L -13 -24 Z" fill="#fcd34d" opacity=".38"/>
    <!-- torso -->
    <path d="M -12.5 -104 L 12.5 -104 L 16.5 -24 L -14.5 -24 Z" fill="#090c14"/>
    <!-- arm -->
    <path d="M 2 -96 L 9 -76 L 14 -60" stroke="#090c14" stroke-width="7.5" stroke-linecap="round" fill="none"/>
    ${staffSVG}
    <!-- head + rim light -->
    <g transform="translate(1,-125)">
      <circle cx="1.8" cy="0" r="20" fill="#fcd34d" opacity=".45"/>
      <circle cx="0" cy="0" r="20" fill="#090c14"/>
      ${hatSVG}
    </g>
  `;

  walkersLayer.appendChild(g);
  return {
    el: g,
    legF: g.querySelector('.legF'),
    legB: g.querySelector('.legB'),
    scale,
    phase,
    spawnTime,
    startU,
    speedU,
    u: startU
  };
}

// Build the progression of walkers matching the exact script beats:
const walkers = [];

// 0:05 (t=0.0s): One lone small silhouette walking left to right at steady pace (the servant from Scene 1)
walkers.push(createPilgrim({
  hasHat: false, hasBundle: true, hasStaff: false,
  scale: 0.36, phase: 0, spawnTime: 0.0, startU: 0.22, speedU: 0.046
}));

// 0:08 (t=3.0s): Two, then four more figures appear behind, walking the same steady pace
const waveTwoSpecs = [
  { spawnTime: 2.8, startU: 0.14, hasHat: true,  hasBundle: false, hasStaff: true,  scale: 0.35 },
  { spawnTime: 3.1, startU: 0.10, hasHat: false, hasBundle: true,  hasStaff: false, scale: 0.34 },
  { spawnTime: 3.8, startU: 0.06, hasHat: true,  hasBundle: true,  hasStaff: false, scale: 0.35 },
  { spawnTime: 4.1, startU: 0.02, hasHat: false, hasBundle: false, hasStaff: true,  scale: 0.33 },
  { spawnTime: 4.4, startU: -0.02, hasHat: true, hasBundle: false, hasStaff: false, scale: 0.35 },
  { spawnTime: 4.7, startU: -0.06, hasHat: true, hasBundle: true,  hasStaff: true,  scale: 0.34 }
];
waveTwoSpecs.forEach((s, idx) => {
  walkers.push(createPilgrim({
    ...s, phase: (idx + 1) * 1.1, speedU: 0.046
  }));
});

// 0:11 - 0:13 (t=6.0s - 8.5s): The line thickens with straw hats, bundles & staffs until a long dark river fills the entire ridge
const totalRiverCount = 38;
for (let i = 0; i < totalRiverCount; i++) {
  const frac = i / (totalRiverCount - 1);
  // Distribute across the entire ridge from far left (-0.12) to far right (1.06)
  const uPos = -0.12 + frac * 1.18 + ((i % 3) - 1) * 0.008;
  // Skip positions overlapping the initial group at t=6.0s
  if (uPos > 0.18 && uPos < 0.52 && i % 2 === 0) continue;

  const spawnT = 5.8 + ((i * 7) % totalRiverCount) / totalRiverCount * 2.5;
  walkers.push(createPilgrim({
    hasHat: i % 2 === 0,
    hasBundle: i % 3 !== 0,
    hasStaff: i % 3 === 1,
    scale: 0.31 + (i % 4) * 0.015,
    phase: i * 0.85,
    spawnTime: spawnT,
    startU: uPos - spawnT * 0.046,
    speedU: 0.046
  }));
}

// ---------- RIG STATE & RENDER ----------
const st = { elapsed: 0 };

function render() {
  const t = st.elapsed;
  walkers.forEach(w => {
    const uNow = w.startU + t * w.speedU;
    const pt = getRidgePoint(uNow);
    // Steady slow walking cadence (same pace for all figures)
    const walkCycle = t * 5.6 + w.phase;
    const stride = Math.sin(walkCycle) * 9.5;
    const bob = Math.abs(Math.cos(walkCycle)) * 1.6;

    w.el.setAttribute('transform', `translate(${pt.x.toFixed(1)},${(pt.y - bob).toFixed(1)}) scale(${w.scale.toFixed(2)})`);
    w.legF.setAttribute('transform', `translate(3,-46) rotate(${stride.toFixed(1)})`);
    w.legB.setAttribute('transform', `translate(-3,-46) rotate(${(-stride).toFixed(1)})`);
  });
}

// ---------- TIMELINE (10.0s) ----------
let sceneTl = null;

function resetScene2ToStart() {
  if (sceneTl) { sceneTl.kill(); sceneTl = null; }
  st.elapsed = 0;
  walkers.forEach(w => w.el.setAttribute('opacity', '0'));
  // Start wide high-angle slightly pushed in (scale 1.11) so it can slowly pull back to 1.0 as crowd grows
  gsap.set('#s2Camera', { scale: 1.11, svgOrigin: '230 610' });
  gsap.set('#s2HazeBack', { x: 0 });
  gsap.set('#s2MistLow', { x: 0 });
  gsap.set('#s2EmberGlow', { opacity: 0.55 });
  render();
  replayBtn.textContent = '↺ 0.0s';
}

function playScene2() {
  resetScene2ToStart();
  sceneTl = gsap.timeline({
    onUpdate: () => {
      render();
      replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
    },
    onComplete: () => replayBtn.textContent = '↺ 10.0s'
  });

  // 0:05 - 0:15 (10.0s): Slow camera pull-back as the crowd grows across the ridge
  sceneTl.to('#s2Camera', { scale: 1.0, svgOrigin: '270 610', duration: 10.0, ease: 'power1.inOut' }, 0);

  // Ambient gentle wind + swelling low drone
  sceneTl.call(() => playWindAndDrone(9.9), null, 0.02);

  // Continuous uniform forward progress for all figures along the winding ridge
  sceneTl.to(st, { elapsed: 10.0, duration: 10.0, ease: 'none' }, 0);

  // Low mist drifting across the path + faint ember sky brightening slightly
  sceneTl.to('#s2HazeBack', { x: 35, duration: 10.0, ease: 'sine.inOut' }, 0);
  sceneTl.to('#s2MistLow', { x: -45, duration: 10.0, ease: 'sine.inOut' }, 0);
  sceneTl.to('#s2EmberGlow', { opacity: 0.92, duration: 9.0, ease: 'sine.inOut' }, 1.0);

  // Fade in each walker according to the script beats (0:05 lone walker -> 0:08 two then four -> 0:11 thickens -> 0:13 river)
  walkers.forEach((w, idx) => {
    const dur = idx === 0 ? 0.35 : 0.75;
    sceneTl.to(w.el, { opacity: 0.94, duration: dur, ease: 'power1.out' }, w.spawnTime);
  });

  // Layered dirt footsteps: starts with one lone pair (0.0s - 3.0s), then layers more footsteps into a soft steady tread
  const stepInterval = 0.56;
  const totalSteps = Math.floor(9.8 / stepInterval);
  for (let s = 0; s < totalSteps; s++) {
    const ts = s * stepInterval;
    // Primary lone walker footsteps
    sceneTl.call(() => playDirtStep(0.082, s % 2 === 0 ? 1.0 : 0.95), null, ts);

    // At 3.0s+ (0:08 mark): second layer of footsteps joins
    if (ts >= 2.8) {
      sceneTl.call(() => playDirtStep(0.052, 0.91), null, ts + 0.14);
    }
    // At 5.8s+ (0:11 mark): third & fourth layers blend into a soft steady tread
    if (ts >= 5.6) {
      sceneTl.call(() => playDirtStep(0.044, 1.06), null, ts + 0.28);
      sceneTl.call(() => playDirtStep(0.038, 0.87), null, ts + 0.42);
    }
  }
}

playBtn.addEventListener('click', () => { initAudio(); playScene2(); });
replayBtn.addEventListener('click', () => { resetScene2ToStart(); });
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = '🔊 Sound: ' + (soundEnabled ? 'ON' : 'OFF');
  if (soundEnabled) initAudio();
});

window.addEventListener('load', () => {
  resetScene2ToStart();
  setTimeout(playScene2, 250);
});
</script>
</body>
</html>
