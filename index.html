<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — Okage Mairi Scene 1: Putting Down the Broom (5.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(252,211,77,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(252,211,77,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style>
</head>
<body>
<div class="stage-wrapper">
<div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Flat dark teal bare interior wall -->
  <linearGradient id="s1Wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#061217"/>
    <stop offset="1" stop-color="#0d232b"/>
  </linearGradient>
  <!-- Bare wooden floor -->
  <linearGradient id="s1Floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a1319"/>
    <stop offset="1" stop-color="#04070b"/>
  </linearGradient>
  <!-- Ember orange doorway glow -->
  <linearGradient id="s1DoorGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f59e0b"/>
    <stop offset=".5" stop-color="#fb923c"/>
    <stop offset="1" stop-color="#fef08a"/>
  </linearGradient>
  <!-- Radial ambient glow spilling from doorway -->
  <radialGradient id="s1AmbientGlow" cx="80%" cy="62%" r="65%">
    <stop offset="0" stop-color="#fef08a" stop-opacity=".8"/>
    <stop offset=".38" stop-color="#f59e0b" stop-opacity=".38"/>
    <stop offset=".75" stop-color="#b45309" stop-opacity=".12"/>
    <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
  </radialGradient>
  <!-- Thin beam of warm light stretching across the floor toward the servant -->
  <linearGradient id="s1FloorBeam" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fef08a" stop-opacity=".46"/>
    <stop offset=".5" stop-color="#f59e0b" stop-opacity=".2"/>
    <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="s1DoorClip">
    <rect x="345" y="420" width="160" height="365"/>
  </clipPath>
</defs>

<g id="s1Camera">
  <!-- Bare dark teal wall & wooden floor -->
  <rect x="0" y="0" width="540" height="790" fill="url(#s1Wall)"/>
  <rect x="0" y="785" width="540" height="175" fill="url(#s1Floor)"/>

  <!-- Subtle wooden floor plank lines & baseboard -->
  <line x1="0" y1="785" x2="540" y2="785" stroke="#060d12" stroke-width="3"/>
  <g stroke="#0e1b23" stroke-width="1.8">
    <line x1="0" y1="818" x2="540" y2="818"/>
    <line x1="0" y1="856" x2="540" y2="856"/>
    <line x1="0" y1="902" x2="540" y2="902"/>
  </g>

  <!-- Ambient warm ember wash -->
  <circle id="s1AmbientC" cx="425" cy="610" r="320" fill="url(#s1AmbientGlow)" opacity=".75"/>

  <!-- Open Sliding Doorway on the right third glowing ember orange -->
  <rect x="337" y="412" width="176" height="373" fill="#061015"/>
  <g clip-path="url(#s1DoorClip)">
    <rect x="345" y="420" width="160" height="365" fill="url(#s1DoorGlow)"/>
    <!-- Sliding door panel (partially visible on far right, slides open slightly at 2.0s) -->
    <g id="s1DoorPanel" transform="translate(105,0)">
      <rect x="345" y="420" width="160" height="365" fill="#0b1b22" stroke="#050d11" stroke-width="3"/>
      <g stroke="#122832" stroke-width="2">
        <line x1="398" y1="420" x2="398" y2="785"/>
        <line x1="452" y1="420" x2="452" y2="785"/>
        <line x1="345" y1="540" x2="505" y2="540"/>
        <line x1="345" y1="660" x2="505" y2="660"/>
      </g>
    </g>
  </g>

  <!-- Thin beam of warm light stretching across the floor toward the servant (pulses slightly) -->
  <g id="s1BeamGroup" opacity=".9">
    <polygon points="345,785 430,785 215,960 95,960" fill="url(#s1FloorBeam)"/>
    <polygon points="345,540 430,630 430,785 345,785" fill="#fef08a" opacity=".08"/>
  </g>

  <!-- Dust floating in the warm light beam -->
  <g fill="#fef08a">
    <circle class="s1Dust" cx="370" cy="630" r="1.6" opacity="0"/>
    <circle class="s1Dust" cx="340" cy="705" r="2.0" opacity="0"/>
    <circle class="s1Dust" cx="290" cy="795" r="1.5" opacity="0"/>
    <circle class="s1Dust" cx="385" cy="745" r="1.8" opacity="0"/>
    <circle class="s1Dust" cx="220" cy="865" r="1.7" opacity="0"/>
    <circle class="s1Dust" cx="305" cy="830" r="1.4" opacity="0"/>
  </g>

  <!-- Servant's long shadow falling to the left across the wooden floor -->
  <polygon id="s1LongShadow" points="168,785 192,785 75,920 20,920" fill="#03060a" opacity=".78"/>

  <!-- SERVANT SILHOUETTE IN SIMPLE KIMONO (Left third, x=180, starts facing left in profile) -->
  <g id="s1Servant" transform="translate(180, 785)">
    <ellipse cx="0" cy="2" rx="28" ry="5.5" fill="#000" opacity=".9"/>

    <!-- Back leg -->
    <g id="s1LegB" transform="translate(-4,-48)">
      <path d="M 0 0 L -1 25 L -2 45" stroke="#08070c" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path id="s1FootB" d="M -12 42 L 4 42 L 6 48 L -14 48 Z" fill="#08070c"/>
    </g>
    <!-- Front leg -->
    <g id="s1LegF" transform="translate(4,-48)">
      <path d="M 0 0 L 1 25 L 3 45" stroke="#0d0b12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path id="s1FootF" d="M -14 42 L 2 42 L 4 48 L -16 48 Z" class="hd"/>
    </g>

    <!-- Far arm (holds upright broom with both hands at 0:00, drops loose at 0:02) -->
    <path id="s1ArmB" d="M -3 -98 L -20 -86 L -34 -88" stroke="#131c24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Warm ember rim light on right/back edge of kimono -->
    <path id="s1TorsoRim" d="M -12.5 -108 L 15.5 -108 L 21.5 -16 L -16.5 -16 Z" fill="#fcd34d" opacity=".42"/>

    <!-- Simple Kimono body (shoulders slightly rounded at 0:00, straightens at 0:02) -->
    <g id="s1TorsoGroup" transform="rotate(-3)">
      <path id="s1KimonoBody" d="M -14 -108 L 14 -108 L 20 -16 L -18 -16 Z" fill="#0d0b12"/>
      <rect id="s1Obi" x="-15.5" y="-68" width="32" height="12" rx="1.5" fill="#16212b"/>
      <!-- Kimono sleeve -->
      <path id="s1Sleeve" d="M -6 -102 L 6 -102 L 8 -75 L -7 -77 Z" fill="#0d0b12"/>
    </g>

    <!-- Front arm (holds upright broom with both hands at 0:00, drops loose at 0:02) -->
    <path id="s1ArmF" d="M 2 -98 L -16 -80 L -32 -78" stroke="#0d0b12" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Head group (facing left in profile at 0:00, bowed with eyes down; turns right at 0:02) -->
    <g id="s1Head" transform="translate(-2,-130) rotate(-14)">
      <circle id="s1HeadRim" cx="1.6" cy="0" r="22" fill="#fcd34d" opacity=".48"/>
      <circle id="s1HeadCore" cx="0" cy="0" r="22" class="hd"/>
      <!-- Tied hair bun on back of head (switches side when turning right) -->
      <circle id="s1Bun" cx="19" cy="-10" r="5.5" class="hd"/>

      <!-- Face Left (0:00 - 0:02: profile facing left, eyes looking down toward floor/broom) -->
      <g id="s1FaceLeft">
        <circle class="fc" cx="-11" cy="1" r="2.1"/>
        <circle class="fc" cx="-18" cy="1" r="2.1"/>
        <line class="fs" x1="-15.5" y1="8.5" x2="-9.5" y2="8.5" stroke-width="1.8"/>
      </g>

      <!-- Face Right (0:02 - 0:05: head up, looking right toward glowing doorway) -->
      <g id="s1FaceRight" opacity="0">
        <circle class="fc" cx="10.5" cy="-2" r="2.1"/>
        <circle class="fc" cx="17.5" cy="-2" r="2.1"/>
        <line class="fs" x1="9" y1="7" x2="15" y2="7" stroke-width="1.8"/>
      </g>
    </g>
  </g>

  <!-- TALL STRAW BROOM IN LEFT FOREGROUND (held upright at x=147 at 0:00, leaned against left wall at 0:01) -->
  <g id="s1Broom" transform="translate(147, 785) rotate(0)">
    <!-- Warm ember rim edge along broom -->
    <line x1="1.8" y1="-36" x2="1.8" y2="-246" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" opacity=".35"/>
    <!-- Tall handle -->
    <line x1="0" y1="-36" x2="0" y2="-246" stroke="#0d0b12" stroke-width="6" stroke-linecap="round"/>
    <!-- Straw broom head & binding -->
    <path d="M -9 -44 L 9 -44 L 16 0 L -16 0 Z" fill="#0d0b12"/>
    <rect x="-9.5" y="-46" width="19" height="5" rx="2" fill="#1e293b"/>
  </g>

  <!-- Soft wooden knock ripple at broom base -->
  <circle id="s1KnockR1" cx="122" cy="785" r="3" fill="none" stroke="#fcd34d" stroke-width="1.4" opacity="0"/>
  <circle id="s1KnockR2" cx="122" cy="785" r="3" fill="none" stroke="#fcd34d" stroke-width="1.1" opacity="0"/>
</g>
</svg>
</div>

<div class="controls">
  <button id="playBtn" class="primary">▶ Play (5.0s)</button>
  <button id="replayBtn">↺ 0.0s</button>
  <button id="soundBtn">🔊 Sound: ON</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const playBtn = $('playBtn'), replayBtn = $('replayBtn'), soundBtn = $('soundBtn');

// ---------- PROCEDURAL WEB AUDIO FOLEY ----------
let audioCtx = null, soundEnabled = true;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// 0:00 / 0:01: One soft wooden knock (broom set down)
function playWoodKnock() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(155, t);
  osc.frequency.exponentialRampToValueAtTime(56, t + 0.085);
  gain.gain.setValueAtTime(0.14, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.11);
}

// 0:02+: Quiet footsteps on wood
function playWoodStep(vol = 0.078) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(118, t);
  osc.frequency.exponentialRampToValueAtTime(46, t + 0.075);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.09);
}

// 0:02+: Sliding door sound
function playShojiSlide() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const dur = 0.9;
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(360, t);
  filter.frequency.linearRampToValueAtTime(480, t + dur * 0.5);
  filter.frequency.linearRampToValueAtTime(310, t + dur);
  filter.Q.value = 3.4;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.055, t + 0.12);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t);
}

// Soft wind + low drone fades in
function playWindAndDrone(dur = 4.95) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;

  const n = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;

  const windSrc = audioCtx.createBufferSource();
  windSrc.buffer = buf;
  const windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 265;
  windFilter.Q.value = 2.6;

  const windGain = audioCtx.createGain();
  windGain.gain.setValueAtTime(0.0001, t);
  windGain.gain.linearRampToValueAtTime(0.025, t + 1.2);
  windGain.gain.linearRampToValueAtTime(0.022, t + dur - 0.3);
  windGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  windSrc.connect(windFilter).connect(windGain).connect(audioCtx.destination);
  windSrc.start(t);

  const d1 = audioCtx.createOscillator();
  const d2 = audioCtx.createOscillator();
  const dGain = audioCtx.createGain();
  d1.type = 'sine';
  d2.type = 'triangle';
  d1.frequency.setValueAtTime(65.41, t); // C2
  d2.frequency.setValueAtTime(98.00, t); // G2

  dGain.gain.setValueAtTime(0.0001, t);
  dGain.gain.linearRampToValueAtTime(0.048, t + 2.5);
  dGain.gain.linearRampToValueAtTime(0.062, t + dur - 0.35);
  dGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  d1.connect(dGain);
  d2.connect(dGain);
  dGain.connect(audioCtx.destination);
  d1.start(t); d2.start(t);
  d1.stop(t + dur + 0.05); d2.stop(t + dur + 0.05);
}

// ---------- RIG STATE ----------
const st = {
  charX: 180,
  bob: 0,
  stride: 0,
  torsoTilt: -3,    // -3 rounded/tired facing left at 0:00 -> 0 upright at 0:02
  headX: -2,
  headRot: -14,     // bowed down facing left at 0:00 -> 0 upright facing right at 0:02
  armPhase: 0,      // 0 = holding upright broom w/ both hands, 1 = leaning broom left, 2 = dropped loose at sides
  broomX: 147,
  broomAngle: 0,    // 0 upright -> -15 leaned against left wall
  doorX: 105,
  outlineFade: 0    // 0 = full silhouette w/ face, 1 = thin dark outline inside glowing doorway
};

const lerp = (a, b, t) => a + (b - a) * t;

function render() {
  // Servant group & long floor shadow
  $('s1Servant').setAttribute('transform', `translate(${st.charX.toFixed(1)},${(785 + st.bob).toFixed(1)})`);
  $('s1LongShadow').setAttribute('points', `${(st.charX - 12).toFixed(1)},785 ${(st.charX + 12).toFixed(1)},785 ${(st.charX - 105).toFixed(1)},920 ${(st.charX - 160).toFixed(1)},920`);

  // Torso posture & head
  $('s1TorsoGroup').setAttribute('transform', `rotate(${st.torsoTilt.toFixed(2)})`);
  $('s1Head').setAttribute('transform', `translate(${st.headX.toFixed(1)},-130) rotate(${st.headRot.toFixed(2)})`);

  // Legs
  $('s1LegF').setAttribute('transform', `translate(4,-48) rotate(${st.stride.toFixed(2)})`);
  $('s1LegB').setAttribute('transform', `translate(-4,-48) rotate(${(-st.stride).toFixed(2)})`);

  // Both hands holding upright broom -> leaning broom -> arms dropped loose at sides
  let fEx, fEy, fHx, fHy, bEx, bEy, bHx, bHy;
  if (st.armPhase <= 1) {
    // Lowering broom with both hands toward left wall
    fEx = lerp(-16, -24, st.armPhase);
    fEy = lerp(-80, -76, st.armPhase);
    fHx = lerp(-32, -46, st.armPhase);
    fHy = lerp(-78, -72, st.armPhase);

    bEx = lerp(-20, -28, st.armPhase);
    bEy = lerp(-88, -84, st.armPhase);
    bHx = lerp(-34, -48, st.armPhase);
    bHy = lerp(-88, -82, st.armPhase);
  } else {
    // Arms drop loose at the sides as body turns right
    const k = st.armPhase - 1;
    fEx = lerp(-24, 5 - st.stride * 0.25, k);
    fEy = lerp(-76, -76, k);
    fHx = lerp(-46, 6 - st.stride * 0.55, k);
    fHy = lerp(-72, -54, k);

    bEx = lerp(-28, -6 + st.stride * 0.25, k);
    bEy = lerp(-84, -76, k);
    bHx = lerp(-48, -7 + st.stride * 0.55, k);
    bHy = lerp(-82, -55, k);
  }
  $('s1ArmF').setAttribute('d', `M 2 -98 L ${fEx.toFixed(1)} ${fEy.toFixed(1)} L ${fHx.toFixed(1)} ${fHy.toFixed(1)}`);
  $('s1ArmB').setAttribute('d', `M -3 -98 L ${bEx.toFixed(1)} ${bEy.toFixed(1)} L ${bHx.toFixed(1)} ${bHy.toFixed(1)}`);

  // Broom in left foreground
  $('s1Broom').setAttribute('transform', `translate(${st.broomX.toFixed(1)},785) rotate(${st.broomAngle.toFixed(2)})`);

  // Sliding door panel
  $('s1DoorPanel').setAttribute('transform', `translate(${st.doorX.toFixed(1)},0)`);

  // 0:04 Steps into the light and becomes a thin dark outline against the glow
  const f = st.outlineFade;
  $('s1FaceRight').setAttribute('opacity', st.headX > 0 ? (1 - f).toFixed(2) : '0');
  $('s1Obi').setAttribute('opacity', (1 - f * 0.85).toFixed(2));
  $('s1HeadRim').setAttribute('opacity', lerp(0.48, 0.94, f).toFixed(2));
  $('s1TorsoRim').setAttribute('opacity', lerp(0.42, 0.90, f).toFixed(2));
  $('s1KimonoBody').setAttribute('transform', `scale(${(1 - f * 0.18).toFixed(3)}, 1)`);
  $('s1HeadCore').setAttribute('r', (22 - f * 1.6).toFixed(2));
}

// ---------- TIMELINE (5.0s) ----------
let sceneTl = null;

function resetScene1ToStart() {
  if (sceneTl) { sceneTl.kill(); sceneTl = null; }
  Object.assign(st, {
    charX: 180,
    bob: 0,
    stride: 0,
    torsoTilt: -3,
    headX: -2,
    headRot: -14,
    armPhase: 0,
    broomX: 147,
    broomAngle: 0,
    doorX: 105,
    outlineFade: 0
  });
  gsap.set('#s1Camera', { scale: 1, svgOrigin: '270 590' });
  gsap.set('#s1FaceLeft', { opacity: 1 });
  gsap.set('#s1FaceRight', { opacity: 0 });
  gsap.set('#s1Bun', { attr: { cx: 19 } });
  gsap.set('#s1HeadRim', { attr: { cx: 1.6 } });
  gsap.set('#s1FootF', { attr: { d: 'M -14 42 L 2 42 L 4 48 L -16 48 Z' } });
  gsap.set('#s1FootB', { attr: { d: 'M -12 42 L 4 42 L 6 48 L -14 48 Z' } });
  gsap.set('#s1KnockR1, #s1KnockR2', { attr: { r: 3 }, opacity: 0 });
  gsap.set('#s1BeamGroup', { opacity: 0.9 });
  gsap.set('.s1Dust', { opacity: 0, y: 0, x: 0 });
  render();
  replayBtn.textContent = '↺ 0.0s';
}

function playScene1() {
  resetScene1ToStart();
  sceneTl = gsap.timeline({
    onUpdate: () => {
      render();
      replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
    },
    onComplete: () => replayBtn.textContent = '↺ 5.0s'
  });

  // Camera: Static, very slow push-in the whole scene
  sceneTl.to('#s1Camera', { scale: 1.06, svgOrigin: '280 595', duration: 5.0, ease: 'power1.inOut' }, 0);

  // Light beam pulses very slightly + dust floats in the beam
  sceneTl.to('#s1BeamGroup', { opacity: 1.0, duration: 1.25, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 0);
  sceneTl.fromTo('.s1Dust',
    { opacity: 0, y: 0, x: 0 },
    { opacity: 0.72, y: -32, x: i => (i % 2 ? 10 : -8), duration: 4.5, stagger: 0.25, ease: 'sine.out', immediateRender: false },
    0.15
  );

  // 0:00: One soft wooden knock + soft wind & drone fade in
  sceneTl.call(() => { playWindAndDrone(4.95); playWoodKnock(); }, null, 0.02);

  // 0:01: Slowly lowers the broom with both hands and leans it against the wall on the left; tilts slightly and settles
  sceneTl.to(st, { armPhase: 1, duration: 0.6, ease: 'power2.inOut' }, 0.95);
  sceneTl.to(st, { broomX: 122, broomAngle: -16.5, duration: 0.65, ease: 'power2.out' }, 1.0);
  sceneTl.call(playWoodKnock, null, 1.55);
  sceneTl.to(st, { broomAngle: -14.0, duration: 0.35, ease: 'bounce.out' }, 1.65);
  sceneTl.fromTo('#s1KnockR1', { attr: { r: 3 }, opacity: 0.5 }, { attr: { r: 20 }, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, 1.55);
  sceneTl.fromTo('#s1KnockR2', { attr: { r: 3 }, opacity: 0.35 }, { attr: { r: 30 }, opacity: 0, duration: 0.6, ease: 'power2.out', immediateRender: false }, 1.62);

  // 0:02: Lifts head, turns body right, looks at glowing doorway; arms drop loose at sides + door slides
  sceneTl.to(st, { armPhase: 2, torsoTilt: 0, headX: 2, headRot: 0, duration: 0.55, ease: 'power2.out' }, 2.0);
  sceneTl.set('#s1FaceLeft', { opacity: 0 }, 2.22);
  sceneTl.set('#s1FaceRight', { opacity: 1 }, 2.22);
  sceneTl.set('#s1Bun', { attr: { cx: -19 } }, 2.22);
  sceneTl.set('#s1FootF', { attr: { d: 'M 0 42 L 16 42 L 18 48 L -2 48 Z' } }, 2.22);
  sceneTl.set('#s1FootB', { attr: { d: 'M -4 42 L 12 42 L 14 48 L -6 48 Z' } }, 2.22);

  sceneTl.call(playShojiSlide, null, 2.2);
  sceneTl.to(st, { doorX: 142, duration: 0.9, ease: 'power2.inOut' }, 2.2);

  // 0:03: Walks right toward the door, 4 slow steady steps, shoulders relaxed, head up, no looking back
  const steps = [
    [2.65, 224, 7.0],
    [3.12, 268, -7.0],
    [3.59, 314, 7.0],
    [4.06, 362, -6.5]
  ];
  steps.forEach(([t, targetX, strideVal]) => {
    sceneTl.call(() => playWoodStep(0.075), null, t)
      .to(st, { charX: targetX, duration: 0.45, ease: 'none' }, t)
      .to(st, { stride: strideVal, duration: 0.225, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t)
      .to(st, { bob: -1.6, duration: 0.225, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t);
  });
  sceneTl.call(() => { st.stride = 0; st.bob = 0; render(); }, null, 4.54);

  // 0:04: Steps into the light and becomes a thin dark outline against the glow
  sceneTl.to(st, { outlineFade: 1, duration: 0.85, ease: 'power2.inOut' }, 4.0);
}

playBtn.addEventListener('click', () => { initAudio(); playScene1(); });
replayBtn.addEventListener('click', () => { resetScene1ToStart(); });
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = '🔊 Sound: ' + (soundEnabled ? 'ON' : 'OFF');
  if (soundEnabled) initAudio();
});

window.addEventListener('load', () => {
  resetScene1ToStart();
  setTimeout(playScene1, 250);
});
</script>
