<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 2: Waking Up & The Candle (6.0s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim-cool: #60a5fa;
      --rim-warm: #fcd34d;
      --shirt: #2d3748;
      --blanket: #1e293b;
      --blanket-fold: #334155;
      --wood: #171316;
      --bamboo: #b45309;
      --bamboo-hi: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #070911;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Dark 1800s Interior Wall -->
        <linearGradient id="s2WallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070911"/>
          <stop offset="65%" stop-color="#0d111d"/>
          <stop offset="100%" stop-color="#131826"/>
        </linearGradient>

        <!-- Pre-Dawn Window Sky Outside -->
        <linearGradient id="s2OutsideSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#09101f"/>
          <stop offset="100%" stop-color="#17233b"/>
        </linearGradient>

        <!-- Cool Pre-Dawn Window Light Beam -->
        <linearGradient id="s2WindowBeam" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
        </linearGradient>

        <!-- Warm Candlelight Radial Glow -->
        <radialGradient id="s2CandleGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
          <stop offset="28%" stop-color="#f59e0b" stop-opacity="0.38"/>
          <stop offset="65%" stop-color="#d97706" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>

        <!-- Wooden Floor -->
        <linearGradient id="s2FloorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0c0e14"/>
          <stop offset="100%" stop-color="#050609"/>
        </linearGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s2Camera">
        <!-- Bedroom Wall & Floor -->
        <rect width="540" height="775" fill="url(#s2WallGrad)"/>
        <!-- Subtle Wainscoting Wall Trim -->
        <rect x="0" y="545" width="540" height="6" fill="#161c2c"/>
        <rect x="0" y="775" width="540" height="185" fill="url(#s2FloorGrad)"/>

        <!-- Warm Candle Ambient Room Wash (Fades In When Candle Lights Up) -->
        <circle id="s2RoomWarmWash" cx="122" cy="545" r="340" fill="url(#s2CandleGlow)" opacity="0"/>

        <!-- BEDROOM WINDOW (Right Side — Showing Outside Bamboo Pole Tapping) -->
        <g transform="translate(335, 195)">
          <!-- Window Frame -->
          <rect x="-10" y="-10" width="160" height="235" rx="3" fill="#181f30"/>
          <!-- Outside Pre-Dawn Sky -->
          <rect x="0" y="0" width="140" height="215" fill="url(#s2OutsideSky)"/>

          <!-- Outside Bamboo Pole Reaching Up From Bottom-Right -->
          <g id="s2OutsidePole">
            <line x1="128" y1="225" x2="56" y2="128" stroke="var(--bamboo)" stroke-width="5.5" stroke-linecap="round"/>
            <line x1="127" y1="225" x2="55" y2="128" stroke="var(--bamboo-hi)" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
            <!-- Bamboo Node & Soft Tip -->
            <circle cx="92" cy="176" r="3" fill="#78350f"/>
            <circle cx="56" cy="128" r="3.8" fill="#fde68a"/>
          </g>

          <!-- Wooden Window Panes / Mullions -->
          <rect x="67" y="0" width="6" height="215" fill="#0d1018"/>
          <rect x="0" y="105" width="140" height="6" fill="#0d1018"/>
          <!-- Stone/Wood Window Sill -->
          <rect x="-15" y="215" width="170" height="12" rx="2" fill="#212a3f"/>

          <!-- Indoor Glass Tap Ripples (Hidden at 0.0s) -->
          <circle id="s2Ripple1" cx="56" cy="128" r="3" fill="none" stroke="#fde68a" stroke-width="2" opacity="0"/>
          <circle id="s2Ripple2" cx="56" cy="128" r="3" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0"/>
        </g>

        <!-- Soft Pre-Dawn Light Cone Entering Room -->
        <polygon points="335,205 475,205 310,775 95,775" fill="url(#s2WindowBeam)" pointer-events="none"/>

        <!-- VINTAGE WOODEN NIGHTSTAND & CANDLE (Left Side) -->
        <g transform="translate(76, 588)">
          <!-- Nightstand Shadow -->
          <ellipse cx="46" cy="190" rx="52" ry="6" fill="#020305" opacity="0.9"/>
          <!-- Nightstand Legs & Cabinet -->
          <rect x="10" y="35" width="7" height="152" fill="#0c0a0d"/>
          <rect x="75" y="35" width="7" height="152" fill="#0c0a0d"/>
          <rect x="8" y="8" width="76" height="58" rx="2" fill="var(--wood)"/>
          <rect x="14" y="15" width="64" height="20" rx="1.5" fill="#211c20"/>
          <circle cx="46" cy="25" r="2.2" fill="#94a3b8"/>
          <!-- Table Top -->
          <rect x="2" y="0" width="88" height="8" rx="2" fill="#262025"/>

          <!-- Brass Chamberstick Holder & Wax Candle -->
          <g transform="translate(46, 0)">
            <!-- Brass Dish & Ring Handle -->
            <ellipse cx="0" cy="-1.5" rx="15" ry="3" fill="#b45309"/>
            <path d="M 13 -2 Q 21 -2 21 -8 Q 21 -13 14 -12" fill="none" stroke="#d97706" stroke-width="2"/>
            <!-- Wax Candle Body -->
            <rect x="-4.5" y="-34" width="9" height="32" rx="1.5" fill="#e2e8f0"/>
            <!-- Melted Wax Drip -->
            <path d="M -4.5 -32 Q -6 -24 -4.5 -20" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
            <!-- Wick -->
            <line x1="0" y1="-34" x2="0" y2="-39" stroke="#090b10" stroke-width="1.5"/>

            <!-- CANDLE FLAME & LOCAL HALO (Hidden Until Worker Lights It) -->
            <g id="s2CandleFlameGroup" opacity="0" transform="translate(0, -45)">
              <circle cx="0" cy="0" r="46" fill="url(#s2CandleGlow)"/>
              <path id="s2FlameShape" d="M 0 -11 C 5 -4, 5 4, 0 7 C -5 4, -5 -4, 0 -11 Z" fill="#f59e0b"/>
              <path d="M 0 -6 C 2.5 -2, 2.5 3, 0 5 C -2.5 3, -2.5 -2, 0 -6 Z" fill="#fef9c3"/>
            </g>
          </g>
        </g>

        <!-- 1800s WOODEN BED & SLEEPER CHARACTER RIG -->
        <g transform="translate(175, 515)">
          <!-- Bed Floor Shadow -->
          <ellipse cx="145" cy="264" rx="155" ry="8" fill="#020305" opacity="0.95"/>

          <!-- Wooden Headboard (Left) & Footboard (Right) -->
          <rect x="0" y="35" width="14" height="225" rx="3" fill="#141115"/>
          <circle cx="7" cy="30" r="8" fill="#1e1920"/>
          <rect x="275" y="110" width="12" height="150" rx="3" fill="#141115"/>
          <circle cx="281" cy="105" r="7" fill="#1e1920"/>

          <!-- Mattress & Fluffed Pillow -->
          <rect x="14" y="165" width="261" height="36" rx="6" fill="#1e2433"/>
          <path d="M 16 165 Q 52 142 88 166 Z" fill="#cbd5e1" opacity="0.88"/>

          <!-- WORKER CHARACTER (Starts Lying Down Asleep, Sits Upright When Knocked) -->
          <g id="s2SleeperPivot" transform="translate(86, 168)">
            <!-- Upper Torso (Extended Deep Beneath Blanket so Zero Clipping Occurs) -->
            <path d="M -14 -48 L 16 -48 L 22 28 L -18 28 Z" fill="var(--shirt)"/>
            <!-- Shirt Collar -->
            <path d="M -8 -48 Q 1 -40 10 -48" fill="none" stroke="#94a3b8" stroke-width="2"/>

            <!-- Back Arm -->
            <path id="s2ArmBack" d="M -4 -36 L 14 -18 L 28 -16" fill="none" stroke="#1e2533" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Zenspiris Signature Head (Exact r=22) -->
            <g id="s2Head" transform="translate(2, -72)">
              <!-- Cool Window Rim (Right) -->
              <circle cx="1.6" cy="0" r="22" fill="var(--rim-cool)" opacity="0.45"/>
              <!-- Warm Candle Rim (Left — Fades In When Candle Lights) -->
              <circle id="s2HeadWarmRim" cx="-1.8" cy="0" r="22" fill="var(--rim-warm)" opacity="0"/>
              <circle cx="0" cy="0" r="22" fill="var(--head)"/>

              <!-- Sleeping Closed Eyes (Downward Curved ◡ ◡) -->
              <g id="s2EyesClosed">
                <path d="M 5 -2 Q 8 1.5 11 -2" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                <path d="M 13 -2 Q 16 1.5 19 -2" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
              </g>

              <!-- Awake Open Eyes (Crisp Off-White Dots) -->
              <g id="s2EyesOpen" opacity="0">
                <circle cx="8" cy="-2" r="2.2" fill="var(--face)"/>
                <circle cx="16" cy="-2" r="2.2" fill="var(--face)"/>
              </g>

              <!-- Mouth -->
              <line id="s2Mouth" x1="9" y1="7" x2="15" y2="7" stroke="var(--face)" stroke-width="1.8" stroke-linecap="round"/>
            </g>

            <!-- Front Arm (Reaches Left Toward Candle at 3.5s) -->
            <path id="s2ArmFront" d="M 2 -36 L 18 -14 L 34 -12" fill="none" stroke="var(--head)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Floating Sleeping "z Z Z" Indicators -->
          <g id="s2ZzzGroup" fill="#94a3b8" font-family="sans-serif" font-weight="700">
            <text id="s2Z1" x="62" y="102" font-size="13" opacity="0">z</text>
            <text id="s2Z2" x="74" y="84" font-size="16" opacity="0">Z</text>
            <text id="s2Z3" x="90" y="64" font-size="19" opacity="0">Z</text>
          </g>

          <!-- HEAVY WOOL BLANKET FOREGROUND LAYER (Covers Lower Torso Cleanly) -->
          <path d="M 58 164 Q 165 152 275 166 L 275 202 L 58 202 Z" fill="var(--blanket)"/>
          <!-- Blanket Folded Cuff -->
          <path d="M 54 162 Q 72 158 84 164 L 80 198 L 54 198 Z" fill="var(--blanket-fold)"/>

          <!-- Wooden Bed Frame Rail -->
          <rect x="14" y="198" width="261" height="22" fill="#1c171d"/>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button class="primary" id="playBtn">▶ Play (6.0s)</button>
    <button id="replayBtn">↺ 0.0s</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Muffled Indoor Glass Tap (Heard From Inside Bedroom)
    function playIndoorGlassTap() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      [1420, 2450].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.78, now + 0.07);
        gain.gain.setValueAtTime(i === 0 ? 0.14 : 0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      });
    }

    // Soft Wool Blanket / Bed Sheet Rustle
    function playBedRustle() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const duration = 0.42;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(750, now);
      filter.Q.setValueAtTime(1.4, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.075, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    // Match Strike & Candle Spark Ignition Foley
    function playCandleSpark() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const duration = 0.35;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(2200, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.09, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      // Warm Soft Flame Bloom Tone
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, now + 0.05);
      osc.frequency.exponentialRampToValueAtTime(380, now + 0.32);
      oscGain.gain.setValueAtTime(0.001, now + 0.05);
      oscGain.gain.linearRampToValueAtTime(0.045, now + 0.14);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now + 0.05);
      osc.stop(now + 0.4);
    }

    let sceneTl = null;

    function triggerIndoorRipple(tl, time) {
      tl.call(() => playIndoorGlassTap(), null, time);
      tl.fromTo('#s2Ripple1',
        { attr: { r: 3 }, opacity: 0.85 },
        { attr: { r: 26 }, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false },
        time
      );
      tl.fromTo('#s2Ripple2',
        { attr: { r: 2 }, opacity: 0.65 },
        { attr: { r: 16 }, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false },
        time + 0.05
      );
    }

    function playScene2() {
      if (sceneTl) sceneTl.kill();

      // Clean Reset to 0.0s
      gsap.set('#s2Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s2SleeperPivot', { rotation: -78, svgOrigin: '0 0' });
      gsap.set('#s2Head', { rotation: 14, svgOrigin: '2 -72' });
      gsap.set('#s2EyesClosed', { opacity: 1 });
      gsap.set('#s2EyesOpen', { opacity: 0 });
      gsap.set('#s2HeadWarmRim', { opacity: 0 });
      gsap.set('#s2OutsidePole', { rotation: -7, svgOrigin: '128 225' });
      gsap.set('#s2ArmFront', { attr: { d: 'M 2 -36 L 18 -14 L 34 -12' } });
      gsap.set('#s2CandleFlameGroup', { opacity: 0, scale: 0.4, svgOrigin: '0 0' });
      gsap.set('#s2RoomWarmWash', { opacity: 0 });
      gsap.set(['#s2Ripple1', '#s2Ripple2'], { opacity: 0, attr: { r: 3 } });
      gsap.set(['#s2Z1', '#s2Z2', '#s2Z3'], { opacity: 0, y: 0 });

      sceneTl = gsap.timeline();

      // Gentle camera drift
      sceneTl.to('#s2Camera', {
        scale: 1.06,
        svgOrigin: '260 470',
        duration: 6.0,
        ease: 'power1.inOut'
      }, 0);

      // 0.0s - 1.6s: Floating z Z Z while sleeping
      ['#s2Z1', '#s2Z2', '#s2Z3'].forEach((zId, idx) => {
        sceneTl.fromTo(zId,
          { opacity: 0, y: 4 },
          { opacity: 0.75, y: -12, duration: 0.9, ease: 'sine.out', immediateRender: false },
          idx * 0.35
        );
      });

      // Two muffled glass taps outside window (0.75s & 1.55s)
      [0.75, 1.55].forEach((t) => {
        sceneTl.to('#s2OutsidePole', {
          rotation: 0,
          duration: 0.13,
          ease: 'power2.in'
        }, t - 0.13);

        triggerIndoorRipple(sceneTl, t);

        sceneTl.to('#s2OutsidePole', {
          rotation: -4,
          duration: 0.3,
          ease: 'power2.out'
        }, t + 0.02);
      });

      // 1.75s: Startled awake — z Z Z vanishes, eyes open, sits upright
      sceneTl.to(['#s2Z1', '#s2Z2', '#s2Z3'], { opacity: 0, duration: 0.2 }, 1.72);
      sceneTl.set('#s2EyesClosed', { opacity: 0 }, 1.78);
      sceneTl.set('#s2EyesOpen', { opacity: 1 }, 1.78);
      sceneTl.call(() => playBedRustle(), null, 1.8);

      sceneTl.to('#s2SleeperPivot', {
        rotation: 0,
        duration: 0.72,
        ease: 'back.out(1.2)'
      }, 1.8);

      sceneTl.to('#s2Head', {
        rotation: 0,
        duration: 0.65,
        ease: 'power2.out'
      }, 1.85);

      // 2.65s: Outside bamboo pole lowers away after seeing him wake up
      sceneTl.to('#s2OutsidePole', {
        rotation: -28,
        opacity: 0.25,
        duration: 0.9,
        ease: 'power2.in'
      }, 2.65);

      // 3.2s: Turns head left toward nightstand and reaches out to light candle
      sceneTl.to('#s2Head', {
        scaleX: -1,
        svgOrigin: '2 -72',
        duration: 0.28,
        ease: 'power1.inOut'
      }, 3.2);

      sceneTl.to('#s2ArmFront', {
        attr: { d: 'M -2 -36 L -28 -32 L -56 -22' },
        duration: 0.45,
        ease: 'power2.out'
      }, 3.35);

      // 3.85s: Candle lights up & warm golden glow fills the room
      sceneTl.call(() => playCandleSpark(), null, 3.85);

      sceneTl.to('#s2CandleFlameGroup', {
        opacity: 1,
        scale: 1,
        duration: 0.4,
        ease: 'back.out(1.6)'
      }, 3.85);

      sceneTl.to('#s2RoomWarmWash', {
        opacity: 0.95,
        duration: 0.85,
        ease: 'power2.out'
      }, 3.88);

      sceneTl.to('#s2HeadWarmRim', {
        opacity: 0.65,
        duration: 0.75,
        ease: 'power2.out'
      }, 3.9);

      // Arm returns to resting position while candle flickers gently
      sceneTl.to('#s2ArmFront', {
        attr: { d: 'M -2 -36 L -14 -14 L -26 -10' },
        duration: 0.5,
        ease: 'power2.inOut'
      }, 4.35);

      sceneTl.to('#s2FlameShape', {
        scaleX: 0.88,
        scaleY: 1.08,
        rotation: 3,
        svgOrigin: '0 0',
        duration: 0.35,
        yoyo: true,
        repeat: 4,
        ease: 'sine.inOut'
      }, 4.25);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene2();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      if (sceneTl) sceneTl.pause(0);
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene2, 250);
    });
  </script>
</body>
</html>
