<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenspiris — The Ember Doorway Scene 2: Ridge of Walkers (10.0s + Foley SFX)</title>
<style>
:root{--head:#0d0b12;--face:#f2ede2;--rim:#fcd34d;--rim-cool:#60a5fa}
*{box-sizing:border-box;margin:0}
body{background:#040406;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;font-family:system-ui,sans-serif}
.stage-wrapper{position:relative;width:100vw;max-width:355px;aspect-ratio:9/16;background:#070911;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.95)}
svg.scene-svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 36%,rgba(3,4,8,.92) 100%)}
.letterbox{position:absolute;left:0;right:0;height:5.5%;background:#000;z-index:12}
.letterbox.top{top:0;border-bottom:1px solid rgba(252,211,77,.35)}
.letterbox.bottom{bottom:0;border-top:1px solid rgba(252,211,77,.35)}
.controls{display:flex;gap:8px}
.controls button{background:#16161f;color:#cbd5e1;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.controls button.primary{background:#1e3a5f;border-color:#3b6ea8;color:#fff}
.hd{fill:var(--head)}.fc{fill:var(--face)}.fs{stroke:var(--face);stroke-linecap:round;fill:none}
</style>
</head>
<body>
<div class="stage-wrapper">
<div class="letterbox top"></div><div class="letterbox bottom"></div><div class="vignette"></div>
<svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Dark night sky transitioning to teal haze and faint ember horizon -->
  <linearGradient id="s2Sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04060c"/>
    <stop offset=".42" stop-color="#09131d"/>
    <stop offset=".68" stop-color="#0f2933"/>
    <stop offset=".85" stop-color="#29211d"/>
    <stop offset="1" stop-color="#5c2d16"/>
  </linearGradient>
  <!-- Faint ember glow on distant horizon -->
  <radialGradient id="s2HorizonEmber" cx="72%" cy="66%" r="55%">
    <stop offset="0" stop-color="#f59e0b" stop-opacity=".38"/>
    <stop offset=".45" stop-color="#b45309" stop-opacity=".18"/>
    <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
  </radialGradient>
  <!-- Teal mist band across valley -->
  <linearGradient id="s2TealHaze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#14b8a6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#0d9488" stop-opacity=".24"/>
    <stop offset="1" stop-color="#042f2e" stop-opacity="0"/>
  </linearGradient>
  <!-- Ridge & foreground earth -->
  <linearGradient id="s2RidgeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0f18"/>
    <stop offset="1" stop-color="#04060a"/>
  </linearGradient>
</defs>

<g id="s2Camera">
  <!-- Sky & Horizon Glow -->
  <rect x="0" y="0" width="540" height="720" fill="url(#s2Sky)"/>
  <ellipse id="s2EmberGlow" cx="390" cy="610" rx="340" ry="180" fill="url(#s2HorizonEmber)" opacity=".85"/>

  <!-- Pale distant moon -->
  <circle cx="115" cy="230" r="46" fill="#5eead4" opacity=".06"/>
  <circle cx="115" cy="230" r="11" fill="#ccfbf1" opacity=".45"/>

  <!-- Far distant mountain range -->
  <path d="M -20 580 Q 95 520 210 565 Q 340 505 460 555 L 560 535 L 560 720 L -20 720 Z" fill="#08121a"/>

  <!-- Lower teal haze mist layer -->
  <rect id="s2Haze1" x="-40" y="485" width="620" height="175" fill="url(#s2TealHaze)" opacity=".85"/>

  <!-- Mid-ground winding ridge path (distant walkers travel along this line) -->
  <path d="M -30 645 Q 140 605 295 628 Q 425 648 570 612 L 570 760 L -30 760 Z" fill="#070b12"/>

  <!-- Distant River of Walkers (grows from a thin line into a long dark stream) -->
  <g id="s2DistantRiver"></g>

  <!-- Upper teal haze drift over mid-ridge -->
  <rect id="s2Haze2" x="-60" y="575" width="660" height="135" fill="url(#s2TealHaze)" opacity=".75"/>

  <!-- Foreground dark ridge & dirt path (y ≈ 785) -->
  <path d="M -20 770 Q 180 755 370 774 L 560 785 L 560 960 L -20 960 Z" fill="url(#s2RidgeGrad)"/>
  <!-- Subtle dirt path texture & warm ember edge highlight along ridge crest -->
  <path d="M -20 771 Q 180 756 370 775 L 560 786" stroke="#f59e0b" stroke-width="1.6" fill="none" opacity=".28"/>
  <path d="M 30 815 Q 240 802 490 822" stroke="#111927" stroke-width="2" fill="none"/>
  <path d="M -10 865 Q 270 850 530 875" stroke="#0d1420" stroke-width="2" fill="none"/>

  <!-- Foreground Hero Walker (same character & costume from Scene 1) -->
  <g id="s2Hero" transform="translate(85, 772)">
    <ellipse cx="0" cy="2" rx="28" ry="5.5" fill="#000" opacity=".9"/>
    <!-- back leg -->
    <g id="s2HeroLegB" transform="translate(-4,-50)">
      <path d="M 0 0 L -1 26 L -3 47" stroke="#08070c" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M -6 44 L 10 44 L 11 50 L -8 50 Z" fill="#08070c"/>
    </g>
    <!-- front leg -->
    <g id="s2HeroLegF" transform="translate(4,-50)">
      <path d="M 0 0 L 1 26 L 4 47" stroke="#0d0b12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 0 44 L 14 44 L 15 50 L -2 50 Z" class="hd"/>
    </g>
    <!-- far arm -->
    <path d="M -7 -100 L -13 -77 L -11 -56" stroke="#18202c" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- torso warm ember rim light -->
    <path d="M -11.5 -108 L 15.5 -108 L 19.5 -26 L -14.5 -26 Z" fill="#fcd34d" opacity=".42"/>
    <!-- torso trapezoid -->
    <path d="M -13 -108 L 14 -108 L 18 -26 L -16 -26 Z" fill="#1e2330"/>
    <!-- same muted scarf from Scene 1 -->
    <path d="M -13 -108 L 14 -108 L 15 -97 L -14 -97 Z" fill="#2d3748"/>
    <path d="M 2 -98 L 11 -98 L 12 -74 L 3 -76 Z" fill="#242c3a"/>
    <!-- front arm -->
    <path id="s2HeroArm" d="M 3 -100 L 10 -78 L 13 -57" stroke="#0d0b12" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- head group -->
    <g id="s2HeroHead" transform="translate(1,-130) rotate(2)">
      <circle cx="1.6" cy="0" r="22" fill="#fcd34d" opacity=".48"/>
      <circle cx="0" cy="0" r="22" class="hd"/>
      <circle class="fc" cx="10.5" cy="-2" r="2.1"/>
      <circle class="fc" cx="17.5" cy="-2" r="2.1"/>
      <line class="fs" x1="9" y1="7" x2="15" y2="7" stroke-width="1.8"/>
    </g>
  </g>

  <!-- Secondary Foreground/Midground Walkers joining the river -->
  <g id="s2MidWalkers"></g>
</g>
</svg>
</div>

<div class="controls">
  <button id="playBtn" class="primary">▶ Play (10.0s)</button>
  <button id="replayBtn">↺ 0.0s</button>
  <button id="soundBtn">🔊 Sound: ON</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const playBtn = $('playBtn'), replayBtn = $('replayBtn'), soundBtn = $('soundBtn');

// ---------- PROCEDURAL WEB AUDIO FOLEY ----------
let audioCtx = null, soundEnabled = true;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Single soft dirt-path footstep (volume & layer density increase over time)
function playDirtStep(volume = 0.09, pitchShift = 1.0) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;

  // Low thud
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(105 * pitchShift, t);
  osc.frequency.exponentialRampToValueAtTime(38 * pitchShift, t + 0.085);
  gain.gain.setValueAtTime(volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.095);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.1);

  // Subtle dirt grit crunch
  const n = Math.floor(audioCtx.sampleRate * 0.07);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 950 * pitchShift;
  filter.Q.value = 1.8;
  const nGain = audioCtx.createGain();
  nGain.gain.setValueAtTime(volume * 0.42, t);
  nGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  src.connect(filter).connect(nGain).connect(audioCtx.destination);
  src.start(t);
}

// Gentle wind across open land + swelling low ambient drone (10.0s)
function playOpenWindAndDrone(dur = 9.9) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;

  // Gentle wind across open ridge
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;

  const windSrc = audioCtx.createBufferSource();
  windSrc.buffer = buf;
  const windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.setValueAtTime(240, t);
  windFilter.frequency.linearRampToValueAtTime(310, t + 5.0);
  windFilter.frequency.linearRampToValueAtTime(260, t + dur);
  windFilter.Q.value = 2.4;

  const windGain = audioCtx.createGain();
  windGain.gain.setValueAtTime(0.0001, t);
  windGain.gain.linearRampToValueAtTime(0.028, t + 1.5);
  windGain.gain.linearRampToValueAtTime(0.032, t + dur - 0.6);
  windGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  windSrc.connect(windFilter).connect(windGain).connect(audioCtx.destination);
  windSrc.start(t);

  // Swelling dark atmospheric drone (C2 + G2 + fifth harmonic swell)
  const d1 = audioCtx.createOscillator();
  const d2 = audioCtx.createOscillator();
  const d3 = audioCtx.createOscillator();
  const dGain = audioCtx.createGain();

  d1.type = 'sine';
  d2.type = 'triangle';
  d3.type = 'sine';
  d1.frequency.setValueAtTime(65.4, t);   // C2
  d2.frequency.setValueAtTime(98.0, t);   // G2
  d3.frequency.setValueAtTime(130.8, t);  // C3

  dGain.gain.setValueAtTime(0.018, t);
  dGain.gain.linearRampToValueAtTime(0.042, t + 4.5);
  dGain.gain.linearRampToValueAtTime(0.072, t + 8.6);
  dGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  d1.connect(dGain);
  d2.connect(dGain);
  d3.connect(dGain);
  dGain.connect(audioCtx.destination);

  d1.start(t); d2.start(t); d3.start(t);
  d1.stop(t + dur + 0.05); d2.stop(t + dur + 0.05); d3.stop(t + dur + 0.05);
}

// ---------- POPULATE DISTANT RIVER & MIDGROUND WALKERS ----------
const svgNS = 'http://www.w3.org/2000/svg';
const distantRiver = $('s2DistantRiver');
const midWalkers = $('s2MidWalkers');

// 34 small silhouette figures forming a thin line that grows into a long dark river along the mid-ridge
const riverNodes = [];
const totalDistant = 34;
for (let i = 0; i < totalDistant; i++) {
  const frac = i / (totalDistant - 1);
  // Path curves across screen from x=-30 to x=560
  const baseX = -25 + frac * 585;
  const ridgeY = 626 + Math.sin(frac * Math.PI * 1.4) * 14 - frac * 12;
  const scale = 0.24 + Math.sin(frac * Math.PI) * 0.14;

  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('transform', `translate(${baseX.toFixed(1)},${ridgeY.toFixed(1)}) scale(${scale.toFixed(2)})`);
  g.setAttribute('opacity', '0');

  // Rim highlight + dark figure silhouette
  g.innerHTML = `
    <circle cx="1.5" cy="-128" r="21" fill="#fcd34d" opacity=".45"/>
    <circle cx="0" cy="-128" r="21" fill="#090c14"/>
    <path d="M -12 -106 L 13 -106 L 17 -24 L -15 -24 Z" fill="#090c14"/>
    <path d="M -5 -26 L -7 0 M 5 -26 L 8 0" stroke="#090c14" stroke-width="9" stroke-linecap="round"/>
  `;
  distantRiver.appendChild(g);
  riverNodes.push({ el: g, baseX, ridgeY, scale, phase: i * 0.7 });
}

// 4 secondary foreground/midground walkers trailing behind & ahead of the hero
const secondarySpecs = [
  { id: 'w1', startX: -45,  endX: 165, y: 766, scale: 0.78, delay: 1.8, scarf: '#1e3a3a' },
  { id: 'w2', startX: -120, endX: 95,  y: 774, scale: 0.86, delay: 3.4, scarf: '#334155' },
  { id: 'w3', startX: 195,  endX: 435, y: 764, scale: 0.74, delay: 0.4, scarf: '#292524' },
  { id: 'w4', startX: -195, endX: 30,  y: 778, scale: 0.92, delay: 5.0, scarf: '#1f2937' }
];

const midState = secondarySpecs.map(spec => {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('transform', `translate(${spec.startX},${spec.y}) scale(${spec.scale})`);
  g.setAttribute('opacity', '0');
  g.innerHTML = `
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#000" opacity=".85"/>
    <g class="legB" transform="translate(-4,-50)">
      <path d="M 0 0 L -1 26 L -3 47" stroke="#08070c" stroke-width="10.5" stroke-linecap="round" fill="none"/>
      <path d="M -6 44 L 10 44 L 11 50 L -8 50 Z" fill="#08070c"/>
    </g>
    <g class="legF" transform="translate(4,-50)">
      <path d="M 0 0 L 1 26 L 4 47" stroke="#0d0b12" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M 0 44 L 14 44 L 15 50 L -2 50 Z" fill="#0d0b12"/>
    </g>
    <path d="M -11.5 -108 L 15.5 -108 L 19.5 -26 L -14.5 -26 Z" fill="#fcd34d" opacity=".36"/>
    <path d="M -13 -108 L 14 -108 L 18 -26 L -16 -26 Z" fill="#161b26"/>
    <path d="M -13 -108 L 14 -108 L 15 -97 L -14 -97 Z" fill="${spec.scarf}"/>
    <path class="armF" d="M 3 -100 L 9 -78 L 12 -57" stroke="#0d0b12" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <g transform="translate(1,-130) rotate(2)">
      <circle cx="1.6" cy="0" r="22" fill="#fcd34d" opacity=".42"/>
      <circle cx="0" cy="0" r="22" fill="#0d0b12"/>
      <circle cx="10.5" cy="-2" r="2.1" fill="#f2ede2"/>
      <circle cx="17.5" cy="-2" r="2.1" fill="#f2ede2"/>
      <line x1="9" y1="7" x2="15" y2="7" stroke="#f2ede2" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  `;
  midWalkers.appendChild(g);
  return {
    spec,
    el: g,
    legF: g.querySelector('.legF'),
    legB: g.querySelector('.legB'),
    x: spec.startX,
    stride: 0,
    bob: 0,
    opacity: 0
  };
});

// ---------- RIG STATE ----------
const st = { heroX: 85, heroStride: 0, heroBob: 0, heroArm: 0, riverFlow: 0 };

function render() {
  // Hero walk
  $('s2Hero').setAttribute('transform', `translate(${st.heroX.toFixed(1)},${(772 + st.heroBob).toFixed(1)})`);
  $('s2HeroLegF').setAttribute('transform', `translate(4,-50) rotate(${st.heroStride.toFixed(2)})`);
  $('s2HeroLegB').setAttribute('transform', `translate(-4,-50) rotate(${(-st.heroStride).toFixed(2)})`);
  $('s2HeroArm').setAttribute('d', `M 3 -100 L ${(10 - st.heroStride * 0.4).toFixed(1)} -78 L ${(13 - st.heroStride * 0.9).toFixed(1)} -57`);

  // Secondary walkers
  midState.forEach(w => {
    w.el.setAttribute('transform', `translate(${w.x.toFixed(1)},${(w.spec.y + w.bob).toFixed(1)}) scale(${w.spec.scale})`);
    w.el.setAttribute('opacity', w.opacity.toFixed(2));
    w.legF.setAttribute('transform', `translate(4,-50) rotate(${w.stride.toFixed(2)})`);
    w.legB.setAttribute('transform', `translate(-4,-50) rotate(${(-w.stride).toFixed(2)})`);
  });

  // Distant river continuous march + subtle bob
  riverNodes.forEach((n, idx) => {
    const shiftedX = ((n.baseX + st.riverFlow + 40) % 620) - 40;
    const frac = (shiftedX + 40) / 620;
    const ridgeY = 626 + Math.sin(frac * Math.PI * 1.4) * 14 - frac * 12;
    const bob = Math.abs(Math.sin(st.riverFlow * 0.18 + n.phase)) * 1.4;
    n.el.setAttribute('transform', `translate(${shiftedX.toFixed(1)},${(ridgeY - bob).toFixed(1)}) scale(${n.scale.toFixed(2)})`);
  });
}

// ---------- TIMELINE (10.0s) ----------
let sceneTl = null;

function resetScene2ToStart() {
  if (sceneTl) { sceneTl.kill(); sceneTl = null; }
  Object.assign(st, { heroX: 85, heroStride: 0, heroBob: 0, heroArm: 0, riverFlow: 0 });
  midState.forEach(w => {
    w.x = w.spec.startX;
    w.stride = 0;
    w.bob = 0;
    w.opacity = 0;
  });
  riverNodes.forEach(n => n.el.setAttribute('opacity', '0'));
  gsap.set('#s2Camera', { scale: 1, svgOrigin: '270 640' });
  gsap.set('#s2Haze1', { x: 0 });
  gsap.set('#s2Haze2', { x: 0 });
  gsap.set('#s2EmberGlow', { opacity: 0.72 });
  render();
  replayBtn.textContent = '↺ 0.0s';
}

function playScene2() {
  resetScene2ToStart();
  sceneTl = gsap.timeline({
    onUpdate: () => {
      render();
      replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
    },
    onComplete: () => replayBtn.textContent = '↺ 10.0s'
  });

  // 0.00s - 10.00s: Slow cinematic camera drift across ridge & growing river of silhouettes
  sceneTl.to('#s2Camera', { scale: 1.06, svgOrigin: '295 635', duration: 10.0, ease: 'power1.inOut' }, 0);

  // 0.00s: Gentle open-land wind + swelling atmospheric drone
  sceneTl.call(() => playOpenWindAndDrone(9.9), null, 0.02);

  // Teal haze drifting slowly across the valley + ember sky pulsing faintly
  sceneTl.to('#s2Haze1', { x: 32, duration: 10.0, ease: 'sine.inOut' }, 0);
  sceneTl.to('#s2Haze2', { x: -38, duration: 10.0, ease: 'sine.inOut' }, 0);
  sceneTl.to('#s2EmberGlow', { opacity: 1.0, duration: 6.5, ease: 'sine.inOut' }, 1.5);

  // Continuous distant river progression
  sceneTl.to(st, { riverFlow: 235, duration: 10.0, ease: 'none' }, 0);

  // 0.00s - 10.00s: Hero steady walk along foreground dirt ridge (18 steps, ~0.54s per step)
  sceneTl.to(st, { heroX: 345, duration: 10.0, ease: 'none' }, 0);
  for (let i = 0; i < 18; i++) {
    const stepTime = i * 0.54;
    const dir = i % 2 === 0 ? 8.5 : -8.5;
    sceneTl.to(st, { heroStride: dir, duration: 0.27, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime);
    sceneTl.to(st, { heroBob: -2.0, duration: 0.27, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime);

    // 0.00s - 2.5s: Starts with one lone pair of footsteps on dirt path
    sceneTl.call(() => playDirtStep(0.085, i % 2 === 0 ? 1.0 : 0.94), null, stepTime);
  }

  // 1.50s - 9.00s: Thin line of distant walkers grows into a long dark river of figures
  riverNodes.forEach((n, idx) => {
    // Initially only every 4th figure is visible (thin sparse line), then gaps fill in
    const isInitialThinLine = idx % 4 === 0;
    const appearTime = isInitialThinLine ? (0.2 + (idx / totalDistant) * 1.6) : (2.2 + ((idx * 7) % totalDistant) / totalDistant * 5.8);
    sceneTl.to(n.el, { opacity: 0.92, duration: 0.9, ease: 'power1.out' }, appearTime);
  });

  // Secondary foreground/midground walkers enter & layer more footsteps into a steady tread
  midState.forEach((w, wIdx) => {
    const startT = w.spec.delay;
    const walkDur = 10.0 - startT;
    sceneTl.to(w, { opacity: 1, duration: 0.8, ease: 'power1.out' }, startT);
    sceneTl.to(w, { x: w.spec.endX, duration: walkDur, ease: 'none' }, startT);

    const stepInterval = 0.52 + wIdx * 0.03;
    const numSteps = Math.floor(walkDur / stepInterval);
    for (let s = 0; s < numSteps; s++) {
      const tStep = startT + s * stepInterval;
      const sDir = s % 2 === 0 ? 8 : -8;
      sceneTl.to(w, { stride: sDir, duration: stepInterval * 0.5, yoyo: true, repeat: 1, ease: 'sine.inOut' }, tStep);
      sceneTl.to(w, { bob: -1.7, duration: stepInterval * 0.5, yoyo: true, repeat: 1, ease: 'sine.inOut' }, tStep);

      // Layer extra footsteps into audio as crowd grows
      if (tStep > 2.4 && tStep < 9.8) {
        sceneTl.call(() => playDirtStep(0.048, 0.86 + wIdx * 0.07), null, tStep);
      }
    }
  });
}

playBtn.addEventListener('click', () => { initAudio(); playScene2(); });
replayBtn.addEventListener('click', () => { resetScene2ToStart(); });
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = '🔊 Sound: ' + (soundEnabled ? 'ON' : 'OFF');
  if (soundEnabled) initAudio();
});

window.addEventListener('load', () => {
  resetScene2ToStart();
  setTimeout(playScene2, 250);
});
</script>
</body>
</html>
