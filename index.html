<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Scene 2: 2026 to 1720 Time Roll & Village Walk</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #f4c28a;
      --outfit-top: #3b78c4;
      --outfit-bottom: #e8dcc0;
      --outfit-bottom-back: #b8ac92;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #080b14;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(4, 4, 8, 0.9) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Deep 18th Century Midnight Sky -->
        <linearGradient id="nightSky1720" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070a14"/>
          <stop offset="55%" stop-color="#111930"/>
          <stop offset="100%" stop-color="#1a2440"/>
        </linearGradient>

        <!-- Ground Path Gradient -->
        <linearGradient id="earthGround" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#14161f"/>
          <stop offset="40%" stop-color="#0d0e14"/>
          <stop offset="100%" stop-color="#06070a"/>
        </linearGradient>

        <!-- Year Counter Ambient Halo -->
        <radialGradient id="yearHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f4c28a" stop-opacity="0.24"/>
          <stop offset="60%" stop-color="#d97706" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
        </radialGradient>

        <!-- Top/Bottom Fade Mask for Rolling Year Reel -->
        <linearGradient id="reelFadeMask" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="22%" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="78%" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <mask id="yearReelMask">
          <rect x="130" y="255" width="280" height="120" fill="url(#reelFadeMask)"/>
        </mask>

        <!-- Symmetrical Lantern Light Cone -->
        <linearGradient id="lanternCone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.44"/>
          <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="lanternHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.65"/>
          <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s2Camera">
        <rect width="540" height="960" fill="url(#nightSky1720)"/>

        <!-- Crescent Moon & Twinkling Stars -->
        <circle cx="430" cy="185" r="24" fill="#f3f4f6" opacity="0.9"/>
        <circle cx="439" cy="178" r="20" fill="#0d1324"/>

        <g id="s2Stars" fill="#f2ede2">
          <circle class="star" cx="95" cy="165" r="2"/>
          <circle class="star" cx="175" cy="135" r="1.8"/>
          <circle class="star" cx="255" cy="195" r="2.2"/>
          <circle class="star" cx="345" cy="140" r="1.8"/>
          <circle class="star" cx="120" cy="275" r="1.8"/>
          <circle class="star" cx="465" cy="265" r="2"/>
          <circle class="star" cx="210" cy="245" r="1.5"/>
        </g>

        <!-- Distant Rolling Hills & 18th Century Village Cottages -->
        <g id="s2VillageBg">
          <path d="M -60 645 Q 180 575 380 635 T 640 615 L 640 760 L -60 760 Z" fill="#0e1324"/>

          <!-- Cottage 1 -->
          <g transform="translate(85, 558)">
            <rect x="0" y="25" width="76" height="52" fill="#090c17"/>
            <polygon points="-8,25 38,-6 84,25" fill="#06080f"/>
            <rect x="54" y="2" width="10" height="18" fill="#06080f"/>
            <rect x="28" y="42" width="16" height="18" rx="2" fill="#f59e0b" opacity="0.55"/>
          </g>

          <!-- Cottage 2 -->
          <g transform="translate(365, 568)">
            <rect x="0" y="22" width="68" height="46" fill="#090c17"/>
            <polygon points="-7,22 34,-5 75,22" fill="#06080f"/>
            <rect x="24" y="38" width="14" height="15" rx="2" fill="#f59e0b" opacity="0.35"/>
          </g>

          <!-- Bare Silhouette Trees -->
          <g stroke="#080b14" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M 245 628 L 245 572 M 245 595 L 230 580 M 245 588 L 260 574"/>
            <path d="M 485 632 L 485 582 M 485 602 L 472 588 M 485 596 L 498 584"/>
          </g>
        </g>

        <!-- Foreground Dirt Path (Flat Surface at y = 735) -->
        <rect x="0" y="735" width="540" height="225" fill="url(#earthGround)"/>
        <line x1="0" y1="735" x2="540" y2="735" stroke="#1e2538" stroke-width="2"/>

        <!-- =====================================================
             VERTICAL ROLLING YEAR REEL (2026 -> 1720)
             ===================================================== -->
        <g id="yearRewindDisplay">
          <ellipse cx="270" cy="315" rx="145" ry="65" fill="url(#yearHalo)"/>

          <!-- Minimal Cinematic Frame Accent Lines -->
          <line x1="175" y1="274" x2="365" y2="274" stroke="#f4c28a" stroke-width="1" opacity="0.25"/>
          <line x1="175" y1="356" x2="365" y2="356" stroke="#f4c28a" stroke-width="1" opacity="0.25"/>
          <!-- Side Indicator Notches -->
          <polygon points="164,311 172,315 164,319" fill="#f4c28a" opacity="0.7"/>
          <polygon points="376,311 368,315 376,319" fill="#f4c28a" opacity="0.7"/>

          <!-- Masked Rolling Year Strip (Each step = 76px) -->
          <g mask="url(#yearReelMask)">
            <g id="yearStrip" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="54" font-weight="700" text-anchor="middle" letter-spacing="4">
              <text x="270" y="333" fill="#7dd3fc">2026</text>
              <text x="270" y="409" fill="#cbd5e1">2010</text>
              <text x="270" y="485" fill="#cbd5e1">1985</text>
              <text x="270" y="561" fill="#e2e8f0">1950</text>
              <text x="270" y="637" fill="#e2e8f0">1910</text>
              <text x="270" y="713" fill="#fde68a">1870</text>
              <text x="270" y="789" fill="#fde68a">1830</text>
              <text x="270" y="865" fill="#f4c28a">1790</text>
              <text x="270" y="941" fill="#f4c28a">1755</text>
              <text x="270" y="1017" fill="#f4c28a">1735</text>
              <text x="270" y="1093" fill="#f2ede2">1720</text>
            </g>
          </g>
        </g>

        <!-- =====================================================
             CHARACTER RIG WITH ARTICULATED KNEE-BEND WALK CYCLE
             Hip anchored at (0, 0) -> placed at (110, 677) so feet touch y = 735
             ===================================================== -->
        <g id="s2Walker" transform="translate(110, 677)">
          <!-- Ground Contact Shadow -->
          <ellipse cx="4" cy="58" rx="30" ry="6" fill="#040508" opacity="0.85"/>

          <!-- 1. Back Articulated Leg (Thigh hip 0,0 -> knee 0,29 -> Shin calf -> ankle 0,58 + foot) -->
          <g id="s2ThighBack">
            <line x1="-1" y1="0" x2="-1" y2="29" stroke="var(--outfit-bottom-back)" stroke-width="7.5" stroke-linecap="round"/>
            <g id="s2ShinBack">
              <path d="M -1 29 L -1 58 L 8 58" fill="none" stroke="var(--outfit-bottom-back)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- 2. Back Arm & Integrated Sleeve (Shoulder pivot at -1, -55) -->
          <g id="s2ArmBack">
            <path d="M -1 -55 L -5 -32 L -2 -14" fill="none" stroke="#07060a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M -1 -57 L -3 -45.5" fill="none" stroke="#295794" stroke-width="8.4" stroke-linecap="round"/>
            <path d="M -2 -51 L -3 -45.5" fill="none" stroke="#295794" stroke-width="8.4" stroke-linecap="butt"/>
          </g>

          <!-- 3. Slim Torso (Signature Blue #3b78c4) with Rounded Collar Peak & Warm Rim -->
          <g id="s2Torso">
            <path d="M -11 -56 Q -11 -61 -5 -62 Q 0 -66.5 5 -62 Q 12.5 -61 12.5 -56 L 12.5 5 L -11 5 Z" fill="var(--rim)" opacity="0.45"/>
            <path d="M -11 -56 Q -11 -61 -5 -62 Q 0 -66 5 -62 Q 11 -61 11 -56 L 11 5 L -11 5 Z" fill="var(--outfit-top)"/>
          </g>

          <!-- 4. Front Articulated Leg (Thigh hip 0,0 -> knee 0,29 -> Shin calf -> ankle 0,58 + foot) -->
          <g id="s2ThighFront">
            <line x1="0" y1="0" x2="0" y2="29" stroke="var(--outfit-bottom)" stroke-width="8" stroke-linecap="round"/>
            <g id="s2ShinFront">
              <path d="M 0 29 L 0 58 L 10 58" fill="none" stroke="var(--outfit-bottom)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- 5. Head Group (Centered at 0, -87.5, r=22.5 -> seamless collar touch) -->
          <g id="s2Head">
            <circle cx="-1.2" cy="-87.5" r="22.5" fill="var(--rim)" opacity="0.35"/>
            <circle cx="1.5" cy="-87.5" r="22.5" fill="var(--rim)" opacity="0.68"/>
            <circle cx="0" cy="-87.5" r="22.5" fill="var(--head)"/>

            <!-- 3/4 Side-Offset Face Features -->
            <g id="s2Face">
              <circle class="walker-eye" cx="10.5" cy="-90" r="2.2" fill="var(--face)"/>
              <circle class="walker-eye" cx="18.5" cy="-90" r="2.2" fill="var(--face)"/>
              <line x1="11.5" y1="-80.5" x2="17.5" y2="-80.5" stroke="var(--face)" stroke-width="2" stroke-linecap="round"/>
            </g>
          </g>

          <!-- 6. Front Arm & Unified Sleeve Holding Glowing Lantern (Shoulder pivot at 1, -55) -->
          <g id="s2ArmFront">
            <path d="M 1 -55.5 L 14 -37 L 28 -30" fill="none" stroke="var(--rim)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
            <path d="M 1 -55 L 14 -36 L 28 -29" fill="none" stroke="var(--head)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M -1 -57.9 L 7.5 -45.5" fill="none" stroke="var(--outfit-top)" stroke-width="8.6" stroke-linecap="round"/>
            <path d="M 3.2 -51.7 L 7.5 -45.5" fill="none" stroke="var(--outfit-top)" stroke-width="8.6" stroke-linecap="butt"/>

            <!-- Antique Lantern & Symmetrical Light Cone (Anchored at hand 28, -29) -->
            <g id="s2Lantern" transform="translate(28, -29)">
              <polygon points="-6,18 6,18 48,87 -48,87" fill="url(#lanternCone)"/>
              <circle cx="0" cy="12" r="54" fill="url(#lanternHalo)"/>
              <path d="M -5 0 Q 0 -6 5 0" fill="none" stroke="var(--head)" stroke-width="2"/>
              <rect x="-6" y="2" width="12" height="16" rx="3" fill="var(--head)"/>
              <rect x="-3.5" y="5" width="7" height="10" rx="1.5" fill="#fde68a"/>
              <circle cx="0" cy="10" r="2.5" fill="#ffffff"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play Scene 2 (9.0s)</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Crisp mechanical slot-roller click as years spin backward
    function playRollTick(pitchShift = 0) {
      playTone(540 + pitchShift, 'triangle', 0.045, 0.08, 220);
    }

    // Deep resonant lock sound when landing on 1720
    function playYearLock() {
      playTone(135, 'sine', 0.65, 0.25, 42);
      playTone(680, 'sine', 0.18, 0.09);
    }

    // Soft earthy footstep sound on dirt path
    function playFootstep() {
      playTone(76, 'sine', 0.11, 0.09, 36);
    }

    let sceneTl = null;
    let lastRollIndex = 0;

    function playScene2() {
      if (sceneTl) sceneTl.kill();
      lastRollIndex = 0;

      // Reset all states
      gsap.set('#s2Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s2VillageBg', { x: 0 });
      gsap.set('#yearStrip', { y: 0 });
      gsap.set('#yearRewindDisplay', { scale: 1 });
      gsap.set('#s2Walker', { x: 110, y: 677 });
      gsap.set('#s2Torso', { rotation: 2, svgOrigin: '0 0' });
      gsap.set('#s2Head', { rotation: 0, svgOrigin: '0 -66' });
      gsap.set('#s2ThighFront', { rotation: 0, svgOrigin: '0 0' });
      gsap.set('#s2ShinFront', { rotation: 0, svgOrigin: '0 29' });
      gsap.set('#s2ThighBack', { rotation: 0, svgOrigin: '0 0' });
      gsap.set('#s2ShinBack', { rotation: 0, svgOrigin: '-1 29' });
      gsap.set('#s2ArmBack', { rotation: 0, svgOrigin: '-1 -55' });
      gsap.set('#s2ArmFront', { rotation: 0, svgOrigin: '1 -55' });
      gsap.set('#s2Lantern', { rotation: 0, svgOrigin: '0 0' });
      gsap.set('.walker-eye', { scaleY: 1, svgOrigin: '14.5 -90' });

      sceneTl = gsap.timeline();

      // 1. VERTICAL ROLLING YEAR COUNTER (2026 -> 1720 across 10 steps * 76px = -760px)
      sceneTl.to('#yearStrip', {
        y: -760,
        duration: 4.8,
        ease: 'power3.inOut',
        onUpdate: function() {
          const currentY = Math.abs(gsap.getProperty('#yearStrip', 'y'));
          const stepIndex = Math.floor(currentY / 76);
          if (stepIndex > lastRollIndex && stepIndex <= 10) {
            lastRollIndex = stepIndex;
            playRollTick((10 - stepIndex) * 18);
          }
        },
        onComplete: function() {
          playYearLock();
          gsap.to('#yearRewindDisplay', {
            scale: 1.08,
            svgOrigin: '270 315',
            duration: 0.18,
            yoyo: true,
            repeat: 1
          });
        }
      }, 0.2);

      // Twinkling stars
      sceneTl.to('.star', {
        opacity: 0.25,
        duration: 0.8,
        stagger: 0.18,
        yoyo: true,
        repeat: 9
      }, 0);

      // Parallax drift on distant village hills
      sceneTl.to('#s2VillageBg', {
        x: -26,
        duration: 9.0,
        ease: 'none'
      }, 0);

      // 2. REALISTIC ARTICULATED WALK CYCLE WITH KNEE BEND & FOOTSTEPS
      const stepDuration = 0.44;
      const totalSteps = 20;

      // Forward translation across dirt path
      sceneTl.to('#s2Walker', {
        x: 385,
        duration: stepDuration * totalSteps,
        ease: 'none'
      }, 0.1);

      // Build natural two-phase stride loop (Left/Back step & Right/Front step)
      const walkLoop = gsap.timeline({ repeat: totalSteps / 2 - 1 });

      // Phase A: Front leg swings forward (thigh forward, knee bends then extends), Back leg pushes off
      walkLoop
        .call(() => playFootstep(), null, 0.02)
        .to('#s2ThighFront', { rotation: -26, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.out' }, 0)
        .to('#s2ShinFront', { rotation: 34, svgOrigin: '0 29', duration: stepDuration * 0.5, ease: 'sine.out' }, 0)
        .to('#s2ThighBack', { rotation: 22, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.inOut' }, 0)
        .to('#s2ShinBack', { rotation: 10, svgOrigin: '-1 29', duration: stepDuration * 0.5, ease: 'sine.inOut' }, 0)
        .to('#s2Walker', { y: 673.5, duration: stepDuration * 0.5, ease: 'sine.out' }, 0)

        // Plant front foot
        .to('#s2ThighFront', { rotation: -18, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 0.5)
        .to('#s2ShinFront', { rotation: 4, svgOrigin: '0 29', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 0.5)
        .to('#s2ThighBack', { rotation: 26, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 0.5)
        .to('#s2ShinBack', { rotation: 28, svgOrigin: '-1 29', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 0.5)
        .to('#s2Walker', { y: 677, duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 0.5)

      // Phase B: Back leg swings forward through (knee bends to clear ground), Front leg sweeps back
        .call(() => playFootstep(), null, stepDuration + 0.02)
        .to('#s2ThighBack', { rotation: -26, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.out' }, stepDuration)
        .to('#s2ShinBack', { rotation: 34, svgOrigin: '-1 29', duration: stepDuration * 0.5, ease: 'sine.out' }, stepDuration)
        .to('#s2ThighFront', { rotation: 22, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.inOut' }, stepDuration)
        .to('#s2ShinFront', { rotation: 10, svgOrigin: '0 29', duration: stepDuration * 0.5, ease: 'sine.inOut' }, stepDuration)
        .to('#s2Walker', { y: 673.5, duration: stepDuration * 0.5, ease: 'sine.out' }, stepDuration)

        // Plant back foot
        .to('#s2ThighBack', { rotation: -18, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 1.5)
        .to('#s2ShinBack', { rotation: 4, svgOrigin: '-1 29', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 1.5)
        .to('#s2ThighFront', { rotation: 26, svgOrigin: '0 0', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 1.5)
        .to('#s2ShinFront', { rotation: 28, svgOrigin: '0 29', duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 1.5)
        .to('#s2Walker', { y: 677, duration: stepDuration * 0.5, ease: 'sine.in' }, stepDuration * 1.5);

      sceneTl.add(walkLoop, 0.1);

      // Counter-swinging back arm
      sceneTl.to('#s2ArmBack', {
        rotation: 20,
        svgOrigin: '-1 -55',
        duration: stepDuration,
        yoyo: true,
        repeat: totalSteps - 1,
        ease: 'sine.inOut'
      }, 0.1);

      // Gentle lantern sway & pendulum inertia
      sceneTl.to('#s2ArmFront', {
        rotation: -4,
        svgOrigin: '1 -55',
        duration: stepDuration,
        yoyo: true,
        repeat: totalSteps - 1,
        ease: 'sine.inOut'
      }, 0.1);

      sceneTl.to('#s2Lantern', {
        rotation: 6,
        svgOrigin: '0 0',
        duration: stepDuration,
        yoyo: true,
        repeat: totalSteps - 1,
        ease: 'sine.inOut'
      }, 0.22);

      // Subtle natural head nod synced with steps
      sceneTl.to('#s2Head', {
        rotation: 2,
        svgOrigin: '0 -66',
        duration: stepDuration,
        yoyo: true,
        repeat: totalSteps - 1,
        ease: 'sine.inOut'
      }, 0.1);

      // Natural Eye Blinks
      sceneTl.to('.walker-eye', {
        scaleY: 0.1,
        svgOrigin: '14.5 -90',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 3.1);

      sceneTl.to('.walker-eye', {
        scaleY: 0.1,
        svgOrigin: '14.5 -90',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 6.6);

      // Gentle cinematic camera push-in
      sceneTl.to('#s2Camera', {
        scale: 1.12,
        svgOrigin: '270 540',
        duration: 9.0,
        ease: 'sine.inOut'
      }, 0);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene2();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene2, 300);
    });
  </script>
