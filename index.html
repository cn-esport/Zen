<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zen // Animation Studio</title>
  <link rel="stylesheet" href="studio.css" />
  <link rel="stylesheet" href="skill.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background: #050811;
      color: #e6f0ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 1px;
      color: #9cb3d9;
      background: #050811;
      z-index: 30;
    }
    #stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #18253d;
      background: #04070f;
    }
    #scrub-wrap {
      flex: 0 0 auto;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 8px 14px 4px;
      background: #050811;
      z-index: 30;
    }
    #scrub {
      width: 100%;
      height: 6px;
      accent-color: #5ca8ff;
      cursor: pointer;
    }
    .controls {
      flex: 0 0 auto;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      padding: 6px 12px 14px;
      background: #050811;
      z-index: 30;
    }
    .ctrl-btn {
      background: #0f1624;
      border: 1px solid #22324f;
      color: #9cb3d9;
      border-radius: 11px;
      padding: 9px 2px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.18s ease;
    }
    .ctrl-btn span { font-size: 14px; line-height: 1; }
    .ctrl-btn.on {
      background: #182947;
      border-color: #5ca8ff;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(92, 168, 255, 0.22);
    }
  </style>
</head>
<body class="v">
  <div class="top-bar">
    <span>ANIMATION // STUDIO</span>
    <span id="time">00:00 / 00:50</span>
  </div>

  <div id="stage">
    <div id="camera">
      <svg id="L-bg" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
      <svg id="L-mid" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
      <svg id="L-char" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
      <svg id="L-fg" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
    <div id="dust"></div>
    <div id="vignette"></div>
    <div id="caps"></div>
    <div id="fade"></div>
  </div>

  <div id="scrub-wrap">
    <input id="scrub" type="range" min="0" max="1000" value="0" />
  </div>

  <div class="controls">
    <button id="sound" class="ctrl-btn" type="button"><span>🔇</span>Sound Off</button>
    <button id="play" class="ctrl-btn on" type="button"><span>❚❚</span>Pause</button>
    <button id="cc" class="ctrl-btn on" type="button"><span>CC</span>Subtitles</button>
    <button id="replay" class="ctrl-btn" type="button"><span>↺</span>Replay</button>
    <button id="fs" class="ctrl-btn" type="button"><span>⛶</span>Full</button>
  </div>

  <script src="scene.js?v=8"></script>
  <script src="engine.js?v=8"></script>
</body>
</html>
