<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Scene 4: Second Sleep & Natural Sunrise</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #fde68a;
      --outfit-top: #3b78c4;
      --outfit-bottom: #e8dcc0;
      --outfit-bottom-back: #b8ac92;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #141218;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 40%, rgba(12, 10, 14, 0.78) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Morning Cabin Wall -->
        <linearGradient id="morningWall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1d1a24"/>
          <stop offset="65%" stop-color="#292433"/>
          <stop offset="100%" stop-color="#1c1922"/>
        </linearGradient>

        <!-- Dawn to Golden Morning Sky -->
        <linearGradient id="sunriseSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1e3a5f"/>
          <stop offset="48%" stop-color="#d97706"/>
          <stop offset="82%" stop-color="#fbbf24"/>
          <stop offset="100%" stop-color="#fef3c7"/>
        </linearGradient>

        <!-- Warm Wooden Floor -->
        <linearGradient id="morningFloor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#221d26"/>
          <stop offset="45%" stop-color="#2c2530"/>
          <stop offset="100%" stop-color="#16131a"/>
        </linearGradient>

        <!-- Sunlight Ray Stream through Window -->
        <linearGradient id="sunBeamGrad" x1="0.5" y1="0" x2="0.2" y2="1">
          <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.34"/>
          <stop offset="60%" stop-color="#fde68a" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </linearGradient>

        <!-- Rising Sun Glow -->
        <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
          <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>

        <clipPath id="s4WindowClip">
          <rect x="0" y="0" width="220" height="270"/>
        </clipPath>
      </defs>

      <!-- Camera Group -->
      <g id="s4Camera">
        <rect width="540" height="715" fill="url(#morningWall)"/>
        <rect x="0" y="130" width="540" height="10" fill="#14111a" opacity="0.55"/>
        <rect x="0" y="485" width="540" height="10" fill="#14111a" opacity="0.55"/>

        <rect x="0" y="715" width="540" height="245" fill="url(#morningFloor)"/>
        <line x1="0" y1="750" x2="540" y2="750" stroke="#18141c" stroke-width="2"/>
        <line x1="0" y1="796" x2="540" y2="796" stroke="#18141c" stroke-width="2"/>
        <line x1="0" y1="850" x2="540" y2="850" stroke="#18141c" stroke-width="2"/>
        <line x1="0" y1="910" x2="540" y2="910" stroke="#18141c" stroke-width="2"/>

        <!-- 1720s WOODEN COTTAGE WINDOW WITH NATURAL SUNRISE -->
        <g transform="translate(175, 165)">
          <rect x="-8" y="-8" width="236" height="286" rx="4" fill="#121017"/>
          <g clip-path="url(#s4WindowClip)">
            <rect x="0" y="0" width="220" height="270" fill="url(#sunriseSky)"/>

            <!-- Rising Morning Sun (Starts low behind mountains at y=225 -> rises to y=115) -->
            <g id="s4Sun" transform="translate(110, 225)">
              <circle cx="0" cy="0" r="68" fill="url(#sunHalo)"/>
              <circle cx="0" cy="0" r="24" fill="#fef3c7"/>
            </g>

            <!-- Morning Mountain Peaks -->
            <path d="M 0 270 L 0 226 L 38 192 L 76 228 L 110 198 L 148 232 L 186 196 L 220 224 L 220 270 Z" fill="#1c1926"/>
          </g>
          <rect x="107" y="0" width="6" height="270" fill="#14111a"/>
          <rect x="0" y="132" width="220" height="6" fill="#14111a"/>
          <rect x="-14" y="270" width="248" height="10" rx="2" fill="#282330"/>
        </g>

        <!-- GOLDEN MORNING SUNBEAMS STREAMING INTO ROOM -->
        <polygon id="s4SunBeams" points="180,170 390,170 310,730 40,730" fill="url(#sunBeamGrad)" opacity="0.25"/>

        <!-- RUSTIC SIDE TABLE WITH MELTED EXTINGUISHED CANDLE & CLOSED BOOK -->
        <g transform="translate(365, 535)">
          <rect x="8" y="88" width="76" height="92" rx="3" fill="#1c1924"/>
          <rect x="2" y="84" width="88" height="8" rx="2" fill="#2c2738"/>
          <rect x="16" y="102" width="60" height="28" rx="2" fill="#15131c"/>

          <!-- Closed Book resting on table -->
          <rect x="12" y="77" width="24" height="7" rx="1.5" fill="#7c4a32"/>
          <rect x="14" y="79" width="20" height="3" fill="#e2d9c5"/>

          <!-- Melted Short Candle Stub (Extinguished at dawn) -->
          <ellipse cx="58" cy="83" rx="14" ry="3" fill="#d97706" opacity="0.7"/>
          <rect x="54" y="68" width="8" height="15" rx="2" fill="#f2ede2"/>
          <line x1="58" y1="64" x2="58" y2="68" stroke="#18181b" stroke-width="1.5"/>
          <!-- Thin wisping morning smoke -->
          <path id="s4Smoke" d="M 58 63 Q 55 55 59 48 Q 62 41 58 34" fill="none" stroke="#f2ede2" stroke-width="1.2" opacity="0.25"/>
        </g>

        <!-- WOODEN BED & SINGLE-RIG REFRESHED AWAKENING CHARACTER -->
        <g transform="translate(68, 565)">
          <ellipse cx="145" cy="152" rx="155" ry="12" fill="#0d0b10" opacity="0.75"/>

          <!-- Rustic Wooden Bed Frame -->
          <rect x="0" y="34" width="14" height="116" rx="3" fill="#1d1926"/>
          <rect x="276" y="68" width="14" height="82" rx="3" fill="#1d1926"/>
          <rect x="10" y="112" width="270" height="22" rx="3" fill="#252030"/>
          <rect x="14" y="92" width="262" height="24" rx="8" fill="#322c40"/>
          <rect x="20" y="74" width="60" height="22" rx="10" fill="#3f3852"/>

          <!-- Floating Second Sleep "Zzz" -->
          <g id="s4ZzzGroup" fill="#fde68a" font-family="sans-serif" font-weight="700" opacity="0.75">
            <text x="64" y="42" font-size="14">z</text>
            <text x="76" y="26" font-size="18">z</text>
          </g>

          <!-- SINGLE UNIFIED CHARACTER RIG (Hip pivot at 112, 85) -->
          <g id="s4UnifiedChar">
            <!-- Back Leg -->
            <g id="s4BackThigh">
              <line x1="115" y1="86" x2="148" y2="86" stroke="var(--outfit-bottom-back)" stroke-width="6.5" stroke-linecap="round"/>
              <g id="s4BackShin">
                <path d="M 148 86 L 150 116 L 149 144 L 157 144"
                      fill="none" stroke="var(--outfit-bottom-back)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </g>

            <!-- Front Leg -->
            <g id="s4FrontThigh">
              <line x1="112" y1="87" x2="152" y2="87" stroke="var(--outfit-bottom)" stroke-width="7" stroke-linecap="round"/>
              <g id="s4FrontShin">
                <path d="M 152 87 L 155 117 L 153 145 L 162 145"
                      fill="none" stroke="var(--outfit-bottom)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </g>

            <!-- Upper Body Group -->
            <g id="s4UpperBody">
              <!-- Back Arm (Raises smoothly for morning stretch!) -->
              <g id="s4BackArm">
                <path d="M 111 36 L 122 54 L 130 70" fill="none" stroke="#07060a" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 111 34 L 116 43" fill="none" stroke="#295794" stroke-width="7.4" stroke-linecap="round"/>
              </g>

              <!-- Slim & Short Torso with Golden Sunlight Rim -->
              <path d="M 103 34 Q 103 29.5 108 28.5 Q 112 24.5 116 28.5 Q 122.5 29.5 122.5 34 L 122.5 87 L 103 87 Z"
                    fill="var(--rim)" opacity="0.55"/>
              <path d="M 103 34 Q 103 29.5 108 28.5 Q 112 25 116 28.5 Q 121 29.5 121 34 L 121 87 L 103 87 Z"
                    fill="var(--outfit-top)"/>

              <!-- Head Group -->
              <g id="s4Head">
                <circle cx="113.5" cy="4" r="22" fill="var(--rim)" opacity="0.7"/>
                <circle cx="112" cy="4" r="22" fill="var(--head)"/>

                <g id="s4Face">
                  <!-- Sleeping Closed Eye Arcs -->
                  <path class="s4-sleep-eye" d="M 119.5 3.5 Q 122 5.8 124.5 3.5" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                  <path class="s4-sleep-eye" d="M 127.5 3.5 Q 130 5.8 132.5 3.5" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>

                  <!-- Refreshed Open Eyes -->
                  <circle class="s4-awake-eye" cx="122" cy="2.5" r="2.2" fill="var(--face)" opacity="0"/>
                  <circle class="s4-awake-eye" cx="129.8" cy="2.5" r="2.2" fill="var(--face)" opacity="0"/>

                  <!-- Refreshed Morning Smile -->
                  <path id="s4Smile" d="M 122 10.5 Q 126 14.5 130 10.5" fill="none" stroke="var(--face)" stroke-width="2" stroke-linecap="round"/>
                </g>
              </g>

              <!-- Front Arm & Unified Sleeve (Stretches upward into morning sunlight, then rests comfortably) -->
              <g id="s4FrontArm">
                <path d="M 113 35.5 L 122 55 L 126 73" fill="none" stroke="var(--rim)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
                <path d="M 113 36 L 122 55 L 126 73" fill="none" stroke="var(--head)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 111.2 33.8 L 116.5 44.5" fill="none" stroke="var(--outfit-top)" stroke-width="7.6" stroke-linecap="round"/>
                <path d="M 113.8 39.1 L 116.5 44.5" fill="none" stroke="var(--outfit-top)" stroke-width="7.6" stroke-linecap="butt"/>
              </g>
            </g>

            <!-- Soft Blanket covering flat legs while sleeping -->
            <path id="s4Blanket" d="M 114 80 Q 195 75 276 84 L 276 114 L 114 114 Z" fill="#2c2638"/>
            <path id="s4BlanketTrim" d="M 114 80 Q 195 75 276 84" fill="none" stroke="#483f5c" stroke-width="2"/>
          </g>
        </g>

        <!-- Warm Darkness Overlay that lifts as the Sun Rises -->
        <rect id="s4DawnVeil" width="540" height="960" fill="#07080f" opacity="0.52" pointer-events="none"/>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play Scene 4 (8.5s)</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Gentle morning birdsong & warm sunrise chord
    function playMorningBirds() {
      playTone(1320, 'sine', 0.12, 0.05, 1680);
      setTimeout(() => playTone(1560, 'sine', 0.14, 0.05, 1980), 140);
      setTimeout(() => playTone(1420, 'sine', 0.18, 0.04, 1760), 340);
    }

    function playSunriseChord() {
      playTone(261.63, 'sine', 1.8, 0.08);
      setTimeout(() => playTone(329.63, 'sine', 1.8, 0.07), 120);
      setTimeout(() => playTone(392.00, 'sine', 1.8, 0.07), 240);
    }

    let sceneTl = null;

    function playScene4() {
      if (sceneTl) sceneTl.kill();

      gsap.set('#s4Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s4Sun', { x: 110, y: 225 });
      gsap.set('#s4SunBeams', { opacity: 0.12 });
      gsap.set('#s4DawnVeil', { opacity: 0.52 });
      gsap.set('#s4UpperBody', { rotation: -82, svgOrigin: '112 85' });
      gsap.set('#s4FrontShin', { rotation: -88, svgOrigin: '152 87' });
      gsap.set('#s4BackShin', { rotation: -88, svgOrigin: '148 86' });
      gsap.set('#s4Blanket', { opacity: 1, y: 0 });
      gsap.set('#s4BlanketTrim', { opacity: 1, y: 0 });
      gsap.set('#s4ZzzGroup', { opacity: 0.8, y: 0 });
      gsap.set('.s4-sleep-eye', { opacity: 1 });
      gsap.set('.s4-awake-eye', { opacity: 0, scaleY: 1, svgOrigin: '126 2.5' });
      gsap.set('#s4FrontArm', { rotation: 0, svgOrigin: '113 36' });
      gsap.set('#s4BackArm', { rotation: 0, svgOrigin: '111 36' });
      gsap.set('#s4Head', { rotation: 0, svgOrigin: '112 25' });

      sceneTl = gsap.timeline();

      // 0.0s - 3.2s: Sun rises naturally from behind mountains & room fills with warm light!
      sceneTl.to('#s4Sun', {
        y: 115,
        duration: 3.4,
        ease: 'power1.inOut'
      }, 0);

      sceneTl.to('#s4DawnVeil', {
        opacity: 0,
        duration: 3.2,
        ease: 'power1.inOut'
      }, 0);

      sceneTl.to('#s4SunBeams', {
        opacity: 0.65,
        duration: 3.4,
        ease: 'power1.inOut'
      }, 0.4);

      sceneTl.to('#s4Smoke', {
        y: -14,
        opacity: 0,
        duration: 3.5,
        ease: 'sine.out'
      }, 0);

      sceneTl.to('#s4ZzzGroup', {
        y: -16,
        opacity: 0.2,
        duration: 2.2,
        ease: 'sine.inOut'
      }, 0);

      // 2.3s: Refreshed Awakening as sunlight hits the room
      sceneTl.call(() => {
        playSunriseChord();
        playMorningBirds();
      }, null, 2.3);

      sceneTl.to('#s4ZzzGroup', { opacity: 0, duration: 0.3 }, 2.25);
      sceneTl.to('.s4-sleep-eye', { opacity: 0, duration: 0.2 }, 2.35);
      sceneTl.to('.s4-awake-eye', { opacity: 1, duration: 0.25 }, 2.4);

      sceneTl.to(['#s4Blanket', '#s4BlanketTrim'], {
        opacity: 0,
        y: 12,
        duration: 0.6,
        ease: 'power2.inOut'
      }, 2.45);

      // Smooth Sit-Up Pivot
      sceneTl.to('#s4UpperBody', {
        rotation: 0,
        svgOrigin: '112 85',
        duration: 1.05,
        ease: 'power2.out'
      }, 2.45);

      sceneTl.to('#s4FrontShin', {
        rotation: 0,
        svgOrigin: '152 87',
        duration: 1.05,
        ease: 'power2.out'
      }, 2.45);

      sceneTl.to('#s4BackShin', {
        rotation: 0,
        svgOrigin: '148 86',
        duration: 1.05,
        ease: 'power2.out'
      }, 2.45);

      // 3.5s - 5.4s: Energized Morning Stretch (Both arms raise smoothly & head tilts slightly up)
      sceneTl.to('#s4FrontArm', {
        rotation: -135,
        svgOrigin: '113 36',
        duration: 0.85,
        ease: 'power2.out'
      }, 3.5);

      sceneTl.to('#s4BackArm', {
        rotation: -145,
        svgOrigin: '111 36',
        duration: 0.85,
        ease: 'power2.out'
      }, 3.55);

      sceneTl.to('#s4Head', {
        rotation: -6,
        svgOrigin: '112 25',
        duration: 0.85,
        ease: 'sine.inOut'
      }, 3.55);

      // Arms lower relaxedly to lap at 5.2s
      sceneTl.to('#s4FrontArm', {
        rotation: -12,
        svgOrigin: '113 36',
        duration: 0.9,
        ease: 'power2.inOut'
      }, 5.1);

      sceneTl.to('#s4BackArm', {
        rotation: -8,
        svgOrigin: '111 36',
        duration: 0.9,
        ease: 'power2.inOut'
      }, 5.1);

      sceneTl.to('#s4Head', {
        rotation: 0,
        svgOrigin: '112 25',
        duration: 0.8,
        ease: 'sine.inOut'
      }, 5.1);

      sceneTl.call(() => playMorningBirds(), null, 6.2);

      // Natural eye blink
      sceneTl.to('.s4-awake-eye', {
        scaleY: 0.1,
        svgOrigin: '126 2.5',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 6.6);

      // Gentle cinematic camera push-in
      sceneTl.to('#s4Camera', {
        scale: 1.16,
        svgOrigin: '250 540',
        duration: 8.5,
        ease: 'sine.inOut'
      }, 0);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene4();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene4, 300);
    });
  </script>
</body>
</html>
