<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Knocker-Uppers Scene 4: The Modern Snooze Loop (6.0s + Foley SFX)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim-cool: #60a5fa;
      --rim-alarm: #38bdf8;
      --shirt: #2d3748;
      --blanket: #1e293b;
      --blanket-fold: #334155;
      --wood: #151720;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #070911;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      position: relative;
      display: flex;
      gap: 8px;
      margin-top: 12px;
      z-index: 50;
      pointer-events: auto;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.25);
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
    #replayBtn { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Modern Pre-Dawn Bedroom Wall -->
        <linearGradient id="s4WallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#06080f"/>
          <stop offset="65%" stop-color="#0b101b"/>
          <stop offset="100%" stop-color="#111726"/>
        </linearGradient>

        <!-- Early Dawn Sky Outside Modern Window -->
        <linearGradient id="s4OutsideSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d1629"/>
          <stop offset="100%" stop-color="#1e2d4a"/>
        </linearGradient>

        <!-- Diagonal Dawn Window Beam -->
        <linearGradient id="s4WindowBeam" x1="0.8" y1="0" x2="0.2" y2="1">
          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
          <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.05"/>
          <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
        </linearGradient>

        <!-- Smartphone Screen Alarm Glow -->
        <radialGradient id="s4PhoneGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
          <stop offset="32%" stop-color="#38bdf8" stop-opacity="0.42"/>
          <stop offset="70%" stop-color="#0284c7" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>

        <!-- Modern Floor -->
        <linearGradient id="s4FloorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0b0d14"/>
          <stop offset="100%" stop-color="#050609"/>
        </linearGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s4Camera">
        <!-- Bedroom Wall & Floor (Floor line at y=775) -->
        <rect width="540" height="775" fill="url(#s4WallGrad)"/>
        <rect x="0" y="575" width="540" height="4" fill="#131927"/>
        <rect x="0" y="775" width="540" height="185" fill="url(#s4FloorGrad)"/>

        <!-- Smartphone Ambient Blue Screen Wash -->
        <circle id="s4RoomScreenWash" cx="152" cy="675" r="310" fill="url(#s4PhoneGlow)" opacity="0"/>

        <!-- MODERN BEDROOM WINDOW (Clean Glass — No Bamboo Pole!) -->
        <g transform="translate(332, 340)">
          <rect x="-8" y="-8" width="148" height="206" rx="4" fill="#161d2e"/>
          <rect x="0" y="0" width="132" height="190" fill="url(#s4OutsideSky)"/>
          <!-- Subtle Glass Reflection -->
          <polygon points="14,0 42,0 10,115 0,115" fill="#94a3b8" opacity="0.06"/>
          <!-- Sleek Modern Center Mullion & Sill -->
          <rect x="64" y="0" width="4" height="190" fill="#0d111a"/>
          <rect x="-12" y="190" width="156" height="10" rx="2" fill="#1e263b"/>
        </g>

        <!-- Diagonal Pre-Dawn Window Light Beam -->
        <polygon points="332,340 464,340 464,530 355,775 155,775 332,530" fill="url(#s4WindowBeam)" pointer-events="none"/>

        <!-- LOW MODERN BEDSIDE CABINET & SMARTPHONE (Floor y=775) -->
        <g transform="translate(116, 709)">
          <ellipse cx="36" cy="68" rx="42" ry="4.5" fill="#020305" opacity="0.9"/>
          <!-- Short Stubby Feet -->
          <rect x="9" y="54" width="6" height="12" rx="1" fill="#0a0c12"/>
          <rect x="57" y="54" width="6" height="12" rx="1" fill="#0a0c12"/>
          <!-- Sleek Minimalist Nightstand -->
          <rect x="5" y="6" width="62" height="50" rx="3" fill="var(--wood)"/>
          <rect x="10" y="12" width="52" height="16" rx="2" fill="#1c202d"/>
          <rect x="30" y="19" width="12" height="2" rx="1" fill="#64748b"/>
          <rect x="10" y="32" width="52" height="18" rx="2" fill="#1c202d"/>
          <rect x="30" y="40" width="12" height="2" rx="1" fill="#64748b"/>
          <!-- Top Surface -->
          <rect x="2" y="0" width="68" height="6.5" rx="2" fill="#222736"/>

          <!-- POCKET-SIZED GLASS SMARTPHONE ON NIGHTSTAND -->
          <g id="s4PhoneGroup" transform="translate(36, -3)">
            <!-- Ambient Screen Glow Halo -->
            <circle id="s4PhoneHalo" cx="0" cy="-6" r="46" fill="url(#s4PhoneGlow)" opacity="0"/>

            <!-- Expanding Alarm Soundwave Rings -->
            <circle id="s4Wave1" cx="0" cy="-8" r="6" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0"/>
            <circle id="s4Wave2" cx="0" cy="-8" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0"/>

            <!-- Angled Phone Stand / Slim Bezel Resting on Table -->
            <rect x="-11" y="-16" width="22" height="15" rx="3" fill="#090b10" stroke="#334155" stroke-width="1.2"/>
            <!-- Glowing Glass Screen -->
            <rect id="s4PhoneScreen" x="-9" y="-14" width="18" height="11" rx="2" fill="#1e293b"/>
            <!-- Minimalist Alarm Bell Icon Bars (No Text Clutter) -->
            <circle id="s4AlarmDot" cx="0" cy="-8.5" r="2.2" fill="#38bdf8" opacity="0"/>
          </g>
        </g>

        <!-- LOW-PROFILE MODERN BED & SLEEPER RIG (Floor y=775) -->
        <g transform="translate(202, 575)">
          <ellipse cx="110" cy="202" rx="122" ry="6.5" fill="#020305" opacity="0.95"/>

          <!-- Low Modern Headboard & Frame -->
          <rect x="0" y="76" width="11" height="124" rx="2.5" fill="#131620"/>
          <rect x="210" y="118" width="10" height="82" rx="2.5" fill="#131620"/>

          <!-- Mattress & Fluffed Pillow -->
          <rect x="11" y="144" width="199" height="26" rx="4" fill="#1e2433"/>
          <path d="M 14 144 Q 48 125 82 145 Z" fill="#cbd5e1" opacity="0.88"/>

          <!-- CHARACTER ANCHORED INSIDE MATTRESS -->
          <g transform="translate(98, 146)">
            <g id="s4SleeperPivot" transform="rotate(-74)">
              <!-- Far Arm Tucked Behind Torso -->
              <path d="M -6 -32 L -10 -12" fill="none" stroke="#18202c" stroke-width="6.5" stroke-linecap="round"/>

              <!-- Upper Torso -->
              <path d="M -13 -44 L 14 -44 L 18 24 L -16 24 Z" fill="var(--shirt)"/>
              <path d="M -7 -44 Q 0.5 -36 8 -44" fill="none" stroke="#94a3b8" stroke-width="1.8"/>

              <!-- Zenspiris Signature Head (Exact r=22) -->
              <g transform="translate(1, -67)">
                <g id="s4Head" transform="rotate(14)">
                  <!-- Cool Window Rim (Right) -->
                  <circle cx="1.6" cy="0" r="22" fill="var(--rim-cool)" opacity="0.45"/>
                  <!-- Phone Screen Blue Rim (Left — Lights Up When Alarm Rings) -->
                  <circle id="s4HeadPhoneRim" cx="-1.8" cy="0" r="22" fill="var(--rim-alarm)" opacity="0"/>
                  <circle cx="0" cy="0" r="22" fill="var(--head)"/>

                  <!-- Sleeping Closed Eyes (Downward Curved ◡ ◡) -->
                  <g id="s4EyesClosed">
                    <path d="M 5 -2 Q 8 1.5 11 -2" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                    <path d="M 13 -2 Q 16 1.5 19 -2" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                  </g>

                  <!-- Groggy Half-Open Eyes (Looking Left at Phone) -->
                  <g id="s4EyesGroggy" opacity="0">
                    <line x1="-18" y1="-2" x2="-13" y2="-2" stroke="var(--face)" stroke-width="2.1" stroke-linecap="round"/>
                    <line x1="-10" y1="-2" x2="-5" y2="-2" stroke="var(--face)" stroke-width="2.1" stroke-linecap="round"/>
                  </g>

                  <!-- Mouth -->
                  <line id="s4Mouth" x1="9" y1="7" x2="15" y2="7" stroke="var(--face)" stroke-width="1.8" stroke-linecap="round"/>
                </g>
              </g>

              <!-- Single Clean Foreground Arm (Reaches Left to Hit Snooze on Phone) -->
              <path id="s4ArmFront" d="M 1 -32 L 13 -13 L 26 -10" fill="none" stroke="var(--head)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Floating Sleeping "z Z Z" Indicators Above Pillow -->
          <g id="s4ZzzGroup" fill="#94a3b8" font-family="sans-serif" font-weight="700">
            <text id="s4Z1" x="42" y="114" font-size="13" opacity="0">z</text>
            <text id="s4Z2" x="54" y="96" font-size="16" opacity="0">Z</text>
            <text id="s4Z3" x="68" y="76" font-size="19" opacity="0">Z</text>
          </g>

          <!-- HEAVY BLANKET FOREGROUND LAYER -->
          <path d="M 74 143 Q 142 134 210 145 L 210 170 L 74 170 Z" fill="var(--blanket)"/>
          <path d="M 70 141 Q 86 138 95 143 L 92 168 L 70 168 Z" fill="var(--blanket-fold)"/>

          <!-- Low Bed Frame Rail -->
          <rect x="11" y="168" width="199" height="16" fill="#181c28"/>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls">
    <button type="button" class="primary" id="playBtn">▶ Play (6.0s)</button>
    <button type="button" id="replayBtn">↺ 0.0s</button>
    <button type="button" id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Modern Smartphone Digital Marimba/Chime + Buzz Foley
    function playPhoneAlarmPulse() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      // Two-note gentle digital chime (E5 -> B5)
      [659.25, 987.77].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const start = now + idx * 0.11;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.09, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.26);
      });

      // Subtle table vibration hum
      const buzz = audioCtx.createOscillator();
      const buzzGain = audioCtx.createGain();
      buzz.type = 'triangle';
      buzz.frequency.setValueAtTime(145, now);
      buzzGain.gain.setValueAtTime(0.001, now);
      buzzGain.gain.linearRampToValueAtTime(0.055, now + 0.02);
      buzzGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      buzz.connect(buzzGain);
      buzzGain.connect(audioCtx.destination);
      buzz.start(now);
      buzz.stop(now + 0.24);
    }

    // Crisp Glass Screen Tap (Snooze Button)
    function playSnoozeTap() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1150, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.055);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.065);
    }

    // Soft Pillow Flop Sound
    function playPillowFlop() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const duration = 0.35;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(480, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.08, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    let sceneTl = null;
    const pivotEl = document.getElementById('s4SleeperPivot');
    const headEl = document.getElementById('s4Head');
    const replayBtn = document.getElementById('replayBtn');

    function resetScene4ToStart() {
      if (sceneTl) {
        sceneTl.kill();
        sceneTl = null;
      }
      pivotEl.setAttribute('transform', 'rotate(-74)');
      headEl.setAttribute('transform', 'rotate(14)');
      gsap.set('#s4Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s4EyesClosed', { opacity: 1 });
      gsap.set('#s4EyesGroggy', { opacity: 0 });
      gsap.set('#s4Mouth', { attr: { x1: 9, y1: 7, x2: 15, y2: 7 } });
      gsap.set('#s4HeadPhoneRim', { opacity: 0 });
      gsap.set('#s4ArmFront', { attr: { d: 'M 1 -32 L 13 -13 L 26 -10' } });

      gsap.set('#s4PhoneGroup', { x: 36, y: -3, rotation: 0 });
      gsap.set('#s4PhoneScreen', { attr: { fill: '#1e293b' } });
      gsap.set('#s4AlarmDot', { opacity: 0 });
      gsap.set('#s4PhoneHalo', { opacity: 0 });
      gsap.set('#s4RoomScreenWash', { opacity: 0 });
      gsap.set(['#s4Wave1', '#s4Wave2'], { opacity: 0, attr: { r: 6 } });
      gsap.set(['#s4Z1', '#s4Z2', '#s4Z3'], { opacity: 0, y: 0 });
      replayBtn.textContent = '↺ 0.0s';
    }

    function triggerAlarmPulse(tl, time) {
      tl.call(() => playPhoneAlarmPulse(), null, time);

      // Phone vibrates rapidly on nightstand
      tl.to('#s4PhoneGroup', {
        x: 38.5,
        rotation: 4,
        duration: 0.045,
        yoyo: true,
        repeat: 7,
        ease: 'sine.inOut'
      }, time);

      tl.set('#s4PhoneGroup', { x: 36, rotation: 0 }, time + 0.38);

      // Soundwave rings expand out from glass screen
      tl.fromTo('#s4Wave1',
        { attr: { r: 6 }, opacity: 0.9 },
        { attr: { r: 34 }, opacity: 0, duration: 0.55, ease: 'power2.out', immediateRender: false },
        time
      );
      tl.fromTo('#s4Wave2',
        { attr: { r: 6 }, opacity: 0.7 },
        { attr: { r: 22 }, opacity: 0, duration: 0.45, ease: 'power2.out', immediateRender: false },
        time + 0.07
      );
    }

    function playScene4() {
      resetScene4ToStart();
      const state = { bodyAngle: -74, headAngle: 14 };

      sceneTl = gsap.timeline({
        onUpdate: () => {
          replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
        },
        onComplete: () => {
          replayBtn.textContent = '↺ 6.0s';
        }
      });

      // Slow camera push
      sceneTl.to('#s4Camera', {
        scale: 1.06,
        transformOrigin: '260px 530px',
        duration: 6.0,
        ease: 'power1.inOut'
      }, 0);

      // 0.0s - 1.5s: Peaceful sleep (z Z Z)
      ['#s4Z1', '#s4Z2', '#s4Z3'].forEach((zId, idx) => {
        sceneTl.fromTo(zId,
          { opacity: 0, y: 4 },
          { opacity: 0.75, y: -12, duration: 0.85, ease: 'sine.out', immediateRender: false },
          idx * 0.32
        );
      });

      // 1.55s: Smartphone screen lights up brightly & alarm pulses twice (1.55s & 2.45s)
      sceneTl.to('#s4PhoneScreen', { attr: { fill: '#e0f2fe' }, duration: 0.15 }, 1.55);
      sceneTl.to('#s4AlarmDot', { opacity: 1, duration: 0.15 }, 1.55);
      sceneTl.to('#s4PhoneHalo', { opacity: 0.95, duration: 0.25 }, 1.55);
      sceneTl.to('#s4RoomScreenWash', { opacity: 0.85, duration: 0.35 }, 1.55);
      sceneTl.to('#s4HeadPhoneRim', { opacity: 0.65, duration: 0.35 }, 1.55);

      triggerAlarmPulse(sceneTl, 1.55);
      triggerAlarmPulse(sceneTl, 2.45);

      // 2.65s: Groggy, half-asleep stir (z Z Z vanishes, lifts head slightly with squinty eyes)
      sceneTl.to(['#s4Z1', '#s4Z2', '#s4Z3'], { opacity: 0, duration: 0.2 }, 2.6);
      sceneTl.set('#s4EyesClosed', { opacity: 0 }, 2.68);
      sceneTl.set('#s4EyesGroggy', { opacity: 1 }, 2.68);
      sceneTl.set('#s4Mouth', { attr: { x1: -15, y1: 7, x2: -9, y2: 7 } }, 2.68);

      sceneTl.to(state, {
        bodyAngle: -32,
        headAngle: -8,
        duration: 0.55,
        ease: 'power2.out',
        onUpdate: () => {
          pivotEl.setAttribute('transform', `rotate(${state.bodyAngle.toFixed(2)})`);
          headEl.setAttribute('transform', `rotate(${state.headAngle.toFixed(2)})`);
        }
      }, 2.7);

      // 3.3s: Reaches single clean foreground arm over to tap "Snooze" on the smartphone!
      sceneTl.to('#s4ArmFront', {
        attr: { d: 'M -1 -32 L -42 -12 L -82 14' },
        duration: 0.42,
        ease: 'power2.out'
      }, 3.3);

      // 3.75s: Taps the glass screen — alarm stops & screen dims into Snooze standby
      sceneTl.call(() => playSnoozeTap(), null, 3.75);
      sceneTl.to('#s4PhoneGroup', { y: -1.5, duration: 0.08, yoyo: true, repeat: 1 }, 3.75);
      sceneTl.to('#s4PhoneScreen', { attr: { fill: '#334155' }, duration: 0.25 }, 3.78);
      sceneTl.to('#s4AlarmDot', { opacity: 0.25, duration: 0.25 }, 3.78);
      sceneTl.to('#s4PhoneHalo', { opacity: 0.15, duration: 0.35 }, 3.78);
      sceneTl.to('#s4RoomScreenWash', { opacity: 0.12, duration: 0.4 }, 3.78);
      sceneTl.to('#s4HeadPhoneRim', { opacity: 0.12, duration: 0.4 }, 3.78);

      // 4.05s: Arm retracts and worker flops straight back down onto the pillow!
      sceneTl.to('#s4ArmFront', {
        attr: { d: 'M 1 -32 L 13 -13 L 26 -10' },
        duration: 0.38,
        ease: 'power2.inOut'
      }, 4.05);

      sceneTl.call(() => playPillowFlop(), null, 4.35);
      sceneTl.set('#s4EyesGroggy', { opacity: 0 }, 4.32);
      sceneTl.set('#s4EyesClosed', { opacity: 1 }, 4.32);
      sceneTl.set('#s4Mouth', { attr: { x1: 9, y1: 7, x2: 15, y2: 7 } }, 4.32);

      sceneTl.to(state, {
        bodyAngle: -74,
        headAngle: 14,
        duration: 0.52,
        ease: 'bounce.out',
        onUpdate: () => {
          pivotEl.setAttribute('transform', `rotate(${state.bodyAngle.toFixed(2)})`);
          headEl.setAttribute('transform', `rotate(${state.headAngle.toFixed(2)})`);
        }
      }, 4.25);

      // 4.9s - 6.0s: "z Z Z" immediately floats back up as he goes right back to sleep!
      ['#s4Z1', '#s4Z2', '#s4Z3'].forEach((zId, idx) => {
        sceneTl.fromTo(zId,
          { opacity: 0, y: 4 },
          { opacity: 0.8, y: -14, duration: 0.75, ease: 'sine.out', immediateRender: false },
          4.9 + idx * 0.22
        );
      });
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene4();
    });

    replayBtn.addEventListener('click', () => {
      resetScene4ToStart();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene4, 250);
    });
  </script>
</body>
</html>
