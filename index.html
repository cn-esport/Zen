  const pos=x=>{let X=x+lx*R+fsx,Y=-2+ly*R*.75,d=Math.hypot(X,Y);if(d>lim){X*=lim/d;Y*=lim/d;}return[X,Y];};
  const bl=(s.blink!==false&&(tt%3.6)>3.48)?.12:1,ry=(ex==='startled'?r*1.5:ex==='squint'?r*.35:r)*bl,rx=ex==='startled'?r*1.5:r,gro=ex==='groggy',up=ex==='happy';
  [['e1','l1','a1','b1',x1,0],['e2','l2','a2','b2',x2,1]].forEach(([ie,il,ia,ib,x,k])=>{
   const[X,Y]=pos(x),e=E[ie],l=E[il],a=E[ia],b=E[ib],dn=ex==='closed'||(ex==='wink'&&k===1);
   e.setAttribute('cx',X);e.setAttribute('cy',Y);e.setAttribute('rx',rx);e.setAttribute('ry',ry);e.style.display=(fv&&!gro&&!dn&&!up)?'':'none';
   l.setAttribute('x1',X-2.5);l.setAttribute('x2',X+2.5);l.setAttribute('y1',Y);l.setAttribute('y2',Y);l.style.display=(fv&&gro)?'':'none';
   a.style.display=(fv&&(dn||up))?'':'none';a.setAttribute('d',up?`M ${X-3} ${Y+1.5} Q ${X} ${Y-4} ${X+3} ${Y+1.5}`:`M ${X-3} ${Y-1} Q ${X} ${Y+3} ${X+3} ${Y-1}`);
   const by=Y-6.5;let q=null;
   if(br==='sad')q=k===0?[X-3,by+1,X+3,by-2]:[X-3,by-2,X+3,by+1];else if(br==='angry')q=k===0?[X-3,by-2,X+3,by+1]:[X-3,by+1,X+3,by-2];else if(br==='raised')q=[X-3,by-3,X+3,by-3];
   if(q&&fv){b.setAttribute('x1',q[0]);b.setAttribute('y1',q[1]);b.setAttribute('x2',q[2]);b.setAttribute('y2',q[3]);b.style.display='';}else b.style.display='none';});
  const mx=12*hcx+fsx;let md='',mf=false;
  if(mo==='flat')md=`M ${mx-3} 7 L ${mx+3} 7`;else if(mo==='smile')md=`M ${mx-4} 6 Q ${mx} 11.5 ${mx+4} 6`;else if(mo==='bigsmile'){md=`M ${mx-5} 5 Q ${mx} 15 ${mx+5} 5 Z`;mf=true;}
  else if(mo==='frown')md=`M ${mx-4} 9.5 Q ${mx} 3.5 ${mx+4} 9.5`;else if(mo==='open'){md=`M ${mx-2.6} 7 Q ${mx-2.6} 2 ${mx} 2 Q ${mx+2.6} 2 ${mx+2.6} 7 Q ${mx+2.6} 12 ${mx} 12 Q ${mx-2.6} 12 ${mx-2.6} 7 Z`;mf=true;}
  else if(mo==='smirk')md=`M ${mx-4} 8 Q ${mx} 8.5 ${mx+2} 6.5 Q ${mx+4} 5 ${mx+5} 3.5`;
  else if(mo==='talk'){const m=.8+3.2*Math.abs(Math.sin(tt*11));md=`M ${mx-3} 7 Q ${mx} ${7-m} ${mx+3} 7 Q ${mx} ${7+m} ${mx-3} 7 Z`;mf=true;}
  else if(mo==='snore'){const m=1.2+Math.sin(tt*2.2);md=`M ${mx-2} 7 Q ${mx} ${6-m} ${mx+2} 7 Q ${mx} ${8+m} ${mx-2} 7 Z`;mf=true;}
  E.mp.setAttribute('d',md);E.mp.setAttribute('fill',mf?'#f2ede2':'none');E.mp.style.display=fv?'':'none';
  return{hand,yaw,facing:sg};
 };
 if(o.outfit)C.setOutfit(o.outfit);
 C.setHat(o.hat||(C.outfit&&C.outfit.hat)||'none');C.setShoe(o.shoe||(C.outfit&&C.outfit.shoe)||'shoe');if(o.rim)C.setRim(o.rim);
 C.update({});return C;
}
/* ===== end ZChar ===== */

/* ---- wardrobe ---- */
Object.assign(ZHATS,{
 sugegasa:[['M -36 -9 Q -16 -14 0 -35 Q 16 -14 36 -9 Q 0 -3 -36 -9 Z','#7a6d52'],['M -34 -9 Q 0 -3 34 -9 L 34 -7.5 Q 0 -1.5 -34 -7.5 Z','#5b5039']],
 hachimaki:[['M -20 -11 Q 0 -19 20 -11 L 20 -6.5 Q 0 -14.5 -20 -6.5 Z','#a04a38'],['M 17 -10 L 28 -5 L 26 -1.5 L 15 -6.5 Z','#a04a38',1]],
 bun:[['M -6 -20 Q -10 -34 0 -34 Q 10 -34 6 -20 Z','#2f3544'],['M -3.5 -30 H 3.5 V -27 H -3.5 Z','#a04a38']],
 shimada:[['M -11 -19 Q -19 -35 0 -35 Q 19 -35 11 -19 Z','#2f3544'],['M 6 -33 L 15 -38 L 16 -35 L 8 -30 Z','#8b6f47',1]],

const OUT={
 tomi:{shirt:['#2b384b',0,-16,3,7],sl:['l','#2b384b'],pa:['k','#262f3f'],hat:'sugegasa',shoe:'waraji',ex:'belt'},
 w1:{shirt:['#1a2030',0,-8,3,9],sl:['l','#1a2030'],hat:'shimada',shoe:'waraji'},
 w2:{shirt:['#202638',0,-14,3,6],sl:['s','#202638'],pa:['k','#1a2030'],hat:'hachimaki',shoe:'waraji',ex:'belt'},
 w3:{shirt:['#1d2433',0,-16,3,7],sl:['l','#1d2433'],pa:['k','#181e2c'],hat:'sugegasa',shoe:'waraji',ex:'belt'},
 w4:{shirt:['#262b3b',0,-14,3,6],sl:['l','#262b3b'],pa:['k','#1e2332'],hat:'tenugui',shoe:'waraji',ex:'belt'},
 w5:{shirt:['#2a2434',0,-8,3,9],sl:['l','#2a2434'],hat:'bun',shoe:'waraji'},
 w6:{shirt:['#1c2a2c',0,-16,3,7],sl:['l','#1c2a2c'],pa:['k','#172224'],hat:'sugegasa',shoe:'waraji',ex:'belt'}
};
const FEET=55,COOL='#60a5fa',CYC=.46,CX=270;

/* ---- walkers ---- */
function mkWalker(o){
 const c=ZChar($(o.layer),{outfit:o.outfit,params:o.params,rim:COOL}),h=(o.params&&o.params.height)||1;
 const w=Object.assign({c,h,rimOp:.5,idle:0,glowRim:false,walk:0},o);
 w.rimEl=c.g.querySelector('[data-r="rim"]');w.trEl=c.g.querySelector('[data-r="tr"]');
 w.rimEl.setAttribute('opacity',w.rimOp);w.trEl.setAttribute('opacity',w.rimOp*.8);
 w.init=()=>({x:o.x,y:o.y,walk:o.walk,ph:0,yaw:0,headTurn:o.headTurn||0,tilt:0,eyes:'deadpan',mouth:'flat',brow:'none',lookX:0,lookY:0,lean:0,naT:10,naE:10,faT:10,faE:10,t:0});
 w.st=w.init();return w;
}
function renderW(w){const s=w.st,idl=w.idle*Math.sin(s.t*1.9+w.h*7);
 w.c.update({x:s.x,y:s.y,walk:s.walk,ph:s.ph,yaw:s.yaw,headTurn:s.headTurn,tilt:s.tilt,eyes:s.eyes,mouth:s.mouth,brow:s.brow,lookX:s.lookX,lookY:s.lookY,lean:s.lean+idl,na:[s.naT,s.naE],fa:[s.faT,s.faE],t:s.t});
 if(w.glowRim){const k=Math.max(-1,Math.min(1,(CX-s.x)/25));
  w.rimEl.setAttribute('cx',(1.7*k).toFixed(2));w.trEl.setAttribute('transform',`translate(${(1.5*k).toFixed(2)},0)`);}
}
const SPEC=[[OUT.w1,.88,736,-2],[OUT.w2,.92,740,112],[OUT.w3,.96,744,36],[OUT.w4,1,748,150],[OUT.w5,1.02,751,-40],[OUT.w6,1.04,754,74]];
const SIDE=SPEC.map(([o,h,y,x])=>{const w=mkWalker({layer:'s7WalkLayer',outfit:o,params:{height:h},x,y,walk:1,rimOp:.5,idle:0,glowRim:true});w.v=FEET*h/CYC;return w;});
const tomi=mkWalker({layer:'s7TomiLayer',outfit:OUT.tomi,x:CX,y:765,rimOp:.6,headTurn:70});
const WALKERS=[...SIDE,tomi];
const fx={trk:0,ring:0};

(function(){ // static dressing: drifting motes extended to top and bottom edges
 let s='',r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 for(let i=0;i<36;i++)s+=`<circle cx="${(rnd()*640-50).toFixed(0)}" cy="${(-80+rnd()*1120).toFixed(0)}" r="${(.7+rnd()*1.3).toFixed(1)}" opacity="${(.08+rnd()*.2).toFixed(2)}"/>`;
 $('s7Motes').innerHTML=s;
})();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---- TIMELINE (6.5s) ---- */
let sceneTl=null;
function resetScene7ToStart(){
 if(sceneTl){sceneTl.kill();sceneTl=null;}
 stopDrone();
 WALKERS.forEach(w=>{w.st=w.init();});
 fx.trk=0;fx.ring=0;
 gsap.set('#s7Camera',{scale:1,svgOrigin:'270 650'});
 gsap.set('#s7Txt',{opacity:0});gsap.set('#s7Rule',{opacity:0});gsap.set('#s7Ring',{opacity:0});
 $('s7Ring').setAttribute('transform','translate(270 767)');
 $('s7Motes').setAttribute('transform','translate(0 0)');
 $('s7GlowBig').setAttribute('opacity',1);$('s7GlowCore').setAttribute('opacity',1);
 WALKERS.forEach(renderW);replayBtn.textContent='↺ 0.0s';
}
function walkSeg(tl,w,t0,t1,x0,x1,ph0,amp,fn){
 const dur=t1-t0,v=Math.abs(x1-x0)/dur,cyc=FEET*w.h/v;
 tl.to(w.st,{walk:amp,duration:.12},t0);
 tl.fromTo(w.st,{x:x0,ph:ph0},{x:x1,ph:ph0+dur/cyc,duration:dur,ease:'none',immediateRender:false},t0);
 tl.to(w.st,{walk:0,duration:.2},t1-.2);
 for(let n=0;;n++){const t=t0+((n/2+.25)-ph0)*cyc;if(t>t1-.15)break;if(t>=t0+.05)tl.call(fn,null,t);}
}
function playScene7(){
 resetScene7ToStart();
 sceneTl=gsap.timeline({onUpdate:()=>{const t=sceneTl.time();WALKERS.forEach(w=>w.st.t=t);
   const cx=SIDE.reduce((a,w)=>a+w.st.x,0)/SIDE.length;
   tomi.st.lookX=fx.trk*clamp((cx-CX)/160,-1,1);
   const wv=.5+.5*Math.sin((t-2.5)*2.4);
   $('s7Ring').setAttribute('opacity',(fx.ring*(.3+.4*wv)).toFixed(3));
   $('s7Ring').setAttribute('transform',`translate(${(270+tomi.st.x-CX)*0+270} 767) scale(${(1+.05*wv).toFixed(3)} ${(1+.05*wv).toFixed(3)})`);
   $('s7GlowBig').setAttribute('opacity',(.95+.05*Math.sin(t*1.3)).toFixed(3));$('s7GlowCore').setAttribute('opacity',(.93+.07*Math.sin(t*1.9+.8)).toFixed(3));
   $('s7Motes').setAttribute('transform',`translate(${(-t*3).toFixed(1)} ${(-t*6).toFixed(1)})`);
   WALKERS.forEach(renderW);replayBtn.textContent=`↺ ${t.toFixed(1)}s`;},onComplete:()=>{replayBtn.textContent='↺ 6.5s';}});
 sceneTl.to('#s7Camera',{scale:1.12,svgOrigin:'270 650',duration:DUR,ease:'power1.inOut'},0);
 sceneTl.call(()=>startDrone(6.4),null,.05);
 for(let k=0;k<7;k++)sceneTl.call(playTick,null,.5+k);
 SIDE.forEach(w=>sceneTl.fromTo(w.st,{x:w.st.x,ph:0},{x:w.st.x+w.v*DUR,ph:DUR/CYC,duration:DUR,ease:'none',immediateRender:false},0));
 for(let n=0;;n++){const t=(n/2+.25)*CYC;if(t>5.6)break;sceneTl.call(playSteps6,null,t);}
 sceneTl.to('#s7Txt',{opacity:.88,duration:.9,ease:'sine.out'},1.0);
 sceneTl.to('#s7Rule',{opacity:.35,duration:.9,ease:'sine.out'},1.2);
 sceneTl.to(fx,{trk:1,duration:.4,ease:'sine.inOut'},2.3);
 sceneTl.to(fx,{ring:1,duration:.5,ease:'sine.out'},2.5);
 sceneTl.set(tomi.st,{eyes:'squint',brow:'sad'},4.8).to(tomi.st,{lean:-5,duration:.5,ease:'power2.out'},4.8);
 sceneTl.call(droneRise,null,4.8);
 sceneTl.call(playPulse,null,5.8);

 sceneTl.to(tomi.st,{lean:-3,duration:.3,ease:'power2.inOut'},6.2);
}
