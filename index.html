/* ===== PROCEDURAL WEB AUDIO (Section 7) ===== */
let audioCtx = null, soundEnabled = true;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(type, f0, f1, d, g, when = 0) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime + when,
        o = audioCtx.createOscillator(),
        v = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + d);
  v.gain.setValueAtTime(g, t);
  v.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(v).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + d + .02);
}

function noise(d, type, f, q, g, att, when = 0) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime + when,
        n = Math.floor(audioCtx.sampleRate * d),
        b = audioCtx.createBuffer(1, n, audioCtx.sampleRate),
        a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
  const s = audioCtx.createBufferSource(),
        fl = audioCtx.createBiquadFilter(),
        v = audioCtx.createGain();
  s.buffer = b;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  v.gain.setValueAtTime(.0001, t);
  v.gain.linearRampToValueAtTime(g, t + att);
  v.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(v).connect(audioCtx.destination);
  s.start(t);
}

function bed(d, type, f, q, g) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime,
        n = Math.floor(audioCtx.sampleRate * d),
        b = audioCtx.createBuffer(1, n, audioCtx.sampleRate),
        a = b.getChannelData(0);
  // Brown-ish filtered noise approximation
  let last = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.04 * w) / 1.04;
    a[i] = last * 3.2;
  }
  const s = audioCtx.createBufferSource(),
        fl = audioCtx.createBiquadFilter(),
        v = audioCtx.createGain();
  s.buffer = b;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  v.gain.setValueAtTime(.0001, t);
  v.gain.linearRampToValueAtTime(g, t + .35);
  v.gain.setValueAtTime(g, t + d - .45);
  v.gain.linearRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(v).connect(audioCtx.destination);
  s.start(t);
}

/* ===== CHARACTER SETUP: TOMI ===== */
// Slim servant build, dark indigo kimono hitched up, grey-blue leggings, waraji, tenugui wrap
const tomi = ZChar($('s1HeroLayer'), {
  outfit: 'Tomi Servant',
  params: { tw: 21, bw: 19, height: 1.0 },
  rim: '#60a5fa' // Cool dawn rim from upper right
});

// Add dual-tone rim/tasuki cord detail onto Tomi's torso & hand broom
const handBroom = document.createElementNS(ZNS, 'g');
handBroom.innerHTML = `
  <g id="s1HandBroomInner" transform="rotate(-14)">
    <line x1="0" y1="-88" x2="0" y2="10" stroke="#475569" stroke-width="4.2" stroke-linecap="round"/>
    <line x1="1" y1="-88" x2="1" y2="10" stroke="#60a5fa" stroke-width="1" opacity=".45"/>
    <rect x="-4.5" y="6" width="9" height="6" rx="1" fill="#b5523b"/>
    <polygon points="-4,12 4,12 13,38 -13,38" fill="#334155"/>
    <line x1="-6" y1="14" x2="-9" y2="37" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="0" y1="14" x2="0" y2="38" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="6" y1="14" x2="9" y2="37" stroke="#1e293b" stroke-width="1.2"/>
  </g>
`;
tomi.hand.appendChild(handBroom);

// Note: yaw in ZChar is in degrees (0 = right, 90 = camera, 180 = left).
// Script specifies three-quarter facing left (yaw ~142 deg) turning to facing right toward gate (yaw ~18 deg).
const HERO0 = {
  x: 318,
  walk: 0,
  ph: 0,
  yaw: 142,       // Three-quarter facing left (back-left catches warm window rim, right catches cool dawn rim)
  headTurn: 0,
  tilt: 4,
  eyes: 'deadpan',
  mouth: 'flat',
  brow: 'none',
  lookX: 0.25,
  lookY: -0.2,    // Looking down at ground
  lean: 3,        // Slight forward sweeping lean
  naT: 26,
  naE: 28,
  faT: 18,
  faE: 35,
  t: 0
};
const st = { ...HERO0 };
const droppedBroom = $('s1DroppedBroom');

const render = () => {
  // Subtle dynamic rim switch: warm window glow when facing left, cool dawn light when turning toward gate
  const rimCol = st.yaw > 90 ? '#fcd34d' : '#60a5fa';
  tomi.setRim(rimCol);
  tomi.update({
    ...st,
    y: 785,
    na: [st.naT, st.naE],
    fa: [st.faT, st.faE]
  });
};

// Walk helper with packed-dirt footsteps (0.7 cycles/s => cycle = 1/0.7 ≈ 1.43s)
function walk(tl, t0, x1, dur, cycle = 1.43) {
  tl.to(st, { walk: 0.85, duration: 0.14 }, t0)
    .to(st, { x: x1, duration: dur, ease: 'none' }, t0)
    .to(st, { ph: '+=' + (dur / cycle), duration: dur, ease: 'none' }, t0);
  const stepInterval = cycle / 2;
  for (let k = 0; k * stepInterval < dur - 0.15; k++) {
    const stepTime = t0 + k * stepInterval + 0.08;
    const fadeGain = stepTime > 4.2 ? 0.045 : 0.085;
    tl.call(() => playDirtStep(fadeGain), null, stepTime);
  }
}

/* ===== TIMELINE (5.0s) ===== */
let sceneTl = null;

function resetScene1ToStart() {
  if (sceneTl) {
    sceneTl.kill();
    sceneTl = null;
  }
  Object.assign(st, HERO0);
  gsap.set('#s1Camera', { scale: 1, svgOrigin: '310 680' });
  gsap.set('#s1HandBroomInner', { opacity: 1, rotation: -14, y: 0 });
  gsap.set(droppedBroom, { opacity: 0, x: 292, y: 742, rotation: 0, svgOrigin: '0 -92' });
  render();
  replayBtn.textContent = '↺ 0.0s';
}

function playScene1() {
  resetScene1ToStart();

  sceneTl = gsap.timeline({
    onUpdate: () => {
      st.t = sceneTl.time();
      render();
      replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
    },
    onComplete: () => {
      replayBtn.textContent = '↺ 5.0s';
    }
  });

  // Camera: slow push-in toward Tomi's hands (zoom 1.0 -> 1.08 over 5.0s)
  sceneTl.to('#s1Camera', {
    scale: 1.08,
    svgOrigin: '310 680',
    duration: 5.0,
    ease: 'power1.inOut'
  }, 0);

  // Ambient bed: Low brown-noise air tone (lowpass 220 Hz, gain 0.05)
  sceneTl.call(() => bed(4.9, 'lowpass', 220, 0.7, 0.05), null, 0.05);
  // Sparse sine-chirp insects (4.2 kHz)
  sceneTl.call(playInsectChirp, null, 0.4);
  sceneTl.call(playInsectChirp, null, 1.65);
  sceneTl.call(playInsectChirp, null, 2.9);
  sceneTl.call(playInsectChirp, null, 4.1);
  // Very faint wind swell at 2.5s
  sceneTl.call(() => playWindSwell(0.9, 0.02), null, 2.5);

  // 0.0s - 0.8s: Sweeping in slow repeated strokes (+/- 12 deg) + straw swish every 0.6s
  sceneTl.call(playSweep, null, 0.05);
  sceneTl.to(st, { naT: 38, faT: 26, duration: 0.3, ease: 'sine.inOut' }, 0.0)
         .to(st, { naT: 14, faT: 12, duration: 0.3, ease: 'sine.inOut' }, 0.3)
         .call(playSweep, null, 0.65)
         .to(st, { naT: 36, faT: 24, duration: 0.32, ease: 'sine.inOut' }, 0.6);

  // 0.8s - 1.8s: Sweeping slows down and stops
  sceneTl.call(playSweep, null, 1.25);
  sceneTl.to(st, { naT: 20, faT: 14, duration: 0.35, ease: 'power1.out' }, 0.92)
         .to(st, { naT: 30, faT: 18, duration: 0.38, ease: 'power2.out' }, 1.27)
         .to(st, { lean: 1.5, tilt: 2, duration: 0.35, ease: 'power1.out' }, 1.45);

  // 1.8s - 2.3s: Broom rises slightly, Tomi opens hand; broom tips & falls along arc (0 -> 82 deg over 0.5s)
  sceneTl.to(st, { naT: 38, naE: 20, duration: 0.16, ease: 'power2.out' }, 1.64)
         .set('#s1HandBroomInner', { opacity: 0 }, 1.8)
         .set(droppedBroom, { opacity: 1, x: 288, y: 746, rotation: 8 }, 1.8)
         .to(droppedBroom, {
           rotation: 82,
           y: 774,
           x: 282,
           duration: 0.5,
           ease: 'power2.in'
         }, 1.8)
         // Tomi watches it fall (eyes deadpan, brow none)
         .to(st, { lookY: -0.55, tilt: 7, naT: 12, naE: 12, faT: 10, faE: 12, duration: 0.35, ease: 'power2.out' }, 1.85);

  // 2.3s: Hollow wooden clatter on packed dirt
  sceneTl.call(playBroomClatter, null, 2.3);
  // Tiny bounce settle on fallen broom
  sceneTl.to(droppedBroom, { rotation: 79, duration: 0.06, ease: 'power1.out' }, 2.3)
         .to(droppedBroom, { rotation: 82, duration: 0.08, ease: 'power1.in' }, 2.36);

  // 2.5s - 3.0s: Brief stillness before turning
  sceneTl.to(st, { tilt: 2, lookY: -0.1, lean: 0, duration: 0.35, ease: 'power1.inOut' }, 2.65);

  // 3.0s - 4.2s: Tomi turns toward the gate (yaw -> 18 deg facing right), walk starts at 0.7 cycles/s, lookX forward
  sceneTl.to(st, {
    yaw: 18,
    lookX: 0.5,
    lookY: 0,
    tilt: 0,
    duration: 0.45,
    ease: 'power2.inOut'
  }, 3.0);

  // Walk from x=318 out past the right gate post (x=545) from 3.1s to 5.0s
  walk(sceneTl, 3.1, 548, 1.9, 1.43);

  // 4.2s - 5.0s: Passes gate post without pausing; final step fades; brief 0.3s breath of wind
  sceneTl.call(() => playWindSwell(0.35, 0.022), null, 4.45);
}

playBtn.addEventListener('click', () => {
  initAudio();
  playScene1();
});
replayBtn.addEventListener('click', () => resetScene1ToStart());
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = '🔊 Sound: ' + (soundEnabled ? 'ON' : 'OFF');
  if (soundEnabled) initAudio();
});

window.addEventListener('load', () => {
  resetScene1ToStart();
  setTimeout(playScene1, 250);
});
</script>
