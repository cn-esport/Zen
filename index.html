<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #fcd34d;
      --coat: #1e2330;
      --coat-dark: #141822;
      --scarf-red: #b91c1c;
      --scarf-red-hi: #dc2626;
      --scarf-green: #15803d;
      --scarf-green-hi: #22c55e;
      --bamboo: #b45309;
      --bamboo-hi: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 355px;
      aspect-ratio: 9 / 16;
      background: #070911;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(3, 4, 8, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; border-bottom: 1px solid rgba(252, 211, 77, 0.35); }
    .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252, 211, 77, 0.35); }

    .controls {
      position: relative;
      display: flex;
      gap: 8px;
      margin-top: 12px;
      z-index: 50;
      pointer-events: auto;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.25);
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
    #replayBtn { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playNightWind(duration = 5.8) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(250, now);
      filter.frequency.linearRampToValueAtTime(320, now + duration * 0.5);
      filter.Q.setValueAtTime(2.6, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.028, now + 0.8);
      gain.gain.linearRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    function playCobblestoneStep() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(130, now);
      osc.frequency.exponentialRampToValueAtTime(46, now + 0.08);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    function playGlassTap() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      [1960, 3380].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.82, now + 0.075);
        gain.gain.setValueAtTime(i === 0 ? 0.16 : 0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      });
    }

    function playDoorCreakOpen() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(185, now);
      osc.frequency.linearRampToValueAtTime(235, now + 0.18);
      osc.frequency.linearRampToValueAtTime(165, now + 0.35);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(520, now);
      filter.Q.setValueAtTime(4, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.045, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.38);
    }

    let sceneTl = null;
    const replayBtn = document.getElementById('replayBtn');

    function resetScene3ToStart() {
      if (sceneTl) {
        sceneTl.kill();
        sceneTl = null;
      }
      gsap.set('#s3Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s3Knocker2', { x: 95, y: 583 });
      gsap.set('#s3K2Torso', { y: 0, rotation: 0 });
      gsap.set('#s3K2Head', { rotation: -4, transformOrigin: '13px 9px' });
      gsap.set('#s3K2PoleRig', { rotation: -12, transformOrigin: '34px 56px' });
      gsap.set('#s3K2LegFront', { rotation: 0, transformOrigin: '16px 124px' });
      gsap.set('#s3K2LegBack', { rotation: 0, transformOrigin: '8px 124px' });

      gsap.set('#s3IndoorLight', { opacity: 0 });
      gsap.set('#s3IndoorClosed', { opacity: 1 });
      gsap.set('#s3IndoorOpen', { opacity: 0 });
      gsap.set('#s3IndoorHead', { y: 0 });
      gsap.set(['#s3Z1', '#s3Z2', '#s3Z3'], { opacity: 0, y: 0 });
      gsap.set(['#s3Ripple1', '#s3Ripple2'], { opacity: 0, attr: { r: 3 } });

      gsap.set('#s3DoorGlow', { opacity: 0 });
      gsap.set('#s3Knocker1', { x: 432, y: 595, opacity: 0 });
      gsap.set('#s3LeaningPole', { x: 502, y: 790, rotation: 0, transformOrigin: '0px 0px' });
      replayBtn.textContent = '↺ 0.0s';
    }

    function triggerGlassRipple(tl, time) {
      tl.call(() => playGlassTap(), null, time);
      tl.fromTo('#s3Ripple1',
        { attr: { r: 3 }, opacity: 0.9 },
        { attr: { r: 26 }, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false },
        time
      );
      tl.fromTo('#s3Ripple2',
        { attr: { r: 2 }, opacity: 0.7 },
        { attr: { r: 16 }, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false },
        time + 0.05
      );
    }

    function playScene3() {
      resetScene3ToStart();

      sceneTl = gsap.timeline({
        onUpdate: () => {
          replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`;
        },
        onComplete: () => {
          replayBtn.textContent = '↺ 6.0s';
        }
      });

      sceneTl.call(() => playNightWind(5.8), null, 0.05);

      // Slow atmospheric camera push
      sceneTl.to('#s3Camera', {
        scale: 1.06,
        transformOrigin: '270px 490px',
        duration: 6.0,
        ease: 'power1.inOut'
      }, 0);

      // 0.0s - 1.8s: Knocker-Upper #1 sleeps inside cottage window (z Z Z)
      ['#s3Z1', '#s3Z2', '#s3Z3'].forEach((zId, idx) => {
        sceneTl.fromTo(zId,
          { opacity: 0, y: 4 },
          { opacity: 0.75, y: -12, duration: 0.9, ease: 'sine.out', immediateRender: false },
          idx * 0.35
        );
      });

      // 0.3s - 1.6s: Early-Bird Knocker-Upper #2 (Green Scarf) walks up to cottage window
      sceneTl.to('#s3Knocker2', {
        x: 172,
        duration: 1.3,
        ease: 'power1.out'
      }, 0.3);

      [0.45, 0.85, 1.25].forEach((stepTime, idx) => {
        sceneTl.call(() => playCobblestoneStep(), null, stepTime);
        const dir = idx % 2 === 0 ? 1 : -1;
        sceneTl.to('#s3K2LegFront', { rotation: 16 * dir, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime - 0.1);
        sceneTl.to('#s3K2LegBack', { rotation: -16 * dir, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime - 0.1);
        sceneTl.to('#s3K2Torso', { y: -2.5, duration: 0.18, yoyo: true, repeat: 1, ease: 'sine.inOut' }, stepTime - 0.1);
      });

      // 1.95s & 2.75s: Knocker-Upper #2 taps on Knocker-Upper #1's bedroom window!
      [1.95, 2.75].forEach((t) => {
        sceneTl.to('#s3K2PoleRig', {
          rotation: 0,
          duration: 0.14,
          ease: 'power2.in'
        }, t - 0.14);

        triggerGlassRipple(sceneTl, t);

        sceneTl.to('#s3K2PoleRig', {
          rotation: -5,
          duration: 0.32,
          ease: 'power2.out'
        }, t + 0.02);
      });

      // 2.9s: Knocker-Upper #1 jolts awake inside window & lights candle!
      sceneTl.to(['#s3Z1', '#s3Z2', '#s3Z3'], { opacity: 0, duration: 0.18 }, 2.85);
      sceneTl.set('#s3IndoorClosed', { opacity: 0 }, 2.92);
      sceneTl.set('#s3IndoorOpen', { opacity: 1 }, 2.92);
      sceneTl.to('#s3IndoorHead', { y: -8, duration: 0.35, ease: 'back.out(1.5)' }, 2.92);
      sceneTl.to('#s3IndoorLight', { opacity: 0.85, duration: 0.45, ease: 'power2.out' }, 3.15);

      // Knocker-Upper #2 lowers his pole after seeing the candle inside
      sceneTl.to('#s3K2PoleRig', {
        rotation: -18,
        duration: 0.55,
        ease: 'power2.inOut'
      }, 3.35);

      // 3.85s: Cottage front door opens, Knocker-Upper #1 steps out & grabs his own bamboo pole!
      sceneTl.call(() => playDoorCreakOpen(), null, 3.85);
      sceneTl.to('#s3DoorGlow', { opacity: 0.35, duration: 0.3 }, 3.85);

      sceneTl.to('#s3Knocker1', {
        opacity: 1,
        x: 392,
        duration: 0.55,
        ease: 'power2.out'
      }, 3.95);

      // His leaning bamboo pole snaps upright into his hand!
      sceneTl.to('#s3LeaningPole', {
        x: 378,
        rotation: -2,
        duration: 0.5,
        ease: 'back.out(1.2)'
      }, 4.05);

      // 4.55s - 6.0s: Both Knocker-Uppers stand face-to-face with bamboo poles in hand (Deadpan Comedy Beat!)
      sceneTl.to('#s3K2Head', {
        rotation: 2,
        duration: 0.35,
        ease: 'power1.out'
      }, 4.55);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene3();
    });

    replayBtn.addEventListener('click', () => {
      resetScene3ToStart();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene3, 250);
    });
  </script>
</body>
</html>
