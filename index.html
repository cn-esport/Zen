<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — The 2:00 AM Phone Scroll Trap (Fixed Alignment)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #f4c28a;
      --outfit-top: #3b78c4;
      --outfit-bottom: #e8dcc0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050507;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #0d0b12;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
      transform: translateZ(0);
    }

    .stage-wrapper.landscape {
      max-width: 880px;
      aspect-ratio: 16 / 9;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      opacity: 0;
      will-change: opacity, transform;
    }

    .scene.active {
      display: block;
      opacity: 1;
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .gpu-layer {
      will-change: transform, opacity;
      transform: translateZ(0);
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 42%, rgba(4, 3, 8, 0.88) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    .location-pill {
      position: absolute;
      top: 8%;
      left: 6%;
      background: rgba(13, 11, 18, 0.82);
      border: 1px solid rgba(242, 237, 226, 0.18);
      color: #f2ede2;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      z-index: 13;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      z-index: 20;
    }

    button {
      background: #181622;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.22);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #2b6cb0; border-color: #63b3ed; }

    .fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      will-change: opacity;
    }
  </style>
</head>
<body>

  <div class="stage-wrapper" id="stageWrapper">
    <div class="stage" id="stage">

      <!-- =========================================================
           SCENE 1 (0:00 - 0:07): The 2:00 AM Bedroom Hook (Centered Safe Zone)

              <circle cx="30" cy="-62" r="2" fill="#7dd3fc"/>
              <ellipse cx="22" cy="-41" rx="4.5" ry="5.5" fill="#f2ede2"/>
              <rect x="8" y="10" width="52" height="15" rx="7.5" fill="#0d0b12" transform="rotate(-14 8 10)"/>
              <rect x="53" y="-31" width="17" height="44" rx="6" fill="#38bdf8" opacity="0.35" transform="rotate(16 53 -31)"/>
              <rect x="56" y="-28" width="11" height="38" rx="4" fill="#7dd3fc" transform="rotate(16 56 -28)"/>
            </g>

            <!-- Streaming Dopamine Particles from Phone (525, 535) to Eyes (485, 495) -->
            <g id="dopamineSparks">
              <circle class="spark gpu-layer" cx="525" cy="535" r="4.5" fill="#7dd3fc"/>
              <circle class="spark gpu-layer" cx="528" cy="542" r="3.5" fill="#f4c28a"/>
              <circle class="spark gpu-layer" cx="522" cy="528" r="5" fill="#38bdf8"/>
              <circle class="spark gpu-layer" cx="530" cy="538" r="4" fill="#fbd38d"/>
              <circle class="spark gpu-layer" cx="520" cy="546" r="3.5" fill="#7dd3fc"/>
              <circle class="spark gpu-layer" cx="526" cy="532" r="4" fill="#ffffff"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Shared Overlays -->
      <div class="fade-overlay" id="fadeOverlay"></div>
      <div class="letterbox top"></div>
      <div class="letterbox bottom"></div>
      <div class="vignette"></div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play / Replay (48s)</button>
    <button id="ratioBtn">Aspect: 9:16</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playVibrate() {
      playTone(95, 'sawtooth', 0.16, 0.08, 82);
      setTimeout(() => playTone(95, 'sawtooth', 0.16, 0.08, 82), 230);
    }

    function playBassDrop() { playTone(115, 'sine', 1.4, 0.28, 35); }

    function playRewind() {
      for (let i = 0; i < 10; i++) {
        setTimeout(() => playTone(680 - i * 45, 'triangle', 0.08, 0.07), i * 100);
      }
    }

    function playHeartbeat() {
      playTone(65, 'sine', 0.24, 0.22, 42);
      setTimeout(() => playTone(58, 'sine', 0.32, 0.18, 36), 270);
    }

    function playPing(pitch = 880) { playTone(pitch, 'sine', 0.32, 0.09, pitch * 1.25); }

    const scenes = ['scene1', 'scene2', 'scene3', 'scene4', 'scene5'];
    function showScene(id) {
      scenes.forEach(s => {
        const el = document.getElementById(s);
        if (s === id) {
          el.classList.add('active');
          gsap.set(el, { opacity: 1 });
        } else {
          el.classList.remove('active');
          gsap.set(el, { opacity: 0 });
        }
      });
    }

    let masterTl = null;

    function buildTimeline() {
      if (masterTl) masterTl.kill();

      showScene('scene1');
      gsap.set('#fadeOverlay', { opacity: 0 });
      gsap.set('#s1Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s4Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s5Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('.eye-dot', { scaleY: 1, opacity: 1, transformOrigin: 'center' });
      gsap.set('.eye-ring', { opacity: 0 });
      gsap.set('#s1MouthFlat', { opacity: 1 });
      gsap.set('#s1MouthOpen', { opacity: 0 });
      gsap.set('#s2Walker', { x: 320, y: 635 });
      gsap.set('#s2ParallaxBg', { x: 0 });
      gsap.set('.spark', { x: 0, y: 0, opacity: 0 });
      document.getElementById('s1ClockText').textContent = '01:59';

      masterTl = gsap.timeline({ paused: true });

      // SCENE 1 (0s - 7s)
      masterTl.call(() => { showScene('scene1'); playVibrate(); }, null, 0);
      masterTl.to('#s1Arm', { rotation: -6, duration: 0.45, yoyo: true, repeat: 13, ease: 'sine.inOut' }, 0);
      masterTl.to('#s1ScreenFeed', { y: 16, duration: 0.45, yoyo: true, repeat: 13, ease: 'power1.inOut' }, 0);
      masterTl.to('#s1PhonePool', { scale: 1.12, transformOrigin: 'center', duration: 1.5, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 0);
      masterTl.to('.eye-dot', { scaleY: 0.1, duration: 0.08, yoyo: true, repeat: 1 }, 1.4);

      masterTl.call(() => {
        document.getElementById('s1ClockText').textContent = '02:00';
        playBassDrop();
      }, null, 2.2);
      masterTl.to('#s1Clock', { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: 'center' }, 2.2);
      masterTl.to('.eye-dot', { opacity: 0, duration: 0.1 }, 2.3);
      masterTl.to('.eye-ring', { opacity: 1, duration: 0.15 }, 2.3);
      masterTl.to('#s1BrowL', { y: -5, rotation: -12, duration: 0.2 }, 2.3);
      masterTl.to('#s1BrowR', { y: -5, rotation: 12, duration: 0.2 }, 2.3);
      masterTl.to('#s1MouthFlat', { opacity: 0, duration: 0.1 }, 2.3);
      masterTl.to('#s1MouthOpen', { opacity: 1, duration: 0.15 }, 2.3);
      masterTl.to('#s1Camera', { scale: 1.18, x: -20, y: -45, transformOrigin: 'center', duration: 4.2, ease: 'power2.inOut' }, 2.3);

      // Transition 1 -> 2
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.45 }, 6.4);
      masterTl.call(() => { showScene('scene2'); playRewind(); }, null, 6.85);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.45 }, 6.95);

      // SCENE 2 (7s - 16s)
      masterTl.to('#clockMin', { rotation: -1080, svgOrigin: '0 0', duration: 5.5, ease: 'power2.inOut' }, 7.0);
      masterTl.to('#clockHour', { rotation: -270, svgOrigin: '0 0', duration: 5.5, ease: 'power2.inOut' }, 7.0);
      masterTl.to('.star', { opacity: 0.2, duration: 0.7, stagger: 0.15, yoyo: true, repeat: 10 }, 7.0);
      masterTl.to('#s2ParallaxBg', { x: -30, duration: 8.5, ease: 'none' }, 7.0);

      masterTl.to('#s2Walker', { x: 560, duration: 7.5, ease: 'power1.out' }, 7.2);
      masterTl.to('#s2Walker', { y: 631, duration: 0.28, yoyo: true, repeat: 24, ease: 'sine.inOut' }, 7.2);
      masterTl.to('#s2LegL', { rotation: 24, svgOrigin: '0 42', duration: 0.28, yoyo: true, repeat: 24, ease: 'sine.inOut' }, 7.2);
      masterTl.to('#s2LegR', { rotation: -24, svgOrigin: '0 42', duration: 0.28, yoyo: true, repeat: 24, ease: 'sine.inOut' }, 7.2);
      masterTl.to('#s2Arm', { rotation: -20, svgOrigin: '0 0', duration: 0.28, yoyo: true, repeat: 24, ease: 'sine.inOut' }, 7.2);

      // Transition 2 -> 3
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.45 }, 15.4);
      masterTl.call(() => { showScene('scene3'); playPing(540); }, null, 15.85);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.45 }, 15.95);

      // SCENE 3 (16s - 28s)
      masterTl.to('#candleFlame', { scaleY: 1.28, scaleX: 0.88, transformOrigin: 'bottom center', duration: 0.35, yoyo: true, repeat: 30, ease: 'sine.inOut' }, 16.0);
      masterTl.to('#candlePulseBg', { opacity: 0.78, duration: 1.1, yoyo: true, repeat: 9, ease: 'sine.inOut' }, 16.0);
      masterTl.to('.ember', { y: -110, opacity: 0, duration: 2.6, stagger: 0.4, repeat: 3, ease: 'power1.out' }, 16.0);
      masterTl.to('#s3MouthL', { scaleY: 2.2, transformOrigin: 'center', duration: 0.22, yoyo: true, repeat: 36, ease: 'steps(1)' }, 16.5);
      masterTl.to('#s3ArmL', { rotation: -32, duration: 0.9, yoyo: true, repeat: 10, ease: 'sine.inOut' }, 16.5);
      masterTl.to('#s3CharL', { rotation: 2.5, transformOrigin: 'bottom center', duration: 1.6, yoyo: true, repeat: 6, ease: 'sine.inOut' }, 16.5);
      masterTl.to('#s3CharR', { rotation: -3, transformOrigin: 'bottom center', duration: 1.8, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 17.2);

      // Transition 3 -> 4
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.45 }, 27.4);
      masterTl.call(() => { showScene('scene4'); playHeartbeat(); }, null, 27.85);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.45 }, 27.95);

      // SCENE 4 (28s - 38s)
      masterTl.to('#s4Camera', { scale: 1.18, y: 25, transformOrigin: 'center', duration: 9.2, ease: 'sine.inOut' }, 28.0);
      masterTl.to('#s4Bokeh', { rotation: 12, transformOrigin: 'center', duration: 9.5, ease: 'none' }, 28.0);
      masterTl.to('#glowingBrain', { scale: 1.1, transformOrigin: 'center', duration: 0.85, yoyo: true, repeat: 10, ease: 'sine.inOut' }, 28.0);
      masterTl.to('#pulseOrb1', { attr: { cx: 0, cy: 18 }, duration: 0.9, repeat: 9, yoyo: true, ease: 'power1.inOut' }, 28.2);
      masterTl.to('#pulseOrb2', { attr: { cx: 0, cy: -34 }, duration: 0.9, repeat: 9, yoyo: true, ease: 'power1.inOut' }, 28.5);
      masterTl.call(() => playHeartbeat(), null, 31.2);
      masterTl.call(() => playHeartbeat(), null, 34.8);

      // Transition 4 -> 5
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.45 }, 37.4);
      masterTl.call(() => { showScene('scene5'); playPing(880); }, null, 37.85);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.45 }, 37.95);

      // SCENE 5 (38s - 48s)
      masterTl.to('.spark', {
        x: -38,
        y: -42,
        opacity: 1,
        scale: 1.3,
        duration: 0.85,
        stagger: 0.18,
        repeat: 9,
        ease: 'power1.out'
      }, 38.0);
      masterTl.to('#s5Char', { x: 467, duration: 0.12, yoyo: true, repeat: 65 }, 38.0);
      masterTl.to('#s5Camera', { scale: 0.94, transformOrigin: 'center', duration: 8.5, ease: 'power1.inOut' }, 38.5);
      masterTl.call(() => playPing(1046), null, 40.5);
      masterTl.call(() => playPing(1244), null, 43.2);

      // Final Fade to Black
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 1.2, ease: 'power2.in' }, 46.8);
    }

    const playBtn = document.getElementById('playBtn');
    const ratioBtn = document.getElementById('ratioBtn');
    const soundBtn = document.getElementById('soundBtn');
    const stageWrapper = document.getElementById('stageWrapper');

    playBtn.addEventListener('click', () => {
      initAudio();
      buildTimeline();
      masterTl.play(0);
    });

    ratioBtn.addEventListener('click', () => {
      stageWrapper.classList.toggle('landscape');
      const isLand = stageWrapper.classList.contains('landscape');
      ratioBtn.textContent = isLand ? 'Aspect: 16:9' : 'Aspect: 9:16';
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    buildTimeline();
  </script>
</body>
</html>
