<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Zenspiris — The 2:00 AM Phone Scroll Trap</title>

  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #f4c28a;
      --outfit-top: #2c4c7c;
      --outfit-bottom: #1e2433;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050507;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Stage Container - Default 9:16 for Shorts/Reels */
    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      background: #0d0b12;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      transition: all 0.4s ease;
    }

    .stage-wrapper.landscape {
      max-width: 880px;
      aspect-ratio: 16 / 9;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Cinematic Overlays from Skill Guide */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 42%, rgba(5, 4, 10, 0.85) 100%);
      z-index: 10;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.045;
      z-index: 11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 6%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    /* Location/Time Pill */
    .location-pill {
      position: absolute;
      top: 8.5%;
      left: 6%;
      background: rgba(13, 11, 18, 0.72);
      border: 1px solid rgba(242, 237, 226, 0.15);
      color: #f2ede2;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 13;
      backdrop-filter: blur(4px);
    }

    /* Playback Controls */
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #181622;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #262336; }
    button:active { transform: scale(0.96); }
    button.primary { background: #2c5282; border-color: #4a80c4; }

    .fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>

  <script>
    // =========================================================
    // Web Audio API Synthesizer for Ambient & SFX
    // =========================================================
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, vol = 0.15, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playVibrate() {
      playTone(95, 'sawtooth', 0.18, 0.08, 85);
      setTimeout(() => playTone(95, 'sawtooth', 0.18, 0.08, 85), 240);
    }

    function playBassDrop() {
      playTone(110, 'sine', 1.4, 0.28, 36);
    }

    function playRewind() {
      for (let i = 0; i < 8; i++) {
        setTimeout(() => playTone(600 - i * 45, 'triangle', 0.08, 0.08), i * 110);
      }
    }

    function playHeartbeat() {
      playTone(65, 'sine', 0.25, 0.22, 42);
      setTimeout(() => playTone(58, 'sine', 0.35, 0.18, 38), 280);
    }

    function playPing(pitch = 880) {
      playTone(pitch, 'sine', 0.35, 0.1, pitch * 1.25);
    }

    // =========================================================
    // Scene Switcher & GSAP Master Timeline (48s Total)
    // =========================================================
    const scenes = ['scene1', 'scene2', 'scene3', 'scene4', 'scene5'];
    function showScene(id) {
      scenes.forEach(s => {
        const el = document.getElementById(s);
        if (s === id) {
          el.classList.add('active');
          gsap.set(el, { opacity: 1 });
        } else {
          el.classList.remove('active');
          gsap.set(el, { opacity: 0 });
        }
      });
    }

    let masterTl = null;

    function buildTimeline() {
      if (masterTl) masterTl.kill();

      // Reset states
      showScene('scene1');
      gsap.set('#fadeOverlay', { opacity: 0 });
      gsap.set('.spark', { x: 0, y: 0, opacity: 0 });

      masterTl = gsap.timeline({ paused: true });

      // --- SCENE 1 (0s - 7s): Hook ---
      masterTl.call(() => {
        showScene('scene1');
        playVibrate();
      }, null, 0);
      masterTl.call(() => playBassDrop(), null, 2.2);
      masterTl.to('#s1PhonePool', { scale: 1.08, transformOrigin: 'center', duration: 2, yoyo: true, repeat: 2, ease: 'sine.inOut' }, 0);
      masterTl.to('#s1Char', { y: 518, duration: 1.8, yoyo: true, repeat: 2, ease: 'sine.inOut' }, 0);

      // Transition 1 -> 2 (6.3s - 7.0s)
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.5 }, 6.3);
      masterTl.call(() => {
        showScene('scene2');
        playRewind();
      }, null, 6.8);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.5 }, 6.9);

      // --- SCENE 2 (7s - 16s): 18th Century Time Shift ---
      masterTl.to('#clockMin', { rotation: -720, svgOrigin: '0 0', duration: 4.5, ease: 'power2.inOut' }, 7.0);
      masterTl.to('#clockHour', { rotation: -180, svgOrigin: '0 0', duration: 4.5, ease: 'power2.inOut' }, 7.0);

      // Transition 2 -> 3 (15.3s - 16.0s)
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.5 }, 15.3);
      masterTl.call(() => {
        showScene('scene3');
        playPing(520);
      }, null, 15.8);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.5 }, 15.9);

      // --- SCENE 3 (16s - 28s): Candlelight First & Second Sleep ---
      masterTl.to('#candleFlame', { scaleY: 1.25, scaleX: 0.9, transformOrigin: 'bottom center', duration: 0.4, yoyo: true, repeat: 26, ease: 'sine.inOut' }, 16.0);
      masterTl.to('#candlePulseBg', { opacity: 0.78, duration: 1.2, yoyo: true, repeat: 8, ease: 'sine.inOut' }, 16.0);
      masterTl.to('#s3CharL', { rotation: 2, transformOrigin: 'bottom center', duration: 2, yoyo: true, repeat: 4, ease: 'sine.inOut' }, 16.5);
      masterTl.to('#s3CharR', { rotation: -2, transformOrigin: 'bottom center', duration: 2.2, yoyo: true, repeat: 4, ease: 'sine.inOut' }, 17.0);

      // Transition 3 -> 4 (27.3s - 28.0s)
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.5 }, 27.3);
      masterTl.call(() => {
        showScene('scene4');
        playHeartbeat();
      }, null, 27.8);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.5 }, 27.9);

      // --- SCENE 4 (28s - 38s): Glowing Brain Close-up ---
      masterTl.to('#glowingBrain', { scale: 1.12, transformOrigin: 'center', duration: 0.85, yoyo: true, repeat: 9, ease: 'sine.inOut' }, 28.0);
      masterTl.call(() => playHeartbeat(), null, 31.5);
      masterTl.call(() => playHeartbeat(), null, 35.0);

      // Transition 4 -> 5 (37.3s - 38.0s)
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 0.5 }, 37.3);
      masterTl.call(() => {
        showScene('scene5');
        playPing(880);
      }, null, 37.8);
      masterTl.to('#fadeOverlay', { opacity: 0, duration: 0.5 }, 37.9);

      // --- SCENE 5 (38s - 48s): Modern Dopamine Trap & Fade to Black ---
      masterTl.to('.spark', {
        x: -36,
        y: -42,
        opacity: 1,
        duration: 1.1,
        stagger: 0.25,
        repeat: 6,
        ease: 'power1.out'
      }, 38.2);
      masterTl.call(() => playPing(1046), null, 40.5);
      masterTl.call(() => playPing(1174), null, 43.0);

      // Final Fade to Black for Seamless Loop
      masterTl.to('#fadeOverlay', { opacity: 1, duration: 1.2, ease: 'power2.in' }, 46.8);
    }

    // Controls
    const playBtn = document.getElementById('playBtn');
    const ratioBtn = document.getElementById('ratioBtn');
    const soundBtn = document.getElementById('soundBtn');
    const stageWrapper = document.getElementById('stageWrapper');

    playBtn.addEventListener('click', () => {
      initAudio();
      buildTimeline();
      masterTl.play(0);
    });

    ratioBtn.addEventListener('click', () => {
      stageWrapper.classList.toggle('landscape');
      const isLand = stageWrapper.classList.contains('landscape');
      ratioBtn.textContent = isLand ? 'Aspect: 16:9 (YouTube)' : 'Aspect: 9:16 (Shorts)';
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    // Initialize on load
    buildTimeline();
  </script>
</body>
</html>
