<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Scene 3: Midnight Moonrise & Smooth Sit-Up</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #f4c28a;
      --outfit-top: #3b78c4;
      --outfit-bottom: #e8dcc0;
      --outfit-bottom-back: #b8ac92;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #0b0a0f;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(4, 4, 7, 0.92) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- 18th Century Rustic Cabin Wall -->
        <linearGradient id="cabinWall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0f0e14"/>
          <stop offset="65%" stop-color="#181620"/>
          <stop offset="100%" stop-color="#111017"/>
        </linearGradient>

        <!-- Midnight Window Sky -->
        <linearGradient id="cabinWindowSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070b18"/>
          <stop offset="60%" stop-color="#111a34"/>
          <stop offset="100%" stop-color="#1b2647"/>
        </linearGradient>

        <!-- Wooden Cabin Floor -->
        <linearGradient id="cabinFloor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#161318"/>
          <stop offset="45%" stop-color="#1e1a21"/>
          <stop offset="100%" stop-color="#0d0b0f"/>
        </linearGradient>

        <!-- Realistic Omnidirectional Spherical Candle Glow (No artificial downward lamp cone!) -->
        <radialGradient id="candleHaloOuter" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
          <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.16"/>
          <stop offset="75%" stop-color="#d97706" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="candleHaloCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85"/>
          <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>

        <!-- Clip Path inside Window Frame so Moon Rises Naturally From Behind Mountains -->
        <clipPath id="windowGlassClip">
          <rect x="0" y="0" width="220" height="270"/>
        </clipPath>
      </defs>

      <!-- Camera Group -->
      <g id="s3Camera">
        <!-- Wall & Floor -->
        <rect width="540" height="715" fill="url(#cabinWall)"/>
        <rect x="0" y="130" width="540" height="10" fill="#0b0a0e" opacity="0.6"/>
        <rect x="0" y="485" width="540" height="10" fill="#0b0a0e" opacity="0.6"/>

        <rect x="0" y="715" width="540" height="245" fill="url(#cabinFloor)"/>
        <line x1="0" y1="750" x2="540" y2="750" stroke="#100e12" stroke-width="2"/>
        <line x1="0" y1="796" x2="540" y2="796" stroke="#100e12" stroke-width="2"/>
        <line x1="0" y1="850" x2="540" y2="850" stroke="#100e12" stroke-width="2"/>
        <line x1="0" y1="910" x2="540" y2="910" stroke="#100e12" stroke-width="2"/>

        <!-- 1720s WOODEN COTTAGE WINDOW WITH RISING MOON -->
        <g transform="translate(175, 165)">
          <rect x="-8" y="-8" width="236" height="286" rx="4" fill="#0a090e"/>

          <!-- Clipped Glass Pane -->
          <g clip-path="url(#windowGlassClip)">
            <rect x="0" y="0" width="220" height="270" fill="url(#cabinWindowSky)"/>

            <!-- Twinkling Stars -->
            <circle cx="48" cy="52" r="1.8" fill="#fff" opacity="0.7"/>
            <circle cx="172" cy="46" r="1.6" fill="#fff" opacity="0.6"/>
            <circle cx="164" cy="115" r="1.5" fill="#fff" opacity="0.5"/>
            <circle cx="65" cy="108" r="1.4" fill="#fff" opacity="0.45"/>

            <!-- RISING CRESCENT MOON (Starts low behind mountains at y=225 -> rises to midnight center y=72) -->
            <g id="s3Moon" transform="translate(110, 225)">
              <circle cx="0" cy="0" r="20" fill="#f3f4f6" opacity="0.94"/>
              <circle cx="8" cy="-5" r="17" fill="#101830"/>
            </g>

            <!-- Mountain Peaks Silhouette (Moon rises from behind the valley) -->
            <path d="M 0 270 L 0 226 L 38 192 L 76 228 L 110 198 L 148 232 L 186 196 L 220 224 L 220 270 Z" fill="#090d1c"/>
          </g>

          <!-- Wooden Window Mullions & Sill -->
          <rect x="107" y="0" width="6" height="270" fill="#0c0b10"/>
          <rect x="0" y="132" width="220" height="6" fill="#0c0b10"/>
          <rect x="-14" y="270" width="248" height="10" rx="2" fill="#1e1b24"/>
        </g>

        <!-- RUSTIC WOODEN SIDE TABLE & REALISTIC SPHERICAL CANDLELIGHT -->
        <g transform="translate(365, 535)">
          <!-- Realistic Radial Spherical Glow (No artificial downward cone) -->
          <circle id="s3CandleHalo" cx="46" cy="30" r="165" fill="url(#candleHaloOuter)"/>
          <circle id="s3CandleCoreGlow" cx="46" cy="30" r="52" fill="url(#candleHaloCore)"/>

          <!-- Wooden Table -->
          <rect x="8" y="88" width="76" height="92" rx="3" fill="#15131a"/>
          <rect x="2" y="84" width="88" height="8" rx="2" fill="#231f2b"/>
          <rect x="16" y="102" width="60" height="28" rx="2" fill="#0f0e14"/>

          <!-- Brass Candle Holder & Tall Beeswax Candle -->
          <ellipse cx="46" cy="83" rx="16" ry="3.5" fill="#d97706" opacity="0.75"/>
          <rect x="44" y="74" width="4" height="9" fill="#b45309"/>
          <rect x="41" y="42" width="10" height="32" rx="2" fill="#f2ede2"/>

          <!-- Animated Flickering Flame (Pivot at wick base 46, 42) -->
          <g id="s3Flame">
            <path d="M 46 24 Q 53 34 46 42 Q 39 34 46 24 Z" fill="#f59e0b"/>
            <path d="M 46 29 Q 50 35 46 41 Q 42 35 46 29 Z" fill="#fef3c7"/>
          </g>
        </g>

        <!-- =====================================================
             WOODEN BED & SINGLE-RIG ARTICULATED CHARACTER
             Starts lying down -> Smoothly pivots at Hip (112, 85) to sit up & open book!
             ===================================================== -->
        <g transform="translate(68, 565)">
          <ellipse cx="145" cy="152" rx="155" ry="12" fill="#060508" opacity="0.88"/>

          <!-- Rustic Wooden Bed Frame (Mattress top at y = 92) -->
          <rect x="0" y="34" width="14" height="116" rx="3" fill="#16131c"/>
          <rect x="276" y="68" width="14" height="82" rx="3" fill="#16131c"/>
          <rect x="10" y="112" width="270" height="22" rx="3" fill="#1c1924"/>
          <rect x="14" y="92" width="262" height="24" rx="8" fill="#272433"/>
          <!-- Soft Pillow -->
          <rect x="20" y="74" width="60" height="22" rx="10" fill="#322e40"/>

          <!-- Floating Sleep "Zzz" Particles -->
          <g id="s3ZzzGroup" fill="#f4c28a" font-family="sans-serif" font-weight="700" opacity="0.8">
            <text x="64" y="42" font-size="14">z</text>
            <text x="76" y="26" font-size="18">z</text>
            <text x="91" y="8" font-size="22">Z</text>
          </g>

          <!-- SINGLE UNIFIED CHARACTER RIG (Hip pivot at 112, 85) -->
          <g id="s3UnifiedChar">
            <!-- 1. Legs Group (Starts stretched flat on bed -90deg -> swings down off bed edge 0deg as character sits up) -->
            <g id="s3LegsGroup">
              <!-- Back Leg -->
              <path d="M 115 86 L 148 86 L 150 116 L 149 144 L 157 144"
                    fill="none" stroke="var(--outfit-bottom-back)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Front Leg -->
              <path d="M 112 87 L 152 87 L 155 117 L 153 145 L 162 145"
                    fill="none" stroke="var(--outfit-bottom)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- 2. Upper Body Group (Pivots at Hip 112, 85 from lying -82deg to sitting upright 0deg!) -->
            <g id="s3UpperBody">
              <!-- Slim & Short Torso (Width 18px, warm right rim light from candle) -->
              <path d="M 103 34 Q 103 29.5 108 28.5 Q 112 24.5 116 28.5 Q 122.5 29.5 122.5 34 L 122.5 87 L 103 87 Z"
                    fill="var(--rim)" opacity="0.5"/>
              <path d="M 103 34 Q 103 29.5 108 28.5 Q 112 25 116 28.5 Q 121 29.5 121 34 L 121 87 L 103 87 Z"
                    fill="var(--outfit-top)"/>

              <!-- Head Group (Centered at 112, 4, r=22 -> seamless collar touch) -->
              <g id="s3Head">
                <circle cx="113.5" cy="4" r="22" fill="var(--rim)" opacity="0.65"/>
                <circle cx="112" cy="4" r="22" fill="var(--head)"/>

                <!-- 3/4 Side-Offset Face Features -->
                <g id="s3Face">
                  <!-- Sleeping Closed Eye Arcs (Visible while lying down) -->
                  <path class="sleep-eye" d="M 119.5 3.5 Q 122 5.8 124.5 3.5" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                  <path class="sleep-eye" d="M 127.5 3.5 Q 130 5.8 132.5 3.5" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>

                  <!-- Awake Open Dots (Fade in smoothly as eyes open upon sitting up) -->
                  <circle class="awake-eye" cx="122" cy="3" r="2.1" fill="var(--face)" opacity="0"/>
                  <circle class="awake-eye" cx="129.8" cy="3" r="2.1" fill="var(--face)" opacity="0"/>

                  <!-- Gentle Calm Mouth -->
                  <path d="M 122.5 11 Q 126 13.5 129.5 11" fill="none" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                </g>
              </g>

              <!-- Front Arm & Unified Sleeve Holding Open Book (Shoulder pivot at 113, 36) -->
              <g id="s3BookArm">
                <path d="M 113 35.5 L 129 52 L 146 47" fill="none" stroke="var(--rim)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
                <path d="M 113 36 L 129 53 L 146 48" fill="none" stroke="var(--head)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 111.2 33.8 L 119.5 42.6" fill="none" stroke="var(--outfit-top)" stroke-width="7.6" stroke-linecap="round"/>
                <path d="M 115.3 38.2 L 119.5 42.6" fill="none" stroke="var(--outfit-top)" stroke-width="7.6" stroke-linecap="butt"/>

                <!-- Open Leather Book (Unfolds smoothly once seated) -->
                <g id="s3Book" transform="translate(144, 34) rotate(-14)">
                  <path d="M 0 12 Q 8 9 16 12 L 16 24 Q 8 21 0 24 Z" fill="#f2ede2"/>
                  <path d="M 16 12 Q 24 9 32 12 L 32 24 Q 24 21 16 24 Z" fill="#e2d9c5"/>
                  <path d="M -1 12 L 16 13 L 33 12" fill="none" stroke="#7c4a32" stroke-width="2.2" stroke-linecap="round"/>
                </g>
              </g>
            </g>

            <!-- Soft Blanket over bed foot (Fades down gently as legs swing off bed) -->
            <path id="s3Blanket" d="M 114 82 Q 195 76 276 86 L 276 114 L 114 114 Z" fill="#23202e"/>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play Scene 3 (9.0s)</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWakeChime() {
      playTone(392, 'sine', 1.2, 0.10);
      setTimeout(() => playTone(523.25, 'sine', 1.4, 0.08), 180);
    }

    function playPageTurn() {
      playTone(250, 'triangle', 0.14, 0.055, 130);
    }

    let sceneTl = null;

    function playScene3() {
      if (sceneTl) sceneTl.kill();

      // Initial State: Lying down asleep while moon is low behind the mountains
      gsap.set('#s3Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s3Moon', { x: 110, y: 225 });
      gsap.set('#s3UpperBody', { rotation: -82, svgOrigin: '112 85' });
      gsap.set('#s3LegsGroup', { rotation: -86, svgOrigin: '112 85' });
      gsap.set('#s3Blanket', { opacity: 1, y: 0 });
      gsap.set('#s3ZzzGroup', { opacity: 0.85, y: 0 });
      gsap.set('.sleep-eye', { opacity: 1 });
      gsap.set('.awake-eye', { opacity: 0, scaleY: 1, svgOrigin: '126 3' });
      gsap.set('#s3BookArm', { rotation: 38, svgOrigin: '113 36' });
      gsap.set('#s3Book', { opacity: 0, scale: 0.7, svgOrigin: '16 18' });
      gsap.set('#s3Flame', { scaleY: 1, scaleX: 1, rotation: 0, svgOrigin: '46 42' });

      sceneTl = gsap.timeline();

      // Continuous organic candle flame flicker
      sceneTl.to('#s3Flame', {
        scaleY: 1.14,
        scaleX: 0.92,
        rotation: 3,
        svgOrigin: '46 42',
        duration: 0.35,
        yoyo: true,
        repeat: 25,
        ease: 'sine.inOut'
      }, 0);

      sceneTl.to('#s3CandleHalo', {
        scale: 1.07,
        svgOrigin: '46 30',
        duration: 0.75,
        yoyo: true,
        repeat: 11,
        ease: 'sine.inOut'
      }, 0);

      // 0.0s - 2.8s: Moon rises smoothly from behind the mountains to top center of window!
      sceneTl.to('#s3Moon', {
        y: 68,
        duration: 2.8,
        ease: 'power1.inOut'
      }, 0);

      // Floating "Zzz" during First Sleep
      sceneTl.to('#s3ZzzGroup', {
        y: -18,
        opacity: 0.25,
        duration: 2.5,
        ease: 'sine.inOut'
      }, 0);

      // 2.6s: Moon reaches midnight peak -> Character wakes & smoothly pivots at Hip to sit up!
      sceneTl.call(() => playWakeChime(), null, 2.65);

      sceneTl.to('#s3ZzzGroup', {
        opacity: 0,
        duration: 0.35
      }, 2.55);

      // Eyes open smoothly
      sceneTl.to('.sleep-eye', { opacity: 0, duration: 0.2 }, 2.7);
      sceneTl.to('.awake-eye', { opacity: 1, duration: 0.25 }, 2.75);

      // Blanket slides down gently as legs swing off the side of the bed
      sceneTl.to('#s3Blanket', {
        opacity: 0,
        y: 12,
        duration: 0.65,
        ease: 'power2.inOut'
      }, 2.8);

      // Smooth Sit-Up Pivot (Upper body rises from -82deg to 0deg upright!)
      sceneTl.to('#s3UpperBody', {
        rotation: 0,
        svgOrigin: '112 85',
        duration: 1.15,
        ease: 'power2.inOut'
      }, 2.8);

      // Legs swing naturally off the bed edge (-86deg to 0deg)
      sceneTl.to('#s3LegsGroup', {
        rotation: 0,
        svgOrigin: '112 85',
        duration: 1.15,
        ease: 'power2.inOut'
      }, 2.8);

      // 3.8s: Once seated upright, arm raises smoothly and opens the book
      sceneTl.to('#s3BookArm', {
        rotation: 0,
        svgOrigin: '113 36',
        duration: 0.75,
        ease: 'power2.out'
      }, 3.7);

      sceneTl.to('#s3Book', {
        opacity: 1,
        scale: 1,
        svgOrigin: '16 18',
        duration: 0.45,
        ease: 'back.out(1.4)'
      }, 4.0);

      // 4.6s - 9.0s: Calm reading in warm candlelight
      sceneTl.to('#s3BookArm', {
        rotation: -2.5,
        svgOrigin: '113 36',
        duration: 1.4,
        yoyo: true,
        repeat: 2,
        ease: 'sine.inOut'
      }, 4.5);

      sceneTl.call(() => playPageTurn(), null, 5.8);

      // Natural eye blinks while reading
      sceneTl.to('.awake-eye', {
        scaleY: 0.1,
        svgOrigin: '126 3',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 5.4);

      sceneTl.to('.awake-eye', {
        scaleY: 0.1,
        svgOrigin: '126 3',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 7.8);

      // Gentle cinematic camera push-in
      sceneTl.to('#s3Camera', {
        scale: 1.18,
        svgOrigin: '250 560',
        duration: 9.0,
        ease: 'sine.inOut'
      }, 0);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene3();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene3, 300);
    });
  </script>
</body>
</html>
