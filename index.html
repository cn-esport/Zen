<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Scene 2: 1720s Before Electric Lights</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #080b14;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(4, 4, 8, 0.9) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    .location-pill {
      position: absolute;
      top: 7.5%;
      left: 6%;
      background: rgba(10, 12, 20, 0.78);
      border: 1px solid rgba(242, 237, 226, 0.14);
      color: rgba(242, 237, 226, 0.85);
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 13;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <div class="location-pill">1720s · Before Electric Lights</div>

    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Deep 18th Century Midnight Sky -->
        <linearGradient id="nightSky1720" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070a14"/>
          <stop offset="55%" stop-color="#111930"/>
          <stop offset="100%" stop-color="#1a2440"/>
        </linearGradient>

        <!-- Ground Path Gradient -->
        <linearGradient id="earthGround" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#14161f"/>
          <stop offset="40%" stop-color="#0d0e14"/>
          <stop offset="100%" stop-color="#06070a"/>
        </linearGradient>

        <!-- Rewind Clock Ambient Halo -->
        <radialGradient id="clockHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f4c28a" stop-opacity="0.22"/>
          <stop offset="60%" stop-color="#d97706" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
        </radialGradient>

        <!-- Symmetrical Lantern Light Cone -->
        <linearGradient id="lanternCone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.42"/>
          <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="lanternHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fde68a" stop-opacity="0.65"/>
          <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s2Camera">
        <rect width="540" height="960" fill="url(#nightSky1720)"/>

        <!-- Crescent Moon & Twinkling Stars -->
        <circle cx="430" cy="185" r="24" fill="#f3f4f6" opacity="0.9"/>
        <circle cx="439" cy="178" r="20" fill="#0d1324"/>

        <g id="s2Stars" fill="#f2ede2">
          <circle class="star" cx="95" cy="165" r="2"/>
          <circle class="star" cx="175" cy="135" r="1.8"/>
          <circle class="star" cx="255" cy="195" r="2.2"/>
          <circle class="star" cx="345" cy="140" r="1.8"/>
          <circle class="star" cx="120" cy="275" r="1.8"/>
          <circle class="star" cx="465" cy="265" r="2"/>
          <circle class="star" cx="210" cy="245" r="1.5"/>
        </g>

        <!-- Distant Rolling Hills & 18th Century Village Cottages (Parallax Layer) -->
        <g id="s2VillageBg">
          <!-- Distant Hill -->
          <path d="M -60 645 Q 180 575 380 635 T 640 615 L 640 760 L -60 760 Z" fill="#0e1324"/>

          <!-- Cottage 1 (Left) -->
          <g transform="translate(85, 558)">
            <rect x="0" y="25" width="76" height="52" fill="#090c17"/>
            <polygon points="-8,25 38,-6 84,25" fill="#06080f"/>
            <!-- Chimney -->
            <rect x="54" y="2" width="10" height="18" fill="#06080f"/>
            <!-- Warm Candlelit Cottage Window -->
            <rect x="28" y="42" width="16" height="18" rx="2" fill="#f59e0b" opacity="0.55"/>
          </g>

          <!-- Cottage 2 (Right) -->
          <g transform="translate(365, 568)">
            <rect x="0" y="22" width="68" height="46" fill="#090c17"/>
            <polygon points="-7,22 34,-5 75,22" fill="#06080f"/>
            <rect x="24" y="38" width="14" height="15" rx="2" fill="#f59e0b" opacity="0.35"/>
          </g>

          <!-- Bare Silhouette Trees -->
          <g stroke="#080b14" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M 245 628 L 245 572 M 245 595 L 230 580 M 245 588 L 260 574"/>
            <path d="M 485 632 L 485 582 M 485 602 L 472 588 M 485 596 L 498 584"/>
          </g>
        </g>

        <!-- Foreground Dirt Path (Flat Surface at y = 735) -->
        <rect x="0" y="735" width="540" height="225" fill="url(#earthGround)"/>
        <line x1="0" y1="735" x2="540" y2="735" stroke="#1e2538" stroke-width="2"/>

        <!-- =====================================================
             ANTIQUE POCKET CLOCK REWINDING IN NIGHT SKY (x=270, y=315)
             ===================================================== -->
        <g id="rewindClock">
          <circle cx="270" cy="315" r="105" fill="url(#clockHalo)"/>
          <!-- Outer Brass Ring -->
          <circle cx="270" cy="315" r="68" fill="none" stroke="#f4c28a" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.75"/>
          <circle cx="270" cy="315" r="56" fill="rgba(9, 11, 20, 0.72)" stroke="#f4c28a" stroke-width="2"/>
          <!-- Roman/Minimal Tick Marks -->
          <line x1="270" y1="265" x2="270" y2="273" stroke="#f4c28a" stroke-width="2.5"/>
          <line x1="270" y1="357" x2="270" y2="365" stroke="#f4c28a" stroke-width="2.5"/>
          <line x1="220" y1="315" x2="228" y2="315" stroke="#f4c28a" stroke-width="2.5"/>
          <line x1="312" y1="315" x2="320" y2="315" stroke="#f4c28a" stroke-width="2.5"/>

          <!-- Clock Hands (Exact Pivot at 270, 315) -->
          <line id="clockHour" x1="270" y1="315" x2="270" y2="283" stroke="#f2ede2" stroke-width="3.5" stroke-linecap="round"/>
          <line id="clockMin" x1="270" y1="315" x2="308" y2="315" stroke="#f4c28a" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="270" cy="315" r="4.5" fill="#f4c28a"/>
        </g>

        <!-- =====================================================
             SLEEK 17-18yo SILHOUETTE WALKER WITH LANTERN
             Feet grounded precisely on path at y = 735
             Base coordinate system anchored at hip (0, 0) -> placed at (130, 655)
             ===================================================== -->
        <g id="s2Walker" transform="translate(130, 655)">
          <!-- Ground Contact Shadow -->
          <ellipse cx="4" cy="80" rx="28" ry="6" fill="#040508" opacity="0.85"/>

          <!-- Back Leg (Hip pivot at 0, 0 -> foot reaches y = 80) -->
          <g id="s2LegBack">
            <path d="M -2 0 L -5 40 L -3 78 L 6 78" fill="none" stroke="#06070a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Back Arm (Shoulder pivot at 0, -48) -->
          <g id="s2ArmBack">
            <path d="M -2 -48 L -10 -22 L -6 -2" fill="none" stroke="#06070a" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Torso (From hip y=0 up to neck y=-56) with Warm Lantern Rim Light -->
          <path d="M -9 -54 L 11 -54 L 9 2 L -9 2 Z" fill="#090a0f" stroke="#f4c28a" stroke-width="1.2" stroke-opacity="0.45"/>

          <!-- Front Leg (Hip pivot at 0, 0 -> foot reaches y = 80) -->
          <g id="s2LegFront">
            <path d="M 1 0 L 4 40 L 2 78 L 12 78" fill="none" stroke="#090a0f" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Subtle Rim Highlight on Front Leg -->
            <path d="M 6 4 L 8 40 L 6 75" fill="none" stroke="#f4c28a" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
          </g>

          <!-- Head & Single Side-Profile Neon Eye (Centered at 1, -74) -->
          <g id="s2Head">
            <!-- Warm Rim Light on Front Edge of Head -->
            <circle cx="2.5" cy="-74" r="16.5" fill="#f4c28a" opacity="0.45"/>
            <circle cx="1" cy="-74" r="16.5" fill="#090a0f"/>
            <!-- Single Side-Profile Glowing Eye looking forward -->
            <ellipse cx="11" cy="-76" rx="4.5" ry="2.6" fill="#fde68a" opacity="0.4"/>
            <ellipse class="walker-eye" cx="11" cy="-76" rx="2.8" ry="1.5" fill="#fef3c7"/>
          </g>

          <!-- Front Arm Holding Glowing Antique Lantern (Shoulder pivot at 2, -48) -->
          <g id="s2ArmFront">
            <!-- Arm reaching forward to hold lantern handle at (26, -16) -->
            <path d="M 2 -48 L 12 -26 L 26 -16" fill="none" stroke="#090a0f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 4 -47 L 14 -26 L 26 -17" fill="none" stroke="#f4c28a" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

            <!-- Swinging Lantern & Symmetrical Light Cone (Anchored at hand 26, -16) -->
            <g id="s2Lantern" transform="translate(26, -16)">
              <!-- Symmetrical Downward Cone onto Dirt Path -->
              <polygon points="-6,18 6,18 46,96 -46,96" fill="url(#lanternCone)"/>
              <!-- Warm Lantern Halo -->
              <circle cx="0" cy="12" r="52" fill="url(#lanternHalo)"/>
              <!-- Lantern Handle & Frame -->
              <path d="M -5 0 Q 0 -6 5 0" fill="none" stroke="#090a0f" stroke-width="2"/>
              <rect x="-6" y="2" width="12" height="16" rx="3" fill="#090a0f"/>
              <!-- Glowing Candle Core Inside Lantern -->
              <rect x="-3.5" y="5" width="7" height="10" rx="1.5" fill="#fde68a"/>
              <circle cx="0" cy="10" r="2.5" fill="#ffffff"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play Scene 2 (9.0s)</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playRewindEffect() {
      // Soft atmospheric whoosh + mechanical clock ticks spinning backward
      playTone(180, 'sine', 1.4, 0.14, 65);
      for (let i = 0; i < 14; i++) {
        setTimeout(() => {
          playTone(720 - i * 32, 'triangle', 0.06, 0.06);
        }, i * 110);
      }
    }

    function playFootstep() {
      playTone(68, 'sine', 0.12, 0.08, 38);
    }

    let sceneTl = null;

    function playScene2() {
      if (sceneTl) sceneTl.kill();

      // Reset initial states with exact SVG joint coordinates
      gsap.set('#s2Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s2VillageBg', { x: 0 });
      gsap.set('#clockMin', { rotation: 0, svgOrigin: '270 315' });
      gsap.set('#clockHour', { rotation: 0, svgOrigin: '270 315' });
      gsap.set('#s2Walker', { x: 130, y: 655 });
      gsap.set('#s2LegFront', { rotation: 0, svgOrigin: '0 0' });
      gsap.set('#s2LegBack', { rotation: 0, svgOrigin: '0 0' });
      gsap.set('#s2ArmBack', { rotation: 0, svgOrigin: '0 -48' });
      gsap.set('#s2ArmFront', { rotation: 0, svgOrigin: '2 -48' });
      gsap.set('.walker-eye', { scaleY: 1, svgOrigin: '11 -76' });

      sceneTl = gsap.timeline();

      // 0.0s: Clock hands spin rapidly backward (Rewind into 18th century)
      sceneTl.call(() => playRewindEffect(), null, 0);
      sceneTl.to('#clockMin', {
        rotation: -1440,
        svgOrigin: '270 315',
        duration: 5.5,
        ease: 'power2.inOut'
      }, 0);
      sceneTl.to('#clockHour', {
        rotation: -360,
        svgOrigin: '270 315',
        duration: 5.5,
        ease: 'power2.inOut'
      }, 0);

      // Twinkling stars
      sceneTl.to('.star', {
        opacity: 0.25,
        duration: 0.8,
        stagger: 0.18,
        yoyo: true,
        repeat: 9
      }, 0);

      // Subtle parallax drift on distant village hills
      sceneTl.to('#s2VillageBg', {
        x: -24,
        duration: 9.0,
        ease: 'none'
      }, 0);

      // Smooth human walk cycle across the dirt path (0.2s to 9.0s)
      sceneTl.to('#s2Walker', {
        x: 375,
        duration: 8.8,
        ease: 'none'
      }, 0.2);

      // Subtle vertical body bob (2px) synced with steps
      sceneTl.to('#s2Walker', {
        y: 652,
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      // Alternating Leg Swing anchored strictly at hip (0, 0)
      sceneTl.to('#s2LegFront', {
        rotation: 22,
        svgOrigin: '0 0',
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      sceneTl.to('#s2LegBack', {
        rotation: -22,
        svgOrigin: '0 0',
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      // Opposite Back Arm Swing anchored at shoulder (0, -48)
      sceneTl.to('#s2ArmBack', {
        rotation: 18,
        svgOrigin: '0 -48',
        duration: 0.36,
        yoyo: true,
        repeat: 23,
        ease: 'sine.inOut'
      }, 0.2);

      // Subtle Lantern Sway anchored at front shoulder (2, -48)
      sceneTl.to('#s2ArmFront', {
        rotation: -4,
        svgOrigin: '2 -48',
        duration: 0.72,
        yoyo: true,
        repeat: 11,
        ease: 'sine.inOut'
      }, 0.2);

      // Natural Eye Blink at 3.2s & 6.8s
      sceneTl.to('.walker-eye', {
        scaleY: 0.1,
        svgOrigin: '11 -76',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 3.2);

      sceneTl.to('.walker-eye', {
        scaleY: 0.1,
        svgOrigin: '11 -76',
        duration: 0.08,
        yoyo: true,
        repeat: 1
      }, 6.8);

      // Gentle cinematic camera push-in
      sceneTl.to('#s2Camera', {
        scale: 1.12,
        svgOrigin: '270 540',
        duration: 9.0,
        ease: 'sine.inOut'
      }, 0);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene2();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene2, 300);
    });
  </script>
</body>
</html>
