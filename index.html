<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenspiris — The Baker's Alarm Scene 1: Burnt Loaf (6.0s + Foley SFX)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #040406;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    gap: 14px;
  }
  .stage-wrapper {
    position: relative;
    width: 100vw;
    max-width: 355px;
    aspect-ratio: 9/16;
    background: #070911;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.95);
  }
  svg.scene-svg {
    width: 100%;
    height: 100%;
    display: block;
    shape-rendering: geometricPrecision;
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(3,4,8,.92) 100%);
    pointer-events: none;
    z-index: 10;
  }
  .letterbox {
    position: absolute;
    left: 0;
    right: 0;
    height: 5.5%;
    background: #000;
    z-index: 12;
  }
  .letterbox.top { top: 0; border-bottom: 1px solid rgba(252,211,77,.35); }
  .letterbox.bottom { bottom: 0; border-top: 1px solid rgba(252,211,77,.35); }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .ctrl-btn {
    background: #16161f;
    color: #cbd5e1;
    border: 1px solid #2a2a38;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  .ctrl-btn:hover { background: #1f1f2b; }
  .ctrl-btn.primary {
    background: #1e3a5f;
    border-color: #3b6ea5;
    color: #e0f0ff;
  }
  .ctrl-btn.primary:hover { background: #254a78; }
</style>
</head>
<body>

<div class="stage-wrapper">
  <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- Oven glow -->
      <radialGradient id="s1OvenGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>

      </radialGradient>
      <radialGradient id="s1OvenCore" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
        <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#b45309" stop-opacity="0.0"/>
      </radialGradient>
      <!-- Window cool glow -->
      <radialGradient id="s1WindowGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>

      <line x1="0" y1="770" x2="540" y2="770" stroke="#1a1410" stroke-width="2"/>

      <!-- Oven (right side) -->
      <g id="s1Oven">
        <!-- Oven body -->
        <rect x="250" y="520" width="180" height="250" rx="6" fill="#0a0806"/>
        <rect x="256" y="526" width="168" height="238" rx="4" fill="#12100c"/>
        <!-- Oven arch top -->
        <rect x="270" y="540" width="130" height="110" rx="4" fill="#050403"/>
        <!-- Oven mouth glow (behind door) -->
        <rect x="272" y="560" width="120" height="90" rx="4" fill="#1a0e04"/>
        <ellipse cx="332" cy="605" rx="90" ry="80" fill="url(#s1OvenGlow)"/>
        <ellipse cx="332" cy="605" rx="55" ry="45" fill="url(#s1OvenCore)" opacity="0.8"/>
        <!-- Oven door (starts closed, pops open at 1.5s) -->
        <g id="s1OvenDoor">
          <rect x="270" y="558" width="124" height="94" rx="3" fill="#1a1612" stroke="#2a241c" stroke-width="2"/>
          <rect x="278" y="566" width="108" height="78" rx="2" fill="#0e0c08"/>
          <!-- Door handle -->
          <rect x="318" y="600" width="28" height="6" rx="3" fill="#3d2a1a"/>
        </g>
        <!-- Oven top rim -->
        <rect x="256" y="526" width="168" height="8" rx="2" fill="#1e1a14"/>

        <!-- Smoke puffs (hidden initially) -->
        <g id="s1Smoke1" opacity="0">
          <ellipse cx="332" cy="560" rx="28" ry="20" fill="url(#s1Smoke)"/>
        </g>
        <g id="s1Smoke2" opacity="0">
          <ellipse cx="350" cy="545" rx="34" ry="24" fill="url(#s1Smoke)"/>
        </g>
        <g id="s1Smoke3" opacity="0">
          <ellipse cx="315" cy="535" rx="30" ry="22" fill="url(#s1Smoke)"/>
        </g>
      </g>

      <!-- Oven glow spill onto floor -->
      <ellipse cx="332" cy="790" rx="140" ry="30" fill="#f59e0b" opacity="0.06"/>

      <!-- Baker character (facing right toward oven) -->
      <g id="s1Baker">
        <!-- Ground shadow -->
        <ellipse cx="200" cy="782" rx="46" ry="9" fill="#000" opacity="0.85"/>

        <!-- Back leg -->
        <path id="s1BackLeg" d="M 192 690 L 190 750 L 182 772" stroke="#08070c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Back shoe -->
        <ellipse cx="178" cy="775" rx="12" ry="6" fill="#08070c"/>
        <!-- Front leg -->
        <path id="s1FrontLeg" d="M 208 690 L 210 750 L 218 772" stroke="#0d0b12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Front shoe -->
        <ellipse cx="222" cy="775" rx="12" ry="6" fill="#0d0b12"/>

        <!-- Torso (dark coat) -->
        <path d="M 178 620 L 222 620 L 228 700 L 172 700 Z" fill="#18222f"/>
        <!-- Torso rim light (warm from oven, right side) -->
        <path d="M 222 620 L 228 700 L 220 700 L 216 620 Z" fill="#fcd34d" opacity="0.35"/>

        <!-- Apron (white) -->
        <path d="M 184 638 L 216 638 L 220 700 L 180 700 Z" fill="#d8d4c8"/>
        <path d="M 184 638 L 216 638 L 220 700 L 180 700 Z" fill="#f2ede2" opacity="0.15"/>
        <!-- Apron strings -->
        <path d="M 184 638 L 172 630" stroke="#d8d4c8" stroke-width="2" fill="none"/>
        <path d="M 216 638 L 228 630" stroke="#d8d4c8" stroke-width="2" fill="none"/>
        <!-- Flour dust spots on coat -->
        <circle cx="188" cy="660" r="2" fill="#f2ede2" opacity="0.25"/>
        <circle cx="210" cy="678" r="1.5" fill="#f2ede2" opacity="0.2"/>
        <circle cx="195" cy="690" r="1.8" fill="#f2ede2" opacity="0.18"/>

        <!-- Back arm (dark, thinner) -->
        <path id="s1BackArm" d="M 182 632 L 170 668 L 175 685" stroke="#18202c" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- Front arm (will reach to pull loaf at 4.0s) -->
        <path id="s1FrontArm" d="M 218 632 L 238 660 L 248 680" stroke="#0d0b12" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- Head group -->
        <g id="s1Head" transform="translate(200, 596)">
          <!-- Rim light behind head (warm, from oven on right) -->
          <circle cx="1.6" cy="0" r="22" fill="#fcd34d" opacity="0.5"/>
          <!-- Head -->
          <circle cx="0" cy="0" r="22" fill="#0d0b12"/>

          <!-- Chef hat -->
          <path d="M -16 -16 L -18 -34 Q -16 -44 0 -44 Q 16 -44 18 -34 L 16 -16 Z" fill="#e8e4d8"/>
          <ellipse cx="0" cy="-38" rx="16" ry="10" fill="#f2ede2"/>
          <!-- Hat band -->
          <rect x="-17" y="-18" width="34" height="5" rx="1" fill="#c8c4b8"/>

          <!-- Eyes (deadpan, looking right toward oven) -->
          <g id="s1EyesDeadpan">
            <circle cx="9" cy="-1" r="2.1" fill="#f2ede2"/>
            <circle cx="16" cy="-1" r="2.1" fill="#f2ede2"/>

          <!-- Eyes closed (blink state) -->
          <g id="s1EyesClosed" opacity="0">

      <!-- Burnt loaf (hidden in oven, appears at 4.0s) -->
      <g id="s1Loaf" opacity="0" transform="translate(340, 660)">
        <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#s1Loaf)"/>
        <ellipse cx="0" cy="-6" rx="20" ry="12" fill="#2a1206"/>
        <!-- Score marks -->
        <line x1="-10" y1="-8" x2="10" y2="-8" stroke="#0a0502" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="-3" x2="8" y2="-3" stroke="#0a0502" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Char edge -->
        <ellipse cx="0" cy="0" rx="22" ry="14" fill="none" stroke="#0a0402" stroke-width="1.5"/>
      </g>

      <!-- Small smoke wisps from loaf -->
      <g id="s1LoafSmoke" opacity="0">
        <ellipse cx="340" cy="645" rx="10" ry="6" fill="url(#s1Smoke)"/>

      <!-- Foreground: shelf edge / counter hint bottom-left -->
      <rect x="0" y="720" width="120" height="50" fill="#0a0806" opacity="0.9"/>
      <rect x="0" y="720" width="120" height="6" fill="#1a1410"/>
      <!-- Flour sack on counter -->
      <path d="M 30 700 Q 25 690 35 685 L 75 685 Q 85 690 80 700 L 80 720 L 30 720 Z" fill="#c8c4b8" opacity="0.7"/>
      <path d="M 35 685 L 40 675 L 70 675 L 75 685" fill="#a8a498" opacity="0.6"/>

  <div class="vignette"></div>
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>
</div>

<div class="controls">
  <button class="ctrl-btn primary" id="playBtn">▶ Play (6.0s)</button>
  <button class="ctrl-btn" id="replayBtn">↺ 0.0s</button>
  <button class="ctrl-btn" id="soundBtn">🔊 Sound: ON</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ============================================================
   Zenspiris — The Baker's Alarm Scene 1: Burnt Loaf
   6.0s + Foley SFX
   ============================================================ */

let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

/* ---------- Foley ---------- */
// Oven door bang: low thud + metallic clank
function playOvenBang() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  // Low thud
  const o1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  o1.type = 'triangle';
  o1.frequency.setValueAtTime(180, t);
  o1.frequency.exponentialRampToValueAtTime(55, t + 0.15);
  g1.gain.setValueAtTime(0.16, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o1.connect(g1).connect(audioCtx.destination);
  o1.start(t); o1.stop(t + 0.22);
  // Metallic clank
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.type = 'square';
  o2.frequency.setValueAtTime(900, t + 0.02);
  o2.frequency.exponentialRampToValueAtTime(420, t + 0.09);
  g2.gain.setValueAtTime(0.05, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  o2.connect(g2).connect(audioCtx.destination);
  o2.start(t + 0.02); o2.stop(t + 0.13);
}

// Smoke puff: filtered noise
function playSmokePuff() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 700;
  filt.Q.value = 1.2;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0, t);
  g.gain.linearRampToValueAtTime(0.06, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start(t); src.stop(t + 0.4);
}

// Footstep (stone floor)
function playFootstep() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.09);
  g.gain.setValueAtTime(0.11, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.11);
}

// Loaf pull: soft whoosh
function playLoafPull() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(400, t);
  filt.frequency.linearRampToValueAtTime(900, t + 0.15);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0, t);
  g.gain.linearRampToValueAtTime(0.05, t + 0.06);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start(t); src.stop(t + 0.3);
}

/* ---------- Timeline ---------- */
let sceneTl = null;

function resetScene1ToStart() {
  if (sceneTl) { sceneTl.kill(); sceneTl = null; }
  gsap.set('#s1Camera', { scale: 1, x: 0, y: 0 });
  gsap.set('#s1OvenDoor', { rotation: 0, transformOrigin: '272px 652px' });
  gsap.set('#s1Smoke1, #s1Smoke2, #s1Smoke3', { opacity: 0, y: 0, scale: 1 });
  gsap.set('#s1Loaf', { opacity: 0, x: 0, y: 0 });
  gsap.set('#s1LoafSmoke', { opacity: 0 });
  gsap.set('#s1EyesDeadpan', { opacity: 1 });
  gsap.set('#s1EyesClosed', { opacity: 0 });
  gsap.set('#s1FrontArm', { attr: { d: 'M 218 632 L 238 660 L 248 680' } });
  gsap.set('#s1Head', { rotation: 0, transformOrigin: '0px 0px' });
  gsap.set('#s1Baker', { x: 0, y: 0 });
  document.getElementById('replayBtn').textContent = '↺ 0.0s';
}

function playScene1() {
  resetScene1ToStart();
  const replayBtn = document.getElementById('replayBtn');

  sceneTl = gsap.timeline({
    onUpdate: () => { replayBtn.textContent = `↺ ${sceneTl.time().toFixed(1)}s`; },
    onComplete: () => { replayBtn.textContent = '↺ 6.0s'; }
  });

  // Camera slow push-in
  sceneTl.to('#s1Camera', {
    scale: 1.06,
    transformOrigin: '330px 600px',
    duration: 6.0,
    ease: 'power1.inOut'
  }, 0);

  // 0.0–1.5s: calm, oven glows, baker stands still
  // (subtle breathing on head)
  sceneTl.to('#s1Head', {
    y: -1.5, duration: 0.75, yoyo: true, repeat: 1, ease: 'sine.inOut'
  }, 0);

  // 1.5s: oven door pops open with bang + smoke puffs
  sceneTl.call(() => playOvenBang(), null, 1.5);
  sceneTl.call(() => playSmokePuff(), null, 1.52);
  sceneTl.to('#s1OvenDoor', {
    rotation: -68,
    transformOrigin: '272px 652px',
    duration: 0.22,
    ease: 'back.out(2.2)'
  }, 1.5);
  // Smoke puffs rise
  sceneTl.to('#s1Smoke1', { opacity: 0.7, y: -18, scale: 1.3, duration: 0.5, ease: 'power2.out' }, 1.52);
  sceneTl.to('#s1Smoke2', { opacity: 0.6, y: -24, scale: 1.4, duration: 0.6, ease: 'power2.out' }, 1.58);
  sceneTl.to('#s1Smoke3', { opacity: 0.55, y: -20, scale: 1.25, duration: 0.55, ease: 'power2.out' }, 1.62);
  sceneTl.to('#s1Smoke1, #s1Smoke2, #s1Smoke3', { opacity: 0, duration: 0.5, ease: 'power1.in' }, 2.2);

  // 2.7s: baker reacts, deadpan eyes (blink + slight head turn toward oven)
  sceneTl.to('#s1EyesDeadpan', { opacity: 0, duration: 0.06 }, 2.7);
  sceneTl.to('#s1EyesClosed', { opacity: 1, duration: 0.06 }, 2.7);
  sceneTl.to('#s1EyesClosed', { opacity: 0, duration: 0.08 }, 2.92);
  sceneTl.to('#s1EyesDeadpan', { opacity: 1, duration: 0.08 }, 2.92);
  sceneTl.to('#s1Head', {
    rotation: 5,
    transformOrigin: '0px 18px',
    duration: 0.3,
    ease: 'power2.out'
  }, 2.75);

  // 3.2s: slight lean toward oven (anticipation)
  sceneTl.to('#s1Baker', { x: 6, duration: 0.4, ease: 'power2.inOut' }, 3.2);

  // 4.0s: he pulls out a burnt loaf
  sceneTl.call(() => playLoafPull(), null, 4.0);
  // Arm reaches in
  sceneTl.to('#s1FrontArm', {
    attr: { d: 'M 218 632 L 252 648 L 278 648' },
    duration: 0.35,
    ease: 'power2.out'
  }, 4.0);
  // Loaf appears at hand
  sceneTl.set('#s1Loaf', { opacity: 1, x: 0, y: 0 }, 4.35);
  sceneTl.set('#s1LoafSmoke', { opacity: 0.6 }, 4.4);
  // Arm retracts with loaf
  sceneTl.to('#s1FrontArm', {
    attr: { d: 'M 218 632 L 240 658 L 240 680' },
    duration: 0.4,
    ease: 'power2.inOut'
  }, 4.4);
  sceneTl.to('#s1Loaf', {
    x: -8, y: 4,
    duration: 0.4,
    ease: 'power2.inOut'
  }, 4.4);
  sceneTl.to('#s1LoafSmoke', { opacity: 0, duration: 0.5 }, 4.6);

  // 4.9s: head turns to camera (deadpan stare)
  sceneTl.to('#s1Head', {
    rotation: -8,
    x: -3,
    transformOrigin: '0px 18px',
    duration: 0.4,
    ease: 'power2.inOut'
  }, 4.9);

  // 5.0–6.0s: deadpan hold — tiny blink at 5.6s for life
  sceneTl.to('#s1EyesDeadpan', { opacity: 0, duration: 0.05 }, 5.6);
  sceneTl.to('#s1EyesClosed', { opacity: 1, duration: 0.05 }, 5.6);
  sceneTl.to('#s1EyesClosed', { opacity: 0, duration: 0.07 }, 5.78);
  sceneTl.to('#s1EyesDeadpan', { opacity: 1, duration: 0.07 }, 5.78);

  // Footstep at 3.2s (weight shift) — subtle
  sceneTl.call(() => playFootstep(), null, 3.2);
}

/* ---------- Controls ---------- */
document.getElementById('playBtn').addEventListener('click', () => {
  initAudio();
  playScene1();
});

document.getElementById('replayBtn').addEventListener('click', () => {
  initAudio();
  playScene1();
});

document.getElementById('soundBtn').addEventListener('click', (e) => {
  soundEnabled = !soundEnabled;
  e.target.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
});

/* Auto-play on load */
window.addEventListener('load', () => {
  setTimeout(() => {
    initAudio();
    playScene1();
  }, 250);
