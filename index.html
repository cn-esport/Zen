<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenspiris — Scene 5: Modern Blue Light & Outro Hook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --head: #0d0b12;
      --face: #f2ede2;
      --rim: #7dd3fc;
      --outfit-top: #3b78c4;
      --outfit-bottom: #e8dcc0;
      --outfit-bottom-back: #b8ac92;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040406;
      color: #f2ede2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      background: #090a10;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
    }

    svg.scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 35%, rgba(3, 4, 8, 0.94) 100%);
      z-index: 10;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      height: 5.5%;
      background: #000;
      z-index: 12;
      pointer-events: none;
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      z-index: 20;
    }

    button {
      background: #16161f;
      color: #f2ede2;
      border: 1px solid rgba(242, 237, 226, 0.2);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { transform: scale(0.95); }
    button.primary { background: #1e3a5f; border-color: #60a5fa; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg class="scene-svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Modern Dark Bedroom Wall -->
        <linearGradient id="s5WallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d0e14"/>
          <stop offset="65%" stop-color="#141620"/>
          <stop offset="100%" stop-color="#0e0f16"/>
        </linearGradient>

        <!-- Late Night Window Sky -->
        <linearGradient id="s5WindowSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070a14"/>
          <stop offset="60%" stop-color="#111830"/>
          <stop offset="100%" stop-color="#192342"/>
        </linearGradient>

        <!-- Modern Floor -->
        <linearGradient id="s5FloorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#13131a"/>
          <stop offset="40%" stop-color="#1a1a24"/>
          <stop offset="100%" stop-color="#0b0b10"/>
        </linearGradient>

        <!-- Harsh Artificial Phone Light Beam -->
        <linearGradient id="s5PhoneBeam" x1="1" y1="0.5" x2="0" y2="0.5">
          <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.72"/>
          <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.24"/>
          <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </linearGradient>

        <!-- Intense Blue Screen Ambient Pool -->
        <radialGradient id="s5BluePool" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.62"/>
          <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="s5ClockGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Camera Group -->
      <g id="s5Camera">
        <rect width="540" height="715" fill="url(#s5WallGrad)"/>
        <rect x="0" y="715" width="540" height="245" fill="url(#s5FloorGrad)"/>
        <line x1="0" y1="748" x2="540" y2="748" stroke="#0f0f14" stroke-width="2"/>
        <line x1="0" y1="792" x2="540" y2="792" stroke="#0f0f14" stroke-width="2"/>
        <line x1="0" y1="845" x2="540" y2="845" stroke="#0f0f14" stroke-width="2"/>
        <line x1="0" y1="905" x2="540" y2="905" stroke="#0f0f14" stroke-width="2"/>

        <!-- MODERN BEDROOM WINDOW (3:14 AM Late Night) -->
        <g transform="translate(175, 165)">
          <rect x="-8" y="-8" width="236" height="296" rx="4" fill="#090a0f"/>
          <rect x="0" y="0" width="220" height="280" fill="url(#s5WindowSky)"/>
          <!-- City Skyline -->
          <g fill="#0a0e1c">
            <rect x="0" y="215" width="42" height="65"/>
            <rect x="38" y="195" width="48" height="85"/>
            <rect x="82" y="225" width="38" height="55"/>
            <rect x="118" y="182" width="54" height="98"/>
            <rect x="168" y="208" width="52" height="72"/>
          </g>
          <!-- Fading Low Crescent Moon -->
          <circle cx="52" cy="128" r="16" fill="#e2e8f0" opacity="0.75"/>
          <circle cx="59" cy="123" r="13" fill="#0e1429"/>
          <!-- Stars -->
          <circle cx="135" cy="48" r="1.6" fill="#fff" opacity="0.5"/>
          <circle cx="175" cy="82" r="1.4" fill="#fff" opacity="0.45"/>
          <!-- Window Frame Mullions -->
          <rect x="107" y="0" width="6" height="280" fill="#0a0b10"/>
          <rect x="0" y="148" width="220" height="6" fill="#0a0b10"/>
          <rect x="-14" y="280" width="248" height="10" rx="2" fill="#1c1e29"/>
        </g>

        <!-- BEDSIDE NIGHTSTAND (Room Lamp Off -> Only Harsh Red 03:14 Clock & Blue Phone) -->
        <g transform="translate(36, 515)">
          <rect x="8" y="105" width="96" height="95" rx="3" fill="#13131a"/>
          <rect x="4" y="102" width="104" height="8" rx="2" fill="#1f1f2b"/>
          <rect x="16" y="118" width="80" height="32" rx="2" fill="#0d0d12"/>
          <circle cx="56" cy="134" r="3" fill="#2e2e3d"/>

          <!-- Unlit Dark Lamp -->
          <rect x="28" y="96" width="28" height="6" rx="2" fill="#22222e"/>
          <rect x="39" y="52" width="6" height="44" fill="#22222e"/>
          <polygon points="24,14 60,14 72,52 12,52" fill="#262836"/>

          <!-- Red Digital Clock showing 03:14 -->
          <g id="s5Clock">
            <circle cx="82" cy="90" r="32" fill="url(#s5ClockGlow)"/>
            <rect x="58" y="78" width="48" height="24" rx="4" fill="#07060a" stroke="#3f1d22" stroke-width="1.5"/>
            <text id="s5ClockText" x="82" y="94" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="13" font-weight="bold">03:14</text>
          </g>
        </g>

        <!-- BED & CHARACTER (FATIGUED BLUE-LIGHT SCROLL -> DIRECT OUTRO LOOK AT VIEWER) -->
        <g transform="translate(152, 565)">
          <ellipse cx="170" cy="152" rx="180" ry="12" fill="#050508" opacity="0.9"/>

          <!-- Bed Frame & Mattress -->
          <rect x="0" y="38" width="14" height="112" rx="3" fill="#12121a"/>
          <rect x="326" y="72" width="14" height="78" rx="3" fill="#12121a"/>
          <rect x="10" y="112" width="320" height="22" rx="3" fill="#181822"/>
          <rect x="14" y="92" width="312" height="24" rx="8" fill="#22232e"/>
          <rect x="20" y="74" width="64" height="22" rx="10" fill="#2b2d3b"/>

          <!-- Intense Cool Blue Ambient Glow -->
          <circle cx="138" cy="24" r="115" fill="url(#s5BluePool)" id="s5PhonePool"/>

          <!-- Character Rig (Exact Slim & Short Torso Proportions) -->
          <g id="s5Char">
            <!-- Back Leg -->
            <path d="M 103 85 L 133 85 L 135 115 L 134 143 L 143 143"
                  fill="none" stroke="var(--outfit-bottom-back)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Slim & Short Torso (Slightly slouched forward at 5deg while tired, straightens at outro!) -->
            <g id="s5TorsoGroup">
              <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 24.5 105 28.5 Q 111.5 29.5 111.5 34 L 111.5 87 L 92 87 Z"
                    fill="var(--rim)" opacity="0.5"/>
              <path d="M 92 34 Q 92 29.5 97 28.5 Q 101 25 105 28.5 Q 110 29.5 110 34 L 110 87 L 92 87 Z"
                    fill="var(--outfit-top)"/>

              <!-- Head Group (Centered at 101, 4, r=22 -> seamless collar touch) -->
              <g id="s5Head">
                <circle cx="102.5" cy="4" r="22" fill="var(--rim)" opacity="0.65"/>
                <circle cx="101" cy="4" r="22" fill="var(--head)"/>

                <!-- Phase 1 Face: 3/4 Side-Offset Tired Eyes staring at Blue Screen -->
                <g id="s5FaceSide">
                  <circle class="s5-eye" cx="111" cy="2.5" r="2.1" fill="var(--face)"/>
                  <circle class="s5-eye" cx="118.8" cy="2.5" r="2.1" fill="var(--face)"/>
                  <!-- Subtle tired under-eye lines -->
                  <line x1="109.5" y1="6.2" x2="112.5" y2="6.2" stroke="#7dd3fc" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
                  <line x1="117.3" y1="6.2" x2="120.3" y2="6.2" stroke="#7dd3fc" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
                  <!-- Flat fatigued mouth -->
                  <line x1="112" y1="11.5" x2="118" y2="11.5" stroke="var(--face)" stroke-width="1.9" stroke-linecap="round"/>
                </g>

                <!-- Phase 2 Face: Direct Front-Facing Outro Hook (Looks straight at viewer!) -->
                <g id="s5FaceFront" opacity="0">
                  <circle cx="95.5" cy="2.5" r="2.3" fill="var(--face)"/>
                  <circle cx="106.5" cy="2.5" r="2.3" fill="var(--face)"/>
                  <!-- Thoughtful Questioning Mouth -->
                  <path d="M 97.5 11.5 Q 101 10.5 104.5 11.5" fill="none" stroke="var(--face)" stroke-width="2" stroke-linecap="round"/>
                </g>
              </g>

              <!-- Front Arm & Unified Sleeve (Lowers phone at 5.2s for Outro Hook) -->
              <g id="s5Arm">
                <!-- Harsh Directional Blue Light Beam + Pulsing Circadian Wave Rings -->
                <g id="s5LightBeamGroup">
                  <polygon points="140,12 140,32 112,16 112,-14" fill="url(#s5PhoneBeam)"/>
                  <path class="blue-wave" d="M 134 15 Q 128 22 134 29" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0"/>
                  <path class="blue-wave" d="M 126 11 Q 119 22 126 33" fill="none" stroke="#7dd3fc" stroke-width="1.4" opacity="0"/>
                </g>

                <!-- Arm Rim Light -->
                <path d="M 102 35.5 L 122 48 L 138 30" fill="none" stroke="var(--rim)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
                <!-- Sleek Black Arm -->
                <path d="M 102 36 L 122 49 L 138 31" fill="none" stroke="var(--head)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Unified Short Sleeve -->
                <path d="M 100.2 33.8 L 111.5 41.2" fill="none" stroke="var(--outfit-top)" stroke-width="7.6" stroke-linecap="round"/>
                <path d="M 105.8 37.5 L 111.5 41.2" fill="none" stroke="var(--outfit-top)" stroke-width="7.6" stroke-linecap="butt"/>

                <!-- Glowing Smartphone -->
                <g transform="translate(140, 12) rotate(12)">
                  <rect x="2.5" y="-1" width="4.2" height="22" rx="1.8" fill="#090a0f"/>
                  <rect x="0" y="0" width="2.8" height="20" rx="1.4" fill="#e0f2fe"/>
                </g>
              </g>
            </g>

            <!-- Front Leg with Rounded Hip Cap -->
            <path d="M 99 86 L 137 86 L 140 116 L 138 144 L 148 144"
                  fill="none" stroke="var(--outfit-bottom)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>
    </svg>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Play Scene 5 (8.5s)</button>
    <button id="soundBtn">🔊 Sound: ON</button>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.14, slideTo = null) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Subtle hypnotic blue-light hum & outro question resolve
    function playScreenPulse() {
      playTone(210, 'sine', 0.35, 0.05, 190);
    }

    function playOutroHookNote() {
      playTone(293.66, 'sine', 0.9, 0.12);
      setTimeout(() => playTone(440.00, 'sine', 1.4, 0.11), 160);
    }

    let sceneTl = null;

    function playScene5() {
      if (sceneTl) sceneTl.kill();

      gsap.set('#s5Camera', { scale: 1, x: 0, y: 0 });
      gsap.set('#s5TorsoGroup', { rotation: 5, svgOrigin: '101 86' });
      gsap.set('#s5Arm', { rotation: 0, svgOrigin: '102 36' });
      gsap.set('#s5LightBeamGroup', { opacity: 1 });
      gsap.set('#s5PhonePool', { opacity: 1, scale: 1, svgOrigin: '138 24' });
      gsap.set('#s5FaceSide', { opacity: 1 });
      gsap.set('#s5FaceFront', { opacity: 0 });
      gsap.set('.s5-eye', { scaleY: 1, svgOrigin: '115 2.5' });
      gsap.set('.blue-wave', { opacity: 0, x: 0 });
      document.getElementById('s5ClockText').textContent = '03:14';

      sceneTl = gsap.timeline();

      // 0.0s - 5.0s: Late-night blue-light scrolling & circadian disruption waves
      sceneTl.to('#s5Arm', {
        rotation: -3.5,
        svgOrigin: '102 36',
        duration: 0.55,
        yoyo: true,
        repeat: 7,
        ease: 'sine.inOut'
      }, 0);

      // Pulsing blue-light waves hitting the eyes
      sceneTl.to('.blue-wave', {
        opacity: 0.75,
        x: -10,
        duration: 0.75,
        stagger: 0.25,
        yoyo: true,
        repeat: 5,
        ease: 'sine.inOut',
        onStart: () => playScreenPulse()
      }, 0.4);

      // Heavy tired slow blink (2.2s)
      sceneTl.to('.s5-eye', {
        scaleY: 0.15,
        svgOrigin: '115 2.5',
        duration: 0.35,
        yoyo: true,
        repeat: 1,
        ease: 'power1.inOut'
      }, 2.2);

      // Clock ticks to 03:15 at 3.4s
      sceneTl.call(() => {
        document.getElementById('s5ClockText').textContent = '03:15';
      }, null, 3.4);

      // 5.2s: OUTRO HOOK — Character lowers phone, straightens posture & looks directly at the viewer!
      sceneTl.call(() => playOutroHookNote(), null, 5.25);

      sceneTl.to('#s5Arm', {
        rotation: 42,
        svgOrigin: '102 36',
        duration: 0.75,
        ease: 'power2.inOut'
      }, 5.2);

      sceneTl.to('#s5LightBeamGroup', {
        opacity: 0.15,
        duration: 0.5
      }, 5.2);

      sceneTl.to('#s5PhonePool', {
        opacity: 0.25,
        scale: 0.75,
        svgOrigin: '138 24',
        duration: 0.75
      }, 5.2);

      // Straightens posture & turns head smoothly toward the viewer
      sceneTl.to('#s5TorsoGroup', {
        rotation: 0,
        svgOrigin: '101 86',
        duration: 0.7,
        ease: 'power2.out'
      }, 5.3);

      sceneTl.to('#s5FaceSide', {
        opacity: 0,
        duration: 0.22
      }, 5.45);

      sceneTl.to('#s5FaceFront', {
        opacity: 1,
        duration: 0.28
      }, 5.55);

      // Cinematic push-in on the direct eye-contact outro frame
      sceneTl.to('#s5Camera', {
        scale: 1.28,
        svgOrigin: '253 565',
        duration: 3.3,
        ease: 'power2.out'
      }, 5.2);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      playScene5();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    window.addEventListener('load', () => {
      setTimeout(playScene5, 300);
    });
  </script>
</body>
</html>
